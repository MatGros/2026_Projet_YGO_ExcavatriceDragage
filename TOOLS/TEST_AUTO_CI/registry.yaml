FB_FbStatus:
  domain: A_COMMUN
  report_group: A_COMMUN
  af_doc: DOC/AF/AF_Partie-03_Contrats_Composants_v2.1.md
  # TC-P03-004 (pas de SafeStop/StartStop hors mouvement) et TC-P03-005 (encapsulation stricte)
  # sont des regles transverses a TOUS les composants du catalogue AF_Partie-03, pas specifiques
  # a FB_FbStatus -- TC-P03-005 est deja prouve mecaniquement par encapsulation_check.py (section
  # Encapsulation du rapport), TC-P03-004 n'a pas de sens pour un socle statut (pas un FB
  # mouvement). Hors perimetre de CE fichier de test, pas un oubli.
  af_ignore: [TC-P03-004, TC-P03-005]
  sources:
    - CODE/A_COMMUN/E_State.st
    - CODE/A_COMMUN/ST_FbStatus.st
    - CODE/A_COMMUN/ST_FbCause.st
    - CODE/A_COMMUN/FB_FbStatus.st
  test: TOOLS/TEST_AUTO_CI/RESULTS/A_COMMUN/tests/test_fb_fbstatus.st

