# Registre figé des FB testables via TEST_AUTO_CI.
# Chaque entree = un FB teste en boite noire (IN/OUT), avec sa chaine de dependances
# de compilation figee a la main (ordre exact = ordre de compilation : DUT/enum d'abord,
# sous-FB, FB composite en dernier). Le runner ne devine jamais de dependance -- toute
# nouvelle entree se fait ici, jamais en modifiant run_tests.py.

FB_Encoder:
  domain: E_CODEURS
  af_doc: DOC/AF/AF_Partie-09_Fonction_Encoder_v2.3.md
  # Deux instances production (un FB, deux treuils) -- le rapport affiche un bloc pinout par
  # instance avec son cablage reel propre (instEncoderM1 != instEncoderM2). Smoke test seul
  # pour l'instant : valide la population IN/OUT du rapport (structs ST_EncoderHw/
  # ST_Encoder_Calib/ST_fbEncoder_Measurement, VAR_IN_OUT Calib), pas encore le catalogue AF-09.
  prod_instances:
    - file: CODE/M_MAIN/PRG_02_Acquisition.st
      name: instEncoderM1
      label: M1
    - file: CODE/M_MAIN/PRG_02_Acquisition.st
      name: instEncoderM2
      label: M2
  sources:
    - CODE/A_COMMUN/_TYPES/E_State.st
    - CODE/A_COMMUN/_TYPES/ST_Status.st
    - CODE/A_COMMUN/_TYPES/ST_Fault.st
    - CODE/A_COMMUN/_TYPES/ST_FaultCause.st
    - CODE/A_COMMUN/_TYPES/ST_Lifecycle.st
    - CODE/E_CODEURS/_TYPES/E_PresetConfirmMode.st
    - CODE/E_CODEURS/_TYPES/ST_fbEncoder_Cfg.st
    - CODE/E_CODEURS/_TYPES/ST_fbEncoder_HwIn.st
    - CODE/E_CODEURS/_TYPES/ST_fbEncoder_HwOut.st
    - CODE/E_CODEURS/_TYPES/ST_Encoder_Calib.st
    - CODE/E_CODEURS/_TYPES/ST_fbEncoder_Measurement.st
    - CODE/E_CODEURS/FB_Encoder_Abs.st
    - CODE/E_CODEURS/FB_Encoder_Homing.st
    - CODE/E_CODEURS/FB_Encoder_Scale.st
    - CODE/E_CODEURS/FB_Encoder_Safety.st
    - CODE/E_CODEURS/FB_EncoderReliability.st
    - CODE/E_CODEURS/FB_Encoder_SpeedMeasure.st
    - CODE/A_COMMUN/FB_FaultCore.st
    - CODE/E_CODEURS/FB_Encoder.st
  test: TOOLS/TEST_AUTO_CI/RESULTS/E_CODEURS/tests/test_fb_encoder.st

FB_Joystick:
  domain: D_JOYSTICK
  af_doc: DOC/AF/AF_Partie-08_Fonction_Joystick_v2.5.md
  # NB : TC-P08-008 n'a plus besoin d'exception ici -- son Type dans l'AF est passe a
  # "N/A ici" (pas "AUTO"), donc le coverage-check ne le detecte plus comme manquant tout
  # seul. Source unique = le tableau AF, pas une liste de suppression a cote.
