# Registre figé des FB testables via TEST_AUTO_CI.
# Chaque entree = un FB teste en boite noire (IN/OUT), avec sa chaine de dependances
# de compilation figee a la main (ordre exact = ordre de compilation : DUT/enum d'abord,
# sous-FB, FB composite en dernier). Le runner ne devine jamais de dependance -- toute
# nouvelle entree se fait ici, jamais en modifiant run_tests.py.

FB_Encoder:
  domain: CODEURS
  af_doc: DOC/AF/AF_Partie-09_Fonction_Encoder_v2.1.md
  # Deux instances production (un FB, deux treuils) -- le rapport affiche un bloc pinout par
  # instance avec son cablage reel propre (instEncoderM1 != instEncoderM2). Smoke test seul
  # pour l'instant : valide la population IN/OUT du rapport (structs ST_EncoderHw/
  # ST_Encoder_Calib/ST_EncoderMeasurement, VAR_IN_OUT Calib), pas encore le catalogue AF-09.
  prod_instances:
    - file: CODE/M_MAIN/PRG_02_Acquisition.st
      name: instEncoderM1
      label: M1
    - file: CODE/M_MAIN/PRG_02_Acquisition.st
      name: instEncoderM2
      label: M2
  sources:
    - CODE/A_COMMUN/E_State.st
    - CODE/A_COMMUN/ST_FbStatus.st
    - CODE/E_CODEURS/ST_EncoderHw.st
    - CODE/E_CODEURS/ST_Encoder_Calib.st
    - CODE/E_CODEURS/ST_EncoderMeasurement.st
    - CODE/E_CODEURS/FB_Encoder_Abs.st
    - CODE/E_CODEURS/FB_Encoder_Homing.st
    - CODE/E_CODEURS/FB_Encoder_Scale.st
    - CODE/E_CODEURS/FB_Encoder_Safety.st
    - CODE/E_CODEURS/FB_EncoderReliability.st
    - CODE/E_CODEURS/FB_Encoder_SpeedMeasure.st
    - CODE/E_CODEURS/FB_Encoder.st
  test: TOOLS/TEST_AUTO_CI/RESULTS/CODEURS/tests/test_fb_encoder.st

FB_Joystick:
  domain: JOYSTICK
  af_doc: DOC/AF/AF_Partie-08_Fonction_Joystick_v2.0.md
  # NB : TC-P08-008 n'a plus besoin d'exception ici -- son Type dans l'AF est passe a
  # "N/A ici" (pas "AUTO"), donc le coverage-check ne le detecte plus comme manquant tout
  # seul. Source unique = le tableau AF, pas une liste de suppression a cote.
  prod_instance:                         # optionnel : active le diagramme pinout + cablage prod reel
    file: CODE/M_MAIN/PRG_02_Acquisition.st
    name: instJoystick
  sources:
    - CODE/F_MODES/E_Mode.st
    - CODE/C_DIAG_RESEAUX/E_Diag_State.st
    - CODE/C_DIAG_RESEAUX/ST_Diag_Device.st
    - CODE/A_COMMUN/E_State.st
    - CODE/A_COMMUN/ST_FbStatus.st
    - CODE/A_COMMUN/ST_FbCause.st
    - CODE/A_COMMUN/FB_FbStatus.st
    - CODE/D_JOYSTICK/ST_Joystick_AxisCmd.st
    - CODE/D_JOYSTICK/FB_AxisScale.st
    - CODE/D_JOYSTICK/FB_Joystick.st
  test: TOOLS/TEST_AUTO_CI/RESULTS/JOYSTICK/tests/test_fb_joystick.st

FB_CycleTime:
  domain: A_COMMUN
  report_group: A_COMMUN
  sources:
    - CODE/A_COMMUN/FB_CycleTime.st
  test: TOOLS/TEST_AUTO_CI/RESULTS/A_COMMUN/tests/test_fb_cycletime.st

FB_Ramp:
  domain: A_COMMUN
