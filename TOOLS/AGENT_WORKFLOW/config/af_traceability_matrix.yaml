        etat: NV
      TC-P10-005:
        intention: 'Méca E bit12 : écart>2m ➔ SafeStop seul (pas PowerCutOff)'
        type: 💻 AUTO
        etat: NV
      TC-P10-006:
        intention: 'Méca E bit13 : bit12 non confirmé 3s ➔ escalade PowerCutOff'
        type: 💻 AUTO
        etat: NV
      TC-P10-007:
        intention: 'Méca F (bit14) : sens mesuré opposé au sens commandé 500ms ➔ SafeStop'
        type: 💻 AUTO
        etat: NV
      TC-P10-008:
        intention: 'Méca G (bit15) : vitesse nulle malgré commande 3s ➔ SafeStop seul'
        type: 💻 AUTO
        etat: NV
      TC-P10-009:
        intention: PowerCutOff = exactement bits 2,7,8,9,10,11,13 (masque 16#2F84)
        type: 💻 AUTO
        etat: NV
      TC-P10-010:
        intention: SafeStop exclut bit3 (mou câble) si SyncEnable=FALSE
        type: 💻 AUTO
        etat: NV
      TC-P10-036.1:
        intention: 'Warmup 3s : après Enable, perte com opérateur (cause 0) ne déclenche
          PAS pendant les 3 premières s (TonStartupWarmup) ; après 3s → SafeStop.'
        type: 💻 AUTO
        etat: NV-I
      TC-P10-037.1:
        intention: 'Gate Enable=FALSE : SafeStop/Permit/PowerCutOff forcés FALSE,
          Ready=FALSE, mais latches (MecaAFaultLatched…) préservés ; re-Enable exige
          Reset front.'
        type: 💻 AUTO
        etat: NV-I
      TC-P10-044.1:
        intention: 'Mou câble : SyncEnable=FALSE → DescendPermit=FALSE (blocage descente)
          mais AscentPermit autorisé palier 1 ; dès M2_TensionedCable_DI=TRUE, blocage
          levé.'
        type: 💻 AUTO
        etat: NV-I
      TC-P10-051.1:
        intention: 'Chaîne PowerCutOff bout-en-bout : demande PRG_04 → agrégation
          PRG_06 → coupure AU (bout-en-bout, pas seulement le masque 16#2F84).'
        type: ⚡ AUTO
        etat: NV
      TC-P10-011:
        intention: 'Inversion Fwd↔Rev en descente exige DirectionInterlockDelayDescent=400ms
          (+100ms palier=500ms) ; en montée DirectionInterlockDelayAscent=900ms (+100ms=1000ms).
          Neutre↔sens = immédiat. DirectionChangePending force la rampe à 0.0 pendant
          l''attente. Redémarrage même sens / inversion : temps mort 1s.'
        type: 💻 AUTO
        etat: NV-I
      TC-P10-017:
        intention: Config palier invalide (FB_SpeedStep) ➔ palier 0, sorties sûres
        type: 💻 AUTO
        etat: NV
      TC-P10-018:
        intention: 'StuckClosed : contacteurs off non confirmés 500ms ➔ bit1'
        type: 💻 AUTO
        etat: NV
      TC-P10-019:
        intention: 'Ordre MainTask : Safety ➔ WinchControl ➔ PRG_06_Outputs'
        type: ⚡ SITE+AUTO
        etat: NV
      TC-P10-042.1:
        intention: 'Plafonds dynamiques palier par contexte : descente max 3, montée
          max 5, approche capteur haut=1, zones ralentissement haut/bas capent le
          palier.'
        type: 💻 AUTO
        etat: NV-I
      TC-P10-052.1:
        intention: 'Garde-fou vitesse (SpeedGuardEnable, désactivé par défaut) : vitesse
          non-stable → palier 1 ; MeasuredSpeedBand < StepNumber → bride. Testable
          après activation.'
        type: 💻 AUTO
        etat: NV-I
      TC-P10-012:
        intention: 'Armer le watchdog sur BrakeCmd (BrakeCmd=TRUE, BrakeFeedback=FALSE,
          RestartInhibit=FALSE). Maintenir 500ms sans confirmation → bit0 ErrorId,
          RestartInhibit:=TRUE, Reason:=BRAKE_COMMAND_NOT_CONFIRMED, FAULT. Vérifier
          l''absence de faux défaut au RestartRequired : BrakeCmd retenu par RestartRequired
          (jusqu''à 1000ms) ne doit PAS armer le watchdog (armé sur BrakeCmd final,
          jamais sur RequestedRelayFwd/Rev).'
        type: ⚡ AUTO_PLC
        etat: NV
      TC-P10-013:
        intention: 'Provoquer un défaut (timeout frein) → ErrorId/RestartInhibit/ResetRequired
          latches. Couper Enable (ou AU) → sorties FALSE MAIS ErrorId, RestartInhibit,
          ResetRequired préservés. Réautorisation : cause disparue + front Reset +
          demande neutre observée + nouvelle demande distincte → RestartInhibit:=FALSE.'
        type: ⚡ AUTO_PLC
        etat: NV
      TC-P10-020:
        intention: Watchdog frein réel terrain (temps, contacteur/bobine)
        type: 🟢 SITE
        etat: NV
      TC-P10-021:
        intention: 'Temps mort même sens : 1s après arrêt ➔ nouvelle demande'
        type: 💻 AUTO
        etat: NV
      TC-P10-022:
        intention: 'Temps mort inversion : 1s après arrêt + inversion sens'
        type: 💻 AUTO
        etat: NV
      TC-P10-039.1:
        intention: 'Frein couplé direct : pour tout état (Error/RestartInhibit/RestartRequired),
          BrakeCmd := RelayFwd OR RelayRev — jamais de divergence frein/mouvement.'
        type: 💻 AUTO
        etat: NV-I
      TC-P10-014:
        intention: 'Écart M1/M2 > seuil Warn (_SyncCfgPersist.CfgSyncTolerance_M=0.8m,
          GVL_PERSISTENT — corrige le 0.10m documenté) → SyncWarn IHM instantané +
          latch, sans timer. Zone 2 : SyncDeviationWarn force le palier 1 sur M1/M2
          SANS coupure (pas de SafeStop sur simple écart).'
        type: 💻 AUTO
        etat: NV
      TC-P10-015:
        intention: Sync bit1 (incohérence commande, 500 ms) ➔ SafeStop fast
        type: 💻 AUTO
        etat: NV
      TC-P10-016:
        intention: SyncActive=TRUE, arrêt sur M1 → M2 coupé au MÊME scan (SafeStopM2_Active
          := SafeStopM2_Raw OR (SyncActive AND SafeStopM1_Raw)), sans attendre le
          filtre 500/800ms. Symétrique M2→M1. Suspendu pendant BenneBusy et en butée
          normale.
        type: 💻 AUTO
        etat: NV
