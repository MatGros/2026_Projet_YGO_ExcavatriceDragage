domains:
  AF-01:
    file: AF_Partie-01_Analyse_Fonctionnelle_v2.1.md
    functions:
      F01.01:
        fonction: Couper la puissance (AU)
        description: Boucle AU physique ouverte ➔ coupure matérielle des moteurs/actionneurs,
          indépendante du PLC
        realisee_par: FB_Safety_EmergencyManagement
        criticite: 🔴 C4
        tc_couvrants:
        - TC-P01-001
        statut: ✅
        etat: NV-I
      F01.02:
        fonction: Maintenir 2 canaux fail-safe
        description: Perte de maintien A ou B ➔ ouvre la boucle AU
        realisee_par: FB_Safety_EmergencyManagement
        criticite: 🔴 C4
        tc_couvrants:
        - TC-P01-002
        statut: ✅
        etat: NV-I
      F01.03:
        fonction: Réarmer sur demande explicite
        description: Front ArmRequest + boucle saine ➔ séquence de réarmement ; jamais
          automatique
        realisee_par: FB_Safety_EmergencyManagement
        criticite: 🔴 C4
        tc_couvrants:
        - TC-P01-003
        - TC-P01-005
        - TC-P01-SCEN-NOM
        statut: ✅
        etat: NV-I
      F01.04:
        fonction: Acquitter sans lever l'interlock
        description: Reset efface l'affichage (pattern Cause/Ack) sans jamais ouvrir
          l'interlock de sécurité
        realisee_par: FB_Safety_EmergencyManagement
        criticite: 🟠 C3
        tc_couvrants:
        - TC-P01-004
        - TC-P01-009
        statut: ✅
        etat: NV-I
      F01.05:
        fonction: Auto-tester la redondance A/B
        description: Test croisé des 2 canaux à chaque réarmement (preuve runtime,
          pas de procédure manuelle séparée)
        realisee_par: FB_Safety_EmergencyManagement
        criticite: 🔴 C4
        tc_couvrants:
        - TC-P01-006
        - TC-P01-SCEN-NOM
        statut: ✅
        etat: NV-I
      F01.06:
        fonction: Verrouiller après échec
        description: Non-confirmation contacteur après pulse ➔ lockout 5s avant nouvel
          essai
        realisee_par: FB_Safety_EmergencyManagement
        criticite: 🟠 C3
        tc_couvrants:
        - TC-P01-007
        - TC-P01-SCEN-DYN
        statut: ✅
        etat: NV-I
      F01.07:
        fonction: Couper sur demande safety métier
        description: PowerCutOffRequest (agrégat M1/M2/M3) ➔ coupe A et B sans déclencher
          d'armement
        realisee_par: FB_Safety_EmergencyManagement
        criticite: 🔴 C4
        tc_couvrants:
        - TC-P01-008
        - TC-P01-SCEN-DYN
        statut: ✅
        etat: NV-I
      F01.08:
        fonction: Cohérence coupure IHM / réarmement
        description: BtnEmergencyCutOff pendant le pulse de réarmement
        realisee_par: FB_Safety_EmergencyManagement
        criticite: 🟠 C3
        tc_couvrants:
        - TC-P01-010
        statut: ⚠️ écart relevé, non corrigé (audit 2026-08-22)
        etat: NV
    validation_points:
      TC-P01-001, TC-P01-008:
        intention: AU physique et demande safety métier agrégée coupent A+B, sans
          passer par une séquence d'armement
        type: 🟢 SITE+AUTO
        ref: FB_Safety_EmergencyManagement
        etat: NV
      TC-P01-002, TC-P01-006:
        intention: Perte d'un canal ouvre la boucle ; auto-test croisé des 2 canaux
          prouvé à chaque réarmement
        type: ⚡ SITE+AUTO_PLC
        ref: FB_Safety_EmergencyManagement
        etat: NV-I
      TC-P01-003, TC-P01-005, TC-P01-007:
        intention: Front explicite requis, jamais automatique ; acquittement et réarmement
          = 2 actions distinctes ; échec de confirmation ➔ lockout 5s
        type: ⚡ AUTO_PLC
        ref: FB_Safety_EmergencyManagement
        etat: NV-I
      TC-P01-004, TC-P01-009:
        intention: Reset efface l'affichage sans jamais lever l'interlock de sécurité
          ; re-latch si nouvel échec
        type: 💻 AUTO
        ref: FB_Safety_EmergencyManagement
        etat: NV-I
      TC-P01-010:
        intention: "⚡ Étape 1 : Impulsion de réarmement en cours (Step 5 PULSE, Cmd.ArmPulse_Cmd=TRUE).\
          \ \n        \U0001F6D1 Étape 2 : Appui volontaire opérateur sur BtnEmergencyCutOff\
          \ pendant le pulse. \n        ✅ Étape 3 : Coupure immédiate du pulse et\
          \ du maintien sans lever d'alarme de contacteur (LastAbortCause=1 (CST_ABORT_CUT_IHM),\
          \ avortement propre, message \"AU echec: coupure IHM en sequence\")."
        type: 💻 AUTO
        ref: §4.3
        etat: V-I
      TC-P01-SCEN-NOM:
        intention: "\U0001F4A4 Étape 0 (Repos initial) : Machine hors tension (EmergencyChainClosed=FALSE\
          \ ou TRUE, contacteur au repos, Armable=TRUE, message \"AU: repos - pret\
          \ a rearmer\"). \n        ⏱️ Étape 0bis (Pré-armement 500 ms) : Front ArmRequest\
          \ ➔ PreArmDelayActive=TRUE, reste en Step 0 IDLE pendant 500 ms (contacteurs\
          \ espacés, message \"AU: appui pris en compte - etablissement chaine\").\
          \ \n        \U0001F680 Étape 1 (Test Voie A 1 s) : Step 1 TEST_A, ForceTestA=TRUE\
          \ ➔ MaintainA_Cmd=FALSE, MaintainB_Cmd=TRUE. Chaîne matérielle doit s'ouvrir\
          \ (EmergencyChainClosed=FALSE). Message \"AU: autotest canal A en cours\"\
          . \n        \U0001F50D Étape 2 (Restauration A 500 ms) : Step 2 RESTORE_A,\
          \ ForceTestA=FALSE ➔ MaintainA_Cmd=TRUE. Chaîne se referme (EmergencyChainClosed=TRUE).\
          \ Settle contacteur 500 ms. \n        \U0001F50D Étape 3 (Test Voie B 1\
          \ s) : Step 3 TEST_B, ForceTestB=TRUE ➔ MaintainB_Cmd=FALSE, MaintainA_Cmd=TRUE.\
          \ Chaîne matérielle doit s'ouvrir (EmergencyChainClosed=FALSE). Message\
          \ \"AU: autotest canal B en cours\". \n        \U0001F50D Étape 4 (Restauration\
          \ B & Hold 1 s) : Step 4 RESTORE_B, ForceTestB=FALSE ➔ MaintainA/B_Cmd=TRUE.\
          \ Chaîne refermée et tenue 1 s avant pulse (relais PowerKeepAlive audibles,\
          \ message \"AU: restauration canal B\"). \n        ⚡ Étape 5 (Pulse collage\
          \ 1 s) : Step 5 PULSE, Cmd.ArmPulse_Cmd=TRUE pendant 1000 ms. Message \"\
          AU: impulsion rearmement contacteur\". \n        ⏱️ Étape 6 (Confirmation\
          \ contacteur ≤ 2 s) : Step 6 CONFIRM, Cmd.ArmPulse_Cmd=FALSE, attente PowerContactorEngaged=TRUE.\
          \ Message \"AU: attente confirmation contacteur\". \n        ✅ Étape 7 (Succès\
          \ & Verrouillage 5 s) : PowerContactorEngaged=TRUE ➔ WasArmed=TRUE, Done=TRUE,\
          \ retour Step 0 IDLE. Garde anti-chatter active : Armable=FALSE pendant\
          \ les 5 s suivant le départ (message \"AU: temporisation 5s en cours - patienter\"\
          ), puis retour Armable=TRUE."
        type: ⚡ AUTO
        ref: §4.3
        etat: V-I
      TC-P01-SCEN-DYN:
        intention: "\U0001F680 Phase 1 (Mise en service) : Réarmement nominal complet\
          \ abouti (Done=TRUE, WasArmed=TRUE). \n        ⚡ Phase 2 (Coupure procédé\
          \ en marche) : Dérive treuil M1/M2/M3 ➔ PowerCutOffRequest=TRUE. Retombée\
          \ immédiate MaintainA/B_Cmd=FALSE, contacteur retombe, WasArmed=FALSE, Armable=FALSE,\
          \ message \"AU: coupure securite metier active - lever la cause puis rearmer\"\
          . \n        \U0001F6E1️ Phase 3 (Tentative sous défaut) : Front ArmRequest\
          \ sous PowerCutOffRequest=TRUE ➔ Refus net, reste Step 0 IDLE sans alarme\
          \ parasite contacteur. \n        \U0001F504 Phase 4 (Acquittement défaut\
          \ procédé) : Disparition dérive + Reset ➔ Armable redevient TRUE (si garde\
          \ 5 s écoulée). \n        ⚠️ Phase 5 (Échec collage contacteur) : Nouvel\
          \ armement, auto-tests A/B OK, pulse 1 s envoyé, mais contacteur ne colle\
          \ pas (Step 6 timeout 2 s) ➔ Avortement LastAbortCause=128 (CST_ABORT_TIMEOUT_CONTACTOR),\
          \ alarme EmergencyArmingFailed=TRUE, Lockout 5 s (EmergencyArmingLockoutActive=TRUE),\
          \ message \"AU echec: contacteur non confirme\". \n        \U0001F513 Phase\
          \ 6 (Reprise après échec) : Écoulement Lockout 5 s + impulsion Reset ➔ Alarme\
          \ acquittée, Armable=TRUE, prêt pour nouvel essai."
        type: 💻 AUTO
        ref: §4.3
        etat: V-I
      TC-P01-001:
        intention: "⚡ Étape 1 : Enfoncement coup de poing AU physique sur site en\
          \ production ➔ Ouverture matérielle boucle 24V (EmergencyChainClosed=FALSE).\
          \ \n        \U0001F512 Étape 2 : Grâce au latch WasArmed=TRUE (aucune raison\
          \ métier), les sorties PLC MaintainA/B_Cmd restent TRUE. \n        ⛔ Étape\
          \ 3 : Retombée instantanée du contacteur de puissance ligne par coupure\
          \ matérielle en série. \n        \U0001F504 Étape 4 : Relâchement coup de\
          \ poing ➔ Boucle 24V se referme immédiatement (EmergencyChainClosed=TRUE),\
          \ relais PLC étant restés fermés. Prêt pour réarmement sans rejouer les\
          \ auto-tests PLC."
        type: 🟢 SITE
        ref: §6.1
        etat: V-I
      TC-P01-002:
        intention: "\U0001F50D Étape 1 : Surveillance indépendante des canaux A et\
          \ B en régime nominal établi. \n        ⚡ Étape 2 : Test de coupure unilatérale\
          \ canal A (ForceTestA=TRUE ➔ MaintainA_Cmd=FALSE, B maintenu TRUE). \n \
          \       \U0001F50D Étape 3 : Vérification réaction boucle ➔ Restauration\
          \ canal A (500 ms settle). \n        ⚡ Étape 4 : Test de coupure unilatérale\
          \ canal B (ForceTestB=TRUE ➔ MaintainB_Cmd=FALSE, A maintenu TRUE) ➔ Restauration\
          \ canal B (1 s hold)."
        type: ⚡ MIXTE
        ref: §5
        etat: V-I
      TC-P01-003:
        intention: "\U0001F680 Étape 1 : Front montant ArmRequest sous préconditions\
          \ saines ➔ Délai pré-armement 500 ms. \n        ⚡ Étape 2 : Auto-tests A/B\
          \ croisés validés ➔ Génération impulsion collage contacteur 1.0 s exacte\
          \ (Cmd.ArmPulse_Cmd=TRUE). \n        ⏱️ Étape 3 : Retombée du pulse à 1.0\
          \ s (Cmd.ArmPulse_Cmd=FALSE) et passage en Step 6 CONFIRM."
        type: ⚡ AUTO
        ref: §4.3
        etat: V-I
      TC-P01-004:
        intention: "⚠️ Étape 1 : Apparition d'un défaut de sécurité ou d'auto-test\
          \ (Status.Fault.Error=TRUE, StartupFail=TRUE ou RedundancyTestFailed=TRUE).\
          \ \n        \U0001F504 Étape 2 : Front montant sur Reset ➔ Effacement de\
          \ l'affichage du défaut (Ack:=TRUE, StartupFail:=FALSE, RedundancyTestFailedCause:=FALSE).\
          \ \n        \U0001F6E1️ Étape 3 : Verrouillage maintenu : aucun redémarrage\
          \ automatique, séquence reste à IDLE Step 0."
        type: 💻 AUTO
        ref: §4.4
        etat: V-I
      TC-P01-005:
        intention: "\U0001F504 Temps 1 : Action 1 = Impulsion Reset opérateur pour\
          \ acquitter et purger l'état de défaut. \n        \U0001F680 Temps 2 : Action\
          \ 2 = Impulsion ArmRequest distincte et consciente pour engager l'armement\
          \ (rejet si tenté simultanément ou sans Reset préalable)."
        type: ⚡ MIXTE
        ref: §4.4
        etat: V-I
      TC-P01-006:
        intention: "\U0001F680 Étape 1 : Front ArmRequest ➔ Délai 500 ms ➔ Lancement\
          \ TestA (Step 1, coupure 1 s canal A, MaintainA_Cmd=FALSE). \n        ⚠️\
          \ Étape 2 : Détection canal collé : EmergencyChainClosed reste TRUE à l'échéance\
          \ de TonTestA (1 s). \n        \U0001F6A8 Étape 3 : Avortement immédiat\
          \ ➔ RedundancyTestFailedCause=TRUE, LastAbortCause=32 (CST_ABORT_REDUNDANCY_A),\
          \ message \"AU echec: voie A collee\", retour IDLE Step 0."
        type: ⚡ AUTO
        ref: §4.3b
        etat: V-I
      TC-P01-007:
        intention: "⚡ Étape 1 : Fin d'impulsion de collage 1 s ➔ Entrée en Step 6\
          \ CONFIRM. \n        ⏱️ Étape 2 : Écoulement timeout 2.0 s sans retour PowerContactorEngaged.\
          \ \n        \U0001F512 Étape 3 : Déclenchement alarme EmergencyArmingFailedCause=TRUE\
          \ + LastAbortCause=128 (CST_ABORT_TIMEOUT_CONTACTOR) + Lockout 5.0 s (EmergencyArmingLockoutActive=TRUE,\
          \ ArmPulseInhibitActive=TRUE), message \"AU echec: contacteur non confirme\"\
          ."
        type: 💻 AUTO
        ref: §4.3
        etat: V-I
      TC-P01-008:
        intention: "⚡ Étape 1 : Détection dérive métier critique (ex. survitesse treuil\
          \ ➔ PowerCutOffRequest=TRUE). \n        ⛔ Étape 2 : Retombée immédiate et\
          \ inconditionnelle des canaux A et B (MaintainA/B_Cmd=FALSE, reset WasArmed=FALSE).\
          \ \n        \U0001F6E1️ Étape 3 : Verrouillage Armable=FALSE (CutOffActive=TRUE),\
          \ message \"AU: coupure securite metier active - lever la cause puis rearmer\"\
          ."
        type: 💻 AUTO
        ref: §4.1
        etat: V-I
      TC-P01-009:
        intention: "\U0001F6E1️ Étape 1 : Présence active de PowerCutOffRequest=TRUE\
          \ (ou BtnEmergencyCutOff=TRUE). \n        \U0001F6AB Étape 2 : Tentative\
          \ d'armement ArmRequest ➔ Refus net, interdiction de transition hors Step\
          \ 0 (Armable=FALSE). \n        \U0001F504 Étape 3 : Persistance du blocage\
          \ si Reset sans disparition de la cause brute."
        type: 💻 AUTO
        ref: §4.2
        etat: V-I
  AF-02:
    file: AF_Partie-02_Architecture_Programme_v3.2.md
    functions:
      F02.01:
        fonction: Ordonner le cycle applicatif
        description: Exécute les six PRG dans l'ordre Acquisition → Modes/Cycle →
          Treuils/Benne → Translation → Outputs → Supervision.
        realisee_par: MainTask + PRG_02 à PRG_07
        criticite: 🔵 C2
        tc_couvrants:
        - TC-P02-004
        statut: ⚠️ revue MainTask manuelle
        etat: NV
      F02.02:
        fonction: Encapsuler l'orchestration ST
        description: Les PRG rendent visibles leurs instances, flux et arbitrages
          ; calculs et machines d'état résident dans les FB.
        realisee_par: PRG_02 à PRG_07
        criticite: ⚪ C1
        tc_couvrants:
        - TC-P02-002
        statut: ✅
        etat: NV-I
      F02.03:
        fonction: Garantir un producteur unique
        description: Chaque image, bus, commande et état public a un propriétaire
          unique, identifié avant tout raccordement.
        realisee_par: Contrats ST_* + PRG producteurs
        criticite: 🟠 C3
        tc_couvrants:
        - TC-P02-001
        statut: ⚠️ gate à fiabiliser (TBD §8)
        etat: NV
      F02.04:
        fonction: Isoler la barrière de sortie
        description: Seul PRG_06_Outputs applique les interlocks finaux et écrit les
          Q/PDO des actionneurs.
        realisee_par: PRG_06_Outputs
        criticite: 🔴 C4
        tc_couvrants:
        - TC-P02-003
        statut: ✅
        etat: NV-I
      F02.05:
        fonction: Rendre explicites les retards de scan
        description: Toute donnée consommée avant son producteur est interdite, sauf
          retard d'un scan nommé et justifié.
        realisee_par: Ordonnancement MainTask
        criticite: 🟠 C3
        tc_couvrants:
        - TC-P02-004
        statut: ⚠️ revue MainTask manuelle
        etat: NV
      F02.06:
        fonction: Séparer supervision et commande métier
        description: La vue troubleshooting observe seulement ; PRG_07 porte distinctement
          reset IHM, persistance et bypass autorisés.
        realisee_par: PRG_07_Supervision + FB_TroubleshootingView
        criticite: 🔵 C2
        tc_couvrants:
        - TC-P02-005
        statut: ✅
        etat: NV-I
    validation_points:
      TC-P02-001:
        etat: NV
        intention: ''
        type: ''
      TC-P02-002:
        intention: Les calculs et machines d'état résident dans les FB ; le PRG rend
          ses arbitrages et flux explicitement lisibles
        type: 💻 AUTO
        ref: §2
        etat: NV
      TC-P02-003:
        intention: Aucun autre POU n'écrit les Q/PDO finaux
        type: 💻 AUTO
        ref: §3
        etat: NV
      TC-P02-004:
        etat: NV
        intention: ''
        type: ''
      TC-P02-005:
        intention: FB_TroubleshootingView ne produit aucune commande, configuration
          ni interlock
        type: 💻 AUTO
        ref: §3
        etat: NV
  AF-03:
    file: AF_Partie-03_Contrats_Composants_v2.3.md
    functions: {}
    validation_points:
      TC-P03-001:
        intention: Enable=FALSE neutralise commandes et statut (gate) ; Enable=TRUE
          autorise l'état Ready
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P03-002:
        intention: Front Reset efface l'affichage (interlock reste sur Cause)
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P03-003:
        intention: Retour READY, nouvel ordre explicite requis
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P03-004:
        intention: Absents des briques E/S, joystick et diag
        type: 💻 AUTO
        ref: §3
        etat: NV
      TC-P03-005:
        intention: Échanges via interfaces/DUTs publics uniquement
        type: 💻 AUTO
        ref: §2
        etat: NV
      TC-P03-006:
        intention: Nouveau front Cause ➔ Ack=FALSE
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P03-007:
        intention: Warning s'efface sans Reset, Fault exige Ack
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P03-014:
        intention: Hors plage nominale (dt = 0 ou dt > CST_MaxCycleDeltaMs) ➔ CycleTimeS
          = DefaultValueS ; sinon dt réel ; secours non latché
        type: 💻 AUTO
        ref: §3 → fiche
        etat: NV-I
      TC-P03-014.1:
        intention: 'Plage nominale : au 1ᵉʳ appel CycleTimeS = DefaultValueS (aucun
          dt disponible) ; aux appels suivants, 0 < dt ≤ CST_MaxCycleDeltaMs ⟹ CycleTimeS
          = dt réel (ms→s), quelle que soit la valeur du dt d''un cycle à l''autre,
          borne dt = CST_MaxCycleDeltaMs incluse (⟹ 1.0 s)'
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P03-014.2:
        intention: 'Borne basse : dt = 0 (deux appels dans le même instant horloge)
          ⟹ CycleTimeS = DefaultValueS'
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P03-014.3:
        intention: 'Borne haute, non latchée : dt > CST_MaxCycleDeltaMs (borne exclue
          : dt = 1001 ms ⟹ secours ; rebouclage TIME() / reprise) ⟹ CycleTimeS = DefaultValueS
          ; dès le scan suivant à dt nominal, le dt réel est de nouveau publié'
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P03-008:
        intention: 'Cumul de plusieurs causes latchées : 2 Causes[i] distincts (Active
          AND Latching) apparus à des instants différents s''accumulent dans LatchedId
          ; un seul front Reset les acquitte ensemble. Cas concret : 2 causes (Causes[2]
          puis Causes[5], Active AND Latching) à scans différents → LatchedId=0x0024
          ; relâcher sans Reset → reste 0x0024 ; un front Reset → LatchedId=0, Latched=FALSE.'
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P03-009:
        intention: 'Cause live (Latching=FALSE) + cause latchée (Latching=TRUE) simultanées
          : la live alimente ErrorId et retombe seule quand Active repasse FALSE ;
          la latchée arme LatchedId et reste jusqu''au front Reset. Cas concret :
          cause live (Causes[1], Latching=FALSE) → ErrorId bit1, retombe seule ; cause
          latchée (Causes[3]) → LatchedId bit3, reste ; front Reset → LatchedId=0.
          Indépendance des vues live/latchée.'
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P03-010:
        intention: 'Bornes de la liste Causes[0..15] : Causes[0] et Causes[15] correctement
          mappés sur le bit 0 et le bit 15 (SHL(WORD#1, i)), pas d''off-by-one'
        type: 💻 AUTO
        ref: §3
        etat: NV-I
      TC-P03-011:
        intention: 'Reset sans historique de défaut : aucun effet parasite, LatchedId
          reste 0, Latched reste FALSE'
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P03-012:
        intention: 'Reset maintenu (niveau haut) sans nouveau front pendant qu''une
          cause latchée disparaît puis réapparaît : pas d''acquittement silencieux
          (le clear n''agit que sur le front R_TRIG) ; la cause réapparue Active AND
          Latching ré-arme son bit (ré-alarme) — faille T148 non applicable à cette
          brique'
        type: 💻 AUTO
        ref: §6
        etat: NV-I
      TC-P03-013:
        intention: 'Enable=FALSE : la vue LIVE n''est pas évaluée (ErrorId=0, Error=FALSE)
          mais la vue LATCHÉE reste publiée — un défaut laté non acquitté ne disparaît
          pas sur bascule Enable OFF→ON sans Reset'
        type: 💻 AUTO
        ref: §4
        etat: NV-I
  AF-04:
