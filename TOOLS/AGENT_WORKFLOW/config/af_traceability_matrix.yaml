        type: 💻 AUTO
        ref: §1, §2, §5bis
      TC-P08-008:
        intention: Winch, Translation et Cycle exigent DeadmanArmed
        preuve: ⚠️ gate câblé dans le PRG de collage, pas dans un FB — vérifié par
          G375 (note ↓), pas par test_fb_joystick.st
        type: 🔒 GATE
