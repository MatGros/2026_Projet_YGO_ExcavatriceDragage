  AF-06:
    file: AF_Partie-06_Acquisition_Qualification_IO_v2.4.md
    functions:
      F06.01:
        fonction: Établir un verdict préflight passif
        description: Sur front Execute (demande IHM GVL_IHM.Commun.Preflight.BtnRun)
          uniquement, attend l'immobilité machine, agrège 16 contrôles et publie PreflightOk,
          PreflightDone, PreflightBusy, PreflightErrorId. Aucun verdict automatique
          au démarrage automate.
        realisee_par: FB_Acquisition_Preflight + PRG_07_Supervision
        criticite: 🔵 C2
        tc_couvrants:
        - TC-P06-007
        statut: ✅ code lu
        etat: NV-I
    validation_points:
      TC-P06-001:
        intention: Consommateurs lisent des faits qualifiés
        type: 💻 AUTO
        ref: §3
        etat: NV
      TC-P06-002:
        intention: Zéro ré-inversion dans les FB métier
        type: 💻 AUTO
        ref: §3
        etat: NV
      TC-P06-003:
        intention: HwIn source unique par domaine
        type: 💻 AUTO
        ref: §3
        etat: NV
      TC-P06-004:
        intention: Statuts dispos pour Modes/Safety/IHM
        type: 💻 AUTO
        ref: §4
        etat: NV
      TC-P06-005:
        intention: PowerKeepAlive_A/B_RQ, EmergencyChainClosed_DI
        type: 🟢 SITE
        ref: §5
        etat: NV
      TC-P06-006:
        intention: PRG_06_Outputs seul producteur final
        type: 💻 AUTO
        ref: §6
        etat: NV
      TC-P06-007:
        intention: 'Sans front Execute, PreflightDone reste FALSE (aucun verdict au
          démarrage). Sur front Execute, tant que la machine n''est pas immobile :
          PreflightBusy=TRUE et aucun verdict final. Une fois immobile, les 16 bits
          sont agrégés et PreflightOk=(PreflightErrorId=0). Sur front Execute + MachineIsStill=TRUE,
          injecter chaque défaut E/S un à un (freins M1/M2/M3, contacteurs, thermiques,
          phases, câble, M3, contacteur sans chaîne, codeurs, homing/position) → vérifier
          le bit PreflightErrorId correspondant (bit0..15) ; suite bit-à-bit (bits
          8..15) ; tous à 0 → PreflightOk=TRUE, chaque bit posé → PreflightOk=FALSE.'
        type: 💻 AUTO_PLC
        ref: FB_Acquisition_Preflight PRG_07_Supervision
        etat: NV-I
