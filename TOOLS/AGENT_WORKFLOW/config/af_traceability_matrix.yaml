      TC-P10-SYNC-03:
        intention: "\U0001F527 Étape 1 (Sélection unitaire M1) : Mode Maintenance\
          \ N2 ou jog M1 seul (SyncEnable=FALSE, M1 commandé RelayFwdM1=TRUE, M2 au\
          \ repos RelayFwdM2=FALSE). \n        ✅ Étape 2 (Vérification neutralisation)\
          \ : BothCommanded=FALSE ➔ MismatchActive=FALSE, ContactorMismatch=FALSE.\
          \ \n        \U0001F513 Étape 3 (Mouvement libre M1) : M1 monte librement\
          \ tous paliers sans générer d'alarme de synchronisme pour permettre le recalage\
          \ mécanique."
        type: 💻 AUTO
        ref: §4.3
        etat: V-I
      TC-P10-SYNC-04:
        intention: "\U0001F6E0️ Étape 1 (Activation bypass banc) : BypassGlobal:=TRUE.\
          \ \n        ⚡ Étape 2 (Injection discordance totale) : M1 en montée P5,\
          \ M2 en descente P1. \n        ✅ Étape 3 (Neutralisation immédiate) : Sorties\
          \ forcées ContactorMismatch=FALSE, ContactorMismatchEscalated=FALSE, Diag.MismatchLevel=0."
        type: 💻 AUTO
        ref: §4.4
        etat: V-I
      TC-P10-012:
        intention: "\U0001F4A4 Étape 0 : BrakeCmd=TRUE, BrakeFeedback=FALSE, RestartInhibit=FALSE\
          \ — watchdog armé \n        \U0001F680 Étape 1 : Maintien 500ms sans confirmation\
          \ frein \n        ⚡ Étape 2 : ErrorId bit0, RestartInhibit:=TRUE, Reason:=BRAKE_COMMAND_NOT_CONFIRMED,\
          \ FAULT \n        ✅ Étape 3 : Pas de faux défaut au RestartRequired — BrakeCmd\
          \ retenu par RestartRequired (jusqu'à 1000ms) n'arme PAS le watchdog (armé\
          \ sur BrakeCmd final, jamais sur RequestedRelayFwd/Rev)"
        type: ⚡ AUTO_PLC
        ref: §3
        etat: NV
      TC-P10-013:
        intention: "\U0001F4A4 Étape 0 : État nominal, aucun défaut \n        \U0001F680\
          \ Étape 1 : Provoquer un défaut (timeout frein) → ErrorId/RestartInhibit/ResetRequired\
          \ latches \n        ⚡ Étape 2 : Couper Enable (ou AU) → sorties FALSE, MAIS\
          \ ErrorId/RestartInhibit/ResetRequired préservés \n        ✅ Étape 3 : Réautorisation\
          \ = cause disparue + front Reset + demande neutre + nouvelle demande distincte\
          \ → RestartInhibit:=FALSE"
        type: ⚡ AUTO_PLC
        ref: §5
        etat: NV
      TC-P10-020:
        intention: "\U0001F4A4 Étape 0 : Essai réel, frein + contacteur/bobine sur\
          \ le banc \n        \U0001F680 Étape 1 : Injecter un défaut de confirmation\
          \ frein \n        ⚡ Étape 2 : Mesurer le comportement watchdog réel (times,\
          \ contacteur/bobine) \n        ✅ Étape 3 : Watchdog frein validé sur le\
          \ terrain"
        type: 🟢 SITE
        ref: §3
        etat: NV
      TC-P10-021:
        intention: "\U0001F4A4 Étape 0 : Arrêt commandé, MotorRequest=FALSE \n   \
          \     \U0001F680 Étape 1 : Nouvelle demande dans le même sens avant expiration\
          \ \n        ⚡ Étape 2 : Temps mort DeadTimeSameDir (défaut 1s) respecté\
          \ après arrêt \n        ✅ Étape 3 : Redémarrage même sens bloqué tant que\
          \ le temps mort n'est pas écoulé"
        type: 💻 AUTO
        ref: §5
        etat: NV
      TC-P10-022:
        intention: "\U0001F4A4 Étape 0 : Arrêt commandé, MotorRequest=FALSE \n   \
          \     \U0001F680 Étape 1 : Nouvelle demande en sens inverse avant expiration\
          \ \n        ⚡ Étape 2 : Temps mort DeadTimeOppositeDir (défaut 1s, > même\
          \ sens) — en sus du délai d'inversion 200ms FB_Winch \n        ✅ Étape 3\
          \ : Inversion bloquée tant que le temps mort n'est pas écoulé"
        type: 💻 AUTO
        ref: §5
        etat: NV
      TC-P10-039.1:
        intention: "\U0001F4A4 Étape 0 : Tout état machine (Error/RestartInhibit/RestartRequired)\
          \ \n        \U0001F680 Étape 1 : Calcul BrakeCmd :=\\: RelayFwd OR RelayRev\
          \ \n        ⚡ Étape 2 : Vérification sur tous les états \n        ✅ Étape\
          \ 3 : Jamais de divergence frein/mouvement — frein suit directement la commande\
          \ de sens"
        type: 💻 AUTO
        ref: §2bis
        etat: NV-I
      TC-P10-SHAPER-01:
        intention: "\U0001F4A4 Étape 0 (Repos) : Enable=TRUE, TargetStep=0, ShapedStep=0,\
          \ StepDelay.Q=FALSE. \n        \U0001F680 Étape 1 (Départ immédiat Palier\
          \ 1) : Injection consigne TargetStep=5, StepRampDelay=T#1000ms ➔ Au scan\
          \ 0 exact ($t=0\\text{ ms}$), ShapedStep=1 immédiatement (aucun contacteur\
          \ vitesse, frein/sens autorisés). \n        ⏱️ Étape 2 (Attente P1➔P2) :\
          \ À $t=500\\text{ ms}$, StepDelayElapsed=500ms, ShapedStep=1. \n       \
          \ ⚡ Étape 3 (Franchissement P2) : À $t=1000\\text{ ms}$, StepDelay.Q=TRUE\
          \ ➔ ShapedStep=2. \n        \U0001F504 Étape 4 (Réarmement timer) : Au scan\
          \ suivant ($t=1010\\text{ ms}$), NOT StepDelay.Q réarme le timer TON, StepDelayElapsed=0ms.\
          \ \n        ⚡ Étape 5 (Paliers P3..P5) : Passage ShapedStep=3 à $t=2000\\\
          text{ ms}$, ShapedStep=4 à $t=3000\\text{ ms}$, ShapedStep=5 à $t=4000\\\
          text{ ms}$ exacts."
        type: ⚡ AUTO
        ref: §4.1
        etat: V-I
      TC-P10-SHAPER-02:
        intention: "\U0001F680 Étape 1 (Départ Palier 1) : TargetStep=5, StepRampDelay=T#500ms\
          \ (sens descente) ➔ ShapedStep=1 à $t=0\\text{ ms}$. \n        ⚡ Étape 2\
          \ (Cadence rapide 500 ms) : ShapedStep=2 à $t=500\\text{ ms}$, ShapedStep=3\
          \ à $t=1000\\text{ ms}$, ShapedStep=4 à $t=1500\\text{ ms}$, ShapedStep=5\
          \ à $t=2000\\text{ ms}$ exacts. \n        ✅ Étape 3 (Contrôle dynamique)\
          \ : Temps total d'établissement = $2.0\\text{ s}$ (2× plus vif que la montée\
          \ pour descente benne)."
        type: ⚡ AUTO
        ref: §4.2
        etat: V-I
      TC-P10-SHAPER-03:
        intention: "⚡ Étape 1 (Régime établi P5) : TargetStep=5, ShapedStep=5. \n\
          \        \U0001F6D1 Étape 2 (Chute partielle) : Réduction consigne TargetStep:=2\
          \ ➔ Au scan 0 exact, ShapedStep:=2 immédiatement sans aucune temporisation.\
          \ \n        ⛔ Étape 3 (Arrêt franc) : Annulation consigne TargetStep:=0\
          \ ➔ Au scan 0 exact, ShapedStep:=0, StepDelay(IN:=FALSE) remis à zéro."
        type: 💻 AUTO
        ref: §4.3
        etat: V-I
      TC-P10-SHAPER-04:
        intention: "⚠️ Étape 1 (Consigne négative) : Injection TargetStep:=-3 ➔ ShapedStep=0\
          \ (aucun palier négatif). \n        ⚠️ Étape 2 (Consigne supérieure à 5)\
          \ : Injection TargetStep:=9 ➔ Plafonnement strict à ShapedStep=5 après écoulement\
          \ de la rampe nominale. \n        \U0001F512 Étape 3 (Coupure Enable) :\
          \ Enable:=FALSE en pleine rampe ➔ Forçage immédiat ShapedStep=0 et StepDelay(IN:=FALSE)."
        type: 💻 AUTO
        ref: §4.4
        etat: V-I
      TC-P10-014:
        intention: "\U0001F4A4 Étape 0 : M1/M2 synchronisés, écart < CfgSyncTolerance_M=0.8m\
          \ (Zone 1) \n        \U0001F680 Étape 1 : Injection écart M1/M2 > 0.8m (_SyncCfgPersist,\
          \ GVL_PERSISTENT — corrige le 0.10m documenté) \n        ⚡ Étape 2 : SyncWarn\
          \ IHM instantané + latch (sans timer) ; SyncDeviationWarn force le palier\
          \ 1 sur M1/M2 \n        ✅ Étape 3 : Pas de SafeStop sur simple écart (Zone\
          \ 2 = dégradation palier 1 SANS coupure)"
        type: 💻 AUTO
        ref: §3
        etat: NV
      TC-P10-015:
        intention: "\U0001F4A4 Étape 0 : M1/M2 en marche, cohérence commande nominale\
          \ \n        \U0001F680 Étape 1 : Injection incohérence commande (ContactorMismatch)\
          \ \n        ⚡ Étape 2 : Détection bit1 ErrorId, temporisation 500ms \n \
          \       ✅ Étape 3 : SafeStop fast déclenché côté Treuils"
        type: 💻 AUTO
        ref: §3
        etat: NV
      TC-P10-016:
        intention: "\U0001F4A4 Étape 0 : SyncActive=TRUE, M1 et M2 en mouvement synchrone\
          \ (hors BenneBusy, hors butée) \n        \U0001F680 Étape 1 : Arrêt (SafeStop/Permit)\
          \ sur M1 \n        ⚡ Étape 2 : SafeStopM2_Active := SafeStopM2_Raw OR (SyncActive\
          \ AND SafeStopM1_Raw) \n        ✅ Étape 3 : M2 coupé au MÊME scan (sans\
          \ attendre le filtre 500/800ms), symétrique M2→M1"
        type: 💻 AUTO
        ref: §4
        etat: NV
  AF-11:
    file: AF_Partie-11_Fonction_Translation_v2.3.md
    functions:
      F11.01:
        fonction: Décoder la position M3 (5 capteurs)
        description: Position qualifiée Travail/Trémie/Extrêmes ; incohérence → défaut
          immédiat
        realisee_par: FB_Translation_PositionDecoder
        criticite: 🟠 C3
        tc_couvrants:
        - TC-P11-001
        - '002'
        statut: ⚠️ cible PRG‑05 ; code encore PRG‑02
        etat: NV
      F11.02:
        fonction: Protéger M3 (Méca A/B, incohérence, bypass)
        description: Arrêt commandé mais mouvement résiduel / incohérence prolongée
          → SafeStop+PowerCutOff ; produit les permits directionnels TremiePermit/MaintenancePermit
          (source safety unique, §3bis)
        realisee_par: FB_Safety_Translation
        criticite: 🔴 C4
        tc_couvrants:
        - TC-P11-002
        - '010'
        - '011'
        - '014'
        statut: ✅
        etat: NV-I
      F11.03:
        fonction: Piloter le mouvement M3 (rampe, ralentissement, interlock sens)
        description: Joystick/SemiAuto → rampe → AC600 ; ralentissement PV ; boutons
          IHM MAINT exigent homme-mort
        realisee_par: FB_Translation
        criticite: 🟠 C3
        tc_couvrants:
        - TC-P11-003-005
        - '013'
        statut: ✅
        etat: NV-I
      F11.04:
        fonction: Barrière finale sorties + watchdog frein
        description: Watchdog frein 500ms, réautorisation post-timeout, gate mot/fréquence,
          reset AC600 sous inhibition
        realisee_par: FB_TranslationOutputInterlock
        criticite: 🔴 C4
        tc_couvrants:
        - TC-P11-006-009
        statut: ✅
        etat: NV-I
      F11.05:
        fonction: Anti-télescopage hauteur M1/M2 (collision benne/translation)
        description: Bloque translation si câbles M1/M2 sous hauteur mini, sauf Bypass.MinHeight
          conscient (jamais via BypassGlobal)
        realisee_par: PRG_05_Translation §0 (câblage direct, hors FB dédié)
        criticite: 🔴 C4
        tc_couvrants:
        - TC-P11-015
        statut: ✅
        etat: NV
    validation_points:
      TC-P11-001/002:
        intention: "\U0001F4A4 Étape 0 : 5 capteurs M3 lus, mot capteurs en formation\
          \ \n        \U0001F680 Étape 1 : Décodage 5 capteurs → mot valide → position\
          \ qualifiée (Travail/Trémie/Extrêmes) \n        ⚡ Étape 2 : Mot incohérent\
          \ injecté → Incoherent=TRUE \n        ✅ Étape 3 : Safety bit7 → SafeStop+PowerCutOff"
        type: 💻 AUTO
        ref: FB_Translation_PositionDecoder
        etat: NV-I
      TC-P11-010/011/014:
        intention: "\U0001F4A4 Étape 0 : M3 en mouvement nominal, BypassGlobal=FALSE\
          \ \n        \U0001F680 Étape 1 : Injection défaut (Méca A : mouvement résiduel\
          \ ; Méca B : incohérence prolongée) \n        ⚡ Étape 2 : SafeStop+PowerCutOff\
          \ déclenchés \n        ✅ Étape 3 : BypassGlobal efface ErrorId (vérifié\
          \ séparément)"
        type: ⚡ AUTO_PLC
        ref: FB_Safety_Translation
        etat: NV-I
      TC-P11-003/004/005/013:
        intention: "\U0001F4A4 Étape 0 : M3 au repos, joystick au neutre \n      \
          \  \U0001F680 Étape 1 : Consigne joystick/SemiAuto → rampe → AC600 \n  \
          \      ⚡ Étape 2 : Ralentissement PV si Direction=1+capteur ; interlock\
          \ sens 200ms si vitesse≠0 \n        ✅ Étape 3 : Boutons IHM MAINT exigent\
          \ DeadmanArmed — mouvement validé"
        type: ⚡ AUTO_PLC
        ref: FB_Translation
        etat: NV
      TC-P11-006-009:
        intention: "\U0001F4A4 Étape 0 : Sorties M3 autorisées, frein OK \n      \
          \  \U0001F680 Étape 1 : Perte BrakeFeedback pendant mouvement \n       \
          \ ⚡ Étape 2 : Watchdog frein 500ms sans confirmation → FAULT+Inhibit \n\
          \        ✅ Étape 3 : Réautorisation = Cause+Reset+Mot 0+nouvelle demande\
          \ — zéro redémarrage auto"
        type: ⚡ AUTO_PLC
        ref: FB_TranslationOutputInterlock
        etat: NV
      TC-P11-015:
        intention: "\U0001F4A4 Étape 0 : CablePosM1/CablePosM2 > _TranslationMinHeightM1M2_M\
          \ (6.0m) \n        \U0001F680 Étape 1 : Descente treuils sous 6.0m → M3_HeightInterlockOk=FALSE\
          \ \n        ⚡ Étape 2 : Translation bloquée ; Bypass.MinHeight (dédié) lève\
          \ l'interlock, BypassGlobal non \n        ✅ Étape 3 : Interlock anti-télescopage\
          \ actif — câblé PRG_05_Translation.st §0 (hors FB dédié)"
        type: 💻 AUTO
        ref: PRG_05_Translation
        etat: NV-I
      TC-P11-002:
        intention: "\U0001F4A4 Étape 0 : Décodage actif, mot capteurs lu \n      \
          \  \U0001F680 Étape 1 : Injection d'un mot incohérent \n        ⚡ Étape\
          \ 2 : Incoherent=TRUE → Safety bit7 levé \n        ✅ Étape 3 : SafeStop+PowerCutOff"
        type: ⚡ AUTO_PLC
        ref: §3
        etat: NV
      TC-P11-010:
        intention: "\U0001F4A4 Étape 0 : Arrêt commandé, DriveActualFreqHz attendu\
          \ à 0 \n        \U0001F680 Étape 1 : ABS(DriveActualFreqHz)>0.5Hz maintenu\
          \ >1s \n        ⚡ Étape 2 : Détection Méca A, bit5 levé \n        ✅ Étape\
          \ 3 : SafeStop+PowerCutOff"
        type: ⚡ AUTO_PLC
        ref: §4
        etat: NV-I
      TC-P11-010.1:
        intention: "\U0001F4A4 Étape 0 : Méca A déclenché → MecaAFault latché (FB_Safety_Translation.st:81,95-99,175)\
          \ \n        \U0001F680 Étape 1 : Cause disparaît (freq retombe) \n     \
          \   ⚡ Étape 2 : Défaut reste latché, aucun redémarrage automatique \n  \
          \      ✅ Étape 3 : Reset front + nouvelle demande requis pour réarmer"
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P11-011:
        intention: "\U0001F4A4 Étape 0 : Arrêt commandé (Direction=0) \n        \U0001F680\
          \ Étape 1 : Incohérence arrêt maintenue >3s \n        ⚡ Étape 2 : Détection\
          \ Méca B, bit4 levé \n        ✅ Étape 3 : SafeStop+PowerCutOff"
        type: ⚡ AUTO_PLC
        ref: §4
        etat: NV
      TC-P11-011.1:
        intention: "\U0001F4A4 Étape 0 : HeartbeatIhmOk=FALSE (perte IHM) \n     \
          \   \U0001F680 Étape 1 : Condition élargie : ABS(freq)>0.5 OR DriveStatusWord.0\
          \ OR NOT BrakeFeedback (FB_Safety_Translation.st:151-152) \n        ⚡ Étape\
          \ 2 : Méca B variante déclenchée \n        ✅ Étape 3 : SafeStop+PowerCutOff"
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P11-014:
        intention: "\U0001F4A4 Étape 0 : BypassGlobal=FALSE, défauts actifs \n   \
          \     \U0001F680 Étape 1 : BypassGlobal=TRUE (mise en service) \n      \
          \  ⚡ Étape 2 : ErrorId effacé, TONs coupés, Reset fonctionnel \n       \
          \ ✅ Étape 3 : Bypass global neutralise la safety M3"
        type: ⚡ AUTO_PLC
        ref: §6
        etat: NV
      TC-P11-001:
        intention: "\U0001F4A4 Étape 0 : 5 capteurs TOR lus (SensorTremie/PV/P2/P1/Maintenance)\
          \ \n        \U0001F680 Étape 1 : Codage du mot thermomètre (bit4=Trémie\
          \ … bit0=Maintenance) \n        ⚡ Étape 2 : 6 mots valides acceptés (11111➔00000)\
          \ \n        ✅ Étape 3 : Tout autre mot → Incoherent=TRUE"
        type: 💻 AUTO
        ref: §3
        etat: NV-I
      TC-P11-EST-01:
        intention: "\U0001F4A4 Étape 1 (Initialisation à froid) : Démarrage sous Enable=TRUE\
          \ avec PersistedPositionM=12.5 et PersistedInitialized=TRUE. \n        \U0001F3AF\
          \ Étape 2 (Restauration immédiate) : PositionEstimatedM prend immédiatement\
          \ la valeur 12.5m dès le 1er cycle. \n        \U0001F512 Étape 3 (Verrouillage\
          \ état) : Initialized=TRUE, aucun saut parasite de recalage émis (Recalibrated=FALSE,\
          \ RecalibratedSensorId=-1)."
        type: ⚡ AUTO
        ref: §4.1
        etat: V-I
      TC-P11-EST-02:
        intention: "\U0001F697 Étape 1 (Mouvement avec dérive) : Position estimée\
          \ courante à 19.2m. \n        \U0001F4CD Étape 2 (Franchissement physique\
          \ P1) : Front montant SensorP1: FALSE ➔ TRUE (cote calibrée PosP1M=20.0m).\
          \ \n        \U0001F3AF Étape 3 (Recalage instantané) : PositionEstimatedM\
          \ saute instantanément à 20.0m, pulse Recalibrated=TRUE pendant 1 cycle\
          \ avec RecalibratedSensorId=1 (P1)."
        type: ⚡ AUTO
        ref: §4.2
        etat: V-I
      TC-P11-EST-03:
        intention: "⚡ Étape 1 (Commande Maintenance) : ReqMaintenance=TRUE sous DriveActualFreqHz=50.0\
          \ Hz (vitesse $0.416\\text{ m/s}$). \n        ⏱️ Étape 2 (Progression temporelle)\
          \ : Exécution continue pendant $1.0\\text{ s}$ $\\rightarrow$ la position\
          \ progresse de manière monotone de $+0.416\\text{ m}$. \n        \U0001F6D1\
          \ Étape 3 (Neutralisation) : Enable=FALSE $\\rightarrow$ arrêt strict de\
          \ l'intégration, maintien de la dernière valeur estimée."
        type: 💻 AUTO
        ref: §4.3
        etat: V-I
      TC-P11-003:
        intention: "\U0001F4A4 Étape 0 : Enable=FALSE \n        \U0001F680 Étape 1\
          \ : Toute commande entrante (SafeStop/StartStop quelconques) \n        ⚡\
          \ Étape 2 : Neutralisation totale \n        ✅ Étape 3 : Enable=FALSE coupe\
          \ tout, indépendamment de SafeStop/StartStop"
        type: ⚡ AUTO_PLC
        ref: §1
        etat: NV
      TC-P11-004:
        intention: "\U0001F4A4 Étape 0 : M3 en mouvement vers Trémie (Direction=1)\
          \ \n        \U0001F680 Étape 1 : Activation SlowdownSensorTremie (PV) lors\
          \ de l'approche \n        ⚡ Étape 2 : Ralentissement d'approche engagé \n\
          \        ✅ Étape 3 : Ralentissement PV actif si Direction=1 (Trémie) ET\
          \ SlowdownSensor"
        type: ⚡ AUTO_PLC
        ref: §4
        etat: NV
      TC-P11-005:
        intention: "\U0001F4A4 Étape 0 : M3 en mouvement sens A \n        \U0001F680\
          \ Étape 1 : Demande inversion de sens \n        ⚡ Étape 2 : Bascule directe\
          \ si vitesse=0, sinon délai DirectionInterlockDelay=200ms \n        ✅ Étape\
          \ 3 : Interlock de sens correctement appliqué"
        type: ⚡ AUTO_PLC
        ref: §6
        etat: NV
      TC-P11-013:
        intention: "\U0001F4A4 Étape 0 : Mode MAINT actif, boutons IHM disponibles\
          \ \n        \U0001F680 Étape 1 : Appui bouton mouvement sans armement homme-mort\
          \ \n        ⚡ Étape 2 : Vérification DeadmanArmed \n        ✅ Étape 3 :\
          \ Mouvement refusé — boutons IHM MAINT exigent DeadmanArmed=TRUE"
        type: ⚡ AUTO_PLC
        ref: §3
        etat: NV
      TC-P11-006:
        intention: "\U0001F4A4 Étape 0 : BrakeReleaseRequest, NOT BrakeCommandOpenConfirmed,\
          \ NOT RestartInhibit — watchdog armé (FB_TranslationOutputInterlock.st:85-86)\
          \ \n        \U0001F680 Étape 1 : Confirmation à 499ms (avant exp.) \n  \
          \      ⚡ Étape 2 : Confirmation à 500ms (expiration) \n        ✅ Étape 3\
          \ : Frontière 499ms → pas de défaut ; 500ms → bit0, RestartInhibit, FAULT"
        type: ⚡ AUTO_PLC
        ref: §3
        etat: NV
      TC-P11-007:
        intention: "\U0001F4A4 Étape 0 : Timeout frein → RestartInhibit:=TRUE \n \
          \       \U0001F680 Étape 1 : Acquittement : ResetEdge.Q AND BrakeCommandOpenConfirmed\
          \ → efface bit0 (FB_TranslationOutputInterlock.st:99-125) \n        ⚡ Étape\
          \ 2 : Réautorisation : NOT Error AND NOT ResetRequired + mot 0 vu (NeutralRequestSeen)\
          \ \n        ✅ Étape 3 : Nouvelle demande 1/2 → mouvement réautorisé"
        type: ⚡ AUTO_PLC
        ref: §5
        etat: NV
      TC-P11-008:
        intention: "\U0001F4A4 Étape 0 : Demande de mouvement M3 reçue \n        \U0001F680\
          \ Étape 1 : Vérification confirmation frein simultanée \n        ⚡ Étape\
          \ 2 : Mot/fréquence nuls sans confirmation \n        ✅ Étape 3 : Mot/fréquence\
          \ autorisés seulement si confirmation frein simultanée"
        type: ⚡ AUTO_PLC
        ref: §4
        etat: NV
      TC-P11-009:
        intention: "\U0001F4A4 Étape 0 : RestartInhibit=TRUE (défaut frein) \n   \
          \     \U0001F680 Étape 1 : Envoi du mot 7 (reset AC600) \n        ⚡ Étape\
          \ 2 : Vérification que l'inhibition n'est pas levée \n        ✅ Étape 3\
          \ : Mot 7 autorisé pendant RestartInhibit (sans levée d'inhibition)"
        type: ⚡ AUTO_PLC
        ref: §6
        etat: NV
  AF-12:
    file: AF_Partie-12_Fonction_Diagnostic_v1.4.md
    functions:
      F12.01:
        fonction: Diagnostiquer le bus CANopen (joystick)
