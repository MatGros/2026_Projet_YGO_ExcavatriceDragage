        preuve: ArmingPermitDenied = RawButton AND NOT ArmingPermit
        type: ⬜ GAP
        ref: §4
      TC-P08-014:
        intention: Mise à l'échelle proportionnelle sur valeurs intermédiaires (RawX=9000→80%,
