  AF-08:
    file: AF_Partie-08_Fonction_Joystick_v2.1.md
    functions:
      F08.01:
        fonction: Acquérir les axes bruts + bouton
        description: Lit RawX/RawY/RawButton depuis le bus CANopen (ou l'image simulée)
        realisee_par: FB_Joystick
        criticite: C2
        tc_couvrants: []
        statut: ❌
      F08.02:
        fonction: Mettre à l'échelle proportionnellement
        description: Convertit le compte brut ADC en % signé ±100, avec deadband centrée
          sur le neutre persistant
        realisee_par: FB_AxisScale
        criticite: C2
        tc_couvrants:
        - TC-P08-014
        statut: ✅
      F08.03:
        fonction: Armer l'homme-mort par maintien
        description: Appui continu DeadmanArmHoldTime (100ms) et ArmingPermit=TRUE
          au terme du maintien
        realisee_par: FB_Joystick
        criticite: C4
        tc_couvrants:
        - TC-P08-002
        statut: ✅
      F08.04:
        fonction: Désarmer sur neutre prolongé
        description: Neutre tenu NeutralHoldTime (100ms), applicable seulement après
          DeadmanArmGraceTime (3s) écoulées depuis l'armement
        realisee_par: FB_Joystick
        criticite: C4
        tc_couvrants:
        - TC-P08-004
        statut: ✅
      F08.05:
        fonction: Désarmer sur perte de permission
        description: ArmingPermit=FALSE ⇒ désarmement immédiat (niveau, pas front),
          axes à 0
        realisee_par: FB_Joystick
        criticite: C4
        tc_couvrants:
        - TC-P08-005
        - TC-P08-011
        - TC-P08-012
        statut: ⚠️ *(logique FB testée ✅, mais producteur ArmingPermit câblé en dur
          TRUE en production — trou réel, voir §8 alerte 1 et Q1 QUESTIONS_OUVERTES_PRG02_v0.1.md)*
      F08.06:
        fonction: Détecter un défaut capteur hors plage
        description: RawX/RawY hors plage ⇒ arrêt (SpeedTgt=0) + ErrorId bit1 (Warning)
          sur les 2 axes
        realisee_par: FB_Joystick
        criticite: C3
        tc_couvrants:
        - TC-P08-007
        statut: ✅
      F08.07:
        fonction: Calibrer le neutre capteur
        description: Bouton calibration mémorise le neutre si axes en zone [2000;8000],
          persistant au redémarrage, accessible depuis l'écran HMI
        realisee_par: FB_Joystick
        criticite: C2
        tc_couvrants:
        - TC-P08-006
        - TC-P08-009
        - TC-P08-010
        statut: ⚠️ *(TC-P08-009/010 = type SITE, non exécutés automatiquement)*
      F08.08:
        fonction: Interdire tout mouvement sans armement homme-mort
        description: Gate combinant AxisCmd*.StartStop AND DeadmanArmed avant d'autoriser
          une commande treuil/translation
        realisee_par: PRG_04_Treuils_Benne (gate, pas un FB)
        criticite: C4
        tc_couvrants:
        - TC-P08-008
        statut: ✅ *(vérifié par G375_check_deadman_arming_gate.py, pas TEST_AUTO_CI)*
    validation_points:
      TC-P08-001:
        intention: Perte contacteur / CAN ➔ désarmer, annuler axes, et lever Error
          (ErrorId bit2, auto-effacé au retour)
        preuve: SpeedTgt=0, DeadmanArmed=FALSE, Error=TRUE
        type: 💻 AUTO
        ref: §3
      TC-P08-002:
        intention: Armement homme-mort par maintien DeadmanArmHoldTime (100ms) ET
          ArmingPermit=TRUE ; relâchement avant la fin du maintien annule la tentative
          (pas d'armement différé)
        preuve: Tenu 100ms + permis ➔ armé / relâché avant ➔ DeadmanArmed reste FALSE,
          nouvel appui exigé
        type: 💻 AUTO
        ref: §4
      TC-P08-003:
        intention: '⛔ RETIRÉ (v2.1) — testait DeadmanReconfEnable/DeadmanRearmTimeout
          (reconfirmation périodique 10s), ports supprimés du FB. La sémantique «
          bouton relâché en mouvement » n''existe plus : le FB ne surveille plus le
          bouton après armement, seul le neutre prolongé désarme (§4). ID non réattribué
          (immutabilité CODE_QUALITY_STANDARDS.md §0).'
        preuve: —
        type: —
        ref: §4
      TC-P08-004:
        intention: Neutre tenu NeutralHoldTime (100ms) après le délai de grâce DeadmanArmGraceTime
          (3s) désarme ; neutre bref ou pendant la grâce conserve l'armement
        preuve: Armement conservé / perdu
        type: 💻 AUTO
        ref: §4
      TC-P08-005:
        intention: Retrait de ArmingPermit (niveau, pas front) désarme immédiatement
          — le FB ne connaît plus Mode/BenneBusy en interne, c'est l'appelant qui
          pilote ArmingPermit
        preuve: DeadmanArmed=FALSE dès ArmingPermit=FALSE
        type: 💻 AUTO
        ref: §4
      TC-P08-006:
        intention: Calibration hors [2000;8000] ➔ alarme ErrorId bit0 (Fault, à acquitter)
        preuve: Bit0 actif, Reset sur cause disparue
        type: 💻 AUTO
        ref: §5
      TC-P08-007:
        intention: SpeedTgt signée [-100;+100] ; si RawX/RawY sort de la plage capteur
