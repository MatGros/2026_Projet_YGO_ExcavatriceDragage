  AF-08:
    file: AF_Partie-08_Fonction_Joystick_v2.5.md
    functions:
      F08.01:
        fonction: Acquérir axes + bouton
        description: Lit RawX/RawY/RawButton (bus CANopen ou image simulée)
        realisee_par: FB_Joystick
        criticite: 🔵 C2
        tc_couvrants:
        - TC-P08-010
        statut: ✅
        etat: NV-I
      F08.02:
        fonction: Mettre à l'échelle
        description: Brut ADC → % signé ±100, deadband ADC sur neutre persistant,
          saturation stricte
        realisee_par: FB_AxisScale
        criticite: 🔵 C2
        tc_couvrants:
        - TC-P08-010
        statut: ✅
        etat: NV-I
      F08.03:
        fonction: Armer homme-mort
        description: Maintien bouton DeadmanArmHoldTime (100ms) ET ArmingPermit=TRUE
        realisee_par: FB_Joystick
        criticite: 🔴 C4
        tc_couvrants:
        - TC-P08-020
        statut: ✅
        etat: NV-I
      F08.04:
        fonction: Désarmer homme-mort
        description: ArmingPermit=FALSE (immédiat) ou neutre tenu NeutralHoldTime
          après grâce DeadmanArmGraceTime (3s)
        realisee_par: FB_Joystick
        criticite: 🔴 C4
        tc_couvrants:
        - TC-P08-020
        statut: ✅
        etat: NV-I
      F08.05:
        fonction: Détecter défaut capteur
        description: RawX/RawY hors [0;10000] ± marge 500 → SpeedTgt=0 2 axes + Warning
        realisee_par: FB_Joystick
        criticite: 🟠 C3
        tc_couvrants:
        - TC-P08-030
        statut: ✅
        etat: NV-I
      F08.06:
        fonction: Calibrer neutre
        description: Front Calibrate en zone [2000;8000] → mémorise neutre persistant,
          sinon Fault
        realisee_par: FB_Joystick
        criticite: 🔵 C2
        tc_couvrants:
        - TC-P08-040
        statut: ⚠️ SITE non exécuté
        etat: NV
      F08.07:
        fonction: Interdire mouvement sans armement
        description: Consommateur combine AxisCmd*.StartStop AND DeadmanArmed avant
          tout ordre translation ; partiel sur treuils (voir §Intégration)
        realisee_par: PRG_04/PRG_05 (câblage), vérifié par gate G375
        criticite: 🔴 C4
        tc_couvrants:
        - TC-P08-050
        statut: ⚠️ partiel (treuils)
        etat: NV
      F08.08:
        fonction: Signaler armement refusé
        description: ArmingPermitDenied := RawButton AND NOT ArmingPermit (warning
          IHM)
        realisee_par: FB_Joystick
        criticite: ⚪ C1
        tc_couvrants:
        - TC-P08-060
        statut: ⚠️ non testé
        etat: NV
    validation_points:
      TC-P08-010:
        intention: RawX=9000→80%, RawY=300→-94% proportionnel (pas seulement aux bornes)
          ; deadband ADC centrée neutre
        type: 💻 AUTO
        ref: FB_AxisScale
        etat: NV
      TC-P08-020:
        intention: Armement maintien+permission ; relâché avant fin = annulé ; désarmement
          (décélération normale, pas coupure) sur ArmingPermit=FALSE ou neutre tenu
          après grâce 3s
        type: 💻 AUTO
        ref: FB_Joystick
        etat: NV
      TC-P08-030:
        intention: Hors plage ±marge ➔ SpeedTgt=0 2 axes, ErrorId bit1 Warning auto-effacé
        type: 💻 AUTO
        ref: FB_Joystick
        etat: NV
      TC-P08-040:
        intention: Hors [2000;8000] ➔ Fault bit0 à acquitter ; neutre persiste après
          redémarrage PLC
        type: ⚡ AUTO+SITE
        ref: FB_Joystick
        etat: NV
      TC-P08-050:
        intention: Translation refuse tout ordre sans DeadmanArmed (tous modes) ;
          Treuils seulement en mode Joystick Maître (asymétrie non tranchée, §7/Q2)
        type: 🔒 GATE
        ref: G375_check_deadman_arming_gate.py
        etat: NV
      TC-P08-060:
        intention: ArmingPermitDenied=TRUE pendant tout appui bouton si ArmingPermit=FALSE
        type: ⬜ GAP
        ref: FB_Joystick
        etat: NV
      TC-P08-010.1:
        intention: 'Échelle proportionnelle asymétrique : RawX=9000 (neutre 5000)
          → 80% ; RawY=300 (neutre 5000) → -94% — pas seulement aux bornes'
        type: 💻 AUTO
        ref: §4
        etat: NV
      TC-P08-010.2:
        intention: 'Deadband ADC centrée sur le neutre : |RawIn-Neutral| <= DeadbandRaw
          ⇒ OutPct=0.0'
        type: 💻 AUTO
        ref: §4
        etat: NV
      TC-P08-010.3:
        intention: 'Saturation stricte : toute sortie de plage RawIn (hors [0;10000])
          ne produit jamais |OutPct| > 100.0'
        type: 💻 AUTO
        ref: §4
        etat: NV
  AF-09:
    file: AF_Partie-09_Fonction_Encoder_v2.3.md
    functions:
      F09.01:
        fonction: Acquérir position brute + gérer le preset SDO
        description: Lit RawPosIn/AlarmsIn/SlaveOperational (EtherCAT), séquence l'écriture
          preset (déclenchement, tolérance, timeout)
        realisee_par: FB_Encoder_Abs
        criticite: 🟠 C3
        tc_couvrants:
        - TC-P09-010
        statut: ✅
        etat: NV-I
      F09.02:
        fonction: Référencer l'axe (homing)
        description: '3 modes : nominal (capteur haut, front), unitaire (cible libre
          CfgHomingTargetM), dynamique (cible calculée par l''appelant, ex. benne)'
        realisee_par: FB_Encoder_Homing
        criticite: 🟠 C3
        tc_couvrants:
        - TC-P09-020
        statut: ✅
        etat: NV-I
      F09.03:
        fonction: Détecter une incohérence codeur au redémarrage
        description: Écart entre position au boot et dernière position connue (RETAIN)
          > tolérance → HomingSuspect, levé par BtnConfirmCoherence
        realisee_par: FB_Encoder_Homing
        criticite: 🟠 C3
        tc_couvrants:
        - TC-P09-020
        statut: ✅
        etat: NV-I
      F09.04:
        fonction: Mettre à l'échelle points → mètres
        description: CablePosM := (RawPos - HomingRefRaw) × CableM_PerRev / PointsPerRev
        realisee_par: FB_Encoder_Scale
        criticite: 🔵 C2
        tc_couvrants:
        - TC-P09-030
        statut: ✅
        etat: NV-I
      F09.05:
        fonction: Borner physiquement + relayer l'incohérence
        description: Hors [PositionMinM;PositionMaxM] (déf. ±99m) OU HomingSuspect
          → EncoderIncoherent=TRUE
        realisee_par: FB_Encoder_Safety
        criticite: 🟠 C3
        tc_couvrants:
        - TC-P09-030
        statut: ✅
        etat: NV-I
      F09.06:
        fonction: Synthétiser les gates de fiabilité
        description: EncoderFault := NOT Available OR Incoherent (sans Homed) ; HomedAndReliable
          := Available AND Homed AND NOT Incoherent (gate stricte M3)
        realisee_par: FB_EncoderReliability
        criticite: 🟠 C3
        tc_couvrants:
        - TC-P09-040
        statut: ✅
        etat: NV-I
      F09.07:
        fonction: Mesurer la vitesse câble
        description: Fenêtre glissante horodatée (6 échantillons, ≥50ms), signée (+
          montée)
        realisee_par: FB_Encoder_SpeedMeasure
        criticite: 🔵 C2
        tc_couvrants:
        - TC-P09-050
        statut: ✅
        etat: NV-I
    validation_points:
      TC-P09-010:
        intention: Bus/esclave KO → EncoderAvailable=FALSE, RawPos gelé ; preset hors
          tolérance après timeout → PresetNak + Fault
        type: 💻 AUTO
        ref: FB_Encoder_Abs
        etat: NV-I
      TC-P09-020:
        intention: 3 modes homing bornent la cible [-99;+99]m avant écriture ; écart
          au boot > tolérance → HomingSuspect, levé par confirmation explicite
        type: 💻 AUTO
        ref: FB_Encoder_Homing
        etat: NV
      TC-P09-030:
        intention: Conversion signée exacte ; hors bornes ou suspect → EncoderIncoherent=TRUE
        type: 💻 AUTO
        ref: FB_Encoder_Scale FB_Encoder_Safety
        etat: NV
      TC-P09-040:
        intention: EncoderFault ne dépend pas de Homed (non-référencé ≠ incohérent)
          ; HomedAndReliable exige les 3 conditions
        type: 💻 AUTO
        ref: FB_EncoderReliability
        etat: NV
      TC-P09-050:
        intention: Valid=TRUE après 6 échantillons (≥50ms) ; absorption des perturbations
          mécaniques câble & vibrations ; purge sur perte validité amont
        type: 💻 AUTO
        ref: FB_Encoder_SpeedMeasure
        etat: V-I
      TC-P09-060:
        intention: —
        type: —
        ref: —
        etat: NV
      TC-P09-010.1:
        intention: AlarmsIn≠0 OU NOT SlaveOperational → EncoderAvailable=FALSE, RawPos/AngleRaw/TurnCount
          gelés (dernière valeur)
        type: 💻 AUTO
        ref: §5
        etat: NV-I
      TC-P09-010.2:
        intention: 'Preset : écart abs(RawPos - PresetValueOut) ≤ PresetTolerancePts
          → PresetAck après 500ms visuel ; sinon timeout PresetTimeout → PresetNak
          + ErrorId bit1'
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P09-020.1:
        intention: 'Nominal : front Home + front TopPositionSensor (dans les 2 ordres)
          → HomingRefRaw calculé pour CablePosM = CfgTopSensorPosM'
        type: 💻 AUTO
        ref: §4
        etat: NV
      TC-P09-020.2:
        intention: 'Unitaire : front Home seul → cible CfgHomingTargetM'
        type: 💻 AUTO
        ref: §4
        etat: NV
      TC-P09-020.3:
        intention: 'Dynamique : front UseDynamicTarget (ou combiné Home) → cible DynamicHomingTargetM
          (ex. auto-référencement benne M2)'
        type: 💻 AUTO
        ref: §4
        etat: NV
      TC-P09-020.4:
        intention: Toute cible hors [-99;+99]m → homing refusé, ErrorId bit4, pas
          d'écriture RETAIN
        type: 💻 AUTO
        ref: §4
        etat: NV
      TC-P09-020.5:
        intention: Écart RawPos/Calib.LastKnownRawPos au boot > tolérance → HomingSuspect=TRUE,
          Homed=FALSE ; levé uniquement par front BtnConfirmCoherence ET HomingPermit=TRUE
        type: 💻 AUTO
        ref: §5
        etat: NV
      TC-P09-030.4:
        intention: CablePosM hors [PositionMinM;PositionMaxM] (déf. ±99m) → EncoderIncoherent=TRUE,
          bit0, auto-effacé au retour en plage
        type: 💻 AUTO
        ref: §4
        etat: NV
      TC-P09-030.5:
        intention: HomingSuspect=TRUE → EncoderIncoherent=TRUE, bit1, tant que non
          confirmé
        type: 💻 AUTO
        ref: §4
        etat: NV
      TC-P09-030.6:
        intention: BypassGlobal=TRUE → neutralise les 2 causes (mise en service)
        type: 💻 AUTO
        ref: §4
        etat: NV
      TC-P09-030.7:
        intention: CablePosMSafe = CablePosM toujours (jamais gelée — distinct du
          gel RawPos côté Abs)
        type: 💻 AUTO
        ref: §4
        etat: NV
      TC-P09-030.1:
        intention: RawPos=HomingRefRaw+4096 (soit ½ tour), CableM_PerRev=2.0, PointsPerRev=8192
          → CablePosM=1.0
        type: 💻 AUTO
        ref: §4
        etat: NV
      TC-P09-030.2:
        intention: RawPos<HomingRefRaw → CablePosM négative (sous l'eau)
        type: 💻 AUTO
        ref: §4
        etat: NV
      TC-P09-030.3:
        intention: PointsPerRev=0 → CablePosM=0.0 (garde division par zéro), pas de
          plantage
        type: 💻 AUTO
        ref: §4
        etat: NV
      TC-P09-050.1:
        intention: Valid=TRUE seulement après 6 échantillons couvrant WindowElapsed
          ≥ T#50ms
        type: 💻 AUTO
        ref: §4
        etat: NV
      TC-P09-050.2:
        intention: PositionValid=FALSE (amont) → purge complète immédiate (CollectedSamples:=0,
          Valid:=FALSE)
        type: 💻 AUTO
        ref: §4
        etat: NV
      TC-P09-050.3:
        intention: Rebouclage TIME() détecté (CurrentTimestamp < LastTimestamp) →
          purge sans réutiliser le delta aberrant
        type: 💻 AUTO
        ref: §4
        etat: NV
      TC-P09-050.4:
        intention: SignedSpeed_Mps signée (+ montée) ; Speed_Mps = ABS(SignedSpeed_Mps)
        type: 💻 AUTO
        ref: §4
        etat: NV
      TC-P09-040.1:
        intention: EncoderAvailable=TRUE, Homed=FALSE, EncoderIncoherent=FALSE → EncoderFault=FALSE
          (non-référencé ≠ incohérent)
        type: 💻 AUTO
        ref: §4
        etat: NV
      TC-P09-040.2:
        intention: Même cas → HomedAndReliable=FALSE (gate stricte exige Homed)
        type: 💻 AUTO
        ref: §4
        etat: NV
      TC-P09-040.3:
        intention: EncoderAvailable=FALSE → EncoderFault=TRUE quel que soit Homed/EncoderIncoherent
        type: 💻 AUTO
        ref: §4
        etat: NV
