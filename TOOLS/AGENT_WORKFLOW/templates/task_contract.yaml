# ═══════════════════════════════════════════════════════════════════════════
# CONTRAT DE TACHE ET SUIVI DE CYCLE DE VIE — projet Excavatrice Dragage
# ═══════════════════════════════════════════════════════════════════════════
#
# Pourquoi ce fichier existe (REX 2026-07-29 & REX 2026-08-12) :
# 1. Définit le contrat d'exécution (objectif, critères testables, scope, preuves).
# 2. Sert de suivi lisible en un coup d'œil par l'humain (`status: PENDING | COMPLETED | VALIDATED`).
# 3. Consigne le rapport synthétique de l'agent (`execution:`) et le visa de l'orchestrateur (`validation:`).
#
# Validation  : python TOOLS/AGENT_WORKFLOW/scripts/check_task_contract.py <fichier>
# ═══════════════════════════════════════════════════════════════════════════

contract:
  # ── Identification ────────────────────────────────────────────────────────
  task_id: LOT_XX_NOM_COURT
  criticality: C2            # C0 | C1 | C2 | C3 | C4
  strategy: patch            # patch | rebuild   (axe independant de la criticite)

  # ── 1. Objectif metier ────────────────────────────────────────────────────
  # Ce que la MACHINE doit faire de plus ou de different, en une phrase.
  objective: >
    En une phrase : quel comportement machine change, et pourquoi.

  # ── 2. Criteres testables ─────────────────────────────────────────────────
  acceptance:
    - id: AC1
      statement: "Comportement observable attendu, formule au present."
      verified_by: "commande exacte, test PLC, ou observation nommee"
    - id: AC2
      statement: "..."
      verified_by: "..."

  # ── 3. Perimetre ──────────────────────────────────────────────────────────
  scope:
    allowed:                 # fichiers que la tache PEUT modifier
      - CODE/…/FB_Xxx.st
    forbidden:               # explicitement hors scope — ne pas y toucher
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - DOC/NAMING_CONVENTION.md

  # ── 4. Contrat de conservation ────────────────────────────────────────────
  # OBLIGATOIRE si strategy = rebuild. Ecrit AVANT toute suppression de lien.
  conservation:
    must_survive:            # comportements/donnees a preserver imperativement
      - "…"
    dropped_on_purpose:      # abandonne sciemment — decision humaine, tracee
      - "…"

  # ── 5. Preuves attendues en restitution ───────────────────────────────────
  evidence_required:
    - check_linkage          # bloc "Auto-verification liaison"
    - run_all_gates          # resultat des gates
    - bundle                 # CODE/CODE_Bundle.xml regenere

  # ── 6. Modeles autorises ──────────────────────────────────────────────────
  models_allowed:
    - "omni/cc/claude-sonnet-5"
    - "omni/cx/gpt-5.6-terra"

  # ── 7. Devoir d'alerte ────────────────────────────────────────────────────
  alert_duty: >
    Tout probleme constate en cours de route (incoherence de spec, bug
    preexistant, risque hors scope) est remonte IMMEDIATEMENT a l'orchestrateur,
    pas a la fin et jamais silencieusement. Signaler n'est pas elargir le scope.

  # ── 8. Note compagnon (T427-AC5) ─────────────────────────────────────────
  # Fichier compagnon MARKDOWN lie au contrat : schémas, graphiques, notes
  # visuelles. C'est un chemin de projet (DOC/ ou TOOLS/) ; son existence
  # physique est vérifiée par G530. Le parseur du contrôle n'attendrait pas
  # une fiche complète : le champ reste facultatif, utile dès que la tâche
  # mérite un support visuel.
  # companion_doc: "DOC/WFLOW/TASKS/T<ID>_<NOM>/TASK_NOTE_<ID>_…_v1.0.md"

# ── Plan d'exécution (T427-AC2) : jalons testables, au moins un dès C2 ──────
# Un jalon sans done_when mesurable ne cadre rien (contrôle T9 en avertissement).
execution_plan:
  milestones:
  - id: M0
    title: 'Cadrage et contrat validé'
    done_when: 'GO explicite du plan enregistré, contrat check_task_contract PASS'
  - id: M1
    title: '…'
    done_when: '…'

# ── Sas d'essais (T427-AC2) : UNE ligne par essai, ≤ 120 caractères ────────
# Pas de code à chaud ni de paragraphe (contrôle T10 en avertissement).
# Format attendu : `<commande ou essai> — <résultat en un fait>`.
test_feedback: []               # ex: "G200 --report: PASS (0 erreur) sur bundle regenere"

# ═══════════════════════════════════════════════════════════════════════════
# 🚦 SUIVI DE L'ETAT D'AVANCEMENT & LISEUR HUMAIN (Où on en est)
# ═══════════════════════════════════════════════════════════════════════════
status: PENDING               # PENDING (attente) | IN_PROGRESS (cours) | COMPLETED (fait agent) | VALIDATED (validé)

# Fiche courante unique T426 : compléter dans ce contrat, sans second journal parallèle.
# Les champs ci-dessous sont préparatoires ; aucun hook bloquant n'est activé.
tracking:
  user_need: ""
  useful_history: []          # Sources pertinentes et conclusions remplacées.
  current_question: ""       # Information nouvelle recherchée et décision débloquée.
  established: []            # Chaque acquis cite une preuve et sa portée.
  unknowns: []               # Donnée manquante, impact et moyen de l'obtenir.
  next_action: ""
  # ── Budget sous-agents (T427-AC2) : cohérence contrôlée (T11 avertissement) ─
  # total = budget de la session/tâche, used = appels consommés,
  # parallel_max = maximum d'appels simultanés. Chaque ligne de log = 1 appel.
  budget:
    total: 10                 # défaut projet ; tout dépassement = accord humain
    used: 0
    parallel_max: 3
    log: []                   # ex: "deepseek-v4.1 · audit critique hooks · 1/10"
  owners:
    accountable: ""
    executor: ""
    control_maintainer: ""
  delegation:
    required_workflows: []   # Chemin canonique et raison d'application.
    permissions: []
    forbidden_actions: []
    measurable_deliverables: []
    alert_conditions: []
    self_review: []          # Liaison, preuve, effets de bord et limites.
  stagnation:
    threshold: 3             # Défaut 3 ; plage 2–5, tout changement exige justification préalable.
    justification: ""
    consecutive_uninformative: 0
    blind_reviews: []        # A/B, contrats distincts ; pas d'accès réciproque avant remise.
  experiments: []
  # qualification=nominal exige source_identity=verified, substitutions_declared=true,
  # build_required et cleanup_required explicitement true/false. Sinon utiliser exploratory.
  # Une revue A/B exige deux reviewers distincts, deux fichiers de rapport distincts,
  # independent=true, after_experiment=<id> et decision non vide. Le contenu reste a relire.
  # Chaque entrée : id, question, prediction, discriminating_observation,
  # decision_if_confirmed, decision_if_refuted, sources, substitutions,
  # expected_cost, repeat_of, repeat_reason, result, evidence, information_gained, next_decision.
  # Résultat : PASS / FAIL / INTERRUPTED / NOT_TESTED / CLEANUP_INCOMPLETE.
  # Un test vert ne prouve que les critères couverts ; preuve absente = non vérifié.

# ── 1. Rapport d'exécution de l'agent (rempli en fin de travail par l'agent) ──
execution:
  executed_by: "..."         # Ex: sonnet-5 (antigravity)
  completed_at: "..."        # Timestamp ISO (ex: 2026-08-12T06:27:00+02:00)
  status: PENDING            # PENDING | COMPLETED | BLOCKED | ALERT_RAISED
  summary: >
    Résumé succinct du travail réalisé par l'agent et résultats des vérifications.
  evidence_submitted: []     # Preuves clés (ex: "run_all_gates: PASS", "linkage: PASS")

# ── 2. Visa de validation de l'orchestrateur / validateur ──────────────────
validation:
  status: PENDING            # PENDING | APPROVED | REJECTED
  validated_by: "..."        # Ex: Claude Code (Orchestrateur)
  validated_at: "..."        # Timestamp ISO
  notes: >
    Remarques de validation de l'orchestrateur et/ou recettage humain.
