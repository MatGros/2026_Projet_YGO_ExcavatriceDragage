contract:
  task_id: T146_P2_RELIABILITY
  criticality: C3            # gate de fiabilite mesure -> consomme par interlock mouvement
  strategy: patch

  # ── 1. Objectif metier ────────────────────────────────────────────────────
  objective: >
    Creer le helper pur FB_EncoderReliability qui calcule les 2 gates de fiabilite
    codeur a partir des faits de la chaine (EncoderAvailable, Homed, EncoderIncoherent),
    conformement aux decisions D-A2bis (helper pur), D-A11 (EncoderFault sans Homed)
    et C1 (EncoderFault = gate general, HomedAndReliable = gate strict M3).

  # ── 2. Criteres testables ─────────────────────────────────────────────────
  acceptance:
    - id: AC1
      statement: "FB_EncoderReliability a pour entree EncoderAvailable, Homed, EncoderIncoherent (BOOL)."
      verified_by: "lecture declaration FB + G315_check_fb_interface"
    - id: AC2
      statement: "EncoderFault := NOT EncoderAvailable OR EncoderIncoherent (SANS Homed)."
      verified_by: "lecture ligne a ligne + G110 nommage (polarite fault)"
    - id: AC3
      statement: "HomedAndReliable := EncoderAvailable AND Homed AND NOT EncoderIncoherent."
      verified_by: "lecture ligne a ligne"
    - id: AC4
      statement: "Le FB est une pure composition combinatoire : aucun Reset/Status/machine d'etat, pas de latch."
      verified_by: "interface FB (aucun Status/Reset) + G315"
    - id: AC5
      statement: "Aucun consommateur existant n'est modifie a ce lot (non cable encore)."
      verified_by: "grep FB_EncoderReliability : seule la definition existe (non instancie)"

  # ── 3. Perimetre ──────────────────────────────────────────────────────────
  scope:
    allowed:
      - CODE/E_CODEURS/FB_EncoderReliability.st
    forbidden:
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - CODE/E_CODEURS/ST_EncoderMeasurement.st    # deja committe Phase 1
      - CODE/M_MAIN/PRG_02_Acquisition.st          # non-cable a ce lot (Phase 4)

  # ── 5. Preuves attendues en restitution ───────────────────────────────────
  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle

  # ── 6. Devoir d'alerte ────────────────────────────────────────────────────
  alert_duty: >
    Tout constat (incoherence de spec, gate deja existant, conflit D-A11/C1) est remonte
    immediatement, pas en fin de phase.

status: VALIDATED

