contract:
  task_id: T146_P5_HOLDOFFSET
  criticality: C3            # winch/benne -> offset synchro (mouvement coordonne)
  strategy: patch            # correctif cible de l'offset dans FB_Bucket

  # ── 1. Objectif metier ────────────────────────────────────────────────────
  objective: >
    Corriger le saut d'offset de la benne en position intermediaire non referencee :
    geler l'ecart reel mémorise (HoldOffsetM) au lieu de sauter vers la config.
    Pre-requis bloquant de la refonte FB_SyncDeviation (sinon on migre sur un
    ActiveOffsetM encore bugue en saut).

  # ── 2. Criteres testables ─────────────────────────────────────────────────
  acceptance:
    - id: AC1
      statement: "FB_Bucket declare une variable locale HoldOffsetM:REAL (memoire de l'ecart reel)."
      verified_by: "lecture declaration FB_Bucket + G110 nommage"
    - id: AC2
      statement: "En position intermediaire non referencee (IsIntermediate, hors BUSY/Close/Open), ActiveOffsetM := HoldOffsetM (gel), pas de saut vers Config.OffsetOpenM."
      verified_by: "lecture du bloc offset (§7) ligne a ligne"
    - id: AC3
      statement: "En BUSY, ActiveOffsetM := CablePosM2 - CablePosM1 et HoldOffsetM := ActiveOffsetM (mise a jour de la memoire)."
      verified_by: "lecture du bloc offset (§7)"
    - id: AC4
      statement: "En CloseReq/IsClosed, ActiveOffsetM := OffsetCloseM (et HoldOffsetM := ActiveOffsetM) ; en OpenReq/IsOpen, OffsetOpenM idem."
      verified_by: "lecture du bloc offset (§7)"
    - id: AC5
      statement: "Aucun autre comportement de FB_Bucket modifie (gates, machine d'etat, sorties inchangees)."
      verified_by: "git diff FB_Bucket.st : seul le bloc offset §7 et la declaration changee"

  # ── 3. Perimetre ──────────────────────────────────────────────────────────
  scope:
    allowed:
      - CODE/H_TREUILS_BENNE/BENNE/FB_Bucket.st
    forbidden:
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - CODE/H_TREUILS_BENNE/FB_WinchSync.st   # refonte = Phase 6, pas ici
      - CODE/M_MAIN/PRG_04_Treuils_Benne.st    # non-cable a ce lot

  # ── 5. Preuves attendues en restitution ───────────────────────────────────
  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle

  # ── 6. Devoir d'alerte ────────────────────────────────────────────────────
  alert_duty: >
    Tout constat (saut residuel, cas non couvert, incoherence OffsetOpen/Close) est
    remonte immediatement. Le gel doit couvrir TOUS les cas intermediaires sans
    reintroduire de saut.

