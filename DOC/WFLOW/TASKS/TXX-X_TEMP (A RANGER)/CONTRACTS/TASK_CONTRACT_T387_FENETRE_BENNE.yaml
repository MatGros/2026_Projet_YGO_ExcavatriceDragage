    generalisant la butee geometrique relative deja utilisee en jog benne manuel, et en relaxant
    etroitement le FdC materiel M2 sous 4 verrous. Le timeout [BENNE] ErrorID:03 ne doit plus etre
    consomme quand la fermeture est refusee par un permis : passage en etat « en attente de permis »
    (WaitingForOperator) au lieu d'un budget 60 s brule.

