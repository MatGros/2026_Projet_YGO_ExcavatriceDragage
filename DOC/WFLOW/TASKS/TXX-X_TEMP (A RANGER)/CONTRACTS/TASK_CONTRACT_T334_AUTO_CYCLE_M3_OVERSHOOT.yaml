contract:
  task_id: T334_AUTO_CYCLE_M3_OVERSHOOT
  criticality: C3
  strategy: patch

  objective: >
    En mode SEMI_AUTO, l'axe de translation M3 doit s'arreter a son point d'arrivee (P1 en AX2,
    Tremie en AX14) avec la meme autorite qu'en manuel et en maintenance : la decision d'arret
    appartient a l'axe, reste valide malgre un rebond ou une perte du capteur d'arrivee, et la
    demande du sequenceur ne peut ni annuler ni recreer un mouvement une fois le point atteint.
    Aucun franchissement du point d'arrivee n'est tolere en automatique. Les sources de commande
    restent separees (operateur / cycle), conformement a AF_Partie-04:179 et AF_Partie-02:220.

  acceptance:
    - id: AC1
      statement: >
        La cause du depassement est nommee sur une trace echantillonnee a 10 ms, ou refutee :
        pour chaque arrivee (P1 en AX2, Tremie en AX14), la trace identifie laquelle des
        hypotheses H1 a H6 la fiche T334 est active, avec la variable fautive nommee et son
        producteur fichier:ligne, ou bien demontre qu'aucune ne l'est. Un resultat negatif
        (aucune hypothese confirmee) est un resultat acceptable et doit etre livre comme tel,
        jamais transforme en conclusion positive.
      verified_by: >
        Les 3 fichiers de trace du protocole PLUS leur conversion en CSV wide obtenue par
        python TOOLS/PLC_CSV_SNAPSHOT/external_python/trace_to_csv.py PLUS une section d'analyse
        dans la fiche T334 qui nomme, pour chaque arrivee, la premiere variable dont la valeur
        contredit le comportement attendu et le fichier:ligne qui la produit.
    - id: AC2
      statement: >
        Apres correctif, sur une arrivee en AX14 et sur une arrivee en AX2 avec intermittence du
        capteur d'arrivee d'environ 1 s, le chariot ne repart pas : aucun front montant de
        M3_CommandWord ni de M3_SetpointFrequencyHz ne survient apres l'atteinte du point
        d'arret, et le verrou d'arret de l'axe est arme dans les 150 ms suivant le premier front
        du capteur d'arrivee. Le comportement ne depend ni du mode ni de l'etape.
      verified_by: >
        Rejeu du scenario B du protocole apres correctif, colonnes M3_CommandWord,
        M3_SetpointFrequencyHz et le verrou d'arret : 0 front de mot de commande apres l'arrivee
        et verrou a TRUE dans les 15 echantillons suivant le front capteur, sur les deux etapes.
    - id: AC3
      statement: >
        Parite manuel / cycle : sur la meme arrivee, le temps entre le premier front du capteur
        d'arrivee et l'extinction du mot de commande ne differe pas de plus d'un echantillon de
        10 ms entre le scenario C (jog MAINT) et les scenarios A/B (SEMI_AUTO), et le meme verrou
        d'arret est arme dans les trois cas.
      verified_by: >
        Comparaison directe des trois CSV wide : ecart du nombre d'echantillons entre le front
        capteur et la retombee du mot de commande, plus etat du verrou d'arret a l'arrivee.
    - id: AC4
      statement: >
        Un test automatise reproduit la perte du capteur d'arrivee et echoue sur le code actuel,
        puis passe apres correctif ; il porte sur la sortie publique de l'axe (mot de commande et
        verrou d'arret), jamais sur une variable interne lue par un appelant.
      verified_by: >
        python TOOLS/TEST_AUTO_CI/scripts/run_tests.py --fb FB_Translation (ou le FB retenu en
        phase 2) : sortie FAIL avec l'assertion nommee avant correctif, PASS de la meme assertion
        apres correctif, les deux sorties collees dans la restitution.
    - id: AC5
      statement: >
        Un garde-fou automatique empeche la regression : il detecte une re-creation de la demande
        de translation sur perte du jeton d'arrivee, ou un armement du verrou d'arret conditionne
        a la presence de la demande. Il passe au ROUGE si l'on retire l'armement du verrou dans une
        copie de travail, et au VERT sur le depot corrige.
      verified_by: >
        python TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py --palier C : gate PASS apres
        enregistrement dans PLANS ; puis variante negative sur copie hors depot : gate FAIL,
        copie restauree immediatement apres.
    - id: AC6
      statement: >
        Le comportement manuel et maintenance est inchange : en MAINT_N1/N2, l'arrivee sur P1, sur
        Maintenance et sur Tremie conserve son arret sur fin de course, son temps d'arret et son
        relachement par demande de sens inverse.
      verified_by: >
        Rejeu du scenario C avant et apres correctif (meme geste) : temps d'arret identiques a un
        echantillon pres et aucun changement du comportement de relachement.
    - id: AC7
      statement: >
        Les protections de surete M3 restent actives et atteignables : un depassement reel et
        soutenu d'une butee allume toujours la cause 6, l'escalade vers l'arret de securite puis
        la coupure de puissance reste possible, et les permis directionnels ainsi que le veto hors
        etape de translation sont inchanges.
      verified_by: >
        Rejeu du scenario B avec depassement force (capteur d'arrivee neutralise) : la cause 6
        apparait, l'escalade est atteinte ; les colonnes des permis directionnels restent
        identiques a la baseline des scenarios A et C.
    - id: AC8
      statement: >
        Pour tout fichier de CODE/M_MAIN modifie par ce lot, le nom du fichier est identique au nom
        de POU declare dans ce fichier : aucun POU n'est renomme et aucun fichier n'est cree sous
        un nom different de son POU.
      verified_by: >
        git diff --name-only sur CODE/M_MAIN/ : chaque chemin porte un POU du meme nom, verifie
        par relevé des declarations PROGRAM et par le gate de structure du palier applicable.
    - id: AC9
      statement: >
        Le suffixe de langage de chaque fichier modifie est egal au langage genere dans le bundle
        pour ce POU : aucun suffixe de langage n'est ajoute ou retire sans que le bundle ne
        produise reellement ce langage.
      verified_by: >
        Relevé du langage de chaque objet dans CODE_XML/CODE_Bundle.xml regenere, compare au
        suffixe du fichier source modifie, plus le gate de bundle du palier applicable.
    - id: AC10
      statement: >
        La decision d'unification est tracee avant tout code : le comparatif, le verdict et la
        liste des questions Q1 a Q6 sont valides par l'humain et l'orchestrateur, et la
        specification AF-11 decrit l'autorite d'arret retenue si la semantique change.
      verified_by: >
        Contrat portant la section decisions remplie (Q1 a Q6) avant le premier diff de CODE/,
        plus la ligne de Suivi historique de DOC/AF/AF_Partie-11_Fonction_Translation_v2.4.md en
        cas de changement de semantique.

  scope:
    allowed:
      - CODE/M_MAIN/PRG_05_Translation.st
      - CODE/I_TRANSLATION/FB_Translation.st
      - CODE/I_TRANSLATION/FB_TranslationCmdArbitrationM3.st
      - CODE/G_CYCLE/FB_CycleSemiAuto.st
      - CODE/M_MAIN/PRG_06_Outputs.st
      - TOOLS/TEST_AUTO_CI/RESULTS/M_MAIN/tests/
      - TOOLS/TEST_AUTO_CI/RESULTS/I_TRANSLATION/tests/
      - TOOLS/TEST_AUTO_CI/RESULTS/G_CYCLE/tests/
      - TOOLS/AGENT_WORKFLOW/scripts/
      - DOC/AF/AF_Partie-11_Fonction_Translation_v2.4.md
      - DOC/WFLOW/CONTRACTS/TASK_CONTRACT_T334_AUTO_CYCLE_M3_OVERSHOOT.yaml
      - DOC/WFLOW/CONTRACTS/PROCEDURE_TRACE_T334_M3_DEUX_CHEMINS.md
      - DOC/WFLOW/TROUBLESHOOTING/FICHES/TROUBLESHOOTING_T334_M3_DeuxChemins_2026-09-20.md
      - DOC/WFLOW/TASKS.yaml
    forbidden:
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - CODE/GVL_PERSISTENT.st
      - CODE/I_TRANSLATION/FB_Translation_PositionEstimator.st
      - CODE/I_TRANSLATION/FB_Translation_PositionDecoder.st
      - CODE/I_TRANSLATION/FB_Safety_Translation.st
      - CODE/L_SIMULATION/
      - CODE/M_MAIN/PRG_04_Treuils_Benne.st
      - CODE/M_MAIN/PRG_07_Supervision.st
      - CODE/J_SUPERVISION/
      - DOC/STDS/NAMING_CONVENTION.md

  conservation:
    must_survive:
      - "Arret sur les fins de course en manuel et maintenance (verrou latche FB_Translation.st:180, :192, :196) et son relachement par demande de sens inverse uniquement (:202-204)"
      - "Substitut de coupure dure P1 en SEMI_AUTO (mot 00001, PRG_05_Translation.st:152-154) et verrous bistables de fin de course (PRG_05_Translation.st:163, :187)"
      - "Coupure dure Tremie sur DI brut avec frein ferme au meme scan (PRG_06_Outputs.st:431-432)"
      - "Escalade de securite cause 6 et coupure de puissance par masque (FB_Safety_Translation.st:200-203, :268)"
      - "Permis directionnels M3 (EffectivePermitM3_Tremie / _Maintenance) et veto hors etape de translation (PRG_05_Translation.st:385-395, :656-662)"
      - "Textes et actions operateur du sequenceur, et continuite AX2 vers AX3 sous geste maintenu (T319)"
      - "Interface de FB_Translation (VAR_INPUT et VAR_OUTPUT) sauf ajout decide en phase 2 et trace au contrat"
    dropped_on_purpose:
      - "Aucun comportement existant n'est retire par principe : toute suppression (par exemple un veto devenu redondant) doit etre decidee en phase 2 et justifiee dans le plan valide"

  evidence_required:
    - trace_10ms_analyse
    - ci_before_after
    - check_linkage
    - run_all_gates
    - bundle
    - diff_bundle

  models_allowed:
    - "deepseek-v4.1-flash:cloud"

  alert_duty: >
    Tout ecart entre les hypotheses de la phase 1 et les faits mesures est remonte immediatement a
    l'orchestrateur, pas a la fin et jamais silencieusement. Cas particulier a signaler sans delai :
    une trace qui contredit la lecture statique du code (par exemple un verrou d'arret arme alors que
    le code montre que le debounce ne peut pas aboutir), un depassement observe sans aucune des
    hypotheses H1 a H6 active, un consommateur de surete decouvert pour une variable annoncee comme
    sans consommateur, et tout effet de bord constate sur les treuils, la benne ou la chaine AU.
    Signaler n'est pas elargir le perimetre : T287, T300, T301, T333, T204, la config morte et
    l'ecart d'escalade aux butees restent hors de ce lot.

status: IN_PROGRESS

