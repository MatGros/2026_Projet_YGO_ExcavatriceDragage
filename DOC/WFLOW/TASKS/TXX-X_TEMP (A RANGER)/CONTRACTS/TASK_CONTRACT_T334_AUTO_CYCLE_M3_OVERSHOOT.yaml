# ═══════════════════════════════════════════════════════════════════════════
# CONTRAT DE TACHE — T334 : Translation M3 — arrêt à l'arrivée P1/Trémie en cycle
# ═══════════════════════════════════════════════════════════════════════════
# Criticite C3 · strategie patch · acteur DSH07 (verrou DOC/WFLOW/TASK_LOCKS.json)
# Verrou : T334 -> DSH07. Orchestrateur : CC01.
# Validation : python TOOLS/AGENT_WORKFLOW/scripts/check_task_contract.py <ce fichier>
# ═══════════════════════════════════════════════════════════════════════════
#
# ── POURQUOI CE FICHIER EXISTE MAINTENANT (devoir d'alerte leve) ──
# DOC/WFLOW/TASKS.yaml:38 referencait ce contrat alors qu'il N'EXISTAIT PAS : la tache C3
# etait menee sans contrat de tache, cas d'arret du preambule sous-agent. La phase 1
# (analyse) a donc ete menee sur les criteres AC1-AC5 du brief d'origine. Ce fichier est
# cree sur GO explicite de l'orchestrateur CC01 (2026-09-20), AVANT la phase 2 de conception.
#
# ── FAITS ETABLIS (phase 1, lecture seule du code, fichier:ligne) ──
# FAIT 1 — L'AXE EST DEJA UNIFIE (la premisse "deux voies vers l'axe" est fausse).
#   Un seul FB de mouvement : FB_Translation, appele une seule fois (PRG_05_Translation.st:537).
#   Un seul arbitre : FB_TranslationCmdArbitrationM3 (declare PRG_05_Translation.st:27,
#   appele :363). Une seule barriere finale : FB_TranslationOutputInterlock (PRG_06_Outputs.st:434).
#   Un seul jeu de mots variateur : PRG_06_Outputs.st:457-459. Les deux demandeurs CONVERGENT.
#
# FAIT 2 — LA DIVERGENCE PORTE SUR LA PROPRIETE DE L'ARRET.
#   Manuel/MAINT : l'arret est un VERROU LATCHE dans l'axe (FB_Translation.st:180, :192, :196),
#   relache uniquement par une demande explicite de sens INVERSE (:202-204) : un rebond capteur
#   ne peut ni le relacher ni relancer le mouvement.
#   Cycle SEMI_AUTO : l'arret est le RETRAIT DE LA DEMANDE par le sequenceur
#   (FB_CycleSemiAuto.st:899 en AX2, :1386 en AX14), donc RE-ARMABLE des que le jeton retombe
#   (:913 et :1383 re-assertent ReqStart). Le jeton d'arrivee est la SOURCE de la demande.
#
# FAIT 3 — LA CIBLE D'ARRET EST FIGEE PAR L'ETAPE AU LIEU DE SUIVRE LE SENS COMMANDE.
#   FB_TranslationCmdArbitrationM3.st:65 (SelTarget := ReqTranslation.PositionTgt) puis
#   PRG_05_Translation.st:408-429 (CASE SelTarget) : en AX2 la cible est P1 quel que soit le sens
#   du geste, alors que les commentaires FB_CycleSemiAuto.st:905-906 et PRG_05_Translation.st:404-407
#   affirment que "la cible effective suit le sens du joystick" : contradiction interne.
#
# FAIT 4 — ASYMETRIE AX2 / AX14, sans source ni commentaire.
#   AX2 conserve PositionTgt := 3 apres l'arrivee (FB_CycleSemiAuto.st:900).
#   AX14 remet PositionTgt := 0 (FB_CycleSemiAuto.st:1387) => SelTarget = 0 => la cible
#   PositionSensorTarget retombe a FALSE car la demande vient d'etre retiree
#   (PRG_05_Translation.st:414-427) => le debounce capteur de 100 ms
#   (ST_fbTranslation_Cfg.st:31) est remis a zero apres UN SEUL scan de 10 ms => le front
#   ArrivalEdge (FB_Translation.st:177) ne se produit jamais => ArrivalLock n'est JAMAIS arme
#   par la voie capteur en AX14. Seule reste la voie FdC (:190-200).
#
# FAIT 5 — LE DERNIER VERROU DISPONIBLE EN CYCLE PEUT ETRE DESACTIVE SANS GARDE DE MODE.
#   FB_Translation.st:190 est conditionne par NOT BypassLimitSwitch, alimente par
#   PRG_05_Translation.st:571 (GVL_IHM.M3Translation.Bypass.LimitSwitch OR .Global) SANS garde
#   de mode, alors que la doctrine du DUT dit "actionnable UNIQUEMENT en MAINT_N2"
#   (ST_BypassTranslation.st:4-5) et que le bypass Global est RESTAURE AU BOOT depuis le RETAIN
#   (PRG_07_Supervision.st:336-346 ; citation d'origine ":230-235" FAUSSE, elle pointe la logique T330 TOP/FdC).
#   De plus la coupure dure Tremie (PRG_06_Outputs.st:431-432) exige ReqTremieSemantic, que le
#   cycle vient precisement de retirer (:1386) : elle est desarmee a l'arrivee.
#
# FAIT 6 — AUCUNE PREUVE DYNAMIQUE DISPONIBLE A CE JOUR.
#   La seule trace M3 du depot (archives/Suivi_TranslationM3bug_20260904_27.trace et
#   Suivi_Cycle_M3_20260906_49.trace) est echantillonnee a dt median 100 ms (mesure : dt min 77 ms,
#   max 128 ms, 39 valeurs distinctes, 367 echantillons) avec 15 canaux, AUCUN jeton ni interne de
#   FB. Les traces SIMU_MaintMANU_20260919 (66 a 70) ne contiennent QUE des variables treuils et
#   joystick Y (54 a 58 canaux), aucune variable M3. Aucune des trois experiences du protocole
#   n'existe donc dans le depot : la phase 1 conclut par des HYPOTHESES SOURCEES (H1 a H6), pas par
#   une cause racine.
#
# FAIT 7 — LE BANC NE PEUT PAS SERVIR DE JUGEMENT EN DERNIER RESSORT.
#   AUDIT_T300_TRACE_20260904_v1.0.md:244 : le banc est structurellement incapable de reproduire
#   le defaut frein/cause 6 (cas C4). Un PASS banc ne vaut donc PAS non-regression terrain.
#
# ── LIEN AVEC T287 (a suivre, hors perimetre de ce lot) ──
#   H1 (le cycle recree la demande quand le jeton d'arrivee est efface) explique mecaniquement le
#   symptome de T287 ("recidive du defaut sequence/retour frein M3 aux arrivees Tremie ET P1",
#   TASKS.yaml:1248-1250, avec commutations capteur 0<->1 pendant environ 1 s). La trace produite
#   par ce lot doit etre reutilisable telle quelle par le porteur read-only de T287 : les canaux
#   Brake.BrakeCmd, M3_BrakeIsOpen_DI, M3_TremieHardStopActive et ArrivalLock y figurent
#   explicitement pour cette raison. Aucune correction de T287 n'est faite ici.
#
# ── QUESTIONS A TRANCHER AVANT LA PHASE 3 (code) ──
#   Q1 (autorite de l'arret) : l'arret d'arrivee doit-il etre arme par la SEULE detection
#      d'arrivee, independamment de la presence d'une demande (recommandation du comparatif,
#      fiche §7.2) ? Si oui, le relachement reste-t-il "demande de sens inverse" uniquement ?
#   Q2 (cible) : PositionSensorTarget doit-il suivre le SENS COMMANDE dans tous les modes, la cible
#      d'etape ne servant qu'a autoriser/interdire ? Cela rend AX2, AX14 et le manuel equivalents.
#   Q3 (retrait de demande) : le sequenceur doit-il attendre la confirmation d'arret de l'axe
#      (Data.TranslationDone / TranslationBusy, PRG_05_Translation.st:817-818) avant de retirer sa
#      demande, ou la barriere doit-elle COMMANDER l'arret plutot que mettre le mot de commande a 0
#      (mot 0 = roue libre cote variateur, FB_Translation.st:297-303) ?
#   Q4 (bypass) : neutraliser les bypass FdC consommes par l'axe hors MAINT_N1/N2, et/ou ne pas les
#      restaurer au passage en SEMI_AUTO (FAIT 5) ?
#   Q5 (perimetre du lot) : corriger aussi l'ecart spec/code de l'escalade aux butees
#      (AF_Partie-11 v2.4:346-351 : 0 / 2,5 s / 5 s vs code 1,5 s + PowerCutOff immediat,
#      FB_Safety_Translation.st:200-203 et :268) ou le laisser hors lot ? Recommandation : HORS LOT
#      (touche la surete, merite son propre contrat).
#   Q6 (config morte) : reactiver ou supprimer _TranslationAutoSpeedCap_Pct (GVL_PERSISTENT.st:97,
#      0 lecteur) alors que le cycle commande 100 % (FB_TranslationCmdArbitrationM3.st:74) ?
#
# ═══════════════════════════════════════════════════════════════════════════
# PHASE 2 — ARBITRAGE Q1 A Q6 RENDU LE 2026-09-20 (CONCEPTION SEULE, ZERO CODE)
# Detail complet, preuves par question et lots : DOC/WFLOW/CONTRACTS/PLAN_T334_PHASE3_AUTORITE_ARRET_AXE.md
#   Q1 autorite de l'arret : OUI — l'axe arme son verrou d'arrivee sur la SEULE detection
#      d'arrivee, independamment de la presence d'une demande ; relachement INCHANGE (demande
#      explicite de sens inverse, FB_Translation.st:202-204). Corrige H1 a la racine : meme si
#      le demandeur recree sa demande, ArrivalLock maintient RampTargetPct a 0 (:251).
#   Q2 cible / sens : NON — la cible d'etape reste la cible d'arrivee en SEMI_AUTO. Rendre la
#      cible dependante du sens en AX2 detruirait le chemin de recuperation de depassement
#      documente (FB_CycleSemiAuto.st:905-906 + branche :1549-1557 WT, jeton P1 arme sur les
#      DEUX fronts de son capteur). Le defaut reel n'est pas QUELLE cible est selectionnee mais
#      que la perte de la demande efface la detection (PRG_05:427) : corrige par Q1 + Q3.
#   Q3 retrait de la demande : OUI — le demandeur CONSERVE demande ET cible jusqu'a
#      ArrivalLock + arret physique confirme, puis retire. Motifs verifies : mot 0 = roue libre
#      en mouvement (H4 a P1) ; les DEUX voies de la cause 6 lisent la demande
#      (FB_Translation.st:123-124, FB_Safety_Translation.st:200-201) ; la coupure dure Tremie
#      exige ReqTremieSemantic (PRG_06:431-432) ; les verrous bistables FdC ne se liberent que
#      sur demande de sens inverse (PRG_05:162-190) ; le veto d'etape force frein + mot a 0 au
#      changement d'etape (PRG_05:656-662). Option "la barriere COMMANDE l'arret" REJETEE
#      (duplication du producteur d'arret : AF_Partie-02:502, CODE_QUALITY_STANDARDS sec.5).
#      Timeout d'attente d'arret ARME obligatoire (jamais un maintien indefini).
#   Q4 bypass : OUI — garde de mode au point de CONSOMMATION (PRG_05:468 et :571), doctrine
#      MAINT_N2 (ST_BypassTranslation.st:4-5). PRG_07 n'est PAS touche (interdit au contrat) :
#      la garde suffit a rendre inoffensive la restauration RETAIN (PRG_07:336-346).
#      Decision humaine D1 requise (retire des capacites de mise en service hors N2).
#   Q5 escalade aux butees : HORS LOT (confirme). FB_Safety_Translation.st est INTERDIT au
#      present contrat ; ecart reel et chiffre — spec AF_Partie-11 v2.4:346-351 (0 / 2,5 s /
#      5 s) vs code :202 (1,5 s) et :268 (PowerCutOff immediat, sans gradation). Contrat dedie.
#   Q6 config morte _TranslationAutoSpeedCap_Pct : HORS LOT. GVL_PERSISTENT.st et
#      CODE/J_SUPERVISION/ sont interdits ici. Recommandation : SUPPRIMER (0 lecteur,
#      GVL_PERSISTENT.st:97, alors que le cycle commande 100 % fixe : information IHM fausse).
#      Decision humaine D2 : retenir le plafond comme mitigation ELARGIT le perimetre du lot.
#
# LOT PHASE 2 "UNIFORMISER AX2/AX14 SUR AX3" : ARRETE (verdict challenger fiche sec. 10bis,
#   confirme sur le code par le porteur). Mecanisme verifie : TranslationStopTimer exige 500 ms
#   CONTINUS de (AX2 ET At_P1) ou (AX14 ET At_Tremie) ET NOT Translation_Busy
#   (FB_CycleSemiAuto.st:334-338) tandis que le re-armement de la demande est IMMEDIAT
#   (:913 / :1387 WT) par des permis qui n'exigent PAS le neutre (:716-717) => sous capteur qui
#   rebondit la transition ne peut jamais s'armer et la demande se re-arme a chaque rebond :
#   le retour au neutre etait la SEULE soupape. Les gardes :718 (JoystickPushOnly) et
#   :1395 WT (NOT JoystickDeflected) RESTENT EN PLACE — ne pas defaire T319 sans garde
#   equivalente. Toute uniformisation est reportee APRES obtention d'un arret possede par l'axe.
#
# PREALABLE DE TRACABILITE (a lever AVANT tout diff de CODE/) : FB_CycleSemiAuto.st porte une
#   edition NON COMMITEE de T331/DSH09 (+20/-5, ecriture 2026-09-20 18:13:32) qui decale de +4
#   toute ligne posterieure a :1224. Lire en version WT (+4) ou HEAD. Ce fichier est sous
#   VERROU D'ECRITURE T331 : le lot sequenceur (L2) est BLOQUE jusqu'a liberation.
#
# ── ECARTS SPEC/CODE CONSTATES, HORS PERIMETRE (signales, non corriges) ──
#   E1 arbitrage par priorite specifie (AF_Partie-11 v2.4:270 "AU > Defaut > Cycle > Joystick >
#      Boutons IHM MAINT") vs aiguillage exclusif par mode implemente
#      (FB_TranslationCmdArbitrationM3.st:63, :84, :114).
#   E2 escalade aux butees : voir Q5.
#   E3 variables mortes : M3_PositioningActive (PRG_05_Translation.st:45, :373),
