      verified_by: "git diff --stat -- CODE/B_AU_SECURITE : sortie VIDE"

    - id: AC11
      statement: "Les hunks NON COMMITÉS d'autres acteurs dans PRG_07_Supervision.st restent INTACTS (édition chirurgicale d'une région disjointe)."
      verified_by: "git diff de PRG_07_Supervision.st relu ligne à ligne : seules les lignes de la région §1c et la déclaration des VAR locales apparaissent, les hunks tiers sont inchangés"

    - id: AC12
