# CONTRAT DE TACHE ET SUIVI DE CYCLE DE VIE — projet Excavatrice Dragage
# ═══════════════════════════════════════════════════════════════════════════
#
# T367 — Acquittement AUTOMATIQUE des défauts latchés : au démarrage à froid, et après réarmement AU
#
# GO humani explicite : 2026-09-21 (périmètre strict dicté, voir objective).
# Périmètre dicté par l'exploitant, verbatim :
#   « au boot, le défaut (quel qu'il soit) doit être acquitté automatiquement, sans que j'aie besoin
#     d'appuyer sur le bouton acquittement séparément. Rien d'autre ne change — aucun nouveau champ,
#     aucune touche à GVL_IHM/ses types (table figée en ce moment pour livraison collègue).
#     Si ta correction nécessite de toucher GVL_IHM ou un type associé, STOP et demande-moi avant. »
#   + « oui GO mais il faut aussi l'implémenter après le réarmement AU contacteur de puissance »
#
# ⛔ CAS D'ARRÊT ABSOLU : si l'implémentation exige de modifier GVL_IHM, un type IHM (ST_*),
#    ou d'ajouter un champ quelconque → L'AGENT S'ARRÊTE ET DEMANDE, sans exception.
#
# Contexte de conception (preuves vérifiées, cf. fiche T369) :
#   - PRG_07_Supervision.st:123-127 est LA porte unique d'acquittement (5 boutons existants).
#   - FB_FaultCore.st : §1 effacement sur Reset (:37-43) AVANT §3 armement (:60-69) dans le MÊME
#     scan ⇒ un acquittement automatique est un NO-OP sur une cause encore ACTIVE : il ne peut
#     PAS masquer un défaut persistant. C'est la propriété de sécurité qui autorise ce lot.
#   - PRG_02_Acquisition.st:216 Data.InputModules.Fault = signal EXISTANT de « transitoire d'E/S
#     terminé » (les 5 modules RUNNING) — réutilisé, aucun champ créé.
#   - PRG_06_Outputs.EmergencyState (ST_Safety_Emergency_State) expose déjà Step / ArmingBusy /
#     ContactorOk ⇒ la preuve « geste opérateur » s'obtient SANS lire GVL_IHM.
#   - Le contacteur PEUT s'engager sans geste opérateur (chaîne refermée + maintien, relâchement
#     d'un AU, bypass MES) ⇒ le front brut de PowerContactorEngaged est INSUFFISANT comme
#     déclencheur : il DOIT être gaté par le fait qu'une séquence d'armement a réellement tourné.
#
# Validation  : python TOOLS/AGENT_WORKFLOW/scripts/check_task_contract.py <fichier>
# ═══════════════════════════════════════════════════════════════════════════

contract:
  # ── Identification ────────────────────────────────────────────────────────
  task_id: T367_ACQ_AUTO_BOOT_ET_REARM
  criticality: C2
  strategy: patch

  # ── 1. Objectif metier ────────────────────────────────────────────────────
  objective: >
    Supprimer l'appui manuel sur le bouton d'acquittement des défauts dans DEUX situations
    bornées : (a) au DÉMARRAGE À FROID, une fois le transitoire d'E/S terminé ; (b) après un
    RÉARMEMENT AU réellement initié par l'opérateur et confirmé par le contacteur de puissance.
    Dans les deux cas l'acquittement est injecté dans la porte unique existante
    FaultMachineReset_IHM, sous forme de campagnes BORNÉES (au plus 3 impulsions espacées d'environ
    1 s, puis arrêt définitif), avec ZÉRO nouveau champ, ZÉRO modification de GVL_IHM et de ses
    types, et ZÉRO modification des 5 sources d'acquittement existantes. Aucun acquittement
    automatique n'existe en dehors de ces deux campagnes.

  # ── 2. Criteres testables ─────────────────────────────────────────────────
  acceptance:
    - id: AC1
      statement: "Au démarrage à froid, une fois le transitoire d'E/S terminé, le PLC émet automatiquement une campagne d'au plus 3 impulsions FaultMachineReset_IHM espacées d'environ 1 s, puis s'arrête DÉFINITIVEMENT."
      verified_by: "test CI TC-T367-101/102 sur FB_TestHarness_PRG_07 : impulsions comptées = 1..3 sous le transitoire d'E/S, 0 après la 3e, compteur figé"

    - id: AC2
      statement: "Aucune impulsion automatique n'est émise tant que le transitoire d'E/S n'est pas terminé (tous les modules RUNNING)."
      verified_by: "test CI TC-T367-105 : Data.InputModules.Fault = TRUE sur toute la fenêtre ⇒ compteur d'impulsions = 0"

    - id: AC3
      statement: "Après un réarmement AU initié par l'opérateur et confirmé par le contacteur de puissance, une campagne d'au plus 3 impulsions est émise, puis s'arrête."
      verified_by: "test CI TC-T367-106 : séquence observée (EmergencyState.Step <> 0) PUIS front ContactorOk ⇒ impulsions 1..3 puis arrêt"

    - id: AC4
      statement: "Un front du contacteur de puissance SANS séquence d'armement opérateur préalable n'émet AUCUNE impulsion automatique."
      verified_by: "test CI TC-T367-107 : front ContactorOk seul (démarrage à chaîne fermée, maintien repris, bypass) ⇒ compteur d'impulsions = 0 hors campagne de boot"

    - id: AC5
      statement: "PROPRIÉTÉ DE SÉCURITÉ : un défaut dont la cause est ENCORE ACTIVE n'est JAMAIS masqué — son latch est ré-armé dans le scan même de l'impulsion."
      verified_by: "test CI TC-T367-103 : cause Active + Latching, campagne d'acquittement jouée ⇒ Fault.Latched reste TRUE après la campagne (preuve de non-masquage)"

    - id: AC6
      statement: "Aucun acquittement automatique n'existe en dehors des deux campagnes : en fonctionnement établi, seule une action opérateur (une des 5 sources existantes) produit une impulsion."
      verified_by: "test CI TC-T367-104 : après les campagnes, N scans sans aucun front des 5 boutons ⇒ aucune impulsion"

    - id: AC7
      statement: "Les 5 sources d'acquittement existantes conservent un comportement inchangé (BtnFaultReset, BtnReset M1/M2/Benne/Cycle)."
      verified_by: "test CI : chacune des 5 sources produit toujours son impulsion ; diff git limité à l'ajout de l'OR"

    - id: AC8
      statement: "AUCUN champ nouveau et AUCUNE modification de GVL_IHM ni d'un type associé : git diff VIDE sur GVL_IHM.st et sur tous les ST_* IHM."
      verified_by: "git diff --stat -- CODE/J_SUPERVISION/GVL_IHM.st CODE/J_SUPERVISION/_TYPES : sortie VIDE ; lecture du diff réel par l'orchestrateur"

    - id: AC9
      statement: "Aucune entrée matérielle ne déclenche directement un acquittement : le trigger de la campagne « réarmement » est conditionné par une séquence d'armement (donc un geste opérateur) et jamais par le seul état du contacteur."
      verified_by: "gate G5xx_check_fault_reset_not_hw_triggered.py (existante ou étendue) PASS + test TC-T367-107"

    - id: AC10
