  conservation:
    must_survive:
      - "T314 reste le socle OpenModelica Windows et n'est pas réécrit par ce cadrage."
      - "FB_SimBench et l'aiguillage atomique HwReal/HwSim/HwIn restent la référence PLC actuelle."
      - "Le PLC reste propriétaire des sécurités, interlocks, réarmements et sorties physiques."
      - "La branche feature/twinbench-m3-native reste conservée comme prototype historique séparé."
    dropped_on_purpose:
      - "Le simulateur web autonome n'est plus une source de physique ni le chemin principal du projet."
  evidence_required:
    - "Contrat T399 contrôlé sans erreur."
    - "Feuille de route relue avec phases, dépendances, décisions et critères GO/NO-GO."
    - "Diff documentaire uniquement."
  alert_duty: >
    Toute capacité supposée du runtime CODESYS (OPC UA, Symbol Configuration,
    licence ou droits d'écriture) reste une hypothèse tant qu'elle n'est pas
    vérifiée sur l'installation cible. Aucune écriture PLC ne peut être déduite
    de la seule disponibilité d'une connexion locale.

