contract:
  task_id: T399
  criticality: C2
  strategy: rebuild
  objective: >
    Organiser la reprise de TwinBench autour d'OpenModelica, d'une application
    Windows et d'une communication locale avec le runtime CODESYS, en séparant
    les étapes obligatoires des intégrations conditionnelles et en interdisant
    tout pilotage involontaire de la machine réelle.
  acceptance:
    - id: AC1
      statement: "La feuille de route découpe le projet en phases ordonnées avec critères d'entrée et de sortie."
      verified_by: "Revue de PLAN_T399_TWINBENCH_HYBRID_PLC_OPENMODELICA.md."
    - id: AC2
      statement: "Chaque lot est marqué OBLIGATOIRE, CONDITIONNEL ou HYPOTHESE et possède un niveau de criticité prévisionnel."
      verified_by: "Tableau des lots de la feuille de route."
    - id: AC3
      statement: "La frontière PLC, passerelle, OpenModelica et interface opérateur attribue un propriétaire unique à chaque calcul."
      verified_by: "Diagramme d'architecture et matrice de responsabilités."
    - id: AC4
      statement: "La connexion initiale au runtime CODESYS est strictement en lecture seule et tout retour HwSim reste conditionné à un banc virtualisé dont les sorties physiques sont neutralisées et prouvées."
      verified_by: "Garde-fous et jalons GO/NO-GO de la feuille de route."
    - id: AC5
      statement: "Les dépendances avec T304 et T314 sont explicites et aucun prototype web ne porte de calcul physique."
      verified_by: "Section héritage et décisions de la feuille de route."
    - id: AC6
      statement: "Aucun fichier CODE/, CODE_XML/, PRJ_CODESYS/ ou TOOLS/TWINBENCH/ n'est modifié pendant le cadrage."
      verified_by: "git diff --name-only limité aux documents de pilotage autorisés."
  scope:
    allowed:
      - DOC/WFLOW/CONTRACTS/TASK_CONTRACT_T399_TWINBENCH_HYBRID_ROADMAP.yaml
      - DOC/WFLOW/CONTRACTS/PLAN_T399_TWINBENCH_HYBRID_PLC_OPENMODELICA.md
      - DOC/WFLOW/TASKS.yaml
