  # ── 7. Devoir d'alerte ────────────────────────────────────────────────────
  alert_duty: >
    Tout probleme constate en cours de route est remonte IMMEDIATEMENT. Signaler n'est pas elargir
    le scope. Deux constats sont deja escalades : l'effacement automatique des bits de liaison
    (FB_Diag_Ethercat.st:131/141/151, FB_Diag_CanOpen.st:100/109) est PREEXISTANT a T278, et
