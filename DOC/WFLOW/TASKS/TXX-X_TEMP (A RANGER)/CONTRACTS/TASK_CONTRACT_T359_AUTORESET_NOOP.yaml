      - "Les gardes de securite internes de FB_AutoResetTransientDiag : SafeCommon, EmergencyChainClosed, PowerCutOffActive, MotionActive"
      - "Le reset operateur sur front, voie distincte du reset transitoire"
      - "L'acquittement operateur obligatoire de la chaine AU et des defauts de securite : ils ne sont jamais auto-acquittes"
      - "L'effacement automatique des bits de liaison quand l'equipement revient RUNNING : comportement existant, non remis en cause par ce lot"
    dropped_on_purpose:
      - "Aucun comportement abandonne : ce lot ne modifie aucun fichier CODE/ avant l'arbitrage humain de la cible du correctif"

  # ── 5. Preuves attendues en restitution ───────────────────────────────────
