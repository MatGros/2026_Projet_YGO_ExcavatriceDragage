contract:
  task_id: T359_AUTORESET_NOOP
  criticality: C3
  strategy: patch

  # ── 1. Objectif metier ────────────────────────────────────────────────────
  objective: >
    Trancher PAR PREUVE si l'impulsion d'auto-acquittement borne (ResetTransient, produite par
    FB_AutoResetTransientDiag) peut avoir un effet sur les diagnostics reseau, puis corriger la
    cause du no-op la ou elle produit un effet visible pour l'operateur. Le besoin client d'origine
    (mail GCAM : masquer les alarmes parasites au demarrage et au rearmement, sans acquittement
    manuel repete) reste NON TENU aujourd'hui, meme apres l'activation des autorisations.

  # ── 2. Criteres testables ─────────────────────────────────────────────────
  acceptance:
    - id: AC1
      statement: >
        Un test CI execute mesure que, sur une perte de liaison suivie du retour de la liaison,
        la valeur de fin de scan de ErrorId est identique que l'impulsion ResetTransient soit
        active ou non, equipement par equipement.
      verified_by: >
        TOOLS/TEST_AUTO_CI/RESULTS/C_DIAG_RESEAUX/tests/test_fb_diag_ethercat.st, cas TC-T359-001,
        execute par python TOOLS/TEST_AUTO_CI/scripts/run_tests.py --fb FB_Diag_Ethercat
    - id: AC2
      statement: >
        Un test CI execute mesure le meme resultat au cadrage de production, c'est-a-dire avec
        l'impulsion emise une seconde apres le retour de liaison, et non au scan du retour.
      verified_by: "Cas TC-T359-002 du meme fichier, meme commande"
    - id: AC3
      statement: >
        Un test CI execute etablit qu'il n'existe aucun scan ou l'equipement est en ligne alors que
        son bit de perte de liaison est encore pose, ce qui rend la voie alternative au front de
        Online sans prise sur le bit.
      verified_by: "Cas TC-T359-003 du meme fichier, meme commande"
    - id: AC4
      statement: >
        Le test CI observe reellement le bit de perte de liaison a l'etat pose pendant la coupure,
        puis a l'etat efface sans impulsion apres le retour, ce qui rend la mesure non vacue.
      verified_by: "Assertions sur 16#0010 a la coupure et 16#0000 au retour, cas TC-T359-001"
    - id: AC5
      statement: >
        La cible du correctif est arbitree par l'humain parmi les options prouvees operables, et
        aucun fichier CODE/ n'est ecrit avant cet arbitrage.
      verified_by: "Etat de git status sur CODE/ colle en restitution, plus la decision consignee dans TASK_LOCKS.json"
    - id: AC6
      statement: >
        Aucune ligne des chaines de securite n'est modifiee par ce lot : chaine AU, securites
        mouvement, codeurs de securite, contacteurs et freins restent hors perimetre.
      verified_by: "git diff --stat sur CODE/ colle en restitution, restreint aux fichiers autorises"
    - id: AC7
      statement: >
        Le nom de fichier est identique au nom de POU pour tout fichier de programme modifie.
      verified_by: "Gate G310 plus presence de l'objet correspondant dans le bundle PLCopenXML"
    - id: AC8
      statement: >
        Le suffixe ST est egal au langage genere dans le bundle PLCopenXML pour les fichiers modifiees.
      verified_by: "Gate G310 plus lecture de l'objet dans CODE_XML/CODE_Bundle.xml"
    - id: AC9
      statement: >
        Un test CI execute mesure qu'une perte de liaison reseau survenue pendant la fenetre
        transitoire de rearmement puissance ne produit AUCUNE alarme au carrousel du bandeau.
      verified_by: >
        TOOLS/TEST_AUTO_CI/RESULTS/J_SUPERVISION/tests/test_fb_hmi_bannerformatter.st, cas TC-T359-004,
        execute par python TOOLS/TEST_AUTO_CI/scripts/run_tests.py --fb FB_Hmi_BannerFormatter.
        Cas ROUGE sur l'etat avant correctif, VERT apres : la preuve precede le correctif.
    - id: AC10
      statement: >
        Le masquage est borne : un defaut reseau encore present a la fin de la fenetre transitoire
        est affiche de nouveau, avec son libelle de bus, ce qui interdit un masquage silencieux.
      verified_by: "Cas TC-T359-005 du meme fichier, vert avant et apres correctif"
    - id: AC11
      statement: >
        La cause de securite AU reste prioritaire et n'est jamais masquee par le masquage reseau.
      verified_by: "Cas TC-T359-006 du meme fichier, plus les 22 autres cas du fichier dont l'etat est inchange"

  # ── 3. Perimetre ──────────────────────────────────────────────────────────
  scope:
    allowed:
      - TOOLS/TEST_AUTO_CI/RESULTS/C_DIAG_RESEAUX/tests/test_fb_diag_ethercat.st
      - TOOLS/TEST_AUTO_CI/RESULTS/C_DIAG_RESEAUX/tests/test_fb_diag_canopen.st
