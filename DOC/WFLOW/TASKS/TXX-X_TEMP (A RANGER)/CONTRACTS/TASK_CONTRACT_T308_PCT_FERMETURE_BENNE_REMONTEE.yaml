  criticality: C2
  strategy: patch

  objective: >
    En cycle auto, interdire la remontée tant que le % de fermeture benne (déjà
    disponible côté IHM) n'atteint pas un seuil minimal configurable.

  acceptance:
    - id: AC1
      statement: "Sous le seuil configuré, la remontée en cycle auto n'est pas autorisée."
      verified_by: "test unitaire CI"
    - id: AC2
      statement: "Au-dessus du seuil, la remontée est autorisée comme actuellement (aucune régression)."
      verified_by: "test unitaire CI de non-régression"
    - id: AC3
      statement: "Le seuil est configurable et persistant (GVL_PERSISTENT)."
      verified_by: "test unitaire CI redémarrage/persistance"

  scope:
