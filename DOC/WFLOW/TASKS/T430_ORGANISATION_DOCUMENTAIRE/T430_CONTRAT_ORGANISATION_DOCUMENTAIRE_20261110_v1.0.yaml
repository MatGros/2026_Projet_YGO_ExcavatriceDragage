contract:
  task_id: T430
  criticality: C2
  strategy: patch
  objective: Rendre les documents rangés retrouvables par leurs tâches et par les outils, sans perte de références ni
    écrasement de preuves historiques.
  acceptance:
  - id: AC1
    statement: Les 394 fichiers du corpus AUDITS157/CONTRACTS192/REVIEWS34/TESTS11 restent présents après correction
      ; seules les modifications de noms, métadonnées de migration et liens identifiés sont autorisées.
    verified_by: Inventaire et empreintes avant/après ; diff explicite des contenus changés, zéro disparition et zéro
      collision Windows.
  - id: AC2
    statement: Les 33 suffixes de version altérés _VX_Y.md sont rétablis en _vX.Y.md avec préfixe de tâche T majuscule
      conservé ; G340 découvre réellement ces versions sous DOC/WFLOW/TASKS.
    verified_by: Test de latest_versions/all_versions sur leur emplacement réel et test CLI G340 en fixture avec ancienne/nouvelle
      version ; la version périmée est signalée.
  - id: AC3
    statement: G340 et G530 extraient intégralement un chemin actif contenant espaces et parenthèses, sans traiter une
      extraction vide comme une preuve de présence ; le retrait de sa cible provoque le résultat d’échec attendu.
    verified_by: 'Tests fixtures : chemin réel T_TEMP (A TRIIER), formes YAML simple/quotée/repliée et liens Markdown
      pertinents ; mutation cible retirée rejetée.'
  - id: AC4
    statement: G530 retrouve toutes les sources attendues du corpus contractuel déclaré, y compris le contrat legacy
      T273 et les autres YAML du dossier CONTRACTS historique ; exemples TASKS/TXXX, archives et sauvegardes sont exclus,
      les fichiers réels préfixés TXXX restent contrôlés.
    verified_by: Inventaire indépendant des sources avec rôles ; tests contrat standard, legacy, contexte/catalogue de
      signaux et fichiers exemple/archives/sauvegardes ; vérification que la suppression d’une source attendue est détectée
      par le contrôle de couverture.
  - id: AC5
    statement: Chaque référence catalogue de ce lot est migrée par correspondance exacte ancien chemin complet vers successeur
      existant unique ; les champs métier id/statut/agent/objectif restent identiques, hors date de suivi imposée par
      le protocole.
    verified_by: Table de correspondance dans le PLAN, comparaison sémantique avant/après de chaque tâche ; API Task
      Manager avec work-lock/edit-flag/revision ; ambiguïtés laissées explicitement non modifiées.
  - id: AC6
    statement: Les liens opératoires du corpus concernés par la migration résolvent vers les fichiers attendus ; les
      citations historiques et preuves datées conservent leur provenance.
    verified_by: Contrôle des liens avec résolution depuis chaque appelant ; cinq liens T226/T229 de la revue inclus
      ; échantillons historiques conservés et métadonnées racine historique/racine courante distinguées.
  - id: AC7
    statement: G525 retrouve un GEL courant unique, termine sans erreur de fichier et produit un inventaire non vide
      ; aucune conclusion de conformité des transitions n’est déduite du seul code retour.
    verified_by: Exécution read-only sur le dépôt et fixtures absent/ambigu ; source GEL et nombres de transitions publiés,
      résultats non déclarés conservés comme constats.
  - id: AC8
    statement: T356 exige une destination explicite de nouveau run et refuse l’écrasement d’artefacts existants ; un
      scan ne recrée pas DOC/WFLOW/AUDITS et ne modifie aucune des neuf annexes historiques T356.
    verified_by: Génération en temp système hors dépôt, comparaison de l’ensemble attendu de sept CSV et un JSON ; empreintes
      des neuf annexes historiques inchangées ; cas destination occupée refusé ; CLI avec --out sans racine correctement
      analysée.
  - id: AC9
    statement: Les contrôles de versions et de références conservent les exclusions et qualifications historiques pertinentes
      lors des déplacements ; le sas T_TEMP n’est pas exclu globalement pour obtenir un succès.
    verified_by: Tests D7/prose historique, exemples/archives exclus de la découverte et des versions actives selon la
      politique explicitée ; aucune réécriture de décisions humaines ni de sémantique AF.
  - id: AC10
    statement: Un garde-fou automatique couvre les défauts de migration corrigés et échoue pour une référence active
      cassée, une perte de couverture ou un suffixe de version invalide dans le corpus déclaré.
    verified_by: Script check_document_organisation.py avec tests positifs et négatifs ; revue indépendante du diff ;
      aucun ajout de baseline pour absorber ces défauts.
  - id: AC11
    statement: Le lot distingue les erreurs corrigées des dettes préexistantes et laisse intactes les trois sauvegardes
      .bak ignorées, les trois contrats déjà en échec structurel et les collisions d’identité hors périmètre.
    verified_by: Baseline des contrôles avant/après, contenu des trois .bak inchangé, aucun changement d’identifiant
      interne ; liste des écarts résiduels avec portée, sans validation PLC revendiquée.
