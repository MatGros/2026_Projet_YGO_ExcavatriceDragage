      verified_by: "py -3.13 -m pytest TOOLS/AGENT_SUPERVISOR/tests -q ; node TOOLS/AGENT_SUPERVISOR/tests/test_ui.mjs ; node TOOLS/AGENT_SUPERVISOR/tests/ui_layout_check.mjs ; (cd TOOLS/AGENT_SUPERVISOR/poc/vscode-notifier && npm test) — sorties des 4 commandes consignees"

