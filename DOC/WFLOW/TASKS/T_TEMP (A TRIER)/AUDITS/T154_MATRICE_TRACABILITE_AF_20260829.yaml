domains:
  AF-01:
    file: AF_Partie-01_Analyse_Fonctionnelle_v2.1.md
    functions:
      F01.01:
        fonction: Couper la puissance (AU)
        description: Boucle AU physique ouverte ➔ coupure matérielle des moteurs/actionneurs,
          indépendante du PLC
        realisee_par: FB_Safety_EmergencyManagement
        criticite: 🔴 C4
        tc_couvrants:
        - TC-P01-001
        statut: ✅
        etat: NV-I
      F01.02:
        fonction: Maintenir 2 canaux fail-safe
        description: Perte de maintien A ou B ➔ ouvre la boucle AU
        realisee_par: FB_Safety_EmergencyManagement
        criticite: 🔴 C4
        tc_couvrants:
        - TC-P01-002
        statut: ✅
        etat: NV-I
      F01.03:
        fonction: Réarmer sur demande explicite
        description: Front ArmRequest + boucle saine ➔ séquence de réarmement ; jamais
          automatique
        realisee_par: FB_Safety_EmergencyManagement
        criticite: 🔴 C4
        tc_couvrants:
        - TC-P01-003
        - TC-P01-005
        statut: ✅
        etat: NV-I
      F01.04:
        fonction: Acquitter sans lever l'interlock
        description: Reset efface l'affichage (pattern Cause/Ack) sans jamais ouvrir
          l'interlock de sécurité
        realisee_par: FB_Safety_EmergencyManagement
        criticite: 🟠 C3
        tc_couvrants:
        - TC-P01-004
        - TC-P01-009
        statut: ✅
        etat: NV-I
      F01.05:
        fonction: Auto-tester la redondance A/B
        description: Test croisé des 2 canaux à chaque réarmement (preuve runtime,
          pas de procédure manuelle séparée)
        realisee_par: FB_Safety_EmergencyManagement
        criticite: 🔴 C4
        tc_couvrants:
        - TC-P01-006
        statut: ✅
        etat: NV-I
      F01.06:
        fonction: Verrouiller après échec
        description: Non-confirmation contacteur après pulse ➔ lockout 5s avant nouvel
          essai
        realisee_par: FB_Safety_EmergencyManagement
        criticite: 🟠 C3
        tc_couvrants:
        - TC-P01-007
        statut: ✅
        etat: NV-I
      F01.07:
        fonction: Couper sur demande safety métier
        description: PowerCutOffRequest (agrégat M1/M2/M3) ➔ coupe A et B sans déclencher
          d'armement
        realisee_par: FB_Safety_EmergencyManagement
        criticite: 🔴 C4
        tc_couvrants:
        - TC-P01-008
        statut: ✅
        etat: NV-I
      F01.08:
        fonction: Cohérence coupure IHM / réarmement
        description: BtnEmergencyCutOff pendant le pulse de réarmement
        realisee_par: FB_Safety_EmergencyManagement
        criticite: 🟠 C3
        tc_couvrants:
        - TC-P01-010
        statut: ⚠️ écart relevé, non corrigé (audit 2026-08-22)
        etat: NV
    validation_points:
      TC-P01-001, TC-P01-008:
        intention: AU physique et demande safety métier agrégée coupent A+B, sans
          passer par une séquence d'armement
        type: 🟢 SITE+AUTO
        ref: FB_Safety_EmergencyManagement
        etat: NV
      TC-P01-002, TC-P01-006:
        intention: Perte d'un canal ouvre la boucle ; auto-test croisé des 2 canaux
          prouvé à chaque réarmement
        type: ⚡ SITE+AUTO_PLC
        ref: FB_Safety_EmergencyManagement
        etat: NV-I
      TC-P01-003, TC-P01-005, TC-P01-007:
        intention: Front explicite requis, jamais automatique ; acquittement et réarmement
          = 2 actions distinctes ; échec de confirmation ➔ lockout 5s
        type: ⚡ AUTO_PLC
        ref: FB_Safety_EmergencyManagement
        etat: NV-I
      TC-P01-004, TC-P01-009:
        intention: Reset efface l'affichage sans jamais lever l'interlock de sécurité
          ; re-latch si nouvel échec
        type: 💻 AUTO
        ref: FB_Safety_EmergencyManagement
        etat: NV-I
      TC-P01-010:
        intention: BtnEmergencyCutOff pendant le pulse de réarmement (step 5)
        preuve: ⚠️ ArmPulse_RQ reste TRUE — écart relevé, non corrigé (audit 2026-08-22)
        type: 💻 AUTO
        ref: §7
        etat: NV-I
      TC-P01-001:
        intention: Coupe puissance moteurs, API vivant
        preuve: Contacteur ouvert
        type: 🟢 SITE
        ref: §6.1
        etat: NV
      TC-P01-002:
        intention: Perte canal A ou B ouvre la boucle AU
        preuve: MaintainA/B_RQ=FALSE
        type: ⚡ SITE+AUTO
        ref: §5
        etat: NV-I
      TC-P01-003:
        intention: Front ArmRequest + boucle OK ➔ pulse 1s
        preuve: Pulse 1s (step 5)
        type: ⚡ AUTO_PLC
        ref: §4.3
        etat: NV-I
      TC-P01-004:
        intention: Reset efface l'affichage (interlock reste sur Cause)
        preuve: Error=FALSE
        type: 💻 AUTO
        ref: §4.4bis
        etat: NV-I
      TC-P01-005:
        intention: Acquittement et réarmement 2 actions distinctes
        preuve: 2 actions requises
        type: ⚡ SITE+AUTO
        ref: §4.4
        etat: NV-I
      TC-P01-006:
        intention: Test croisé A/B au réarmement (échec ➔ RedundancyFail)
        preuve: Steps 1–4 (200ms)
        type: ⚡ AUTO_PLC
        ref: §4.3bis
        etat: NV-I
      TC-P01-007:
        intention: Échec confirmation contacteur ➔ verrouillage 5s
        preuve: LockoutActive=TRUE
        type: 💻 AUTO
        ref: §4.3
        etat: NV-I
      TC-P01-008:
        intention: PowerCutOffRequest=TRUE coupe A et B sans armer
        preuve: MaintainA/B_RQ=FALSE
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P01-009:
        intention: Cause persistante ➔ ré-alarme au prochain essai
        preuve: Ack=FALSE
        type: 💻 AUTO
        ref: §4.4bis
        etat: NV-I
  AF-02:
    file: AF_Partie-02_Architecture_Programme_v3.2.md
    functions:
      F02.01:
        fonction: Ordonner le cycle applicatif
        description: Exécute les six PRG dans l'ordre Acquisition → Modes/Cycle →
          Treuils/Benne → Translation → Outputs → Supervision.
        realisee_par: MainTask + PRG_02 à PRG_07
        criticite: 🔵 C2
        tc_couvrants:
        - TC-P02-004
        statut: ⚠️ revue MainTask manuelle
        etat: NV
      F02.02:
        fonction: Encapsuler l'orchestration ST
        description: Les PRG rendent visibles leurs instances, flux et arbitrages
          ; calculs et machines d'état résident dans les FB.
        realisee_par: PRG_02 à PRG_07
        criticite: ⚪ C1
        tc_couvrants:
        - TC-P02-002
        statut: ✅
        etat: NV-I
      F02.03:
        fonction: Garantir un producteur unique
        description: Chaque image, bus, commande et état public a un propriétaire
          unique, identifié avant tout raccordement.
        realisee_par: Contrats ST_* + PRG producteurs
        criticite: 🟠 C3
        tc_couvrants:
        - TC-P02-001
        statut: ⚠️ gate à fiabiliser (TBD §8)
        etat: NV
      F02.04:
        fonction: Isoler la barrière de sortie
        description: Seul PRG_06_Outputs applique les interlocks finaux et écrit les
          Q/PDO des actionneurs.
        realisee_par: PRG_06_Outputs
        criticite: 🔴 C4
        tc_couvrants:
        - TC-P02-003
        statut: ✅
        etat: NV-I
      F02.05:
        fonction: Rendre explicites les retards de scan
        description: Toute donnée consommée avant son producteur est interdite, sauf
          retard d'un scan nommé et justifié.
        realisee_par: Ordonnancement MainTask
        criticite: 🟠 C3
        tc_couvrants:
        - TC-P02-004
        statut: ⚠️ revue MainTask manuelle
        etat: NV
      F02.06:
        fonction: Séparer supervision et commande métier
        description: La vue troubleshooting observe seulement ; PRG_07 porte distinctement
          reset IHM, persistance et bypass autorisés.
        realisee_par: PRG_07_Supervision + FB_TroubleshootingView
        criticite: 🔵 C2
        tc_couvrants:
        - TC-P02-005
        statut: ✅
        etat: NV-I
    validation_points:
      TC-P02-001:
        intention: Un seul producteur par donnée
        preuve: Aucun écouteur/écrivain multiple sur un contrat *(⚠️ G200_check_linkage.py
          L10 remonte des faux positifs intra-POU — voir TBD §8)*
        type: 💻 AUTO
        ref: §2
        etat: NV
      TC-P02-002:
        intention: Programme d'orchestration ST sans logique métier cachée
        preuve: Les calculs et machines d'état résident dans les FB ; le PRG rend
          ses arbitrages et flux explicitement lisibles
        type: 💻 AUTO
        ref: §2
        etat: NV
      TC-P02-003:
        intention: Sorties physiques via PRG_06_Outputs
        preuve: Aucun autre POU n'écrit les Q/PDO finaux
        type: 💻 AUTO
        ref: §3
        etat: NV
      TC-P02-004:
        intention: Ordre d'exécution MainTask conforme
        preuve: Tâche CODESYS + G200_check_linkage.py PASS *(⚠️ ne vérifie pas l'ordre
          inter-POU — revue manuelle à ce jour, voir TBD §8)*
        type: ⚡ SITE+AUTO
        ref: §5
        etat: NV
      TC-P02-005:
        intention: Vue troubleshooting en lecture seule
        preuve: FB_TroubleshootingView ne produit aucune commande, configuration ni
          interlock
        type: 💻 AUTO
        ref: §3
        etat: NV
  AF-03:
    file: AF_Partie-03_Contrats_Composants_v2.3.md
    functions: {}
    validation_points:
      TC-P03-001:
        intention: Cycle de vie et neutralisation Enable
        preuve: Enable=FALSE neutralise commandes et statut (gate) ; Enable=TRUE autorise
          l'état Ready
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P03-002:
        intention: Reset inconditionnel (Cause/Ack)
        preuve: Front Reset efface l'affichage (interlock reste sur Cause)
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P03-003:
        intention: Pas de redémarrage auto après Ack
        preuve: Retour READY, nouvel ordre explicite requis
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P03-004:
        intention: Pas de SafeStop/StartStop hors mouvement
        preuve: Absents des briques E/S, joystick et diag
        type: 💻 AUTO
        ref: §3
        etat: NV
      TC-P03-005:
        intention: Encapsulation stricte
        preuve: Échanges via interfaces/DUTs publics uniquement
        type: 💻 AUTO
        ref: §2
        etat: NV
      TC-P03-006:
        intention: Re-latch sur ré-apparition Cause
        preuve: Nouveau front Cause ➔ Ack=FALSE
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P03-007:
        intention: Warning auto-effaçable vs Fault latché
        preuve: Warning s'efface sans Reset, Fault exige Ack
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P03-008:
        intention: 'Cumul de plusieurs causes latchées : 2 Causes[i] distincts (Active
          AND Latching) apparus à des instants différents s''accumulent dans LatchedId
          ; un seul front Reset les acquitte ensemble'
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P03-009:
        intention: 'Cause live (Latching=FALSE) + cause latchée (Latching=TRUE) simultanées
          : la live alimente ErrorId et retombe seule quand Active repasse FALSE ;
          la latchée arme LatchedId et reste jusqu''au front Reset'
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P03-010:
        intention: 'Bornes de la liste Causes[0..15] : Causes[0] et Causes[15] correctement
          mappés sur le bit 0 et le bit 15 (SHL(WORD#1, i)), pas d''off-by-one'
        type: 💻 AUTO
        ref: §3
        etat: NV-I
      TC-P03-011:
        intention: 'Reset sans historique de défaut : aucun effet parasite, LatchedId
          reste 0, Latched reste FALSE'
        type: 💻 AUTO
        ref: §4
        etat: NV-I
      TC-P03-012:
        intention: 'Reset maintenu (niveau haut) sans nouveau front pendant qu''une
          cause latchée disparaît puis réapparaît : pas d''acquittement silencieux
          (le clear n''agit que sur le front R_TRIG) ; la cause réapparue Active AND
          Latching ré-arme son bit (ré-alarme) — faille T148 non applicable à cette
          brique'
        type: 💻 AUTO
        ref: §6
        etat: NV-I
      TC-P03-013:
        intention: 'Enable=FALSE : la vue LIVE n''est pas évaluée (ErrorId=0, Error=FALSE)
          mais la vue LATCHÉE reste publiée — un défaut laté non acquitté ne disparaît
          pas sur bascule Enable OFF→ON sans Reset'
        type: 💻 AUTO
        ref: §4
        etat: NV-I
  AF-04:
    file: AF_Partie-04_Mode_SemiAuto_Sequenceur_v2.3.md
