        type: 💻 AUTO
        ref: §3
        etat: V-I
      TC-P04-021:
        intention: Enchaînement continu d'extraction sous maintien joystick
        preuve: Fermeture $\rightarrow$ Décollage $\rightarrow$ Nominal sans à-coup
        type: 💻 AUTO
        ref: §3
        etat: V-I
