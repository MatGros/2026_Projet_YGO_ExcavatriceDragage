  AF-06:
    file: AF_Partie-06_Acquisition_Qualification_IO_v2.4.md
    functions:
      F06.01:
        fonction: Établir un verdict préflight passif
        description: Sur front Execute (demande IHM GVL_IHM.Commun.Preflight.BtnRun)
          uniquement, attend l'immobilité machine, agrège 16 contrôles et publie PreflightOk,
          PreflightDone, PreflightBusy, PreflightErrorId. Aucun verdict automatique
          au démarrage automate.
        realisee_par: FB_Acquisition_Preflight + PRG_07_Supervision
        criticite: 🔵 C2
        tc_couvrants:
        - TC-P06-007
        statut: ✅ code lu
        etat: NV-I
    validation_points:
      TC-P06-001:
        intention: Aucune lecture d'E/S brute dans les FB métier
        preuve: Consommateurs lisent des faits qualifiés
        type: 💻 AUTO
        ref: §3
        etat: NV
      TC-P06-002:
        intention: Polarité normalisée une seule fois à l'acquisition
        preuve: Zéro ré-inversion dans les FB métier
        type: 💻 AUTO
        ref: §3
        etat: NV
      TC-P06-003:
        intention: Bascule réel/simulation centralisée
        preuve: HwIn source unique par domaine
        type: 💻 AUTO
        ref: §3
        etat: NV
      TC-P06-004:
        intention: Diag CANopen/EtherCAT publié en ligne
        preuve: Statuts dispos pour Modes/Safety/IHM
        type: 💻 AUTO
        ref: §4
        etat: NV
      TC-P06-005:
        intention: Noms des signaux de puissance validés
        preuve: PowerKeepAlive_A/B_RQ, EmergencyChainClosed_DI
        type: 🟢 SITE
        ref: §5
        etat: NV
      TC-P06-006:
        intention: Écriture des sorties physiques centralisée
        preuve: PRG_06_Outputs seul producteur final
        type: 💻 AUTO
        ref: §6
        etat: NV
      TC-P06-007:
        intention: 'Sans front Execute, PreflightDone reste FALSE (aucun verdict au
          démarrage). Sur front Execute, tant que la machine n''est pas immobile :
          PreflightBusy=TRUE et aucun verdict final. Une fois immobile, les 16 bits
          sont agrégés et PreflightOk=(PreflightErrorId=0).'
        type: 💻 AUTO_PLC
        ref: FB_Acquisition_PreflightPRG_07_Supervision
        etat: NV-I
