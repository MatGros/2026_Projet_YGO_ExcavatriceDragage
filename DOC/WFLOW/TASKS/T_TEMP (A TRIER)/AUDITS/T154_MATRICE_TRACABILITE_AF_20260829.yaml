        etat: NV
      F12.02:
        fonction: Diagnostiquer le bus EtherCAT (variateur M3, codeurs M1/M2)
        description: Perte liaison par device → ErrorId bit4/5/6 (nibbles)
        realisee_par: FB_Diag_Ethercat
        criticite: 🟠 C3
        tc_couvrants:
        - TC-P12-010
        - '020'
        - '030'
        - '040'
        statut: ⚠️ conçu, non implémenté
        etat: NV
      F12.03:
        fonction: Surveiller le heartbeat IHM↔PLC
        description: Toggle bidirectionnel, détecte timeout communication
        realisee_par: FB_Diag_IhmHeartbeat
        criticite: 🟠 C3
        tc_couvrants:
        - TC-P12-050
        statut: ⚠️ conçu, non implémenté
        etat: NV
    validation_points:
      TC-P12-010:
        intention: 'Pour chaque device (Joystick CAN, Variateur M3, Encodeur M1, Encodeur
          M2) : StateRaw≠RUNNING/ACTIVE ➔ Online=FALSE, Operational=FALSE, State=INIT,
          sans effet sur les autres devices'
        type: 💻 AUTO
        ref: FB_Diag_CanOpenFB_Diag_Ethercat
        etat: NV-I
      TC-P12-020:
        intention: Défaut isolé sur un seul device ➔ ErrorId de ce device porte exactement
          son bit attendu, aucun bit croisé sur un autre device — couvre les 4 devices
          (Joystick bit0/1, Variateur bit4, M1 bit5, M2 bit6)
        type: 💻 AUTO
        ref: FB_Diag_CanOpenFB_Diag_Ethercat
        etat: NV-I
      TC-P12-030:
        intention: Error global et synthèse ErrorId par nibble (0x00F0 variateur /
          0x0F00 M1 / 0xF000 M2) reflètent l'état Error booléen de chaque device,
          indépendamment du détail bit-level
        type: 💻 AUTO
        etat: NV
      TC-P12-040:
        intention: SimBypass/NetworkBypassActive sans device réel RUNNING ➔ SIMULATED
          ; réel RUNNING sans bypass ➔ READY ; ni l'un ni l'autre ➔ INIT ; Enable=FALSE
          prioritaire ➔ DISABLED
        type: 💻 AUTO
        ref: FB_Diag_CanOpenFB_Diag_Ethercat
        etat: NV
      TC-P12-050:
        intention: Absence de front TglHeartbeatIhm pendant IhmTimeout ➔ HeartbeatIhmTimeout=TRUE/HeartbeatIhmOk=FALSE
          ; TglHeartbeatPlc bascule toutes les PlcTogglePeriod indépendamment de l'IHM
          ; nouveau front après timeout ➔ HeartbeatIhmOk restauré immédiatement
        type: 💻 AUTO
        etat: NV
