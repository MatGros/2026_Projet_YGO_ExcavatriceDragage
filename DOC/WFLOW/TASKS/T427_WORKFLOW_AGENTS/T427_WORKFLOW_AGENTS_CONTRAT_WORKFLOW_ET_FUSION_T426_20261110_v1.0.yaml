      les schémas et graphiques.
    verified_by: python TOOLS/AGENT_WORKFLOW/scripts/G530_check_contract_refs.py .
  - id: T426-AC1
    statement: Le catalogue conserve un résumé court et pointe vers une seule fiche active par tâche.
    verified_by: Comparer TASKS.yaml, le template et deux tâches pilotes ; aucun journal ni contrat dupliqué.
  - id: T426-AC2
    statement: La fiche unique décrit besoin, décision recherchée, périmètre, permissions, critères observables, preuves et
      responsabilités.
    verified_by: Valider un exemple complet et rejeter un exemple privé de critère observable ou de périmètre.
  - id: T426-AC3
    statement: Chaque expérience possède une question nouvelle, des prédictions discriminantes et une décision selon résultat
      avant lancement.
    verified_by: Sur un historique pilote, détecter une répétition sans justification et accepter un rejeu motivé par une
      source modifiée.
  - id: T426-AC4
    statement: Trois itérations non informatives déclenchent une revue A/B aveugle ; un seuil de deux à cinq exige une justification
      préalable.
    verified_by: Cas seuil atteint, seuil non atteint, résultats proches et remise à zéro justifiée ; vérifier indépendance
      des deux missions.
  - id: T426-AC5
    statement: Le contrat de délégation impose contexte utile, workflow applicable, sorties mesurables, alerte et auto-revue.
    verified_by: Deux missions pilotes ; chaque conclusion renvoie à une preuve et chaque point insuffisamment établi reste
      non vérifié.
  - id: T426-AC6
    statement: Chaque contrôle automatique possède déclencheur, portée, responsable, sévérité, diagnostic et procédure de
      reprise.
    verified_by: Matrice de contrôles avec un cas valide et un contre-exemple par contrôle ; zéro blocage hors périmètre dans
      les cas pilotes.
  - id: T426-AC7
    statement: Les contrôles nouveaux démarrent en avertissement et ne changent pas silencieusement les hooks actifs.
    verified_by: Comparer configurations avant/après ; activation bloquante uniquement après validation humaine explicite
      et tests des faux positifs.
  - id: T426-AC8
    statement: Les résultats distinguent PASS, FAIL, interruption, non testé et nettoyage incomplet ; une exception ne produit
      pas un succès implicite.
    verified_by: Tests du validateur de résultat incluant exception, preuve absente, sortie partielle et erreur de nettoyage.
  - id: AC6
    statement: '[AJOUTE PAR LA FUSION, a valider par l''exploitant] La regle ''1 tache = 1 dossier, base minimale (contrat
      + plan), extensions sur validation ecrite'' est ecrite une seule fois et appliquee a T427 et T429 sans perte de contenu,
      selon les 5 conditions de migration de T426 (consolidation_review.acceptance_before_migration, conservees dans l''archive
      du contrat T426).'
    verified_by: Lecture de la regle dans WORKFLOW.md ; comparaison avant/apres des dossiers T427 et T429 ; table ancien->nouveau
      chemin validee par l'exploitant avant tout deplacement ; G340 sans nouvelle erreur imputable.
