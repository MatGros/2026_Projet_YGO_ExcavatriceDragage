contract:
  task_id: T353_OUTIL_WEB_CARTOGRAPHIE
  criticality: C2
  strategy: patch

  objective: >
    Au lieu de relire a chaque diagnostic deux fiches Markdown de plusieurs
    centaines de lignes, l'utilisateur ouvre un outil web local, choisit une
    chaine de commande (treuils M1/M2 manuel, treuils M1/M2 cycle, translation
    M3 manuel, translation M3 cycle) et un sens de geste, et voit s'afficher le
    chemin exact parcouru — variable par variable, dans l'ordre chronologique,
    avec le producteur et le consommateur en fichier:ligne — sachant a chaque
    instant si ces numeros de ligne sont encore valides, car l'outil compare le
    blob SHA de chaque fichier cite a celui consigne par le document source et
    signale en rouge tout fichier dont le contenu a bouge.

  acceptance:
    - id: AC1
      statement: "Le parseur TOOLS/CMD_PATH_VIEWER/parse_cartographies.py lit les 3 documents source et produit un format pivot JSON ; les 202 lignes de chaine reellement definies par les documents (66 codes M + 35 codes C dans la fiche treuils, idem dans T334) sont toutes parsees, ou chaque ligne non parsable est listee avec son code, son document d'origine et le motif de rejet. Le taux est chiffre (lignes parsees / lignes totales), jamais estime."
      verified_by: "Execution du parseur, puis lecture du rapport de taux et comptage independant dans le JSON produit : nombre de maillons par document et par chaine. Un rejet silencieux est un echec du critere."

    - id: AC2
      statement: "Chaque reference fichier:ligne extraite est resolue vers un chemin de fichier REEL, ou classee NON_RESOLUE avec son texte brut conserve : les 4 formes rencontrees dans les sources sont traitees (chemin complet code/M_MAIN/PRG_04_Treuils_Benne.st:1405, forme abregee PRG_02:492, continuation :492 apres un fichier nomme, et liste :29,36,43,49). Aucune reference n'est devinee : toute resolution passe par un index construit a partir des fichiers reellement presents (git ls-files), et les cas ambigus sont isoles, jamais tranches par supposition. Le taux de resolution est chiffre par categorie."
      verified_by: "Rapport de resolution par categorie (resolues / non resolues / ambigues, avec exemples) + relecture par l'orchestrateur d'un echantillon d'au moins 20 references tirees du JSON, verifiees une par une contre le disque."

    - id: AC3
      statement: "Les tableaux d'audit de l'annexe (§2.1 et §2.2, 4 colonnes : Ref. T334 / Ligne citee par T334 / Contenu reel sur disque / Verdict) ne sont PAS injectes dans le graphe : ce ne sont pas des chaines mais des lignes de contre-verification, et leurs codes M/C ne partagent pas la semantique de ceux de T334. Le graphe ne contient donc que les maillons issus des tableaux de chaine a 5 colonnes, plus les complements explicitement declares comme tels."
      verified_by: "Comptage des maillons par document dans le JSON + test automatise verifiant qu'aucun maillon ne provient d'une ligne a 4 colonnes. L'annexe doit apparaitre UNIQUEMENT comme source d'ancrage de blob et comme source de complements non fusionnes."

    - id: AC4
      statement: "Le format pivot porte l'ancrage complet : pour chaque fichier cite, le blob SHA consigne ET la SOURCE de cet ancrage, etiquetee (bloc d'ancrage de la fiche treuils, ou §1.3 de l'annexe), plus le HEAD mesure au moment de la generation et un horodatage ISO 8601. Les fichiers cites par T334 sont explicitement etiquetes comme reposant sur un ancrage DERIVE de l'annexe, car T334 ne porte AUCUN bloc d'ancrage (trou numero 1 releve par l'annexe elle-meme) : l'outil ne presente jamais cet ancrage comme provenant de T334."
      verified_by: "Lecture du JSON et de l'affichage de l'outil : presence des deux etiquettes de source, du HEAD mesure, de l'horodatage, et de la mention du trou d'ancrage de T334."

    - id: AC5
      statement: "Le garde-fou blob est PROUVE par un test volontaire, pas par un commentaire : un fichier cite est modifie intentionnellement, l'outil signale ce fichier en rouge avec le blob attendu et le blob mesure, puis le fichier est restaure et l'outil repasse au vert. La preuve porte les trois etats (blob avant / blob pendant / blob apres), horodates, et demontre que la restauration est complete."
      verified_by: "Log ou transcription horodatee du test dans le dossier de preuves, corroboré par git hash-object avant, pendant et apres, et par git status prouvant qu'aucune modification ne subsiste."

    - id: AC6
      statement: "Le recalcul de blob cote navigateur est exactement equivalent a git hash-object : le SHA-1 affiche par l'outil en mode live est identique au SHA-1 rendu par la commande git hash-object pour au moins 5 fichiers de controle. Un algorithme approximatif (hash du seul contenu, sans l'en-tete blob) est un echec du critere."
      verified_by: "Table de comparaison produite dans le dossier de preuves : pour chaque fichier de controle, SHA-1 affiche par l'outil et SHA-1 rendu par git hash-object, cote a cote, strictement egaux."

    - id: AC7
      statement: "L'interface affiche, pour la selection courante (chaine + mode + sens), le chemin complet dans l'ordre chronologique : chaque maillon porte son code (Mnn / Cnn), le nom exact de la variable, le producteur fichier:ligne, le consommateur fichier:ligne et le role. Aucun maillon ne peut etre affiche sans ses references fichier:ligne."
      verified_by: "Lecture du rendu et du JSON source du rendu : presence des cinq champs pour chaque maillon affiche ; verification que l'ordre affiche suit l'ordre des codes du document."

    - id: AC8
      statement: "Les branches NON empruntees sont affichees, pas masquees : pour chaque selection, l'outil montre la chaine non retenue (par exemple la chaine cycle quand on interroge le mode manuel) et remonte les lignes marquees comme dissymetriques ou incertaines par les documents, avec leur origine. C'est le besoin de diagnostic exprime par l'utilisateur."
      verified_by: "Lecture de l'interface pour au moins 2 selections differentes : la chaine non retenue est visible et les marqueurs de dissymetrie portes par les documents sont restitues."

    - id: AC9
      statement: "Le selecteur de geste est honnete sur sa propre limite : les documents ne decrivent PAS un arbre de decision par geste mais des chaines lineaires, donc chaque geste propose est une entree curee qui CITE sa source (code M/C et document d'origine), et tout geste que les documents ne permettent pas de separer est affiche comme NON SEPARABLE avec la raison. Aucun geste n'est invente, aucune entree curee n'est anonyme."
      verified_by: "Audit de la table de gestes : chaque entree porte une source verifiable ; presence d'au moins une entree NON SEPARABLE si les documents ne permettent pas la separation."

    - id: AC10
      statement: "Le lot n'ecrit AUCUN fichier de CODE/, ne regenere aucun CODE_XML, ne lance aucun test CI ni aucun gate, et ne cree aucun commit. Tous les livrables sont sous TOOLS/CMD_PATH_VIEWER/ et dans DOC/WFLOW/ (contrat, catalogue, verrou, registre). Aucun fichier temporaire a la racine du depot."
      verified_by: "git status --short avant et apres le lot : aucun fichier de CODE/ ni de CODE_XML/ apparait ; arborescence des livrables conforme a TOOLS/AGENT_WORKFLOW/docs/STRUCTURE_AND_CLEANUP.md."

    - id: AC11
      statement: "Les 3 documents source sont INTACTS : leurs blobs SHA sont strictement identiques avant et apres le lot (aeaac5dd285618f80a0479dbb3ba81a0e6fe7001, 2ea84800602ea530698c4a220f88ad48e3b7fd8f, 20bfada06fc56a9fa10f432cd48272f203ed3b95)."
      verified_by: "git hash-object des 3 fichiers avant et apres, valeurs cote a cote."

    - id: AC12
      statement: "L'outil est autonome et utilisable sans serveur applicatif : le mode statique fonctionne en file:// sans aucune requete reseau ni CDN, et le mode live n'utilise qu'un serveur de FICHIERS statique (python -m http.server lance par un fichier .bat), aucune logique metier cote serveur. Une note courte documente la structure, les deux modes, et les limites connues de l'outil."
      verified_by: "Lecture du README et du lanceur, et verification qu'aucune dependance externe n'est chargee (aucune URL distante dans le HTML/JS). Les limites connues (T334 sans bloc d'ancrage, gestes non separables, references non resolues) y figurent explicitement."

