  alert_duty: >
    Six points doivent etre remontes et non tranches silencieusement pendant ce lot.
    Premier point, bloquant pour la promesse du brief : la fiche T334 ne porte AUCUN bloc
    d'ancrage de revision (c'est le trou numero 1 releve par l'annexe elle-meme, section 3).
    La verification de fraicheur des references M3 ne peut donc pas s'ancrer sur T334 : elle
    repose sur la table de blobs du paragraphe 1.3 de l'annexe, mesuree a 2026-09-21T01:31:44.
    Cet ancrage DERIVE doit etre etiquete comme tel dans l'outil et dans la preuve, jamais
    presente comme un ancrage de T334.
    Second point, limitation de fond : le besoin exprime est un choix de GESTE (« joystick M1
    monte »), alors que les documents livrent des chaines LINEAIRES, pas un arbre de decision
    par geste. Separer un geste impose une surcouche curee, dont chaque entree doit citer sa
    source ; tout ce que les documents ne permettent pas de separer est declare NON SEPARABLE.
    Inventer une granularite de geste que les sources ne portent pas serait la faute la plus
    grave de ce lot.
    Troisieme point : un document HTML ouvert en file:// ne peut pas executer git hash-object.
    La fraicheur n'est donc verifiee en direct que si la page est servie par un serveur de
    fichiers statique local ; sans lui, les badges de fraicheur sont FIGES et doivent afficher
    leur horodatage et leur caractere non recalcule, jamais un vert trompeur.
    Quatrieme point : les codes Mnn/Cnn ne sont PAS un espace de noms partage entre documents.
    Dans l'annexe, C02 et C03 designent des objets de PRG_03 qui ne correspondent pas aux codes
    C02 et C03 de T334. Un code n'a de sens qu'accompagne de son document d'origine, et le
    format pivot doit le porter.
    Cinquieme point : les references courtes et les listes de lignes sont nombreuses et parfois
    ambiguës. Une reference non resolue est affichee comme telle ; elle n'est jamais remplacee
    par une supposition, et l'outil ne doit jamais afficher un chemin avec assurance quand sa
    reference n'a pas ete resolue.
    Sixieme point : les documents source sont eux-memes encore en mouvement (T334 est modifie
    non committe, et l'annexe signale que HEAD a bouge pendant son propre audit). Toute mesure
    d'ancrage vieillit en minutes : les blobs doivent etre re-mesures juste avant l'ecriture du
    JSON, et l'horodatage affiche dans l'outil est celui de cette mesure.

