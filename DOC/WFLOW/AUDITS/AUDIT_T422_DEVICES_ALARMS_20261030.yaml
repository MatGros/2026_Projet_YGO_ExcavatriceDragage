  D08_JOYSTICK_PUPITRE:
    statut: TERMINE
    nom: Joystick & Pupitre Opérateur
    perimetre: Manipulateur 2 axes Hall JOY1, bouton Homme-Mort, arbitre de commande
      maître, interlocks de neutre et inter-axes
    fichiers_cles:
    - CODE/D_JOYSTICK/FB_Joystick.st
    - CODE/D_JOYSTICK/FB_AxisScale.st
    - CODE/M_MAIN/PRG_02_Acquisition.st
    - CODE/M_MAIN/PRG_03_Modes_Cycle.st
    - CODE/M_MAIN/PRG_04_Treuils_Benne.st
    - CODE/M_MAIN/PRG_05_Translation.st
    - CODE/I_TRANSLATION/FB_TranslationCmdArbitrationM3.st
    - CODE/H_TREUILS_BENNE/FB_WinchCmdArbitrationM1.st
    - CODE/H_TREUILS_BENNE/FB_WinchCmdArbitrationM2.st
    - CODE/J_SUPERVISION/FB_Hmi_BannerFormatter.st
    - CODE/J_SUPERVISION/FB_TroubleshootingView.st
    auditeur: Auditeur Expert Ergonomie Industrielle & CANopen
    challenger: Expert Sécurité Machine ISO 13849 & Conduite
    defauts:
    - id: D08-01
      nom: Perte bus CANopen JOY1
      condition: CODE/D_JOYSTICK/FB_Joystick.st:116 (BusLost)
      action_machine: Gate sécurité, consignes à 0 %, DeadmanArmed=FALSE
      enregistrement: instCauses[2] (Perte liaison bus CAN joystick), ST_Fault
      visibilite_ihm:
        bandeau_alarme: '[CAN] Joystick JOY1 non detecte'
        action_operateur: '[CAN] Joystick non détecté'
        condition_speciale: Aucune
      statut: CONFORME
    - id: D08-02
      nom: Tension potentiomètre hors plage ADC (RawOutOfRange)
      condition: CODE/D_JOYSTICK/FB_Joystick.st:112 (RawX/Y < -500 ou > 10500)
      action_machine: Consignes SpeedTgt forcées à 0.0 %, Enable=FALSE
      enregistrement: instCauses[1] (Capteur joystick hors plage ADC), GVL_IHM.JOY1Joystick.State.Error
      visibilite_ihm:
        bandeau_alarme: ABSENT du bandeau alarme §5
        action_operateur: ABSENT de l action §4 (affiche deplacement en cours a tort)
        condition_speciale: Aucune
      statut: DEFAUT_MORT_REFUS_SILENCIEUX
    - id: D08-03
      nom: Échec de calibration neutre joystick (CalibFail)
      condition: CODE/D_JOYSTICK/FB_Joystick.st:121 (Calibrate avec axes hors [2000..8000])
      action_machine: Rejet calibration, verrouillage Ready=FALSE via Fault.Latched
      enregistrement: instCauses[0] (Echec calibration joystick), Fault.Latched
      visibilite_ihm:
        bandeau_alarme: ABSENT du bandeau alarme §5
        action_operateur: ABSENT de l action §4
        condition_speciale: Aucune
      statut: DEFAUT_ORPHELIN
    - id: D08-04
      nom: Verrou inversion rapide inter-scan sans neutre (InversionLockActive)
      condition: CODE/D_JOYSTICK/FB_Joystick.st:208 (FlipX ou FlipY sans neutre)
      action_machine: Désarmement immédiat DeadmanArmed=FALSE, réarmement verrouillé
        jusqu au neutre
      enregistrement: Variable locale pure InversionLockActive (non publiée)
      visibilite_ihm:
        bandeau_alarme: Aucun
        action_operateur: '[JOYSTICK] Appuyer homme-mort au neutre (trompeur sans
          mention inversion)'
        condition_speciale: Aucune
      statut: REFUS_SILENCIEUX
    - id: D08-05
      nom: Refus d armement par ArmingPermit=FALSE (ArmingPermitDenied)
      condition: CODE/D_JOYSTICK/FB_Joystick.st:244 (RawButton AND NOT ArmingPermit)
      action_machine: Refus d armer l homme-mort, consignes à 0 %
      enregistrement: Data.Joystick.ArmingPermitDenied (non relayé vers GVL_IHM)
      visibilite_ihm:
        bandeau_alarme: Aucun
        action_operateur: 'Répète en boucle: [JOYSTICK] Appuyer homme-mort au neutre
          sans expliquer la cause'
        condition_speciale: Aucune
      statut: REFUS_SILENCIEUX_MAJEUR
    - id: D08-06
      nom: Non-respect du maintien homme-mort 100ms
      condition: CODE/D_JOYSTICK/FB_Joystick.st:227 (Relâchement avant DeadmanArmHoldTime)
      action_machine: Annulation de l armement
      enregistrement: Aucun
      visibilite_ihm:
        bandeau_alarme: Aucun
        action_operateur: '[JOYSTICK] Appuyer homme-mort au neutre'
        condition_speciale: Aucune
      statut: CONFORME
    - id: D08-07
      nom: Désarmement par neutre prolongé après délai de grâce
      condition: CODE/D_JOYSTICK/FB_Joystick.st:249 (AtNeutralXY > 3s + 100ms)
      action_machine: DeadmanArmed repasse à FALSE
      enregistrement: State.DeadmanArmed := FALSE
      visibilite_ihm:
        bandeau_alarme: Aucun
        action_operateur: '[JOYSTICK] Appuyer homme-mort au neutre'
        condition_speciale: Aucune
      statut: CONFORME
    - id: D08-08
      nom: Conflit Joystick Maître inactif (TglJoystickMaster=FALSE)
      condition: CODE/H_TREUILS_BENNE/FB_WinchCmdArbitrationM1.st:68 & CODE/I_TRANSLATION/FB_TranslationCmdArbitrationM3.st:89
      action_machine: Manipulateur physique ignoré à 100 %, machine immobile
      enregistrement: Aucun
      visibilite_ihm:
        bandeau_alarme: Aucun
        action_operateur: Affiche à tort [JOYSTICK] Déplacement en cours alors que
          la machine est bloquée
        condition_speciale: Aucune
      statut: ANOMALIE_AFFICHAGE_REFUS_SILENCIEUX
    - id: D08-09
      nom: Asymétrie homme-mort boutons écran (M3 exige Homme-Mort, Treuils non)
      condition: CODE/I_TRANSLATION/FB_TranslationCmdArbitrationM3.st:102 vs CODE/H_TREUILS_BENNE/FB_WinchCmdArbitrationM1.st:121
      action_machine: Bouton écran M3 inopérant sans homme-mort physique maintenu
      enregistrement: Aucun
      visibilite_ihm:
        bandeau_alarme: Aucun
        action_operateur: Aucun message n explique l interdiction de bouger au tactile
        condition_speciale: Aucune
      statut: INCOHERENCE_INGENIERIE_REFUS_SILENCIEUX
    - id: D08-10
      nom: Neutralisation translation M3 par déflexion treuils Y
      condition: CODE/I_TRANSLATION/FB_TranslationCmdArbitrationM3.st:104 (Direction
        Y <> 0)
      action_machine: Translation M3 bloquée à 0.0 %
      enregistrement: Aucun
      visibilite_ihm:
        bandeau_alarme: Aucun
        action_operateur: ABSENT
        condition_speciale: Aucune
      statut: REFUS_SILENCIEUX
    - id: D08-11
      nom: Neutralisation treuils M1/M2 par déflexion translation X
      condition: CODE/H_TREUILS_BENNE/FB_WinchCmdArbitrationM1.st:124 (Direction X
        <> 0)
      action_machine: Treuils M1/M2 bloqués à l arrêt
      enregistrement: Aucun
      visibilite_ihm:
        bandeau_alarme: Aucun
        action_operateur: ABSENT
        condition_speciale: Aucune
      statut: REFUS_SILENCIEUX
    - id: D08-12
      nom: Checklist Dépannage neutre hardcodée hors calibration
      condition: CODE/J_SUPERVISION/FB_TroubleshootingView.st:527-528 (Bornes fixes
        4800..5200)
      action_machine: Aucune
      enregistrement: ST_JoystickChecklist.NeutralXAct/NeutralYAct
      visibilite_ihm:
        bandeau_alarme: Aucun
        action_operateur: Diagnostic checklist faux si neutre réel hors de [4800..5200]
        condition_speciale: Aucune
      statut: ANOMALIE_DIAGNOSTIC
    synthese_device:
      total_defauts_et_interlocks: 18
      conformes: 3
      refus_silencieux: 8
      defauts_morts_ou_orphelins: 4
      anomalies_arbitrage_et_priorite: 3
  D09_BUS_RESEAUX_IO:
    statut: TERMINE
    nom: Bus Réseaux & Modules E/S Déportées
    perimetre: Bus EtherCAT (Master, AC600, COD1, COD2), Bus CANopen (Master, JOY1),
      Heartbeat IHM, 5 Modules WAGO (Local_Digital_IO, VH_0800END, VH_0808ETP, VH_0008ER,
      VH_0008ER_1), AutoReset transitoire
    fichiers_cles:
    - CODE/C_DIAG_RESEAUX/FB_Diag_Ethercat.st
    - CODE/C_DIAG_RESEAUX/FB_Diag_CanOpen.st
    - CODE/C_DIAG_RESEAUX/FB_Diag_IhmHeartbeat.st
    - CODE/C_DIAG_RESEAUX/FB_AutoResetTransientDiag.st
    - CODE/C_DIAG_RESEAUX/E_Diag_State.st
    - CODE/C_DIAG_RESEAUX/ST_Diag_Device.st
    - CODE/M_MAIN/PRG_02_Acquisition.st
    - CODE/M_MAIN/PRG_07_Supervision.st
    - CODE/J_SUPERVISION/FB_Hmi_BannerFormatter.st
    - CODE/J_SUPERVISION/_TYPES/6_DIAG_ET_CHAINES/ST_IOModuleDiag.st
    - CODE/J_SUPERVISION/_TYPES/6_DIAG_ET_CHAINES/ST_NetworkDiagHMI.st
    auditeur: Auditeur Expert Réseaux Industriels & Bus de Terrain
    challenger: Architecte Sécurité Machine ISO 13849 & CI/CD
    defauts:
    - id: D09-01
      nom: Déconnexion / Défaillance coupleur d entrées Local_Digital_IO
      condition: CODE/M_MAIN/PRG_02_Acquisition.st:211 (Local_Digital_IO.GetDeviceState()
        <> DEVICE_STATE.RUNNING)
      action_machine: SafeStop immédiat M1, M2 et M3. Data.DataValid passe à FALSE.
        Risque coupure puissance (PowerCutOff) si M1_ContactorsReleased_DI retombe
        à 0.
      enregistrement: Data.InputModules.LocalDigitalIoOk := FALSE, Data.InputModules.Fault
        := TRUE
      visibilite_ihm:
        bandeau_alarme: '[IO] Defaut module Local IO (DI8/DO8)'
        action_operateur: '[IO] Défaut module E/S - vérifier alimentation/coupleur'
        condition_speciale: Aucune
      statut: CONFORME_AVEC_RESERVE
    - id: D09-02
      nom: Déconnexion / Défaillance module d entrées VH_0800END (Sécurité & Freins)
      condition: CODE/M_MAIN/PRG_02_Acquisition.st:212 (VH_0800END.GetDeviceState()
        <> DEVICE_STATE.RUNNING)
      action_machine: Retombée physique à 0 de EmergencyChainClosed_DI et PowerContactorEngaged_DI.
        Chute brutale de la chaîne AU et ouverture contacteur puissance !
      enregistrement: Data.InputModules.Vh0800EndOk := FALSE, Data.InputModules.Fault
        := TRUE
