  D06_SYNCHRO_M1_M2:
    statut: TERMINE
    nom: Synchronisation Treuils M1/M2
    perimetre: Asservissement ecart, tolerances dynamique/statique, concordance contacteurs,
      maintien inhibition 4s, couplage atomique croise
    fichiers_cles:
    - CODE/H_TREUILS_BENNE/FB_WinchSync.st
    - CODE/H_TREUILS_BENNE/FB_SyncDeviation.st
    - CODE/H_TREUILS_BENNE/FB_SyncContactor.st
    - CODE/M_MAIN/PRG_04_Treuils_Benne.st
    - CODE/M_MAIN/PRG_06_Outputs.st
    - CODE/J_SUPERVISION/FB_Hmi_BannerFormatter.st
    - CODE/J_SUPERVISION/_TYPES/7_COMMUN_CONFIG/ST_SyncCfg.st
    - CODE/J_SUPERVISION/_TYPES/7_COMMUN_CONFIG/ST_SyncState.st
    auditeur: Auditeur Expert Synchro & Levage Lourd Multi-Axes
    challenger: Expert Sécurité Machine ISO 13849 & Régulation
    defauts:
    - id: D06_01
      nom: Alerte ecart synchronisation M1/M2 (Seuil 1 Warn)
      condition: DeltaPosM > CfgSyncToleranceM (3.0m) avec HomedAndReliableM1 et HomedAndReliableM2
      action_machine: Bridage automatique au Palier 1 pour les deux treuils (CommonMaxStepAscent/Descent
        := 1)
      enregistrement: SyncErrorId bit 0 (16#0001), SyncState.SyncDeviationWarn :=
        TRUE
      visibilite_ihm:
        bandeau_alarme: '[SYNC] ErrorID:01 - ecart M1/M2'
        action_operateur: Aucune action specifique (bridage silencieux a palier 1)
        condition_speciale: 'ATTENTION: Synchro bridee (masquee si un bypass actif)'
      statut: CONFORME_AVEC_RESERVE
    - id: D06_02
      nom: Ecart critique synchronisation treuils M1/M2 (Seuil 2 Fault)
      condition: DeltaPosM > CfgSyncCriticalToleranceM (6.0m) filtre 800ms
      action_machine: Defaut cycle auto (AX_STAB). AUCUN SafeStop direct en manuel
        (deconnecte dans PRG_04) !
      enregistrement: SyncErrorId bit 2 (16#0004), Data.WinchSyncError := TRUE
      visibilite_ihm:
        bandeau_alarme: DEFAUT MORT / ORPHELIN (16#0004 non teste dans FB_Hmi_BannerFormatter)
        action_operateur: Aucune action specifique
        condition_speciale: Aucune
      statut: DEFAUT_MORT_ET_MANQUE_SECURITE
    - id: D06_03
      nom: Discordance contacteurs M1/M2 Niveau 1
      condition: Commandes ou contacteurs M1 <> M2 pendant plus de 500ms (hors plongee
        P4/P5)
      action_machine: SafeStop immediat des deux treuils (WinchContactorMismatchLvl1)
      enregistrement: SyncErrorId bit 1 (16#0002), MismatchLevel := 1
      visibilite_ihm:
        bandeau_alarme: '[SYNC] discordance contacteurs M1/M2 -> arret : <contacteur>'
        action_operateur: '[SYNC] Discordance contacteurs M1/M2 - Acquitter SafeStop'
        condition_speciale: Aucune
      statut: CONFORME
    - id: D06_04
      nom: Discordance contacteurs M1/M2 Niveau 2 (Escalade)
      condition: Discordance contacteurs confirmee tenue plus de 3.0s
      action_machine: PowerCutOff materiel immediat via MecaE escalade (bit 13)
      enregistrement: SyncContactorDiag.MismatchLevel := 2, instSafetyWinch.ErrorId
        bit 13 (16#2000)
      visibilite_ihm:
        bandeau_alarme: '[SYNC] discordance M1/M2 persistante -> coupure : <contacteur>'
        action_operateur: Masquee par [SECURITE] Coupure puissance active
        condition_speciale: Aucune
      statut: ANOMALIE_AFFICHAGE
    - id: D06_05
      nom: Maintien inhibition synchro 4s post-benne
      condition: Fin d une action benne, tempo BucketActivityHold de 4.0s active
      action_machine: instWinchSync.Enable coupe a la source, purge des etats synchro
      enregistrement: SyncState.SyncActive := FALSE
      visibilite_ihm:
        bandeau_alarme: Aucun (silencieux)
        action_operateur: Aucune
        condition_speciale: Aucune
      statut: REFUS_SILENCIEUX
    - id: D06_06
      nom: Refus synchro sur offset benne invalide
      condition: instBucket.ActiveOffsetValid = FALSE
      action_machine: SyncOperationPermit = FALSE, refus d activation de la synchro
      enregistrement: SyncState.SyncActive := FALSE
      visibilite_ihm:
        bandeau_alarme: Aucun
        action_operateur: Aucune
        condition_speciale: Aucune
      statut: REFUS_SILENCIEUX
    - id: D06_07
      nom: Blocage atomique croise Both (CoupledBoth)
      condition: Perte de permit sur un treuil en commande couplee
      action_machine: Arret symetrique simultane des deux treuils
      enregistrement: BothBlocked := TRUE, BothBlockReason := COUPLING_BLOCKED
      visibilite_ihm:
        bandeau_alarme: Aucun
        action_operateur: Degrade en [TREUIL] Descente interdite generique (cause
          reelle masquee)
        condition_speciale: Aucune
      statut: ANOMALIE_AFFICHAGE
    - id: D06_08
      nom: Ecart initial excessif au re-accouplement
      condition: Re-selection synchro avec delta physique > 2.5m/6.0m
      action_machine: SafeStop immediat via MecaE ou bridage palier 1
      enregistrement: WinchMxSafety.ErrorMecaE := TRUE
      visibilite_ihm:
        bandeau_alarme: '[M1] ErrorID:13 - MecaE - ecart synchro M1/M2 critique'
        action_operateur: '[PUPITRE] Acquitter SafeStop (sterile sans degagement unitaire)'
        condition_speciale: Aucune
      statut: ANOMALIE_AFFICHAGE
    - id: D06_09
      nom: Soft-stop synchro directionnel unitaire
      condition: _SyncSoftStopEnable actif et ecart > 3.0m en commande unitaire
      action_machine: Blocage de la commande unitaire dans le sens qui aggrave l ecart
      enregistrement: Local interne PRG_04
      visibilite_ihm:
        bandeau_alarme: Aucun
        action_operateur: Aucune
        condition_speciale: Aucune
      statut: REFUS_SILENCIEUX
    - id: D06_10
      nom: Sur-neutralisation synchro par bypass tiers
      condition: Bypasser n importe quel organe sur M1 ou M2 (thermique, contacteur
        feedback)
      action_machine: Force instWinchSync.BypassGlobal et instSyncContactor.BypassGlobal
        a TRUE
      enregistrement: GVL_IHM.M1M2Sync.Bypass.Global := TRUE
      visibilite_ihm:
        bandeau_alarme: Alarmes synchro neutralisees
        action_operateur: Aucune
        condition_speciale: 'ATTENTION: Bypass actif (generique)'
      statut: ANOMALIE_CONCEPTION
    - id: D06_11
      nom: Desynchronisation voulue MAINT_N2
      condition: SelSyncEnable decoche en mode MAINT_N2
      action_machine: SyncActive := FALSE, surveillance ecart desactivee
      enregistrement: SyncState.SyncActive := FALSE
      visibilite_ihm:
        bandeau_alarme: Aucun (nominal)
        action_operateur: Aucune
        condition_speciale: Aucune
      statut: CONFORME
    - id: D06_12
      nom: Neutralisation calcul ecart sur codeurs non fiables
      condition: Perte de HomedAndReliable sur M1 ou M2
      action_machine: DeltaPosM force a 0.0m, bridage automatique Palier 1
      enregistrement: SyncState.DeltaPos_M := 0.0
      visibilite_ihm:
        bandeau_alarme: Aucune alarme synchro
        action_operateur: Aucune
        condition_speciale: Aucune (ecart affiche trompeur a 0.00m)
      statut: ANOMALIE_AFFICHAGE
    synthese_device:
      total_defauts_et_interlocks: 12
      conformes: 2
      refus_silencieux: 4
      defauts_morts_ou_orphelins: 2
      anomalies_affichage: 4
