tée 2026-09-21T10:15:00) MAIS JAMAIS REPORTÉ ICI. CONSÉQUENCE MESURÉE, ET C'EST LA LEÇON : le 2026-09-22, un orchestrateur lisant CE registre (statut en_cours, verdict « lot livré, visas en attente ») face à un arbre sans les 125 lignes a conclu à un EFFACEMENT ACCIDENTEL par écrasement concurrent, a produit une alerte d'incident majeure et a commencé une RÉ-INSERTION du code annulé ; elle a été retirée dès la lecture du contexte du catalogue, dépôt rendu intact, aucun commit (détail dans l'entrée T367-FAUSSE-ALERTE-PERTE-LOT). AUCUN CLOBBER N'A EU LIEU : la seule cause de la divergence registre/code était le revert humain non reporté. RESTE OUVERT APRÈS CLÔTURE — 3 points à arbitrer par l'humain : (a) le gate G521 (écrit POUR ce lot) est ROUGE sur l'arbre réel depuis le revert (mesure DSH01 2026-09-22 : FAIL « bloc des campagnes introuvable ») et constitue le 5e rouge permanent du palier C (G300/G340/G430/G483/G521) : le retirer ou rétablir la fonction ? ; (b) 4 artefacts du lot annulé restent sur disque sans marque d'abandon (TASK_CONTRACT_T367_ACQ_AUTO_BOOT_ET_REARM.yaml, TASK_CONTRACT_T367_REARMEMENT_ACQUITTEMENT.yaml, NOTE_APPLICATION_T367_ACQ_AUTO_BOOT_ET_REARM.md, BRIEF_T367_DIAGNOSTIC_DEFAUTS_BOOT.md) — aucune suppression automatique, nettoyage = décision humaine explicite ; (c) l'entrée T367-ARBITRAGE-DOCTRINE (statut terminé) reste valide sur le fond (séparation acquitter/réarmer = doctrine écrite) mais son arbitrage « canal V2 séquenceur PLC » est TOMBÉ avec la fusion annulée : à requalifier ou archiver. [MAJ DSH01 2026-09-22T04:40 — ARBITRAGE HUMAIN RENDU SUR G521 : RETIRE DE LA SUITE.] Decision explicite de l'exploitant : retirer G521 de la suite de gates parce qu'il garde une fonction ANNULEE — un gate qui ne peut plus jamais passer masque un futur vrai rouge. EXECUTION : la declaration G521 est retiree de TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py (palier C) et remplacee par un commentaire de tracabilite date qui dit POURQUOI il est absent ; contro