- id: "INVESTIG-ETHERCAT-RECOVERY-POWERKEEPALIVE"
  date: "2026-09-02"
  type: "etude"
  priorite: "haute"
  agent_id: "general-purpose (ac40a84c)"
  sujet: "MES: récupération bus EtherCAT à chaud après coupure AU (sans restart froid) + transition propre shunt externe PowerKeepAlive_A/B_RQ"
  statut: "termine"
  livrable: "rapport investigation (transcript sous-agent ac40a84c)"
  verdict: "Sujet 1 EtherCAT: le bouton confirmer est PUR SOFT (FB_Diag_Ethercat, Reset code mort AF-12 §9), ne touche jamais le maître. Restart froid marche car il rejoue la config maitre. Levier applicatif reel = <Maitre>.xRestart (lib IODrvEtherCAT, front) + appel explicite du FB maitre, puis attendre xConfigFinished AND xDistributedClockInSync. ReconfigMaster/RestartBusScan ne sont PAS des API publiques. Sujet 2 shunt PowerKeepAlive: confirme le deadlock (Armable exige EmergencyChainClosed ET NOT PowerContactorEngaged). A et B retombent TOUJOURS ensemble (pas de divergence A/B dans ce code). Maintain_ChainOk s'effondre des que la chaine s'ouvre hors sequence (aucun filtrage) -> auto-entretien de l'ouverture. Etat pas bon = glitch transfert shunt->PLC + latch StartupFail/lockout."
  decision: "Sujet 1: (immediat, sans code) cocher option maitre 'Automatically restart slaves' + verifier que l'energie coupee en emergency ne touche pas le maitre/coupleur. (code C3) FB_Recover_Ethercat sur front bouton IHM BtnEcatRecover, garde par machine-arretee + freins serres + EncoderAvailable regele FALSE (re-homing obligatoire). Sujet 2: (immediat) rearmer le PLC AVANT de retirer le shunt; si bloque: couper puissance, attendre PowerContactorEngaged_DI=FALSE, Reset, armement. (code) sortir EmergencyChainClosed de la condition d'affichage bouton (ArmingCanStart = Idle AND NoLockout AND NOT PowerContactorEngaged AND NOT BtnCutOff AND NOT PowerCutOffRequest) [C2]; + entree ShuntPresent lue par PLC (etat maintien deroge + rearmement explicite au front descendant) [C3] OU mode MES puissance maintenue dedie [C3]; + diagnostic 'perte chaine hors sequence' explicite [C1]. Donnees manquantes: nom noeud maitre EtherCAT, option auto-restart deja cochee?, energie emergency touche le maitre?, le shunt ponte-t-il AUSSI la boucle retour EmergencyChainClosed?, snapshot a l'instant du retrait du shunt."
  note: "Sujet 1: bandeau [ECAT] Defaut bus persiste après retour énergie, bouton confirmer insuffisant, restart froid obligatoire -> chercher IoDrvEtherCAT.ReconfigDevice/RestartBusScan + point d'accroche code (FB_Diag_Ethercat Reset non exploité, AF-12 §9). Sujet 2: switch physique hors PLC shunte PowerKeepAlive_A/B_RQ pour MES; au retrait du shunt perte ChainOk + commande incohérente des sorties maintien -> tracer FB_Safety_EmergencyManagement Maintain A/B + séquence armement, pistes transition propre. Lecture seule + web."

