  sujet: "T367 (C2) - Acquittement AUTOMATIQUE des defauts latches : (a) au demarrage a froid, (b) apres un rearmement AU initie par l'operateur et confirme par le contacteur. Perimetre strict dicte par l'exploitant : aucun nouveau champ, aucune touche a GVL_IHM ni a ses types."
