  verdict: "CONFORMITE DE PERIMETRE VERIFIEE AVANT REDACTION, PUIS CONTRAT ECRIT ET VALIDE. Le design n'exige AUCUN champ nouveau et AUCUNE modification de GVL_IHM ou d'un type : (1) les 4 etats de campagne sont des VAR LOCALES au PROGRAM PRG_07_Supervision (non-RETAIN, donc remis a zero au cold start - exactement ce qu'il faut pour une campagne unique par demarrage) ; (2) la preuve 'geste operateur' s'obtient SANS lire GVL_IHM, via PRG_06_Outputs.EmergencyState (ST_Safety_Emergency_State, deja public : Step / ArmingBusy / ContactorOk) ; (3) le signal de fin de transitoire d'E/S est EXISTANT (PRG_02_Acquisition.st:216 Data.InputModules.Fault, deja consomme par PRG_07:588) ; (4) la porte unique FaultMachineReset_IHM est un VAR_OUTPUT de PRG_07 (PRG_07:18), pas un champ IHM. Le cas d'arret dicte par l'humain ('si ta correction necessite de toucher GVL_IHM ou un type -> STOP et demande-moi') est inscrit comme INTERDIT ABSOLU du scope ET comme devoir d'alerte prioritaire du contrat. PROPRIETE DE SECURITE QUI AUTORISE LE LOT : FB_FaultCore execute le paragraphe 1 (effacement sur Reset, :37-43) AVANT le paragraphe 3 (armement des latches, :60-69) dans le MEME scan => un acquittement automatique est un NO-OP sur une cause encore ACTIVE, il ne peut PAS masquer un defaut persistant ; il n'efface que les artefacts dont la cause a disparu, et il ne contourne aucun interlock (les preconditions d'armement Armable restent la seule autorisation). Cette propriete est verrouillee par le cas TC-T367-103 (cause Active => Fault.Latched reste TRUE apres la campagne)."
  decision: "GO EXPLICITE DE L'EXPLOITANT 2026-09-21, avec perimetre strict dicte verbatim : 'au boot, le defaut (quel qu'il soit) doit etre acquitte automatiquement, sans que j'aie besoin d'appuyer sur le bouton acquittement separement. Rien d'autre ne change - aucun nouveau champ, aucune touche a GVL_IHM/ses types (table figee en ce moment pour livraison collegue). Si ta correction necessite de toucher GVL_IHM ou un type associe, STOP et demande-moi avant.' + 'oui GO mais il faut aussi l'implementer apres le rearmement AU contacteur de puissance'. ARBITRAGES DE CONCEPTION TRACES : (1) campagne de boot = jusqu'a 3 impulsions espacees d'environ 1 s apres la fin du transitoire d'E/S, puis arret DEFINITIF (non-RETAIN => une seule campagne par demarrage a froid) ; (2) campagne de rearmement = GATEE par une sequence d'armement reellement executee (EmergencyState.Step different de 0, ce qui ne peut arriver que sur un front de commande operateur, FB_Safety_EmergencyManagement.st:299) PUIS front ContactorOk - et NON par le seul front du contacteur : motif de securite verifie, le contacteur peut s'engager SANS geste operateur (relacher un AU avec maintien repris, demarrage a chaine fermee avec Maintain_ChainOk = EmergencyChainClosed, bypass MES) ; (3) ECART DE DOCTRINE ASSUME ET TRACE, jamais silencieux : la regle 'appui conscient' (AGENTS.md) et l'ordre AF-01 7.4 'acquitter PUIS rearmer' sont amendes POUR CES DEUX CAS SEULEMENT, sur decision de l'exploitant ; AF-01 n'est PAS modifiee (rien d'autre ne change) et l'ecart est documente dans NOTE_APPLICATION_T367_ACQ_AUTO_BOOT_ET_REARM.md ; (4) acquittement SILENCIEUX assume (aucun compteur, aucun voyant possible sans nouveau champ) => risque residuel trace : un defaut reel mais DEJA DISPARU au moment du boot est efface sans appui conscient."
  note: "COLLISION VIVE PRISE EN COMPTE, REGION DISJOINTE : CODE/M_MAIN/PRG_07_Supervision.st est le fichier le plus dispute du depot (T368/DSH27 y edite la liste d'arguments de instHmiBannerFormatter, T299/CC01 y a un hunk non commite vers :245, T330/DSH06 y a des modifications en vol, T361 y a travaille). Le lot T367 n'ecrit QUE dans la region §1c (acquittement global machine, :118-131) et dans la liste des VAR locales du PROGRAM ; l'edition doit etre CHIRURGICALE et le git diff final doit prouver que les hunks tiers sont INTACTS (AC11 du contrat, preuve exigee). INTERDITS RAPPELES : CODE/J_SUPERVISION/GVL_IHM.st (fige pour livraison collegue), CODE/J_SUPERVISION/_TYPES/** (aucun type IHM), CODE/B_AU_SECURITE/**, DOC/AF/** (doctrine non modifiee), DOC/STDS/**, CODE/L_SIMULATION/** (le banc n'est pas le sujet ici, c'est T300/T328/DSH03 qui le porte), PRJ_CODESYS/**, Device.export ; aucun reset periodique ni en fonctionnement. VERIFICATION MECANIQUE EXIGEE : G200 --report (bloc Auto-verification liaison colle dans la restitution), bundle complet + diff bundle frais, palier C, et git diff --stat VIDE sur GVL_IHM.st, _TYPES/ et B_AU_SECURITE/. AUCUN COMMIT, AUCUN PUSH sans accord explicite distinct du GO. [MAJ DSH26 2026-09-21T09:50 -- LOT LIVRE, NON COMMITE, VISAS EN ATTENTE : statut reel = en_attente (validation humaine), conserve visible car different de termine.] Le perimetre dicte a ete TENU dans les faits, pas seulement promis : git diff --stat VIDE sur GVL_IHM.st, CODE/J_SUPERVISION/_TYPES/ et CODE/B_AU_SECURITE/ (AC8/AC10), CODE/ ne contient que CODE/M_MAIN/PRG_07_Supervision.st pour ce lot plus les 3 hunks tiers preexistants, et le diff reel a ete lu ligne a ligne par l'orchestrateur (3 hunks : VAR/VAR CONSTANT locales, region §1c-1 + §1c-2, et le hunk tiers CycleElapsed_Min/S de instHmiBannerFormatter reste INTACT). Les 5 sources de FaultMachineReset_IHM sont bit-identiques (seul le ';' de la derniere ligne s'est deplace). PREUVES REJOUES PAR L'ORCHESTRATEUR