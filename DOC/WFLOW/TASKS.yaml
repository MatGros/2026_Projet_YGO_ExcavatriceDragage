    montee couplee. Contrainte forte : passer par le VRAI selecteur arbitre (JoystickWinchSelectArbitrated), pas un mecanisme
    parallele. Une fois le mouvement couple lance, ne PLUS recorriger la benne meme si IsOpen/IsClosed est perdu momentanement.
