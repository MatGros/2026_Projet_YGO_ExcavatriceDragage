  titre: MAINT WinchSel=0 + benne auto - ManualBucketLimits (jog M2) fuit dans la phase JOG automatique (palier 1 force + trou permis/IsClosed)
  diagnostic_20260920: 'CAUSE LOCALISEE (CC01, trace 70 + code) : FB_Modes.st:392 force Auth.JoystickWinchSelectArbitrated := 2 pendant la phase JOG benne-auto (WinchSel operateur = 0). PRG_04_Treuils_Benne.st:749-750 calcule ManualBucketLimitsActive := TglManualBucketLimits AND (Arbitrated = 2) -> les bornes JOG MANUEL M2 s''appliquent a la phase AUTOMATIQUE. Effet 1 : M2MaxStep=1 force pendant toute la fermeture (trace 70 t=50133-55264 : SpeedTgt=100, M2_SpeedContactor_1 seul, 1,25 m/s). Effet 2 : ProcessPermitM2_Ascent (PRG_04:769) coupe a Delta >= OffsetCloseM - CloseAnticipationM = 13,8 m alors que FB_Bucket.st:364 IsClosed exige Delta >= OffsetCloseM - CoherenceLimitM = 14,0 m -> trou de 0,2 m comble par la seule inertie (trace 70 t=56372 Delta=13,89 relais M2=0 joystick tire ; t=57780 Delta=14,22 -> BucketSeqSatisfied -> M1+M2). Sur machine chargee / inertie < 0,2 m = blocage franc (symptome 1). Les 8,75 s M2 seul = 6 s palier 1 + 1,4 s trou + rampes. PAS D18 (DirectionChangePending=0 confirme). Pistes : (1) ManualBucketLimitsActive sur JoystickWinchSelectRequest (selection operateur) et non Arbitrated ; (2) gate config CloseAnticipationM <= CoherenceLimitM et OpenAnticipationM <= CoherenceLimitM (CfgFault FB_Bucket) ; (3) libelle IHM honnete. Le symptome DESCENTE interdite en benne intermediaire reste a tracer separement (probablement le meme trou cote ouverture : OpenAnticipationM 1,3 > CoherenceLimitM 1,0).'
  contexte: 'Signale par Mathieu 2026-09-20 (session MAINT_N1, essais D18) : quand un ecart M1-M2 commence a se creer (benne en position intermediaire, ni IsOpen ni IsClosed francs), la descente peut se retrouver interdite, y compris en mode auto benne -- blocage total. Le contournement observe : piloter un peu la benne pour la ramener a un etat FRANC (ouverte ou fermee) la debloque. Suspicion : un permis process (chaine ProcessPermit_Descend / EffectivePermit, cf. NAMING_CONVENTION.md taxonomie D-P1->D-P11) ou une condition de FB_Bucket (IsOpen/IsClosed/IsIntermediate, FB_Bucket.st ~L369-376) exige un etat franc pour autoriser la descente, ce qui bloque le cas normal ou la benne est temporairement en transition. SECOND SYMPTOME APPARENTE (trace 70, 2026-09-20, MAINT_N1 confirme explicitement -- PAS AX10B/SEMI_AUTO) : en pilotage couple (WinchSel=0, "les deux") avec toggle benne-auto actif (Context.TglEnableCoupledBucketSequencing), une demande de MONTEE mesure M2 seul actif (M2_RelayAscent_Close_RQ=1) pendant 8,75s (t=49028->57780ms) avant que M1 ne rejoigne -- D18 M1/M2 (DirectionChangePending/DelayElapsed) reste a 0 tout du long, confirme hors-D18. Code trouve (FB_BucketCmdArbitration.st:54-58 WinchBothAscentBucketCloseArmed ; PRG_04_Treuils_Benne.st:384 WinchBothMotionBlockedByBucket ne couvre QUE le cas descente/WinchBothDiveBucketOpenArmed ; PRG_04:385-388 BucketNotClosedAscentCapStep1 ne prevoit qu''une DEGRADATION PALIER 1 pour la montee, PAS un blocage total de relais) -- INCOHERENCE NON RESOLUE : le code lu ne devrait pas bloquer totalement M1 en montee (seulement degrader la vitesse), mais la trace montre un blocage total du relais pendant 8,75s. Mecanisme exact du blocage total en montee non localise -- a chercher en priorite a la reprise.'
  description: 'Identifier precisement quel permis/interlock exige un etat benne franc pour autoriser la descente, et si cette exigence est justifiee (securite reelle) ou trop stricte (bloque un cas normal de transition). Tracer la chaine complete producteur->consommateur (cf. CODE_QUALITY_STANDARDS.md §3ter) avant tout correctif. Analyse et cadrage uniquement dans un premier temps -- pas de modification de code sans validation.'
  objectifs:
  - 'Identifier le permis/interlock exact qui bloque la descente en position benne intermediaire (nom de variable, fichier, ligne).'
  - 'Determiner si cette exigence "etat franc requis" est une securite documentee/justifiee ou un defaut de conception.'
  - 'Proposer un correctif cadre si defaut confirme, avec analyse de risque (meme methode que T325) avant toute implementation.'
  - 'MAINT WinchSel=0 + benne auto : la phase JOG automatique n''est plus bornee par ManualBucketLimitsActive (ni palier 1 force, ni coupure permis avant IsClosed/IsOpen) -- reactivite identique au jog WinchSel=2.'
  - 'WinchSel=2 operateur : bornes manuelles strictement inchangees (non-regression).'
  - 'Config incoherente (Anticipation > CoherenceLimit) detectee au boot par CfgFault, jamais un blocage silencieux.'
  contrat: DOC/WFLOW/CONTRACTS/TASK_CONTRACT_T327_MANUAL_BUCKET_LIMITS_PHASE_JOG.yaml
  bloque_par: []
