    treuil est possible à pleine vitesse, les protections logicielles de position deviennent inertes, seul le capteur physique
    haut protège. Aucun débridage « capteur TOP haut », aucun interlock « grille levée / trémie pleine » (TremieFull_OR_GateRaised_DI
    déclaré non consommé). Décision métier ISO 13849 requise : bridage progressif vs repos capteur physique assumé. Formulation
    « Homed=TRUE strict » : correcte pour l''anti-collision hauteur M3 et la benne, à NE PAS généraliser — à coupler à un
    bridage vitesse (Homed strict là où la position est critique, bridage sinon, levé si capteur TOP haut).'
