    emet pas dans ce cas (le C++ genere porte `FB.WINCHCFGM1 = WINCHCFG;` sans `s.`). Consequence mesuree sur T341 : 8/21
    tests PASS avec des corrections INVISIBLES (le FB ecrivait dans sa copie privee) — les cas `aucune correction attendue`
    etaient des faux verts. Le post-traitement retourne silencieusement False et le runner d origine est utilise : AUCUNE
    trace, aucun avertissement. (2) STruCpp v0.6.2 SUPPRIME silencieusement les ASSERT_* places dans le corps d une boucle
    FOR : verifie dans le C++ genere du test TC-P10-066 de T341 (`ctx.assert_near` absent du corps du `for`), le test etait
    declare PASS sans aucune assertion executee.'
  description: 'Rendre ces deux pieges IMPOSSIBLES a ignorer : (a) inject_var_in_out_copyout.py doit reconnaitre les deux
    formes de copy-in (`s.FB.X = s.Y;` ET `FB.X = Y;`) et, quand une VAR_IN_OUT du FB teste est passee par le test SANS copy-out
    injectable, ECHOUER BRUYAMMENT (ou emettre un avertissement bloquant) au lieu de retourner False silencieusement ; (b)
    detecter toute assertion situee dans le corps d une boucle (FOR/WHILE/REPEAT) dans un fichier de test CI et la REFUSER,
    ou la faire remonter par STruCpp — un test qui n execute pas ses assertions ne doit jamais etre compte PASS. Prevoir un
    garde-fou executable (selftest avec jeux violants) et verifier la non-regression des suites existantes qui utilisent VAR_IN_OUT
    (FB_Bucket, FB_Joystick, FB_WinchSpeedLearning, FB_Sim_Encoder).'
  objectifs:
