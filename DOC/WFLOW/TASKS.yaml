    de labsence de borne : cette branche force M2_ReqDescend a FALSE et ne commande que la montee, donc une borne DIRECTIONNELLE
    est sans effet sur elle — contrainte neuve : la borne ne doit jamais inhiber le sens allant vers la cible. ARBITRAGES
    BLOQUANTS OUVERTS (arret volontaire avant toute ecriture de code) : Q1 ancrage de la borne — (a) M2StartPosM plus ou moins
    une marge comme l ancien code, ou (b) frontiere reelle de l etat oppose avec CoherenceLimitM, formule deja en production
