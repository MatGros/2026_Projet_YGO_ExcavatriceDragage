  contexte: 'DEUX defauts d outillage decouverts pendant T341, tous deux produisant des tests VERTS alors qu ils ne verifient
    rien (fausse couverture silencieuse). (1) TOOLS/COMPILER_ST2C_STruCpp/inject_var_in_out_copyout.py ne fait RIEN quand
