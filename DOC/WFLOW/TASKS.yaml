    \ - warn non bloquant si |Delta - ActiveOffsetM| >\n  CoherenceLimitM pendant 2 s -> \"reconfirmer position benne\".\n\
    - FB_Bucket §1 : OffsetMaxFault borne basse = OffsetOpenM - CoherenceLimitM\n  (au lieu de CablePosM1 sec) + latch seulement\
