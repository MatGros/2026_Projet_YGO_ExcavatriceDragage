    (mesure DSH01 : 0) => AUCUNE cause de ce nom n existe dans le code. LE CAS EST EXIGE, ET EN C4 IMMEDIAT : DOC/WFLOW/AUDITS/AUDIT_29_CAS_LIMITES_SECURITE_AF_20260829.md:100
    ecrit « C4 immediat : CAS-001 (retombee contacteur en marche), CAS-002 (AU pendant transition) » ; DOC/WFLOW/AUDITS/DESIGN/PLAN_GEL_TREUIL_T181_v0.1.md:79
    liste « T180 | C4 | Audit 29 cas limites securite (2 C4 : chute de charge) | Vecteurs T181-00 croises avec les CAS-xxx
    (au moins CAS-001 retombee contacteur en marche, CAS-012 = T175) ». TRACABILITE CASSÉE, MESUREE : T180 n a AUCUNE entree
