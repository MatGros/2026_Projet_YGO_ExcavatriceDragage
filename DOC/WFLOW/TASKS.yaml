  contexte: 'Commit 2a307b5b (2026-09-05, "suppression des coupures parasites LeftStartSinceArm") a retire les 2 branches
    d arret sur retour a M2StartPosM apres manoeuvre engagee, sans documenter le symptome exact ni arbitrer une alternative.
    Releve par l audit CI T339 (2026-09-20) : sous fermeture/ouverture engagee, aucune borne de recul ne subsiste (seule la
    cible finale OffsetCloseM/OffsetOpenM arrete le mouvement). LeftStartSinceArm reste affecte (FB_Bucket.st:560-561) mais
    jamais relu (code mort). Decision utilisateur 2026-09-20 : restaurer une borne correcte (pas de retour a l ancien defaut).'
  description: 'Diagnostiquer la cause exacte des coupures parasites d origine (hypothese : egalite stricte sur retour a M2StartPosM
    sans marge, sensible au bruit/bagotement de mesure) avant tout code. Concevoir puis implementer une borne de recul (fermeture
    ET ouverture, symetrique) qui protege la machine sans reproduire le defaut. Ne pas inventer de valeur de marge sans base
    documentee — demander a l utilisateur si non deductible du code existant (ex. Config.CloseAnticipationM reutilisable ?).
    Purger ou reutiliser LeftStartSinceArm selon la solution retenue.'
  objectifs:
  - Diagnostic ecrit et prouve de la cause des coupures parasites d origine, avant toute ecriture de code.
  - Borne de recul restauree sur FB_Bucket.st, symetrique fermeture/ouverture, sans faux declenchement demontre par test CI
    rouge->vert.
  - LeftStartSinceArm purge ou reellement reutilise, plus de variable a moitie morte.
  - Bundle + diff bundle + G200 + gates palier C avant restitution.
