  contexte: 'Demande utilisateur (2026-09-03) : retirer la temporisation de référencement CST_PresetVerifyTime (500 ms) dans
    FB_Encoder_Homing.st. Analyse : ce n''est PAS un simple retrait de constante — c''est la latence de sécurité transactionnelle
    qui laisse le codeur appliquer physiquement le preset avant la relecture de vérification (ReadbackOk). La retirer sans
    refonte risque de valider Calib.Homed sur une position non encore appliquée (référence erronée). Zone liée au bug homing
    M2 « benne fermée » (M2 reste à 8.5 m, cf. T213).

    '
