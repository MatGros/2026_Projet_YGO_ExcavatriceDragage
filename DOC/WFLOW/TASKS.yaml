    l''origine du chiffre 400 est inconnue, et l''asymétrie déclarée (descente non limitée) n''est ni justifiée ni vérifiable.
    En parallèle, le thermique moteur est uniquement subi (retours matériels M1ThermalOk / M2ThermalOk câblés, latchés, affichés)
    : aucun compteur de démarrages, aucune limitation de cadence, aucun modèle thermique logiciel. Or en SEMI_AUTO la cadence
    de cycle est fixée par le programme.'
