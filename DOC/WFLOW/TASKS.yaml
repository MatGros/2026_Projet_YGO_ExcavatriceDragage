  titre: 'FB_FbStatus : fault latché perdu (silencieus...'
  contexte: 'Intitulé complet : FB_FbStatus : fault latché perdu (silencieusement) sur un cycle Enable=FALSE→TRUE sans Reset
    | Audit indépendant 2026-08-22 (test_auto_ci + revue sécurité machine, sur CODE/A_COMMUN/FB_FbStatus.st, en cours de développement
    par un autre agent — pas de code touché ici). '
  description: '**Constat** : le gate IF NOT Enable THEN ... ErrorIdLatched := 0; ... END_IF; (§1, ~ligne 55) remet la mémoire
    de défaut latché à zéro dès que Enable repasse à FALSE, **sans passer par un front Reset explicite**. Ça viole l''esprit
    \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"Reset
    = front conscient, jamais de réarmement/acquittement accidentel\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"
    (AGENTS.md). Scénario concret : un fault latché sur un FB standard (ex. futur treuil) ; l''opérateur change de mode ou
    un re-init logiciel fait retomber Enable un cycle puis remonter ; le fault disparaît de l''IHM sans qu''aucun Reset n''ait
    été appuyé → perte de traçabilité d''un défaut réel, l''opérateur croit la machine saine. <br>**Décision utilisateur (2026-08-22)**
    : la mémoire du dernier défaut latché **ne doit pas** être remise à zéro par Enable=FALSE — seul un front Reset explicite
    doit acquitter. <br>**Correctif proposé** : retirer ErrorIdLatched := 0; de la branche IF NOT Enable THEN dans FB_FbStatus.st
    §1 — le reste du gate neutre (façade Status.Error/ErrorId à 0 tant que Enable=FALSE) peut rester tel quel, seule la mémoire
    interne doit survivre au cycle désactivé. <br>**Doc à mettre à jour en parallèle** (DOC/STDS/CODE_QUALITY_STANDARDS.md
    §3bis) : documenter explicitement ce comportement (Enable=FALSE ne doit pas acquitter, seul Reset le fait) — actuellement
    non écrit nulle part (ni code ni standard) : trou d''audit distinct de l''ambiguïté elle-même. <br>**Autres trous identifiés
    dans le même audit (non bloquants, à trier séparément si besoin)** : cumul de 2 bits latchés jamais testé, priorité d''affichage
    texte fault vs warning simultanés non tranchée, standard CODE_QUALITY_STANDARDS.md décrit une \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"rotation
    d''affichage 1s\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"
    que le code n''implémente pas (§3bis, à corriger ou implémenter), Busy/Done \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"hors
    socle\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"
    non documenté dans le standard, WarningIdCause cité dans le standard mais absent de l''interface réelle (coquille).'
  contrat: DOC/WFLOW/CONTRACTS/TASK_CONTRACT_T147_RETRO.yaml
