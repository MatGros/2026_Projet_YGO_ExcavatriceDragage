  titre: Meca DriftGuard se déclenche au référencement sans mouvement
  domaine: Projet / Sécurité / Simulation
  criticite: C4
  statut: ⬜
  agent: —
  locked_at: ''
  updated_at: '2026-08-22T21:05:00'
  completed_at: ''
  bloque_par: []
  contrat: ''
  description: '**Identification (2026-08-20)** : à l''appui du bouton de référencement
    M2 (benne ouverte/fermée) ou M1 (codeur), **sans mouvement**, MecaA se déclenche
    via DriftGuardA.Violation → PowerCutOff → contacteur coupé → mode DISABLE. Le
    bypass MecaA (IHM) permet le référencement. <br>**Cause probable** : InReferencingMode
    := instHomingM2.Busy (PRG_04 l.736) mal synchronisé — DriftGuardA armé (NOT InReferencingMode,
    FB_Safety_Winch l.283) au moment de l''appui → détecte une dérive transitoire.
    **L''ErrorId n''est pas conservé** (défaut de conception) → cause invisible au
    snapshot. <br>**Solution proposée** : ① vérifier/corriger la synchro InReferencingMode
    pendant le référencement ; ② conserver l''ErrorId (latch cause) jusqu''au Reset
    pour rendre la cause visible. <br>🔗 **Intégré à T137 (2026-08-20)** : le correctif
    définitif (conservation ErrorId + interface ST_FbStatus) sera porté par la migration
    FB_Safety_Winch/FB_Safety_Translation→ST_FbStatus. Correctif minimal proposé :
    Enable := TRUE (surveillance permanente) sur les 3 FB safety. <br>**Session 2026-08-21
    — cause racine CONFIRMÉE** : le « Meca à l''arrêt » (M1/M2) vient d''une **course
    temporelle** entre l''**armement instantané** (contacts/frein échos de commande
    sim) et la **fenêtre de mesure vitesse 50 ms** (FB_Encoder_SpeedMeasure) → MeasuredSpeedMps
    > 0,02 ~50 ms après l''arrêt → faux Meca bit7. Même famille pour NoMovement (bit15,
    vitesse < 0,02 pendant commande). **Correctifs appliqués & commités** : ① TON
    arrêt confirmé 100 ms avant d''armer la détection de vitesse Meca (FB_Safety_Winch)
    ; ② Reset effectif en DISABLE (efface la cause même en mode neutre → réarmement)
    ; ③ SimulationBypassActive étendu aux bypass **Safety+Process** M1/M2 (banc).
    ⏳ **Référencement toujours à investiguer** (synchro InReferencingMode).'
