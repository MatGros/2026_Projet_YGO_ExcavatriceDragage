    n''est pas affectée (basée sur le booléen Error, pas la valeur brute du bit). Correction proposée : bit6 = 16#0040, masque
    effacement 16#FFBF. Couverture CI actuelle (test_fb_diag_ethercat.st) insuffisante pour détecter ce type de bug (aucune
