  - id: "T147"
    parent_id: ""
    statut: "⬜"
    criticite: "C4"
    domaine: "SÉCURITÉ"
    agent: "—"
    date: "2026-08-22T12:00:00"
    titre: "FB_FbStatus : fault latché perdu (silencieus..."
    contexte: "Intitulé complet : FB_FbStatus : fault latché perdu (silencieusement) sur un cycle Enable=FALSE→TRUE sans Reset | Audit indépendant 2026-08-22 (test_auto_ci + revue sécurité machine, sur CODE/A_COMMUN/FB_FbStatus.st, en cours de développement par un autre agent — pas de code touché ici). "
    description: "**Constat** : le gate IF NOT Enable THEN ... ErrorIdLatched := 0; ... END_IF; (§1, ~ligne 55) remet la mémoire de défaut latché à zéro dès que Enable repasse à FALSE, **sans passer par un front Reset explicite**. Ça viole l'esprit \"Reset = front conscient, jamais de réarmement/acquittement accidentel\" (AGENTS.md). Scénario concret : un fault latché sur un FB standard (ex. futur treuil) ; l'opérateur change de mode ou un re-init logiciel fait retomber Enable un cycle puis remonter ; le fault disparaît de l'IHM sans qu'aucun Reset n'ait été appuyé → perte de traçabilité d'un défaut réel, l'opérateur croit la machine saine. <br>**Décision utilisateur (2026-08-22)** : la mémoire du dernier défaut latché **ne doit pas** être remise à zéro par Enable=FALSE — seul un front Reset explicite doit acquitter. <br>**Correctif proposé** : retirer ErrorIdLatched := 0; de la branche IF NOT Enable THEN dans FB_FbStatus.st §1 — le reste du gate neutre (façade Status.Error/ErrorId à 0 tant que Enable=FALSE) peut rester tel quel, seule la mémoire interne doit survivre au cycle désactivé. <br>**Doc à mettre à jour en parallèle** (DOC/STDS/CODE_QUALITY_STANDARDS.md §3bis) : documenter explicitement ce comportement (Enable=FALSE ne doit pas acquitter, seul Reset le fait) — actuellement non écrit nulle part (ni code ni standard) : trou d'audit distinct de l'ambiguïté elle-même. <br>**Autres trous identifiés dans le même audit (non bloquants, à trier séparément si besoin)** : cumul de 2 bits latchés jamais testé, priorité d'affichage texte fault vs warning simultanés non tranchée, standard CODE_QUALITY_STANDARDS.md décrit une \"rotation d'affichage 1s\" que le code n'implémente pas (§3bis, à corriger ou implémenter), Busy/Done \"hors socle\" non documenté dans le standard, WarningIdCause cité dans le standard mais absent de l'interface réelle (coquille)."
    contrat: ""
    objectifs: []
    bloque_par: []

  - id: "T148"
    parent_id: ""
    statut: "⬜"
    criticite: "C4"
    domaine: "SÉCURITÉ"
    agent: "—"
    date: "2026-08-22T12:00:00"
    titre: "FB_FbStatus : Reset simplement MAINTENU (san..."
    contexte: "Intitulé complet : FB_FbStatus : Reset simplement MAINTENU (sans nouveau front) + disparition de la cause pendant ce maintien = acquittement silencieux | Découvert en écrivant les tests étendus test_fb_fbstatus.st (2026-08-22) — même famille que T147, faille distincte (pas de code touché, TOOLS/ uniquement). "
    description: "**Constat** : ResetEdge(CLK:=Reset) ne (re)vide ErrorIdLatched qu'au **front montant** de Reset — mais rien n'empêche ce vidage de se produire alors que la cause brute (FaultCause) est **encore active** à cet instant précis (le test TC \"Reset ne doit pas acquitter tant que la cause persiste\" ne le voit pas car il ne teste qu'1 seul cycle : Error reste bien TRUE cette scan-là grâce à l'union sur la cause brute, pas grâce au latch). Séquence qui casse la garantie : Reset **maintenu à TRUE** plusieurs scans pendant que la cause est active (le latch est vidé au 1er front et jamais réarmé, faute de nouveau front FaultEdge puisque la cause reste constante) → si la cause **disparaît** À CE MOMENT-LÀ (Reset toujours haut, donc **aucun nouveau front Reset**), Error retombe silencieusement à FALSE — sans confirmation opérateur au moment réel où le défaut se résout. <br>**Scénario concret** : opérateur bloque/maintient le bouton Reset (bouton collé, séquence auto qui garde Reset actif) pendant qu'un défaut réel est encore présent ; le défaut se résout tout seul (cause disparaît) pendant ce maintien → l'IHM efface le défaut sans qu'aucun nouveau geste conscient n'ait eu lieu à l'instant de la résolution. Prouvé par test (TOOLS/TEST_AUTO_CI/RESULTS/A_COMMUN/tests/test_fb_fbstatus.st, test *\"Reset MAINTENU plusieurs scans...\"*), comportement actuel documenté dans le test, pas un choix de spec validé. <br>**Piste de correctif à trancher** (pas encore décidée) : ne vider ErrorIdLatched sur le front Reset que si FaultCause = 0 à cet instant (sinon ignorer le front tant que la cause est active), pour que seul un **nouveau** front Reset survenant **après** disparition de la cause puisse acquitter — cohérent avec le test déjà existant \"Reset ne doit pas acquitter tant que la cause persiste\" mais étendu à Reset maintenu. À trancher avec la même décision de spec que T147."
    contrat: ""
    objectifs: []
