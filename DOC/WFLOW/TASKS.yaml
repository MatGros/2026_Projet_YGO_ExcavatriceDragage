  avancement_phase2: 'GO CC01 2026-09-20 : verdict de la PHASE 1 ACCEPTE (verifie sur 3 points durs : verrou d arret de l axe, asymetrie AX14, front montant seul du decodeur). Etape en cours = CAMPAGNE DE TRACE 10 ms selon le protocole A/B/C. (1) CONTRAT C3 CREE — le constat A01 de la fiche est leve : DOC/WFLOW/CONTRACTS/TASK_CONTRACT_T334_AUTO_CYCLE_M3_OVERSHOOT.yaml, check_task_contract.py PASS (0 erreur, 0 avertissement), 10 criteres AC1-AC10 dont les 2 criteres structurels exiges par le gate T8 pour toute ecriture CODE/M_MAIN, 6 questions Q1-Q6 a trancher avant code, contrat de conservation et interdits des chantiers concurrents. (2) CAMPAGNE DE TRACE RENDUE TURNKEY : DOC/WFLOW/CONTRACTS/PROCEDURE_TRACE_T334_M3_DEUX_CHEMINS.md — liste des canaux a copier telle quelle (7 groupes A a G), reglage de trace MainTask 10 ms avec repli en 3 sous-traces si buffer limite, 3 scenarios A (cycle nominal) / B (cycle + intermittence capteur ~1 s) / C (MAINT manuel, geste identique), matrice de decision signature vers hypothese, post-traitement trace_to_csv.py, interdits. LE RUN RESTE HUMAIN (CODESYS) : l agent ne peut pas executer une trace PLC. (3) 3 FAITS MESURES integres a la fiche : les internes d instance par chemin pointe, imbriques compris, SONT tracables (releve trace_treuils_charge_v1.txt) donc la preuve de H2 est techniquement possible ; Suivi_Cycle_M3_20260906_49.trace est a dt median 100 ms (77 a 128 ms) avec 15 canaux sans jeton ni interne d axe ; les traces SIMU_MaintMANU_20260919 ne contiennent AUCUNE variable M3, donc la comparaison manuel contre cycle n existe pas au depot. (4) LIEN H1 vers T287 note dans la fiche : meme lieu (arrivees Tremie ET P1), meme signal d entree (rebond capteur ~1 s), meme verrou de preuve (aucune trace 10 ms) ; la campagne trace explicitement les canaux frein et coupure dure pour que le porteur read-only de T287 reutilise la trace. Aucune correction de T287 dans ce lot. (5) PROCHAINE ETAPE : run de trace humain, puis analyse canal par canal (section 9 de la fiche), puis arbitrage Q1-Q6, puis PHASE 2 (conception). ARRET DE L AGENT : zero fichier CODE/, zero test, zero gate, zero commit.'
  arbitrage_q1_q6: 'ARBITRAGE PHASE 2 RENDU le 2026-09-20 par DSH07, ZERO code — livrables : DOC/WFLOW/CONTRACTS/PLAN_T334_PHASE3_AUTORITE_ARRET_AXE.md (7 invariants, lots L0 a L4 sequences, AC11 a AC16, alertes Q7/A13-A18, 5 decisions humaines D1 a D5) + bloc decisions Q1 a Q6 du contrat C3 (check_task_contract.py PASS 0 erreur / 0 avertissement) + 2 citations du contrat parent corrigees. Q1 (autorite de l arret) OUI : le verrou appartient a l AXE (FB_Translation.st:179-183), arme par la SEULE detection d arrivee et JAMAIS leve par la perte de la demande ; relachement inchange (demande de sens inverse seule, :202-204) ; effet = H1 neutralise a la racine, le terme ArrivalLock maintenant la rampe a 0 (:251) meme si le demandeur recree sa demande. Q2 (cible) NON : la cible d etape reste la cible d arrivee en SEMI_AUTO ; la faire suivre le sens en AX2 detruirait le chemin de recuperation de depassement documente (FB_CycleSemiAuto.st:905-906 + branche :1549-1557 WT, jeton P1 arme sur les DEUX fronts de son capteur). Q3 (retrait de demande) OUI option (a) : le demandeur conserve demande ET cible jusqu a ArrivalLock + arret physique confirme ; option « la barriere commande l arret » REJETEE (duplication du producteur d arret, AF_Partie-02:502). Q4 (bypass) OUI : garde de mode au point de CONSOMMATION (PRG_05:468 et :571), doctrine MAINT_N2 (ST_BypassTranslation.st:4-5) ; PRG_07 (interdit au contrat) non touche, la garde rend inoffensive la restauration RETAIN (:336-346). Q5 (escalade butees) HORS LOT : FB_Safety_Translation.st interdit au contrat ; ecart confirme et chiffre — spec AF_Partie-11 v2.4:346-351 (0 / 2,5 s / 5 s) vs code :202 (1,5 s) et :268 (PowerCutOff immediat des que le bit 6 est actif). Q6 (config morte _TranslationAutoSpeedCap_Pct) HORS LOT + recommandation SUPPRIMER (0 lecteur, GVL_PERSISTENT.st:97, alors que le cycle commande 100 % fixe). LOT PHASE 2 « uniformiser AX2/AX14 sur AX3 » DEFINITIVEMENT ARRETE : challenge §10bis MAJOR, mecanisme confirme sur le code — TranslationStopTimer exige 500 ms CONTINUS de jeton d arret (FB_CycleSemiAuto.st:334-338) alors que le re-armement de la demande est IMMEDIAT (:913) par des permis qui n exigent PAS le neutre (:716-717) => sous capteur qui rebondit la transition ne peut JAMAIS s armer et le chariot peut ramer indefiniment : le retour au neutre etait la SEULE soupape. Les gardes :718 (JoystickPushOnly) et :1395 WT (NOT JoystickDeflected) RESTENT EN PLACE (ne pas defaire T319 sans garde equivalente). PREALABLE DE TRACABILITE NON LEVE : FB_CycleSemiAuto.st porte une edition non committee de T331/DSH09 (+4 lignes au-dela de :1224, ecriture 18:13:32) et reste sous VERROU D ECRITURE T331 => le lot sequenceur L2 est BLOQUE et une revision doit etre figee avant le premier diff de CODE/. Ordre impose par la preuve : L0 prouver (trace 10 ms, run humain) -> L1 l axe possede l arret -> L2 le demandeur s aligne -> L3 sort du neutre (optionnel, conditionne a L1+L2 prouves). Decisions humaines ouvertes avant L1/L2 : D1 garde de mode des bypass, D2 config morte supprimer ou reactiver, D3 coupure dure Tremie contre arrivee nominale (nouvelle question Q7, a trancher sur trace), D4 abandon de l uniformisation du neutre, D5 sequencement apres liberation du verrou T331.'
  avancement: 'ETAPE 1 (ANALYSE) LIVREE par DSH07 (tag verifie dans TASK_LOCKS.json : DSH01..DSH06 pris/contamines, DSH07 pris). Fiche DOC/WFLOW/TROUBLESHOOTING/FICHES/TROUBLESHOOTING_T334_M3_DeuxChemins_2026-09-20.md. RESULTAT PRINCIPAL : la premisse "deux voies vers l axe" est FAUSSE au niveau de l axe -- FB_Translation est appele une seule fois (PRG_05:537), l arbitre FB_TranslationCmdArbitrationM3 est unique (PRG_05:363), la barriere FB_TranslationOutputInterlock est unique (PRG_06:434-451), les mots variateur sont uniques (PRG_06:457-459) : les deux demandeurs CONVERGENT avant l axe. La divergence reelle porte sur la PROPRIETE DE L ARRET : en manuel l arret est un verrou LATCHE dans l axe (FB_Translation.st:180,192,196 ; relache seulement par demande de sens inverse :202-204) ; en cycle c est le RETRAIT DE LA DEMANDE par le sequenceur (FB_CycleSemiAuto.st:899 AX2, :1386 AX14), donc RE-ARMABLE par un rebond capteur. VERDICT : ANOMALIE PARTIELLE -- separation des sources OBLIGATOIRE et conforme (AF_Partie-04:179, AF_Partie-02:220) ; duplication de la fonction d arret NON conforme (AF_Partie-02:502 "une commande unique par mouvement" ; CODE_QUALITY_STANDARDS §5 producteur unique). 2 chaines relevees fichier:ligne : MANUELLE 66 lignes (M01-M66), CYCLE AUTO 35 lignes (C01-C35). 10 divergences sourcees (dont : cible d arret FIGEE par l etape FB_TranslationCmdArbitrationM3.st:65 au lieu de suivre le sens -- contredit ses propres commentaires FB_CycleSemiAuto.st:905-906 et PRG_05:404-407 ; asymetrie AX2 PositionTgt=3 conserve :900 vs AX14 PositionTgt=0 :1387 ; SpeedPct=100 fixe :74 alors que _TranslationAutoSpeedCap_Pct 40% GVL_PERSISTENT.st:97 n a AUCUN lecteur ; bypass FdC non filtre par le mode PRG_05:571 + restaure au boot PRG_07:230-235, alors que la doctrine dit MAINT_N2 uniquement). CONDITION D ARRET ABSENTE EN CYCLE : la cible capteur + debounce 100 ms n aboutit PAS en AX14 (PositionTgt remis a 0 a l arrivee -> cible FALSE car ReqTremie deja retire, PRG_05:427)