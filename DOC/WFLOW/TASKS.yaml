    CC01=T299/T340/T341, AGY01=T291-B ; lentree T346 portait agent em-dash = verrou libre). PHASE 1 DIAGNOSTIC LIVREE 2026-09-20T22:34
    (NON COMMITEE, ZERO fichier CODE/ modifie, aucun bundle) : DOC/WFLOW/AUDITS/DESIGN/DIAGNOSTIC_T346_BORNE_RECUL_2026-09-20.md.
    Methode : lecture de la version REELLE davant le commit par git show 2a307b5b^ et non de la citation du brief. CINQ DEFAUTS
    PROUVES, chacun avec fichier:ligne, dans les 2 versions : (D1) REFERENCE MOBILE — BusyEdge est keye sur (CloseReq OR OpenReq)
    AND MotionRequestActive SANS clause NOT Lifecycle.Busy (pre-commit :422, aujourdhui :494) donc un relachement/repompage
    du joystick en pleine manoeuvre recree un front et RECAPTURE M2StartPosM a la position courante ; (D2) le meme front remet
    LeftStartSinceArm a FALSE (pre-commit :428-429, aujourdhui :501) donc la borne se re-arme au scan suivant des +1 increment
    et SUIT le pompage, sans aucune marge ; (D3) comparaison brute sans anticipation (pre-commit :491 et :516) alors que les
    arrets nominaux utilisent CloseAnticipationM/OpenAnticipationM (aujourdhui :566 et :592) ; (D4) COUPE NON RECUPERABLE
    — la branche pose CloseReq a FALSE et Done a TRUE alors que MotionRequestActive reste TRUE (plus aucun front possible)
    et CloseReq/OpenReq ne se reposent QUE par CmdClose_IHM/CmdOpen_IHM sous NOT Busy AND NOT M1_Busy AND NOT M2_Busy, donc
    l operateur est VERROUILLE jusqua reappui du bouton IHM ; (D5) falsification detat — BucketState.IsOpen/IsClosed reecrits
    depuis WasOpenAtStart/WasClosedAtStart alors que M2 a physiquement bouge, contredisant le classement continu sur la mesure
    impose par T247. HYPOTHESE DE DEPART DU BRIEF DECLAREE INSUFFISANTE : le bagotement/bruit de mesure autour de M2StartPosM
    nest que D3 ; le moteur dominant est D1, et une simple hysteresis autour de M2StartPosM ne corrigerait donc PAS le defaut.
    Le geste declencheur est documente sur site : CHALLENGE_T175-01_02_M2_BUCKET_SAFETY.md:51 (constat F06, relachement joystick
    a mi-close). SEULE BORNE SUBSISTANTE : le timeout CfgTimeoutDuration 60 s (FB_Bucket.st:239-260 -> :294-295 -> SevereError
    :414) = defaut machine + Reset, ce qui nest pas une borne de recul. NETTOYAGE PLUS INCOMPLET QUE LE BRIEF NE LE DIT :
    6 variables mortes dans FB_Bucket.st, pas 4 — outres LeftStartSinceArm (:130), M2StartPosM (:127, chaine morte), WasOpenAtStart
    (:128) et WasClosedAtStart (:129), la mesure a revele BandLatchConcord (:115) et StateOffsetM (:116), cette derniere documentee
    comme reference du FILET 5a, donc un filet de securite disparu sans nettoyage. Ces 2 dernieres sont HORS du commit 2a307b5b
    et remontees separement. REPONSES AUX QUESTIONS DE CHALLENGE DU BRIEF : (1) TC-P10-029.1 (test_fb_bucket.st:551-635) est
    la bonne base rouge->vert, avec 2 reserves — son scan 6b assere la RESTAURATION DETAT (= D5, a ne pas satisfaire mais
