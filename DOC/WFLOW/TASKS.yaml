  titre: 'T306 phase 2 - CORRECTIFS SECURITE (1 seul lot C4) : bypass PhaseRotation NON GATE MAINT_N2 sur 3 axes + masquage par BypassProcess [BLOCK], puis SafeStop INERTE a la barriere finale M3 [MAJOR]'
  contexte: 'ISSU DU CHALLENGE EXPERT (orchestrate, run 2026-09-22, 3 audits + 2 revues). ECART B = BLOCK, gravite la plus elevee : BypassPhaseRotation est cable BRUT sur GVL_IHM en PRG_04_Treuils_Benne.st:984 (M1) et :1050 (M2) - commentaire :970 « SANS gate de mode (derogation MES 2026, tous modes) » - et en PRG_05_Translation.st:496 (M3) alors que le bypass VOISIN est gate : PRG_05:500 BypassLimitSwitch := M3_MaintN2 AND (...) avec M3_MaintN2 defini :462 = (Auth.Mode = E_Mode.MAINT_N2). CONSEQUENCE PHYSIQUE : un defaut de rotation de phases (inversion ou perte de phase => sens/vitesse errones => charge non maitrisee sur un axe porteur) est TOTALEMENT MASQUE en PRODUCTION (SEMI_AUTO/AUTO) - aucun arret exige. FINDING SUPPLÉMENTAIRE DU CHALLENGE, que ni la phase 0 ni l orchestrateur n avaient vu : gater le seul BypassPhaseRotation serait INCOMPLET et creerait une FAUSSE ASSURANCE, car FB_Safety_Winch.st:302 et FB_Safety_Translation.st:140 ecrivent IF NOT (BypassProcess OR BypassPhaseRotation) AND NOT PhaseRotationOk THEN - donc BypassProcess SEUL leve aussi la protection de phase (et BypassProcess inclut le bypass commun SlackCable, PRG_04:974/:1042). DEROGATION MES 2026 : REELLE et VERIFIEE (commit cac7387d du 2026-09-02 « feat(safety): DEROGATION MES - bypass treuil M1/M2+benne sans gate de mode [NON TESTE] », documentee DOC/AF/AF_Partie-05_Modes_Maintenance_v2.1.md:179-192 : « ecart assume vis-a-vis de la Directive Machines / ISO 13849 ... A revoir une fois la MES stabilisee »), TEMPORAIRE, [NON TESTE], non conforme ISO 13849, et de perimetre etroit (bypass comm/position non critiques) - elle NE JUSTIFIE PAS de laisser la protection ROTATION DE PHASES neutralisable en production. Le gate G483_check_bypass_matrix_mode_gated.py est ROUGE a ce jour. ECART A = MAJOR (nuance importante du challenge, plus juste que « aucun arret ») : SafeStop est declare en VAR_INPUT de CODE/I_TRANSLATION/FB_TranslationOutputInterlock.st:15 et JAMAIS lu dans le corps (:69-156), alors qu il est cable en entree (PRG_06_Outputs.st:438). M3 s arrete TOUJOURS via la rampe de FB_Translation (PRG_05:575 instTranslationM3.SafeStop := M3_SafeStop_Aggregate, agregation :511-512, permis effectifs retires :541-547) : le defaut n est donc PAS « aucun arret » mais une PERTE DE DEFENSE EN PROFONDEUR - la barriere finale ne force ni BrakeCmd := FALSE ni le blocage du mouvement si FB_Translation defaillait de facon coincidente. Inventaire de classe realise : AUCUN autre SafeStop declare-non-lu dans CODE/ (FB_TranslationOutputInterlock:15 est l unique cas).'
  description: 'UN SEUL LOT, dans cet ordre : (B) gater BypassPhaseRotation sur MAINT_N2 pour les 3 axes (PRG_04_Treuils_Benne.st:984 et :1050 via (PRG_03_Modes_Cycle.Data.Auth.Mode = E_Mode.MAINT_N2), PRG_05_Translation.st:496 via M3_MaintN2) ET desolidariser la cause rotation de phases de BypassProcess dans FB_Safety_Winch.st:302 et FB_Safety_Translation.st:140 — sans casser le bypass commun SlackCable conserve (PRG_04:508/:520, :974/:1042) ; puis (A) consommer SafeStop dans FB_TranslationOutputInterlock.st au bloc de decision finale (environ :137 et :146) : forcer BrakeCmd := FALSE et bloquer le mouvement quand SafeStop = TRUE, SANS toucher a Reset / Enable / FaultCore / watchdog / PDO. Validation commune : bundle complet + diff bundle des fichiers touches + G200_check_linkage.py --report (PASS 0 erreur) + run_all_gates.py (G483 redevenu VERT) + le test d injection du defaut rotation de phases (issu de T306 phase 1) VERT sur M1, M2 ET M3 avec redondance finale verifiee sur M3 et bypass inoperant hors MAINT_N2. Aucune temporisation moteur/frein modifiee hors du point de correction arbitre. Recette machine : action HUMAINE (coupure/inversion de phase sur armoire).'
  objectifs:
  - 'AC1 : BypassPhaseRotation est inoperant hors MAINT_N2 sur les 3 axes (M1, M2, M3) — preuve : code + test qui tente le bypass en SEMI_AUTO et constate que la protection reste active.'
  - 'AC2 : la cause rotation de phases n est PLUS levee par BypassProcess seul (desolidarisation dans FB_Safety_Winch et FB_Safety_Translation) — preuve : test avec BypassProcess = TRUE et PhaseRotationOk = FALSE => le defaut est TOUJOURS active.'
  - 'AC3 : SafeStop est CONSOMME par FB_TranslationOutputInterlock (BrakeCmd := FALSE + blocage du mouvement) — preuve : test unitaire safe-stop sur cet interlock (ROUGE avant / VERT apres).'
  - 'AC4 : gate G483 (matrice bypass MAINT_N2) redevient VERT et la derogation MES 2026 est soit cloturee soit re-formalisee avec un perimetre etroit EXPLICITE excluant la rotation de phases.'
  - 'AC5 : G200 PASS 0 erreur + palier C sans rouge nouveau, et diff VIDE sur B_AU_SECURITE/** hors du point de correction arbitre.'
  - 'AC6 : recette machine listee comme action HUMAINE : phases coupees/inversees => arret des 3 axes, acquittement sur FRONT, AUCUN redemarrage automatique.'
  contrat: 'A ECRIRE avant toute ecriture (C4 : plan humain obligatoire + double revue parallele)'
  avancement: '[CADRAGE 2026-09-22 — TACHE CREEE SUR VERDICT DU CHALLENGE EXPERT, AUCUNE LIGNE DE CODE ECRITE.] ORIGINE : challenge independant du lot T306 phase 1 (orchestrate : 3 audits parallels + 2 revues) qui a rendu un verdict de gravite BLOCK pour l ECART B et MAJOR pour l ECART A, avec un finding supplementaire determinant (BypassProcess masque aussi la rotation de phases). Le challenge a par ailleurs REFUTE l orchestration sur un point : la preuve ROUGE/VERT du lot phase 1 est quasi-tautologique (voir annotation T306). DECISION D ORCHESTRATION : UN seul lot C4 (B puis A) et non deux, pour rester dans UNE campagne d essais (regle exploitant). AUCUN COMMIT, AUCUN PUSH.'
