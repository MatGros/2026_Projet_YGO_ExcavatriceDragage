  titre: 'T336 Phase 3 — REFONTE du homing : reference provisoire a la fermeture benne + palier 1 constant global + vrai Homed uniquement au FDC mecanique haut'
  contexte: 'ABANDON du design initial (referencement a la descente, option B du challenge). Nouvelle conception VALIDEE par l utilisateur le 2026-09-20, remplace integralement T336 Phase 2 option B :
    1. Operateur confirme visuellement benne fermee ("je valide") -> M2 se cale par rapport a M1 comme aujourd hui (inchange). Si benne au sol/impossible a fermer : MAINT_N2, treuils synchronises a petite vitesse pour se degager.
    2. M1 recoit une position PROVISOIRE (ex. 0) a cette confirmation -> permet un mouvement synchronise a petite vitesse. CE N EST PAS Homed. Le vrai Homed n arrive QUE quand le capteur mecanique haut est reellement atteint.
    3. Palier 1 = CONSTANTE FIXE non reglable (pas un parametre), imposee sur TOUS les mouvements treuils dans les DEUX sens tant que pas vraiment reference -- ET DANS TOUS LES MODES : si M1 ou M2 ou benne n est pas Homed, le cycle automatique ne peut PAS etre lance (on peut entrer dans le mode mais on reste bloque a l init ou equivalent).
    4. Translation M3 : AUCUN mouvement (pas juste petite vitesse) tant que non referencee -- altimetrie inconnue, risque de collision mecanique. Un interlock de ce type existe potentiellement deja (PRG_05:134-138, M3_HeightInterlockOk) -- A VERIFIER s il couvre exactement ce cas avant d en ecrire un nouveau.
    5. Sortie du grafcet en cours de route -> reste NON reference, aucune triche possible.
    PLAN B OBLIGATOIRE (garde-fou, pas une option) : si le referencement "au vol" pendant le mouvement ne fonctionne pas bien sur site, prevoir un referencement A L ARRET -- apres stabilisation par inertie (position d arret legerement apres le capteur), sur un etat de repos confirme (les deux treuils ET la benne stables), pas seulement en mouvement.'
  description: 'AVANT tout code : un challenger independant (contexte frais) doit verifier cette conception sur le code reel, comme pour l hypothese montee precedente (qui avait revele un piege cache). Points a challenger en priorite : (a) le "faux referencement provisoire" M1:=0 ne doit fuiter NULLE PART comme un vrai Homed (aucun consommateur ne doit le confondre avec un referencement reel) ; (b) l interlock M3 existant (PRG_05:134-138) couvre-t-il reellement "non reference = aucun mouvement", ou seulement un seuil de hauteur minimale differencie ; (c) le palier 1 constant global dans TOUS les modes est-il compatible avec les interlocks existants (MAINT_N1/N2, T249-A, etc.) sans conflit ni trou ; (d) le Plan B (reference a l arret) est-il implementable proprement en complement, pas en remplacement, du referencement au vol.'
  objectifs:
  - 'Position provisoire M1 (fermeture benne validee) explicitement distincte de Homed/MachineHomed -- aucun consommateur ne doit traiter les deux comme equivalents.'
  - 'Palier 1 CONSTANTE non reglable (litteral ou CST_ dedie), active sur tous mouvements treuils tant que non reference, dans tous les modes -- cycle auto bloque a l init si M1/M2/benne non Homed.'
  - 'Verifier/completer l interlock translation M3 : zero mouvement (pas seulement petite vitesse) tant que non referencee.'
  - 'Plan B (reference a l arret, apres stabilisation inertie, treuils+benne au repos) implemente en complement du referencement au vol, pas en remplacement.'
  - 'Confirmation operateur benne fermee toujours prealable ; MAINT_N2 synchronise petite vitesse si benne au sol.'
  - 'Aucune triche : sortie du grafcet en cours de route = toujours non reference.'
  - 'Tests CI : position provisoire jamais confondue avec Homed, palier 1 constant verifie dans tous les modes, interlock M3 verifie, Plan B testable independamment.'
  - 'Bundle PLCopenXML, G200 liaison, gates applicables PASS avant integration CODESYS.'
  bloque_par: []
  avancement: 'VERROU PRIS par CC01 le 2026-09-20T20:48:29 (GO direct humain, urgence tests utilisateur imminents). Challenge AVANT code LIVRE : DOC/WFLOW/AUDITS/DESIGN/CHALLENGE_T340_REFONTE_HOMING_2026-09-20.md (1 BLOCK, 2 PASS deja-couvert, 2 MAJOR, 9 constats hors scope). FAITS ACTES : (a) la position provisoire M1 est ABANDONNEE — ST_Encoder_Calib n a qu un booleen Homed, tout etat provisoire fuiterait dans ~20 consommateurs, et le couple M1 provisoire + M2 cale sur M1 rendrait MachineHomed auto-coherent donc indetectable ; (b) le palier 1 global existe deja (PRG_04:1217-1230) et l interlock M3 aussi (PRG_05:134-138) : AUCUN code de plafond ni d interlock a ecrire ; (c) le cycle auto est deja bloque sans datum (FB_Modes:251 expulsion + FB_CycleSemiAuto:834). ECART DANS LE SCOPE : CST_StepSlow est du code mort en MAINT_N2 (l arbitrage ignore ReqWinch hors SEMI_AUTO, FB_WinchCmdArbitrationM1.st:56-104) donc un re-referencement d une machine encore referencee peut se faire a palier 5 et faire echouer la capture preset (10 mm / 50 ms).
    IMPLEMENTATION LIVREE 2026-09-20T21:15 (NON COMMITEE) : etape HX7_LOCKED_REFERENCE dediee et VERROUILLEE (entree par confirmation operateur benne fermee -> nouvelle entree BucketCloseConfirmed cablee depuis le front existant BucketReferenceCloseEdge.Q ; montee vers le capteur sous permis ; puis prise de reference NOMINALE A L ARRET : capteur reellement atteint + arret mecanique confirme + commande relachee) ; verrou = aucune sortie d etape par changement de mode (etape TENUE sans mouvement), descente reellement commandee en HX7 => abandon avec cause dediee ; A1 CORRIGE (gardes de montee ET de descente consommees UNIQUEMENT si l ordre de mouvement est reellement emis ; garde de montee 120 s en dur -> 300 s DERIVEE : 58,5 m / 0,4 m/s = 146,3 s, x2 = 292,5 s) ; chemin de secours MAINT_N1 hors grafcet NON touche ; FB_Encoder_Homing.st et ST_Encoder_Calib.st NON modifies. DEUX REVUES INDEPENDANTES read-only : (1) NON en l etat (2 MAJOR + 9 MINOR) ; (2) OUI (1 MAJOR + 4 MINOR). Les 3 MAJOR CORRIGES : garde keyee sur l ordre reellement emis (elle se consommait hors MAINT_N2 ou aucun ordre n est emis) ; garde HX3 desormais testee (H210/H211) et declaree dans must_survive ; entree de l etape verrouillee EXIGEANT un capteur haut INACTIF (un capteur deja actif permettait une capture sans franchissement = datum faux). PREUVES FINALES : CI 21 tests / 19 PASS / 2 FAIL (H010/H090 PREEXISTANTS, identiques a l archive 13/09 : 8/6/2 ; cause BootReady jamais pilote) dont 13/13 nouveaux TC-P09-H200..H212 PASS ; G511 PASS + --selftest PASS (8 mutations rejetees) ; G200 --report PASS (0 erreur, 2025 instances) ; bundle frais 259/259 objets 0 erreur + diff bundle 4 objets ; palier C 43/48 PASS avec EXACTEMENT les 5 dettes preexistantes G300/G340/G408/G430/G483 (aucun fichier du lot signale). Persistants : AUCUN ajout. IHM : aucune commande ni champ nouveau. Aucun commit.'
