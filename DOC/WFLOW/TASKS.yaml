    vraies positions physiques, NE DOIVENT JAMAIS CHANGER. Remis a 0.0 (et CoherenceLimitM a 1.0) commit abbd0aa2. Consequence
    de l''erreur : tout Confirm Open/Close presse pendant la fenetre a 2.25 a injecte ~2.25 m d''erreur dans la reference
    encodeur M2 (necessite un re-Confirm apres coup). La cause racine reelle du NoMovement 16#8000 / IsOpen jamais TRUE observee
    initialement reste A IDENTIFIER (ce n''etait PAS OffsetOpenM). FAIT 2026-09-04 (reste valide, independant de l''erreur
    ci-dessus) : verrou atomicite demarrage couple (PRG_04 ~1225/1315) - fige la commande finale du treuil PRET tant que l''autre
