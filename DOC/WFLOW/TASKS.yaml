    est tout-ou-rien (IDLE->RESTORE_B) et empeche de qualifier le canal deja pret.
  description: Ajouter deux flags RETAIN BypassAuRedundancyTestA / BypassAuRedundancyTestB (GVL_BypassRetain), entrees FB
    BypassRedundancyTestA / BypassRedundancyTestB, cables via PRG_06. bypassTestA saute TEST_A + RESTORE_A ; bypassTestB saute
    TEST_B. Le latch RedundancyTestFailedCause n est saute que pour le canal bypasse. BypassRedundancyTest global conserve
    = alias A+B.
  objectifs:
  - Le canal non bypasse garde son auto-test A/B complet et son abort CST_ABORT_REDUNDANCY_A/B
  - bypassTestA sur canal A seul => sequence IDLE->TEST_B->RESTORE_B->PULSE, latch A neutralise, latch B actif
  - bypassTestB sur canal B seul => sequence TEST_A->RESTORE_A->RESTORE_B->PULSE, latch B neutralise, latch A actif
  - A+B (ou BypassRedundancyTest global) => comportement actuel IDLE->RESTORE_B inchange
