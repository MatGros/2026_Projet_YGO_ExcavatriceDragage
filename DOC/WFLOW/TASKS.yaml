    exactement 1 100 000 -> chemin exact du saut 8,50 -> 204,677 m reconstitue. Sans ce correctif, le saut post-AU/reactivation
    simulation reste reproductible malgre le correctif T338 (plancher RawPos=0) deja committe (6a5910da).'
