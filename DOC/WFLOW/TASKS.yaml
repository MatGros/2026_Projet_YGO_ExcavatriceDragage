    PhaseRotationOk_DI injectable/altérable dans le banc de simulation SimBench/HwSim. 2) Vérifier scan par scan qu''un front
    descendant (PhaseRotationOk_DI passant de TRUE à FALSE) déclenche immédiatement le verrouillage sur FB_Safety_Winch (M1/M2)
    et FB_Safety_Translation (M3). 3) Valider formellement que PRG_06_Outputs coupe et interdit toute commande de mouvement
    et retombe les contacteurs. 4) Vérifier la visibilité du défaut sur l''IHM (alarme bandeau, bit PhaseRotationFault, diagnostic
    preflight). 5) Vérifier l''inhibition conditionnelle par BypassPhaseRotation (réservé Maintenance N2) et le réarmement
