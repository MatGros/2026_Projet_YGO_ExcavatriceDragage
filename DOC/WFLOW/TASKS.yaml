    en charge.'
  description: 'Phase 1 DIAGNOSTIC ET TRACABILITE (read-only, obligatoire, AVANT tout code) : reconstituer et FORMALISER l
    exigence — relire AUDIT_29 (cas limites securite), le plan T180 et la SPEC harness T181-00, puis ecrire le contrat de
    tache T180/CAS-001 (objectifs testables, matrice des vecteurs, perimetre, preuves) et le faire PASSER par check_task_contract.py.
    Trancher explicitement, avec l humain, ce que CAS-001 exige : quelle cause, quelle fenetre de detection, quelle neutralisation,
    quel rattachement (FB_Safety_Winch et/ou la chaine de sortie), et si l exigence est TOUJOURS EN VIGUEUR (elle date du
    2026-08-29) ou doit etre abandonnee formellement. Phase 2 IMPLEMENTATION (apres GO humain et contrat valide) : implementer
    la detection + la neutralisation, sans jamais modifier les temporisations moteur/frein ni la chaine AU, avec test CI ROUGE
    avant / VERT apres — et sur un harnais REPARE (voir T384/T372 : le stub PRG_04 doit etre reconstruit pour pouvoir l observer).
