  titre: SimBench - couplage mecanique M1/M2 et rattrapage (anti-blocage des machoires)
  contexte: >-
    En simulation, une fermeture de benne suivie d'une montee directe laisse un ecart residuel (benne autour de 10 % ouverte, dans le trou metier de fermeture 13,8 / 14,0 m traite par T327) ; l'automate plafonne alors la montee au palier 1 (PRG_04_Treuils_Benne.st 1224). En realite l'ecart se resorbe par le couplage mecanique des deux treuils, sauf si les machoires sont bloquees. Le banc modelisait les deux treuils independamment et ne connaissait un couplage qu'en descente (SimM2CoupledDescentModelActive). ARBITRAGE HUMAIN 2026-09-20 : DSH01 est confirme sur T328, l'autre agent travaille sur T327.
  description: Rattrapage mecanique M1/M2 implemente dans FB_SimBench (region 2bis) sur l'IMAGE publiee du codeur M2 (jamais sur la memoire persistante RETAIN), gate sur le mouvement physique reel des deux treuils, plus un stimulus de blocage des machoires. Plan et contrat amendes apres deux challenges independants AVANT ecriture, puis revue independante APRES ecriture (defauts corriges).
  objectifs:
  - Montee couplee sans blocage, l'ecart relatif rejoint l'entree de la bande fermee (OffsetCloseM moins 0,5 x CoherenceLimitM) - FAIT (TC-P13-060 et 066).
  - Arret, jog M2 seul, cable mou, benne au fond, preset - aucun rattrapage (TC-P13-061 et 064).
  - Machoires bloquees - rattrapage inhibe et charge forcee observable en diagnostic (TC-P13-062).
  - Modele desactive - image M2 strictement identique, non-masquage de T327 (TC-P13-063 et 068).
  - Correction bornee a 0,02 m par scan et ecriture limitee a l'image publiee - FAIT.
  - RESTE A FAIRE - purge de l'accumulateur sur Enable OFF vers ON ; test d'integration AC1 jusqu'au palier autorise.
  contrat: DOC/WFLOW/CONTRACTS/TASK_CONTRACT_T328_SIMBENCH_COUPLAGE_M1M2.yaml
  bloque_par: []
