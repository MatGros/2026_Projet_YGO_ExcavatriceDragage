    sans mouvement bloque avere. PRINCIPE DE CONCEPTION DEMANDE PAR L UTILISATEUR (a trancher en design, pas a deviner) :
    tout timeout de deplacement doit etre conditionne sur une action/engagement operateur continu (joystick maintenu, commande
