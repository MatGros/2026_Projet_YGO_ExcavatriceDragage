  contexte: 'NOMS REELS DU CODE (corriges le 2026-09-20, cf. cadrage section 1) : CfgTopSensorPos_M = position de referencement au capteur TOP mecanique (ST_WinchCfg.st:8, defaut 8,5 m, M1 maitre, M2 miroir impose par PRG_07:154-155) et CfgCableLimitAscent_M = FDC logiciel haut d exploitation (ST_CommunCfg.st:21, defaut 7,5 m, commun M1/M2). Les libelles PositionHomingTop_M / PositionFdcLogicielHaut_M / CableLimitAscent_M n existent PAS dans CODE/ (CableLimitAscent sans prefixe designe un ETAT BOOL). Ces deux parametres sont modifiables IHM, persistants, et ne doivent JAMAIS etre codees en dur. DECISION HUMAINE 2026-09-20 (Q1) : ReserveTop_M = CfgTopSensorPos_M - CfgCableLimitAscent_M >= 1,00 m ET WinchSlowdownDistanceTop_M >= 0,50 m, DEUX regles distinctes ; la regle historique reserve <= ralentissement est ABROGEE.'
