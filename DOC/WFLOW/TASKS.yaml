  contexte: 'Le message « Posture depart incorrecte (M3, FDC haut M1 ou benne) » est trop global : il peut citer M3 alors
    que M3 est déjà à P1, ou ne pas distinguer un M1 hors FDC logiciel haut d''une benne non qualifiée. AX1 doit exposer uniquement
    les causes réellement fausses et l''action associée. Si une remise en posture est autorisée, elle doit rester une manœuvre
    opérateur contrôlée : geste joystick maintenu + homme-mort, fermeture automatique de la benne si nécessaire puis remontée
    couplée jusqu''à la position haute ; la translation gauche/droite doit pouvoir rejoindre P1 et s''arrêter automatiquement
    sur P1. ⚠️ ÉLARGI 2026-09-20 (regroupement demandé par l''utilisateur, même famille de besoin) : à l''étape AX15b (« Vidage
    : ouverture benne, treuils arretes »), les deux treuils sont AUJOURD''HUI explicitement neutralisés (FB_CycleSemiAuto.st:1434-1435,
    WinchM1Cmd.RunRequest/WinchM2Cmd.RunRequest := FALSE) — AUCUN moyen de remonter/refermer la benne depuis cette étape.
    Risque terrain identifié : si le frein glisse et que la benne ne tombe pas (bloquée), l''opérateur ne peut ni interrompre
    le vidage ni revenir en arrière (fermer + remonter) sans sortir du cycle. Besoin : sous joystick maintenu en sens inverse
    (montée), pouvoir refermer la benne puis remonter, symétriquement à la descente/ouverture normale d''AX15b — même doctrine
    de commande maintenue + homme-mort que le reste du cycle, aucun mouvement autonome.'
  description: 'Cadrer puis implémenter séparément DEUX diagnostics/procédures de la même famille (retour arrière opérateur
    contrôlé, phase 2 ensemble) : (1) AX1 : diagnostic par cause + remise en posture (M3→P1, FDC haut M1, benne). La montée
    de remise en posture conserve le TOP mécanique, AU, permis, FDC/limites et protections existants ; aucun mouvement autonome,
    aucune confusion d''axe, aucun bypass et aucune nouvelle variable de FDC/position. La condition benne non qualifiée doit
    être définie avant implémentation (état franc requis et comportement en cas d''ouverture/fermeture non atteinte). (2)
    AX15b : repli treuils (fermer + remonter) sous commande maintenue inverse, pour le cas frein glissant/benne bloquée en
    vidage. Doit rejoindre une étape cohérente du cycle (retour vers AX10 ou AX14 selon l''état, à définir en phase 2) sans
    dupliquer la logique de fermeture/remontée déjà écrite ailleurs dans le cycle (cf. AX15C repositionnement, AX10/AX11/AX12).'
  objectifs:
  - 'Diagnostic AX1 décomposé en trois causes indépendantes et testables : M1 hors FDC logiciel haut, benne non qualifiée
    selon la précondition explicitée, M3 hors P1 ou position non qualifiée.'
  - Le message et l'action opérateur ne citent que les causes fausses au scan courant ; aucun libellé M3 si M3 est déjà P1
    qualifié, et réciproquement.
  - Sous geste opérateur maintenu et homme-mort valides, une fermeture automatique de benne puis une remontée couplée peuvent
    être proposées uniquement avec tous les permis, AU, TOP mécanique, FDC/limites et protections existants ; relâchement
