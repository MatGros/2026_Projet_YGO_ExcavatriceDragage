  titre: Regulariser et renumeroter les steps speciaux hors GEL (AX3_WAIT_DIVE_START, AX10B_RACCORDEMENT_P1)
  contexte: 'Analyse trace Suivi_62_SIMU_AX10_AX11 (troubleshooting 2026-09-19) : AX10B_RACCORDEMENT_P1 (implemente par T262,
    valeur enum 22) et AX3_WAIT_DIVE_START (valeur enum 21) sont deux etapes speciales inserees en fin d''enum E_AutoCycleStep,
