    := FALSE) preset M2 a CfgTopSensorPos_M (8.5) quel que soit l''etat benne. Consequence si homing lance BENNE FERMEE :
    M2 physiquement ~15 m sous M1, preset a 8.5 -> 15 m d''incoherence injectee -> DriftGuard M2 (MecaA) + WinchSync (MecaE)
    -> M2Status.HomedAndReliable=FALSE -> HX3 n''aboutit pas -> HXF_FAILED, et le datum M2 reste corrompu de ~15 m (bordel
    en cascade : bucket ERROR OffsetMax, FB_WinchSync desactive a la main, mesures faussees). Demande utilisateur : le referencement
    doit marcher benne ouverte OU fermee, puisque HX4 redemande justement de fermer la benne + valider sa position. NOTE :
    remplace l''ancienne demande "fermer la benne a HX1" - incompatible, la benne doit rester ouverte pendant HX2/HX3 SAUF
    si on rend le preset M2 offset-aware.

    '
  description: "Spec GRAFCET homing (contrat obligatoire C2). Design propose : 1. HX1 : demander l'etat benne reel (ouverte\
    \ / fermee) -> OffsetExpected\n   (0 ou OffsetCloseM).\n2. HX3 : M2Demand.UseDynamicTarget := (OffsetExpected > 0) ;\n\
    \   M2Demand.DynamicTarget_M := M2.CfgTopSensorPos_M + OffsetExpected ->\n   M2 preseté a 8.5 (ouvert) ou ~23.5 (ferme).\n\
    3. Propager OffsetExpected vers instBucket.ActiveOffsetM pendant HX3 pour que\n   WinchSync / DriftGuard soient offset-aware\
    \ (sinon SafeStop comme le\n   2026-09-02, cf. 0350e3d1).\n4. RefWindowActive (FB_Safety_Winch) doit couvrir tout HX3\
    \ + reconvergence\n   M1/M2 : verifier que la fenetre M2 (InReferencingMode / PosStepDetected /\n   TonRefSettle 2 s)\
    \ tient assez longtemps pour un preset de +15 m.\n5. HX4/HX5 inchange : re-confirme + commit l'offset ferme. Alternative\
    \ minimale si trop risque : forcer benne ouverte pour HX2/HX3 (garde BucketIsOpen sur transition HX1->HX2) + prompt clair.\n"
  objectifs:
  - Homing machine aboutit benne ouverte ET benne fermee, sans datum M2 corrompu
  - Pas de MecaA / MecaE parasite pendant le preset M2 (RefWindow couvre HX3)
  - HX1 capte l'etat benne attendu ; HX3 preset M2 a la bonne cible
  - FB_CycleMachineHoming tests verts, bundle regenere, G200 PASS
