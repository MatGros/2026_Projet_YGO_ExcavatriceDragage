  titre: Analyse de risque - FB_WinchDirectionInterlock (D18) ne credite pas le temps reel deja passe au neutre
  contexte: 'Discussion troubleshooting AX10->AX11 (2026-09-20) : FB_WinchDirectionInterlock (D18, delais M1WinchCfg.DirectionInterlockDelayAscent/Descent = 800ms/500ms) impose la temporisation complete d''inversion de sens en la comptant UNIQUEMENT a partir de l''instant de la nouvelle demande (TON DirectionChangeDelay dont IN=Enable AND RequestActive AND DirectionChanged ; RequestActive=FALSE pendant tout le neutre remet ET a 0). Le temps deja ecoule pendant une pause au neutre (ex: fermeture benne 1-2s) n''est jamais credite, meme si le moteur est deja physiquement a l''arret confirme. A l''inverse, FB_WinchOutputInterlock.DeadTime (barriere finale, DeadTimeSameDir=500ms/DeadTimeOppositeDir=700ms par defaut dans le code actuel) compte pendant tout l''arret reel via la condition NOT BrakeFeedback (frein physiquement confirme ferme). CORROBORATION (second agent, 2026-09-20) : la trace AX10->AX11 mesure un trou de ~805ms entre la fermeture benne et le redemarrage M1/M2, correspondance quasi exacte avec la constante T#800ms (M1WinchCfg.DirectionInterlockDelayAscent), sans necessite d''invoquer un EnableRising parasite -- preuve renforcee. EFFET DE PROPAGATION identifie : la defense de coherence AUTO interdit a M2 de partir seul tant que M1 est retenu par D18, donc le defaut sur M1 seul bloque aussi M2 -- blocage couple des deux treuils en sequence AUTO/SEMI_AUTO (scenario concret pour AC2). RAPPEL PERIMETRE (Mathieu, 2026-09-20) : M2 possede son propre FB_WinchDirectionInterlock/FB_WinchOutputInterlock symetrique (M2WinchCfg.DirectionInterlockDelayAscent=800ms/Descent=500ms, PRG_04 ~L1471-1472) -- verifier si M2 peut lui-meme declencher SA PROPRE tempo D18 au meme instant, et si les deux tempos M1/M2 peuvent se cumuler ou se masquer. ⚠️ MISE EN GARDE EXPLICITE (Mathieu, 2026-09-20) : les fiches AF_Partie-10_Fonction_Winch_v2.1.md et DOC/AF/AF_Partie-10_Fonction_Winch/FB_WinchOutputInterlock_v1.0.md contiennent des valeurs qui NE CORRESPONDENT PAS au code actuel (ex: AF-10 v2.1 §1 documente DirectionInterlockDelay=900ms montee/400ms descente vs 800/500ms code ; §2ter documente RestartDelay=1500ms vs T#500ms code ligne FB_WinchOutputInterlock.st:224 ; la fiche v1.0 documente DeadTimeSameDir/OppositeDir=1s par defaut et reference encore un ancien interlock unique a 200ms, donc probablement perimee par rapport a AF-10 v2.1). CES FICHES NE SONT PAS PRESUMEES A JOUR NI FAISANT AUTORITE. La reference de comportement attendu pour cette tache est le fonctionnement fonctionnel EXPLICITEMENT DEFINI PAR MATHIEU dans cette conversation (credit systematique du temps d''arret REEL, peu importe la couche technique qui le mesure ; reprise meme sens ou sens oppose doit etre instantanee des que l''arret reel est suffisant ; inversion sans arret reel suffisant doit rester temporisee) -- PAS le contenu des fiches AF, qui doivent au contraire etre auditees et le cas echeant corrigees/mises a jour en consequence de cette tache, jamais l''inverse. BUG SUPPLEMENTAIRE releve en discussion (a verifier formellement par T325) : dans FB_WinchOutputInterlock.st §4bis, LastDirection est reecrit sous la MEME condition (MotorRequest) que le calcul de NewDirection, AVANT leur comparaison -- NewDirection egale donc potentiellement toujours LastDirection au moment du test, ce qui empecherait structurellement DeadTimeOppositeDir de jamais se declencher. Coherent avec l''echec constate des tests TC-P10-021 et TC-P10-022 (verifie : les deux sont "passed": false dans TOOLS/TEST_AUTO_CI/RESULTS/H_TREUILS_BENNE/reports/FB_WinchOutputInterlock.json) -- pre-existant, sans lien cause avec cette tache, mais renforce l''idee que FB_WinchOutputInterlock ne doit pas etre presume correct/fiable comme reference tant que ce point n''est pas tranche. HYPOTHESE DE TRAVAIL PRIORITAIRE POUR L''IMPLEMENTATION FUTURE (challenge multi-agents converge, 2026-09-20, PAS encore validee/implementee -- a confirmer par T325) : Option "credit D18" plutot que "RestartDelay 1500ms" (celle-ci ne corrige pas la cause, seulement une autre tempo, a traiter comme divergence separee). Qualificateur d''arret a utiliser = SIGNAL PHYSIQUE deja disponible dans D18 sans changement d''interface : FB_Winch appelle deja D18 avec Enable := (StepNumber = 0) AND Sensors.ContactorsAllOff (FB_Winch.st ligne ~198) -- PAS le simple neutre joystick (NOT RequestActive), qui ne prouve rien sur l''etat physique reel. Piege identifie et a eviter dans l''implementation : un TON dont IN retombe a FALSE au moment meme de la nouvelle demande remet son ET a 0 CE MEME SCAN (comportement standard CODESYS) -- le temps de pause credite doit etre MEMORISE (variable persistante, capturee au front de la nouvelle demande, AVANT le recalcul du TON de ce scan) et non relu depuis le TON apres coup. Ne jamais additionner les delais : au front de la nouvelle demande, appliquer uniquement le RELIQUAT (delai requis pour le sens demande moins temps d''arret deja credite, borne a 0 minimum), en utilisant une base commune MAX(DirectionInterlockDelayAscent, DirectionInterlockDelayDescent) pour la phase d''accumulation (le sens final n''est connu qu''a la demande). Le bug LastDirection (FB_WinchOutputInterlock §4bis) reste un correctif INDEPENDANT, jamais mele au meme lot que D18 -- sous-tache/correctif dedie avec test rouge demontrant le defaut puis tests SameDir/OppositeDir verts. DEUX DEFAUTS SUPPLEMENTAIRES CONFIRMES PAR TRACE REELLE (trace 66/67 MAINT_N1, 2026-09-20, PRE-EXISTANTS -- verifies par diff git contre dcb28019 : code inchange par le correctif credit) : DEFAUT B -- purge de DeadTimeArmed inatteignable (FB_WinchDirectionInterlock.st ~L90/109/116/119) : l''ordre IF/ELSIF place "ELSIF DeadTimeArmed THEN DirectionChangePending:=TRUE" AVANT "ELSIF DirectionChangeDelay.Q THEN adoption", donc des que DeadTimeArmed est arme (front EnableRising pendant une demande deja active), la branche d''adoption n''est plus jamais evaluee meme apres ecoulement complet du delai -- seules sorties : retour au neutre franc (L109-115) ou front Reset (L44-51). Confirme par trace 67 : DirectionChangeDelayElapsed grimpe a 2174ms sans jamais que Pending retombe par adoption, seul le retour au neutre (~7s) l''a resolu. DEFAUT A -- garde croisee M1/M2 potentiellement livelock (PRG_04_Treuils_Benne.st:1360-1361 force ReqM1Winch a FALSE si instWinchM2.DirectionChangePending ; L1452-1453 symetrique force ReqM2Winch a FALSE si instWinchM1.DirectionChangePending -- verifie present dans le code, commentaire d''origine reference un REX anterieur "M2 relance seul pendant que M1 est en dead-time"). Le TON DirectionChangeDelay remet son ET a 0 des que RequestActive retombe (y compris via ce gel force par l''autre treuil) -- si M1 et M2 sont pending simultanement, chacun peut geler la requete de l''autre au moment ou celui-ci allait aboutir, empechant les deux ET d''atteindre jamais leur PT (livelock auto-entretenu, sans defaut visible, RampTargetStep=0 -> MotorRequest=FALSE -> State=READY/Reason=NONE cote barriere -- absence de defaut n''est PAS une preuve d''innocence de D18). Mecanisme PRE-EXISTANT (meme comportement de TON avant le correctif credit), pas aggrave ni cause par le correctif credit, mais doit etre traite dans le MEME lot d''implementation future (meme FB, meme classe de risque C4). ANOMALIE COMPLEMENTAIRE A VERIFIER PAR WATCH CODESYS (pas de modif code) : trace 67 mesure DirectionChangeDelayElapsed=591ms sur une demande de DESCENTE, alors que le reliquat maximal possible pour ce sens est borne a ChangeDelayDescent=500ms (M1WinchCfg.DirectionInterlockDelayDescent) -- un TON ne peut jamais depasser son PT, donc soit la constante effective embarquee dans le PLC differe de celle lue dans le code source (image perimee ou override IHM/persistant), soit une autre explication existe -- a verifier par Watch direct sur PRG_04_Treuils_Benne.M1WinchCfg.DirectionInterlockDelayDescent et instWinchM1.Config.DirectionInterlockDelayDescent avant toute conclusion.'
  description: 'Tache d''ANALYSE et de CADRAGE uniquement -- aucune modification de code. Reference de comportement attendu = ce que Mathieu a defini fonctionnellement dans la discussion (credit systematique du temps d''arret reel), PAS le contenu des fiches AF qui peuvent etre perimees -- auditer leur fraicheur (dates, coherence avec le code et entre elles) comme partie du travail, pas comme prealable de confiance. Mener une analyse de risque croisee sur les 3 modes (MANU joystick, MAINTENANCE, AUTO/SEMI_AUTO grafcet) pour chaque scenario d''inversion de sens : passage neutre bref, passage neutre prolonge, inversion sans neutre detectable, sequence AUTO enchainant deux etapes de sens oppose, sur M1 ET M2 independamment et couples. Etablir une table de verite arret/reprise/inversion (reference minimale : matrice ~18-24 scenarios elementaires -- pause courte/longue x meme sens/sens oppose/inversion directe/perte-retour Enable/retour frein retarde/retour contacteur incoherent x M1 seul/M2 seul/M1+M2 couples, plus le cas reel AX10->AX11 trace). Arbitrer explicitement les valeurs contradictoires (D18 800/500ms code vs 900/400ms AF-10 v2.1 ; RestartDelay 500ms code vs 1500ms AF-10 v2.1 ; DeadTimeSameDir/OppositeDir 500/700ms code vs 1s fiche v1.0) en explicitant a chaque fois QUELLE valeur sert desormais de reference et pourquoi, sans jamais presumer qu''une fiche perimee est correcte du seul fait d''etre ecrite. Verifier si FB_Translation (temporisation directionnelle distincte) reproduit le meme defaut conceptuel -- si oui, SIGNALER et proposer une tache separee, ne pas l''integrer au scope de T325. Si un defaut de conception est confirme, proposer un correctif cadre SANS l''implementer, avec au moins 2-3 options de strategie de correction comparees (taille/risque/reversibilite) -- le correctif doit etre soumis a relecture croisee experts humains (Mathieu + revue externe) avant toute ecriture de code, et la FUTURE tache d''implementation devra etre C4 (pas C2), avec contrat de conservation dedie et sa propre matrice de tests.'
  objectifs:
  - 'Fraicheur des fiches AF_Partie-10_Fonction_Winch_v2.1.md et FB_WinchOutputInterlock_v1.0.md auditee (dates, coherence mutuelle et avec le code) -- verdict explicite sur laquelle (si une seule) fait encore autorite, sans presomption de depart.'
  - 'Table de verite arret/reprise/inversion couvrant M1 seul, M2 seul, M1+M2 couples, pause courte et pause longue, redigee et versionnee.'
  - 'Analyse de risque ecrite couvrant MANU (joystick), MAINTENANCE et AUTO/SEMI_AUTO (grafcet), avec au moins un scenario concret par mode ou l''ecart entre FB_WinchDirectionInterlock et FB_WinchOutputInterlock.DeadTime a un impact operationnel ou securitaire -- ancre sur le comportement attendu defini par Mathieu, pas sur les fiches AF brutes.'
  - 'Preuve temporelle sur trace reelle AX10->AX11 (trace 63 ou equivalente) : dernier sens M1, passage neutre, nouvelle demande, DirectionChangePending mesure, blocage couple M1/M2 confirme ou infirme avec horodatage.'
  - 'Toutes les divergences de valeurs (D18, RestartDelay, DeadTimeSameDir/OppositeDir) entre code et fiches AF listees avec arbitrage explicite de la valeur de reference retenue.'
  - 'Verdict explicite : incoherence = defaut de conception a corriger, OU comportement volontaire et justifie (avec la raison technique et sa source).'
  - 'Si defaut confirme : au moins 2-3 options de correctif comparees (principe, fichiers ST impactes, taille estimee, risque, reversibilite) redigees pour revue humaine -- zero ligne de code ST modifiee dans cette tache -- et mention explicite que l''implementation future sera classee C4.'
  - 'Verification FB_Translation (meme defaut conceptuel ?) tracee, avec creation d''une tache separee si confirme -- jamais integree au scope ou au code de T325.'
  - 'Defaut B (purge DeadTimeArmed inatteignable) analyse avec la meme rigueur que le credit neutre : cause, portee (tous modes ou seulement EnableRising pendant demande active), option de correctif comparee dans le meme lot d''implementation future.'
  - 'Defaut A (garde croisee M1/M2, risque de livelock) analyse : conditions exactes de declenchement, verification par Watch CODESYS (instWinchM1/M2.DirectionInterlock.DeadTimeArmed, DirectionChangePending M1 ET M2) plutot que par deduction seule, option de correctif comparee (ex: decoupler l''horloge D18 de RequestActive via un front memorise) dans le meme lot.'
  - 'Anomalie DirectionChangeDelayElapsed=591ms sur descente (borne theorique 500ms) verifiee par Watch CODESYS direct (M1WinchCfg.DirectionInterlockDelayDescent, instWinchM1.Config.DirectionInterlockDelayDescent) -- confirmee ou infirmee avant toute conclusion sur une divergence image PLC/source.'
  - 'Fiche ou note versionnee dans DOC/WFLOW/ tracant l''analyse complete, prete pour double relecture (Mathieu + expert externe) avant toute suite en implementation.'
  contrat: DOC/WFLOW/CONTRACTS/TASK_CONTRACT_T325_D18_NEUTRE_ANALYSE_RISQUE.yaml
