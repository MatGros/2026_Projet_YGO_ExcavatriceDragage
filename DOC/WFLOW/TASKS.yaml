  contexte: 'Mise en service 2026-09-03 (MES-045). Serie de defauts en cascade en pilotage benne : etat memorise (IsOpen/IsClosed)
    fixe UNIQUEMENT par les boutons ConfirmOpen/ClosePos (MAINT_N2) ou le succes d''un cycle -> quand l''etat diverge de la
    realite mecanique, ActiveOffsetM (0 ou OffsetCloseM) est applique a l''envers -> M2PositionCorrected faux de ~15 m ->
    FB_WinchSync voit un ecart fantome -> MecaE -> synchro desactivee a la main. Plus : OffsetMaxFault latche a 13 cm de M2
    sous M1 (borne basse = CablePosM1 sec, sans tolerance). L''ancienne version (CODE_BACKUP 20260822) avait un classifieur
    d''etat continu sur la mesure, retire lors d''un refactor. Tentative R3 (detection sur position en jog M2, commit 0defd32e)
    a introduit un fly-through -> etat faux -> MecaE ; retiree (commit 8bd0b65f).

    '
  description: "Implemente (NON COMMITE au 2026-09-03 19:40, en test banc) : - FB_Bucket §4a : CLASSIFICATION CONTINUE de\
    \ l'etat sur la mesure physique.\n  IsClosed si |Delta - OffsetCloseM| <= CoherenceLimitM pendant 1 s (TON),\n  IsOpen\
    \ si |Delta - OffsetOpenM| <= CoherenceLimitM pendant 1 s ;\n  gate machine TOTALEMENT arretee + referencee + hors sequence\n\
    \  (NOT M1_Busy AND NOT M2_Busy AND NOT Lifecycle.Busy AND NOT SevereError)\n  -> aucun transitoire d'ecart, self-heal\
    \ des que la machine est parkee,\n  dans tous les modes. Zone intermediaire -> dernier etat franc conserve.\n- FB_Bucket\
    \ §5 : ActiveOffsetM pilote par cet etat fiable (un seul offset,\n  pas de split display/sync : sync est OFF en WinchSel=2\
    \ ou le pas d'offset\n  se produit).\n- FB_Bucket §5a : OffsetStateMismatchWarn (VAR_OUTPUT, publie IHM\n  ST_BucketHMIState)\
    \ - warn non bloquant si |Delta - ActiveOffsetM| >\n  CoherenceLimitM pendant 2 s -> \"reconfirmer position benne\".\n\
    - FB_Bucket §1 : OffsetMaxFault borne basse = OffsetOpenM - CoherenceLimitM\n  (au lieu de CablePosM1 sec) + latch seulement\
    \ si hors plage > 500 ms\n  (TON anti-pic). CfgFault : tolere OffsetOpenM legerement negatif (>= -2 m)\n  pour recalibration.\n\
    - PRG_04 : publication OffsetStateMismatchWarn. Complement commit b6837198 (solution utilisateur) : §4a classification\
    \ INSTANTANEE (NearClosed/NearOpen/IsIntermediate/TooOpen/TooClosed) + §5 SNAP IMMEDIAT de ActiveOffsetM sur la bande\
    \ mesuree (M2 corrige ~ M1 des l'arret, avant le latch debounce 1 s). IsIntermediate (declare mais jamais ecrit) restaure\
    \ -> Benne_IsRoughlyClosed (PRG_04, tolerance galets).\n"
  reste_a_faire:
  - Test banc du classifieur continu (recalage auto etat a l'arret)
  - CALIBRATION ORDRE OBLIGATOIRE. Recalibrer OffsetCloseM (~13.95) et OffsetOpenM (~ -0.13) aux vrais FDC AVANT tout. Sinon
    avec OffsetCloseM=15 et CoherenceLimitM=1.0 la bande fermee vaut 14 a 16 m, or Delta reel ~13.95 tombe HORS bande -> classe
    intermediaire, offset ne se recale pas. Alternative, elargir CoherenceLimitM a 1.5 (tassement galets + allongement charge).
  - Valider au banc un arret VOLONTAIRE a mi-course (Delta ~7.5 m). Doit rester sur le dernier etat franc + HoldOffsetM (continuite
    geometrique voulue).
  - Reparer le test unitaire FB_Bucket (harness reference MotionDirection, input supprime a un refactor anterieur) - ROUGE
    pre-existant.
  - Widget IHM warn OffsetStateMismatchWarn
  objectifs:
  - Etat benne reflete la realite mecanique sans intervention MAINT_N2
  - ActiveOffsetM correct -> M2PositionCorrected ~ M1 par construction
  - Fin des OffsetMaxFault parasites (bruit codeur / sur-jog cm)
  - Alarme non bloquante en cas d'incoherence offset/mesure persistante
