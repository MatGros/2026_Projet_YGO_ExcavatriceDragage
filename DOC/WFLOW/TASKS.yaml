  description: 'FB_Modes 4quater : BucketSeqSatisfied (phase latch), Auth.CoupledBucketPhaseLocked (toute la fenetre T248
    -> FB_BucketCmdArbitration n''arme jamais dive-open/ascent- close -> pas de blip instBucket.Busy -> deadman preserve),
    Auth.WinchSelTransitionHold (dwell fixe TonWinchSelSettle apres tout changement de JoystickWinchSelectArbitrated). PRG_04:519
    : si WinchSelTransitionHold -> zero des requetes logiques M1/M2. FAIT : sequencement selecteur reel, phase-lock deadman,
    exemption programme (DumpAtTremie/ExtractionAssist via ProgramBucketDriveActive), TOF MecaA/overspeed non masque, dwell
