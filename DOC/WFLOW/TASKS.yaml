    0.0 et CoherenceLimitM 1.0 en production, une fermeture engagee dans la bande ouverte serait immediatement a la limite,
    ce qui impacte TC-P10-029) ; Q2 comportement a la limite — (A) coupe avec CloseReq/OpenReq toujours armes et reprise au
    joystick, (B) coupe avec Done propre et BucketState intact, (C) diagnostic nomme, avec la contrainte verifiee que tout
    slot instCauses alimente FaultCore donc SevereError et Reset, un simple signalement exigeant une VAR_OUTPUT dediee ; Q3
    COLLISION decriture reelle que le brief declare a tort inexistante — test_fb_bucket.st est dans le perimetre d ecriture
