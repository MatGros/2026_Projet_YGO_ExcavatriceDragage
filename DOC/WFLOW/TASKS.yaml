  titre: ErrorID:02 [BENNE] depassement ecart max declenche pendant le referencement (absurde)
  contexte: 'Signale par Mathieu 2026-09-20 (session MAINT_N1, essais D18) : alarme "[BENNE] ErrorID:02 - depassement ecart max autorise" visible pendant une phase de referencement (homing), jugee absurde par l''operateur car les mesures ne sont pas encore qualifiees a ce stade. Verifie : FB_Bucket.st (Cause 1, ~L172-190) exclut deja explicitement le homing actif de ce controle (HomingPositionValid := HomedAndReliableM1 AND HomedAndReliableM2 AND NOT MachineHomingActive). Deux hypotheses non tranchees : (1) defaut LATCHE avant le debut du homing, encore affiche pendant le homing faute de Reset (comportement normal d''un latch, pas un bug) ; (2) MachineHomingActive n''etait pas reellement TRUE au moment observe (vrai bug de gating). Aucun snapshot pris au moment de l''alarme -- non tranche, Mathieu est passe a autre chose sans fournir de preuve.'
  description: 'Obtenir un snapshot ou une trace pris PENDANT l''affichage de l''alarme (Error/ErrorId de FB_Bucket, MachineHomingActive, HomedAndReliableM1/M2, Fault.Latched) pour trancher entre latch anterieur persistant et vrai bug de gating homing. Analyse uniquement tant que la preuve manque -- ne pas corriger a l''aveugle.'
  objectifs:
  - 'Preuve (snapshot/trace) capturee pendant l''alarme, avec MachineHomingActive et Fault.Latched au moment precis.'
  - 'Verdict : latch anterieur persistant (comportement normal, rien a corriger) OU vrai gating errone pendant le homing (defaut confirme).'
  - 'Si defaut confirme : correctif cadre avant implementation, meme methode que T325.'
