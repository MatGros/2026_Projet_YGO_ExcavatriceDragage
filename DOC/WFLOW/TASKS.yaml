  contexte: 'MES 2026-09-04. Mode "gestion bucket auto" actif par defaut (1 bouton IHM pour desactiver : GVL_IHM.Commun.Cfg.TglEnableCoupledBucketSequencing).
    En MAINT couple (JoystickWinchSelectRequest=0), si l''operateur pousse (descente) et benne pas ouverte -> bascule auto
