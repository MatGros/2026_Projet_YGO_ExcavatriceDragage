    du GEL + garde-fou GEL<->code
  contexte: 'DECISION EXPLOITANT 2026-09-22 : « si c est plus simple et sur d integrer une micro step de sequencage j avais
    dit pas de probleme ... en plus on peut ajouter un message utilisateur pour expliquer ». LE PROBLEME, PROUVE : le GRAFCET
    semi-auto est GELE (DOC/WFLOW/AUDITS/GEL_GRAFCET_SEMIAUTO_20260903.md) ; pour la DECHARGE il ne declare que DEUX sorties
    d AX15B_DUMP_OPEN (step 16) — AT15B-c (option, RepositionRequest -> AX15C) et AT15B (JoystickDeflected AND Benne_Done
