  titre: MAINT WinchSel=0 + benne auto - armement fermeture/ouverture bloque par dependance circulaire (benne fermee non francs ne demarre jamais)
  contexte: 'Trouve en marge de T327 (CC01, 2026-09-20, analyse code, PAS encore confirme par trace) : en pilotage couple (SelJoystickWinch=0) avec benne-auto (TglEnableCoupledBucketSequencing), quand la benne est dans un etat franc oppose au sens demande (ex. franchement ouverte et on demande la montee), rien ne demarre -- contacteurs frein/direction restent ouverts indefiniment. Chaine tracee : FB_BucketCmdArbitration.st:54-58 WinchBothAscentBucketCloseArmed (et :49-53 WinchBothDiveBucketOpenArmed) exige Context.MotionActive=TRUE pour armer la fermeture/ouverture auto de la benne. Context.MotionActive := WinchBothMotionActive (PRG_04_Treuils_Benne.st:309, ArbBucketContext.MotionActive). WinchBothMotionActive (PRG_03_Modes_Cycle.st:141-143) exige Auth.JoystickWinchSelectArbitrated=0. Or Arbitrated ne repasse a 0 que lorsque BucketSeqSatisfied est vrai (FB_Modes.st:385-393), qui exige que la benne soit DEJA dans l etat requis (JoystickPull AND BucketIsClosed, ou JoystickPush AND BucketIsOpen). DEPENDANCE CIRCULAIRE : il faut le mouvement couple actif pour armer la fermeture auto de la benne, mais il faut que la benne soit deja fermee pour activer le mouvement couple. Distinct de T327 (ManualBucketLimitsActive, deja corrige) -- fichiers non touches par T327 (FB_Modes.st, FB_BucketCmdArbitration.st, PRG_03_Modes_Cycle.st explicitement hors scope T327).'
  description: 'Verifier par trace (HUM) la dependance circulaire decrite, puis concevoir un correctif MINIMAL sans elargir le rayon d impact : introduire un signal d intention operateur distinct (ex. WinchBothIntent.OperatorIntentActive, meme calcul que WinchBothMotionActive MOINS la condition Arbitrated=0, homme-mort + mode conserves dans les deux branches joystick/boutons de PRG_03), utilise UNIQUEMENT par ArbBucketContext.MotionActive pour armer WinchBothDiveBucketOpenArmed/WinchBothAscentBucketCloseArmed -- WinchBothMotionActive existant reste INCHANGE pour tout le reste (permis M1/M2 etc.). Point de verification EXPLICITE demande par Mathieu (2026-09-20) : prouver par trace/test que le cycle automatique SEMI_AUTO n est PAS affecte -- la garde (Auth.Mode <> E_Mode.SEMI_AUTO) existe deja dans FB_BucketCmdArbitration.st:50/55 et n est PAS touchee par ce correctif, et SEMI_AUTO utilise un calcul totalement distinct de WinchBothMotionActive/Intent (PRG_03_Modes_Cycle.st:298-311, pilote par instCycleSemiAuto) -- a demontrer, pas seulement affirmer.'
  objectifs:
  - 'Preuve par trace (HUM) de la dependance circulaire : benne franchement ouverte, demande montee couplee WinchSel=0, aucun demarrage, contacteurs a 0 en continu.'
  - 'Correctif localise a PRG_03_Modes_Cycle.st (nouveau champ bus) + PRG_04_Treuils_Benne.st (cablage ArbBucketContext.MotionActive) -- WinchBothMotionActive et ses autres consommateurs (permis M1/M2) strictement inchanges.'
  - 'Preuve explicite (test CI + trace) que le cycle SEMI_AUTO est inchange avant/apres le correctif -- pas seulement une garde de mode citee, un scenario SEMI_AUTO rejoue avec resultat identique.'
  - 'Non-regression WinchSel=2 (jog M2 manuel) et pilotage boutons (TglJoystickMaster=FALSE) : les deux branches de calcul couvertes.'
  - 'Aucun changement sur FB_WinchSync.st, FB_Safety_Winch, ni sur la chaine SafeStop/Enable.'
  contrat: ''
  bloque_par: []
