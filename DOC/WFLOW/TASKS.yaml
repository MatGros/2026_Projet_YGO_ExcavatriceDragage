  avancement: '⏳ Cadrage LIVRE + DECISIONS HUMAINES ACTEES (2026-09-20) par DSH01. Livrables : DOC/WFLOW/AUDITS/DESIGN/CADRAGE_T330_INVARIANT_HAUT_v1.0.md et DOC/WFLOW/AUDITS/DESIGN/PLAN_T330_C3_INVARIANT_HAUT_v1.0.md. Noms reels du code PROUVES : CfgTopSensorPos_M (ST_WinchCfg.st:8, 8,5 m ; M2 ecrase = M1 chaque scan par PRG_07:154-155) et CfgCableLimitAscent_M (ST_CommunCfg.st:21, 7,5 m, commun M1/M2) ; les libelles PositionHomingTop_M / PositionFdcLogicielHaut_M n existent pas dans CODE/. DECISIONS HUMAINES Q1/Q2 du 2026-09-20 : Q1 = DEUX regles distinctes contrôlées SEPAREMENT, ReserveTop_M >= 1,00 m ET WinchSlowdownDistanceTop_M >= 0,50 m, la regle historique reserve <= ralentissement (G483 AC2b) est ABROGEE ; Q2 = NORMALISATION (3e option, ni refus ni etat invalide) : la valeur invalide saisie est corrigee immediatement et l IHM reflete la valeur corrigee, avec message non alarmant, en PRESERVANT le reglage non modifie (FDC trop haut => FDC := TOP - 1,00 m ; TOP trop bas => TOP := FDC + 1,00 m ; slowdown < 0,50 => 0,50 m). Q15 et Q16 RESOLUES ; 2 nouvelles questions bloquantes Q17 (les DEUX champs changent dans le meme scan : lequel preserver ?) et Q18 (la borne 0,50 m n est adossee a AUCUNE mesure de distance d arret). 8 pieges d implementation consignes (section 0ter). Contrat T330 reecrit (AC1..AC7) et valide par check_task_contract.py (PASS). MAINTIEN EXPLICITE : aucun code tant que T291-B B1 reste en cours sur PRG_04/PRG_07 ; verrou 🔒 T330 conserve a la demande de l humain. ZERO code modifie : CODE/, CODE_XML/, types IHM et Device.export intacts. [MAJ CC01 2026-09-20] MAINTIEN LEVE : T291-B B1 remis (commit 55700932). ARBITRAGES HUMAINS Q17-Q28 : Q17 preserver le TOP, corriger le FDC ; Q23 option A pre-bridge (=> Q19/Q20 sans objet) ; Q21 bornes absolues FDC [0 ; 9,00 m] (car TOP <= 10 et TOP-FDC >= 1 ; challenge DSH01 C1 accepte), TOP [1 ; 10 m] (a confronter aux bornes existantes section 2.1) ; Q22 reformulee (challenge C2 accepte) : R2 correction du TOP INHIBEE pendant InReferencingMode, appliquee au scan suivant la sortie du mode avec message ; R1/R3 jamais inhibees ; Q12 guerre d ecriture IHM = LIMITE du lot (C3) ; Q24 ok (sens unique, pas de rebond) ; Q27 AUCUNE tolerance, regle stricte 1,00 m ; Q28 resolu. Phase P1/P2 (spec tests) autorisable, toujours ZERO code ST avant GO P3. [MAJ DSH01 2026-09-20 T330 P1/P2 LIVRE] PLAN C3 revise en v1.2 (remplacement en place, revision interne) : Q17 a Q28 TOUTES FERMEES et tracees avec leur source (section 1), C1/C2/C3 integres (C1 borne FDC corrigee a [0 ; 9,00 m] AVEC demonstration arithmetique FDC <= TOP - 1 et TOP <= 10 => FDC <= 9, et verification que R2 ne peut plus sortir de borne ; C2 R2 INHIBEE pendant InReferencingMode, R1/R3 jamais, avec message de correction differee ; C3 guerre d ecriture IHM tracee comme LIMITE du lot, AUCUN test IHM en P2). MATRICE AC <-> TC <-> ORACLE <-> PREUVE FIGEE (section 4) : 37 cas, bloc TC-P10-052-088, chacun avec oracle NUMERIQUE. DECOUVERTE pendant l integration : mon premier bloc propose TC-P10-035-071 COLLISIONNAIT des familles de variantes existantes (TC-P10-036.1, 037.1, 039.1, 044.1 a 048.1, 051.1 deja presentes dans HEAD) ; mesure exhaustive des numeros AF-10 utilises (1-16, 20-34, 36, 37, 39, 44-48, 51) => premier bloc contigu libre de 37 = 52-399, donc renumero en TC-P10-052-088. G470 : 156 TC uniques et 16 problemes d unicite AVANT et APRES mon edition (identique a HEAD, verifie par comparaison --matrix) => aucun probleme introduit ; mon bloc n apparait dans AUCUN recouvrement. G504 SPECIFIE (7 controles, entrees, sortie, exclusions de faux positifs) et enregistrement PLANS erige en CRITERE D ACCEPTATION (REX garde-fou mort-ne : G490 et G499_check_t291b_top_authority.py existent mais sont absents de PLANS donc ne s executent jamais). G483 : liste EXACTE des lignes a retirer (docstrings 15-16 et 17-18, bloc 164-175, helper value 166-168, lecture GVL_PERSISTENT 165) ; G483 restera ROUGE sur AC1 (Q11 ouverte, independante de T330) -- aucun faux vert annonce. SIGNALEMENTS : AF-07 ne declare AUCUNE fonction dans af_traceability_matrix.yaml alors que la normalisation y appartient logiquement => TC rattaches a AF-10 faute de fonction AF-07 ; restriction de perimetre reconciliee explicitement (af_traceability_matrix.yaml est sous TOOLS/ mais autorise nominativement, sinon AC3 serait inexecutable). check_task_contract.py PASS. ZERO code ST, ZERO CODE_XML, ZERO IHM ecrits. P3 (code) attend un GO DISTINCT et la livraison de T255-D (FB_Hmi_BannerFormatter.st : T255-D se declare seul ecrivain, et PRG_07:140-196 est interdit a T255-D reciprocquement). [MAJ DSH01 2026-09-20 T330 P1/P2 - SECTION 2.7bis AJOUTEE] Deux PIEGES du gating R2 (decision C2/Q22) identifies par l orchestrateur et traites dans le plan : (1) HomingLifecycle.Busy SEUL ne couvrirait que la transaction de preset (~50 ms, CST_PresetVerifyTime) alors que le homing machine dure tout HX0..HX6 => le gating doit combiner PRG_02.Data.MachineHoming.Active OR EncoderM1/M2 HomingLifecycle.Busy, sinon Q22 n est PAS satisfait (fenetre de protection 50 ms au lieu du homing entier) ; (2) la detection quel champ a change est SUR FRONT, donc une R2 inhibee pendant le homing ne se declencherait JAMAIS a la sortie (plus de front) => la correction differee exigee par Q22 serait SILENCIEUSEMENT PERDUE => 1 memoire NON persistante requise (R2PendingTopCorrection, armee pendant le homing, relue et desarmee a la sortie, idempotente), autorisee par AC3 car ce n est ni un reglage IHM ni un RETAIN. TC-P10-078 renforce : il couvre desormais INHIBITION pendant + APPLICATION DIFFEREE a la sortie + IDEMPOTENCE + variante auto-correction operateur. Verifications d integrite : 37 lignes de test, 37 IDs distincts TC-P10-052-088, AUCUN doublon ; bloc contigu, rien hors bloc. Une erreur de ma propre edition a ete detectee et corrigee AVANT livraison (TC-P10-079 etait deja pris par HomingSuspect - le sous-cas a ete replie dans TC-P10-078 sans creer de nouvel ID).'
