  contexte: 'DECOUVERTE DU TRIAGE CI 2026-09-22 (agent b496437e, rapport DOC/WFLOW/AUDITS/DESIGN/AUDIT_TRIAGE_WINCH_INTEG_20260922.md,
    195 lignes) ET VERIFIEE EN PREMIERE MAIN PAR L ORCHESTRATEUR SUR LES SOURCES. LE FAIT : l assertion du harnais WINCH_INTEG
    est « HARN-80 : CAS-001 retombee contacteur EN MARCHE (feedback incoherent) -> defaut + neutralisation (CIBLE T180) »
