    déterministe (déclencheur événementiel : retour PDO / état codeur), en conservant la garantie de non-validation d''un
    preset non appliqué (ReadbackOk dans CST_HomingVerifyToleranceM avant Calib.Homed := TRUE). Criticité C4 : fiabilité du
    référencement codeur.

    '
  objectifs:
  - Supprimer CST_PresetVerifyTime et PresetVerifyTimer de FB_Encoder_Homing.st
  - Déclencher la vérification preset par un événement déterministe, pas un timeout
