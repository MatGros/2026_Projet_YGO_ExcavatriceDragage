contract:
  task_id: T377-B
  criticality: C4
  strategy: patch

  objective: >
    Supprimer les défauts parasites de démarrage (perte codeur M1/M2, échec autotest AU) en retardant
    leur armement jusqu'à ce que leurs préconditions soient valides, sans jamais effacer un défaut
    de sécurité réel ni réarmer automatiquement en marche.

  acceptance:
    - id: AC1
      statement: "Au redémarrage du PLC sous puissance, bus sain, aucun défaut de perte codeur M1/M2 n'est armé et ArmingErrorId vaut 0."
      verified_by: "snapshot Troubleshooting avant/après redémarrage : EncoderFaultLatched M1/M2 = FALSE, ArmingErrorId = 0 (sortie brute)"
    - id: AC2
      statement: "Un codeur réellement mort au démarrage est armé au plus X secondes après le démarrage, et aucun mouvement n'est possible avant."
      verified_by: "essai ou simulation avec codeur débranché + trace horodatée ; X mesuré, valeur citée"
    - id: AC3
      statement: "Une perte codeur en marche, après un premier OP du bus, arme le défaut immédiatement (comportement actuel conservé)."
      verified_by: "test unitaire C_DIAG_RESEAUX / SimBench : OP vu puis perte ⇒ latch au scan suivant"
    - id: AC4
      statement: "Après un AU puis rebouclage, la perte codeur consécutive arme immédiatement le défaut."
      verified_by: "test SimBench : flag OP déjà vrai, perte ⇒ latch immédiat"
    - id: AC5
      statement: "Démarrage à froid, boucle AU ouverte : l'autotest AU n'échoue pas tant que la boucle n'a jamais été fermée ; après le premier rebouclage il est évalué, et un AU réellement en défaut arme le défaut."
      verified_by: "test PLC sur FB_Safety_EmergencyManagement + essai terrain démarrage à froid"
    - id: AC6
      statement: "Aucun défaut de sécurité armé n'est effacé automatiquement, hors l'impulsion de repli unique décrite en AC8."
      verified_by: "revue de code du diff + test déterministe : aucun chemin d'effacement automatique hors AC8"
    - id: AC7
      statement: "Chaque mécanisme (prévention codeur, report de l'autotest AU, impulsion de repli) a son bit Tgl dédié ; défaut = comportement actuel."
      verified_by: "test : bits à FALSE ⇒ comportement identique à la version précédente (non-régression)"
    - id: AC8
      statement: "L'impulsion de repli, si activée, est émise une seule fois après la fin du boot + 5 s, limitée à la perte codeur, jamais en marche, jamais sur un retour de bus, jamais sur l'autotest AU."
      verified_by: "test : défaut réel présent ⇒ ré-armé au scan suivant ; autotest AU intact ; aucune impulsion en marche"
    - id: AC9
      statement: "X est mesuré sur la machine (démarrage à froid et après retour contacteur) avant d'être figé."
      verified_by: "relevé horodaté du temps de montée à OP des codeurs M1/M2, noté au registre de mise en service"

  scope:
    allowed:
      - CODE/H_TREUILS_BENNE/FB_Safety_Winch.st
      - CODE/C_DIAG_RESEAUX/FB_Diag_Ethercat.st
      - CODE/B_AU_SECURITE/FB_Safety_EmergencyManagement.st
      - CODE/J_SUPERVISION/FB_Hmi_BannerFormatter.st
    forbidden:
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - CODE/E_CODEURS/FB_Encoder_Abs.st
      - TOOLS/AGENT_WORKFLOW/scripts/task_scope.py
      - DOC/WFLOW/TASKS.yaml

  conservation:
    must_survive:
      - "Armement immédiat de la perte codeur en marche (AC3, AC4)"
      - "Cause 0 (communication opérateur) et toutes les autres causes de FB_Safety_Winch"
      - "Reset opérateur sur front, jamais conditionné"
    dropped_on_purpose:
      - "Armement de la perte codeur avant le premier OP du bus (retardé de X secondes, décision exploitant 2026-11-18)"

  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle

  models_allowed:
    - "omni/cc/claude-sonnet-5"
    - "omni/cx/gpt-5.6-terra"

  alert_duty: >
    Tout probleme constate en cours de route (incoherence de spec, bug
    preexistant, risque hors scope) est remonte IMMEDIATEMENT a l'orchestrateur,
    pas a la fin et jamais silencieusement. Signaler n'est pas elargir le scope.

