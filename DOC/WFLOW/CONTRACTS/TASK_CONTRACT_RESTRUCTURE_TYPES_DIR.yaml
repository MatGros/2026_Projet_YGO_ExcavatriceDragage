      - CODE/MAIN/
      - ARCHIVES/

  # ── 4. Contrat de conservation ────────────────────────────────────────────
  conservation:
    must_survive:
      - "Les 77 DUT conservent leur contenu exact, nom de fichier et déclaration TYPE ST_* à l'identique."
      - "Aucune modification de syntaxe ST ni de logique automate."

  # ── 5. Preuves attendues en restitution ───────────────────────────────────
  evidence_required:
    - bundle_freshness
    - linkage_report
    - all_gates_pass

  # ── 6. Modeles autorises ──────────────────────────────────────────────────
  models_allowed:
    - "inherit"

  # ── 7. Devoir d'alerte ────────────────────────────────────────────────────
  alert_duty: >
    Si un fichier DUT ne rentre dans aucune des 8 catégories ou si un script
    externe non identifié dépendait d'un chemin fixe de DUT, remonter
    immédiatement.

