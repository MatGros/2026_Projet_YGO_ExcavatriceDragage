      - TOOLS/AGENT_WORKFLOW/scripts/G380_check_config_persistence.py
      - TOOLS/AGENT_WORKFLOW/config/naming_baseline.json
      - DOC/WFLOW/CONTRACTS/TASK_CONTRACT_RESTRUCTURE_TYPES_DIR.yaml
      - DOC/WFLOW/PLAN_TASK.md
