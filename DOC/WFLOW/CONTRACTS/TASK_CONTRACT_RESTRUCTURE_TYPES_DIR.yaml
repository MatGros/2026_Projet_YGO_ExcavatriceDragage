      verified_by: >
        python TOOLS/AGENT_WORKFLOW/scripts/G380_check_config_persistence.py sort en PASS.

    - id: AC3
      statement: >
        La baseline de nommage naming_baseline.json est mise à jour avec les nouveaux chemins,
        et G110_check_naming_style.py valide 100% de conformité sans régression.
      verified_by: >
        python TOOLS/AGENT_WORKFLOW/scripts/G110_check_naming_style.py sort en PASS.

    - id: AC4
      statement: >
        Le générateur PLCopenXML produit un bundle fresh sans erreur.
      verified_by: >
        python TOOLS/AGENT_WORKFLOW/scripts/generate_codesys_bundle.py . sort en PASS.

    - id: AC5
      statement: >
        La vérification mécanique de liaison globale sort en PASS.
      verified_by: >
        python TOOLS/AGENT_WORKFLOW/scripts/G200_check_linkage.py sort en PASS.

    - id: AC6
      statement: >
        Tous les gates du projet (A, B, C) restent 100% au vert.
      verified_by: >
        python TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py --palier C sort en code 0.

  # ── 3. Perimetre ──────────────────────────────────────────────────────────
  scope:
    allowed:
