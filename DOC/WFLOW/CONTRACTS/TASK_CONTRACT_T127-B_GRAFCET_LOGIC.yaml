contract:
  task_id: T127-B_GRAFCET_LOGIC
  criticality: C4
  strategy: patch
  objective: >
    Implémenter la logique interne fluide des sous-cycles FB_DiveSearch (recherche Kobold 4 temps à la volée,
    bridage strict Palier <= 4, protection thermique, repli de sécurité) et FB_ExtractionSequence (maintien joystick
    continu, fermeture, décollage basse vitesse, palier de contrôle, accélération nominale), ainsi que la coordination
    dans FB_Cycle.st avec tests unitaires STruCpp validés à 100%.
  acceptance:
    - id: AC1
      statement: "FB_DiveSearch implémente la séquence d'auto-test et recherche Kobold en 4 temps à la volée sans arrêt intempestif du mouvement (Vérif DI=0 au repos -> Commande contacteur + T081 -> Vérif DI=1 -> Descente continue Palier <= 4 -> Détection front descendant 1->0 -> Contact fond confirmé + Coupure contacteur)."
      verified_by: "Tests unitaires STruCpp et simulation de chronogramme de plongée."
    - id: AC2
      statement: "FB_DiveSearch interdit formellement le Palier 5 de vitesse lors de la recherche Kobold (bloque la descente avec défaut explicite si Palier 5 tenté)."
      verified_by: "Test unitaire de dépassement de palier sous STruCpp."
    - id: AC3
      statement: "En cas d'interruption opérateur (relâchement joystick) sous le seuil d'eau sécurisé pendant la plongée, FB_DiveSearch impose un repli par remontée benne fermée jusqu'à l'altimétrie de dégagement CfgSafeReentryDepthM avant toute nouvelle plongée."
      verified_by: "Test unitaire d'interruption et de repli obligatoire."
    - id: AC4
      statement: "FB_ExtractionSequence enchaîne de façon fluide et continue (avec maintien constant du joystick par l'opérateur) : fermeture benne -> décollage fond -> palier de contrôle dynamique (vérif stabilisation & écart codeurs M1/M2) -> accélération nominale vers la surface."
      verified_by: "Tests unitaires STruCpp de la séquence d'extraction complète."
    - id: AC5
      statement: "FB_Cycle coordonne les sous-cycles, mémorise l'étape en cours lors d'une bascule en mode Maintenance, et exige un réarmement explicite (StartCycle) sans reprise automatique spontanée lors du retour en Semi-Auto."
      verified_by: "Tests TC-P04-001 à TC-P04-013 sous STruCpp."
    - id: AC6
      statement: "Le bundle PLCopenXML est régénéré, G200 Linkage est vert (0 erreur) et la suite de tests STruCpp du domaine G_CYCLE réussit à 100%."
      verified_by: "generate_codesys_bundle.py, G200_check_linkage.py et run_tests.py."
  scope:
    allowed:
      - CODE/G_CYCLE/FB_DiveSearch.st
      - CODE/G_CYCLE/FB_ExtractionSequence.st
      - CODE/G_CYCLE/FB_Cycle.st
      - CODE/G_CYCLE/_TYPES/**
      - TOOLS/TEST_AUTO_CI/RESULTS/G_CYCLE/**
      - DOC/WFLOW/CONTRACTS/TASK_CONTRACT_T127-B_GRAFCET_LOGIC.yaml
      - DOC/WFLOW/TASKS.yaml
    forbidden:
      - PRJ_CODESYS/**
      - Device.export
  conservation:
    must_survive:
      - "Interface standard AF-03 §3 (Ready, Fault, Lifecycle, OperatorActionId)."
      - "Sorties de commandes actionneurs WinchM1Cmd, WinchM2Cmd, TranslationCmd, BucketCmd."
      - "Compatibilité avec PRG_03_Modes_Cycle.st et PRG_07_Supervision.st."
    dropped_on_purpose: []
  evidence_required:
    - strucpp_compilation
    - unit_tests
    - check_linkage
    - run_all_gates
    - bundle
  models_allowed:
    - "deepseek-v4-flash:cloud"
    - "inherit"
  alert_duty: "Tout blocage de mouvement non sollicité ou rupture de continuité du geste opérateur lors des transitions constitue une non-conformité majeure."
