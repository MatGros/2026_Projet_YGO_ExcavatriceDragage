validation:
  status: PENDING            # PENDING | APPROVED | REJECTED
  validated_by: "..."        # Ex: Claude Code (Orchestrateur)
  validated_at: "..."        # Timestamp ISO
  notes: >
    Contrat C2 actualise le 2026-09-22 (DSH31) : decision humaine modifiee — le
    reset est envoye QUASI SANS CONDITION sur front Reset (ResetEdge.Q), meme
    sans defaut AC600 actif, en impulsion temporisee ~100 ms puis retour a 0.
