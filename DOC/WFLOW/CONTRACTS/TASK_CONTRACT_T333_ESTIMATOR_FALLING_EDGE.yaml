      - CODE/M_MAIN/PRG_05_Translation.st
      - CODE/M_MAIN/PRG_04_Treuils_Benne.st
      - CODE/M_MAIN/PRG_07_Supervision.st
      - CODE/L_SIMULATION/
      - CODE/I_TRANSLATION/FB_Translation_PositionDecoder.st
      - DOC/STDS/NAMING_CONVENTION.md

  conservation:
    must_survive:
      - "Recalage sur front montant des 5 capteurs (comportement actuel vers la Tremie) : TC-P11-EST-005 doit rester PASS"
      - "Init a froid depuis PersistedPositionM/PersistedInitialized au premier scan utile (ColdStart) et non-recalage au 1er scan (FirstScanDone) : TC-P11-EST-001 reste PASS"
      - "Integration odometrique par sens (ReqTremie = negatif, ReqMaintenance = positif) et neutralisation d'une demande contradictoire"
      - "Sortie PositionEstimatedM et Initialized maintenues hors Enable, pour la recopie persistante de PRG_05:596-597"
      - "Interface FB inchangee : aucun VAR_INPUT/VAR_OUTPUT ajoute, retire ou renomme"
    dropped_on_purpose:
      - "Aucun : le lot ne retire aucun comportement existant, il en ajoute un (front descendant)"

  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle
    - diff_bundle
    - ci_before_after

  models_allowed:
    - "deepseek-v4.1-flash:cloud"

  alert_duty: >
    Tout ecart entre l'audit et les faits, toute cause alternative, tout consommateur aval de
    PositionEstimatedM decouvert, et toute question de geometrie de came non documentee sont
    remontes immediatement a l'orchestrateur. Ecarts deja constates et signales dans l'en-tete :
    (1) la premisse "le chariot est a ~5 m" de H2 (§3.4 de l'audit) est refutee par le §3.5 du
    meme document (position vraie ~0,31 m), tandis que la MAGNITUDE du saut n'est pas decidable
    sur la trace (elle vaut -(P0 + ~0,04 m) et P0 n'est pas trace) ; mon premier jet de contrat
    avait avance un facteur de surestimation, retracte ici faute de fondement ;
    (2) la fiche du composant annonce un bornage [0,0 ; 30,0] m que le code n'applique pas
    (LIMIT ±0,5 m, fiche v1.0:162 vs code :146) ;
    (3) TASKS.yaml porte T333 en statut "a faire" alors que ce contrat est IN_PROGRESS
    (incoherence de registre a arbitrer par l'orchestrateur, fichier non touche par ce lot car
    ecrit par un autre agent).
    Signaler n'est pas elargir le perimetre : H3, H5, H6, H7, H8, H9 et le gain odometrique
    (T301) restent hors de ce lot.

