contract:
  task_id: T185_REFACTOR_FB_MACHINEHOMINGCYCLE
  criticality: C4
  strategy: patch
  objective: >
    Au demarrage ou apres perte de coherence, publier une qualification machine et
    un guide de referencement M1/M2/benne ; les actions restent libres en MAINT_N2,
    mais SEMI_AUTO est interdit tant que deux codeurs fiables et un offset benne
    confirme visuellement ne rendent pas la reference machine valide.
  acceptance:
    - id: AC1
      statement: "Une confirmation Ouverte/Fermee est refusee hors MAINT_N2, hors capteur haut commun ou lorsque les treuils ne sont pas a l'arret mecanique confirme."
      verified_by: "TC integration N2 : trois vecteurs de refus et assertion ActiveOffsetValid=FALSE."
    - id: AC2
      statement: "Une confirmation admissible declenche le homing M1 et M2 dans le meme cycle de commande ; M2 utilise la cible dynamique correspondant a l'etat visuellement confirme."
      verified_by: "TC integration : assertions HomingAtTargetM M1/M2 et cible M2."
    - id: AC3
      statement: "IsOpen/IsClosed et ActiveOffsetValid restent invalides jusqu'au succes des deux homings, puis sont publies atomiquement."
      verified_by: "TC integration multi-scan : assertions avant/apres les deux retours HomingLifecycle.Done."
    - id: AC4
      statement: "Echec homing M1 ou M2, perte du capteur haut, ou mouvement pendant la sequence invalide l'etat benne et conserve ActiveOffsetValid=FALSE."
      verified_by: "TC integration : quatre vecteurs d'abandon."
    - id: AC5
      statement: "La recuperation Both conserve le clamp palier 1 tant que ActiveOffsetValid est FALSE ; SyncDeviationWarn n'est pas bypassed globalement."
      verified_by: "HARN WINCH_INTEG : demande Both en N2 sans offset valide -> M1=M2=palier 1."
    - id: AC6
      statement: "G200, bundle et gates palier C sont verts ; aucun TC vert existant ne regresse."
      verified_by: "generate_codesys_bundle.py, G200_check_linkage.py --report, run_all_gates.py --palier C."
    - id: AC7
      statement: "L'IHM publie une instruction unique et actionnable pour chaque etape de recuperation : selection N2, montee Both lente, arret mecanique, choix visuel benne, homing conjoint en cours, succes ou echec."
      verified_by: "TC integration : oracle sur le code et le texte de l'etape publiee pour chaque precondition manquante et chaque transition."
    - id: AC8
      statement: "Le cycle distingue explicitement codeur M1 non reference, codeur M2 non reference, doute de coherence codeur et offset benne inconnu ; aucune de ces causes n'est masquee par un message SyncDeviationWarn generique."
      verified_by: "TC simulateur : injection de chaque cause et assertion de l'etape/diagnostic publie."
    - id: AC9
      statement: "L'operateur peut demander M1, M2 ou choisir l'etat benne dans un ordre libre ; le choix benne est memorise comme attente et ne devient valide qu'apres les deux homings fiables."
      verified_by: "TC integration : trois ordres d'action distincts, meme etat final ReferenceMachineReady."
    - id: AC10
      statement: "L'IHM propose Benne fermee comme choix initial du parcours, mais aucune valeur IsClosed/IsOpen n'est forcee sans confirmation explicite de l'operateur."
      verified_by: "À vérifier par un TC IHM/intégration : présélection fermée sans front = aucun commit ; confirmation fermée = commit fermé."
    - id: AC11
      statement: "L'operateur peut remplacer le choix propose par Benne ouverte ; le homing conjoint et le commit atomique suivent le meme contrat."
      verified_by: "À vérifier par un TC IHM/intégration : confirmation ouverte après changement de choix = commit ouvert exclusif."
    - id: AC12
      statement: "Critère structurel (scope CODE/M_MAIN) : pour chaque fichier modifié, le nom de fichier est identique au nom de POU ; aucun suffixe de langage _CFC/_LD n'est ajouté et le suffixe reste identique au langage généré dans le bundle."
      verified_by: "G310 structure + génération bundle PLCopenXML."
  scope:
    allowed:
      - CODE/G_CYCLE/FB_MachineHomingCycle.st
      - CODE/H_TREUILS_BENNE/BENNE/FB_Bucket.st
