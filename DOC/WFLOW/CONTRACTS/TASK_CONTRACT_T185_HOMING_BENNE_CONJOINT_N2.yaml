  conservation:
    must_survive:
      - "Les commandes de homing unitaire existantes BtnHome M1 et M2."
      - "Les sequences normales d'ouverture et fermeture de FB_Bucket."
      - "Les interlocks materiels et le clamp SyncDeviationWarn hors recuperation explicite."
    dropped_on_purpose:
      - "Le recalage immediat de M2 seul par BtnConfirmOpenPos/BtnConfirmClosePos en MAINT_N1 ou MAINT_N2."
  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle
  models_allowed:
    - "deepseek-v4-flash:cloud"
    - "omni/cx/gpt-5.6-terra"
  alert_duty: >
    Stopper avant toute approximation si le capteur haut commun n'est pas exploitable
    comme precondition booleenne active, si le retour de succes homing M1/M2 ne peut
    pas etre observe sans acces aux internes, ou si le harnais ne peut pas couvrir
    l'atomicite multi-scan.
