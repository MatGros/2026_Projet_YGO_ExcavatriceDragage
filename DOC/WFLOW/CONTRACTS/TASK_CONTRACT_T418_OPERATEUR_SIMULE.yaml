      statement: Un nouvel appui unique produit appui armement, debattement puis relachement armement dans cet ordre.
      verified_by: Tests ST FB_Sim_Joystick et integration SimOperatorJoystick avec FB_Joystick reel.
    - id: AC2
      statement: Apres relachement du bouton armement simule, la demande axe reste active si le permis reel est conserve.
      verified_by: Integration ST SimOperatorJoystick, assertions sur DeadmanArmed et AxisCmdX/Y.
    - id: AC3
      statement: Annulation pendant armement ne produit aucun debattement differe; relachement en mouvement ramene au neutre.
      verified_by: Tests ST annulation et retour dynamique.
    - id: AC4
      statement: Une direction deja tenue au demarrage, une inversion directe ou plusieurs directions exigent relachement complet et retour neutre avant un nouveau geste.
      verified_by: Tests ST activation, reactivation, conflit et inversion.
    - id: AC5
      statement: Perte de permis reel neutralise le mouvement; le simulateur ne genere aucun nouvel appui automatique pendant le maintien IHM.
      verified_by: Integration ST refus et perte ArmingPermit avec FB_Joystick reel.
    - id: AC6
      statement: Hors Enable le banc rend HwReal et reinitialise le geste; le stimulus brut manuel reste utilisable hors geste automatique.
      verified_by: Tests ST FB_SimBench repli et priorite des sources.
    - id: AC7
      statement: Le code de production hors deux fichiers simulation reste identique au checkpoint 9630ddb5; aucun etat arme reel n'est force.
      verified_by: Diff Git borne et garde-fou automatique avec mutations.
    - id: AC8
      statement: Les fronts simules sont observes par le vrai homing et tout lancement HX1 est signale sans le masquer.
      verified_by: Integration ST SimOperatorJoystick avec FB_CycleMachineHoming reel.
    - id: AC9
      statement: Bundle complet et diff frais, G200 PASS, resultats gates et CI documentes puis revue expert independante.
      verified_by: generate_codesys_bundle.py, generate_codesys_diff_bundle.py, G200 --report, run_all_gates.py et rapport de revue.
    - id: AC10
      statement: Le selecteur effectif operateur desactive et reinitialise le geste; aucune reprise tenue apres reselection, phases armement, mouvement et retour couvertes.
      verified_by: Tests ST SimOperatorJoystick et G528 sur le raccordement OperatorInputSourceSimulated.
    - id: AC11
      statement: Le traitement joystick, homing, trois commandes manuelles de reference et cycle reste identique au tag MES_FIN_20260923; reference etablie puis N1 et SEMI_AUTO ne lancent aucun HX1 par geste joystick.
      verified_by: audit_t418_commissioning_baseline.py et TC-T418-INT-009 avec vrais FB joystick et homing; ne constitue pas un essai cycle machine complet.
    - id: AC12
