contract:
  task_id: T216_PERMITS_DIRECTIONNELS_UNIQUES
  criticality: C4
  strategy: rebuild
  related_tasks_preserved:
    - "T176 : producteur ArmingPermit légitime et test anti-câblage littéral"
    - "T202-C : un seul permis homme-mort cycle et neutralisation centralisée"
    - "T204 : permis M3 appliqué à la commande"
    - "T184 : nomenclature M3 et projection IHM"
  objective: >
    Rendre chaque autorisation de mouvement M1, M2 et M3 unique, directionnelle,
    traçable et effectivement appliquée, avec atomicité stricte de la commande Both M1/M2.

  naming_frozen:
    - "EffectivePermitM1_Ascent : BOOL"
    - "EffectivePermitM1_Descend : BOOL"
    - "EffectivePermitM2_Ascent : BOOL"
    - "EffectivePermitM2_Descend : BOOL"
    - "EffectivePermitBucket_Open : BOOL"
    - "EffectivePermitBucket_Close : BOOL"
    - "EffectivePermitM3_Maintenance : BOOL"
    - "EffectivePermitM3_Tremie : BOOL"

  acceptance:
    - id: AC1
      statement: "Chaque axe et sens possède un unique EffectiveDirectionPermit et un BlockReason publié."
      verified_by: "matrice producteur-route-consommateur, grep des consommateurs et revue du diff"
    - id: AC2
      statement: "Une commande Both M1/M2 ne produit jamais un départ isolé : chaque sens démarre les deux treuils ou aucun."
      verified_by: "tests CI BothUp/BothDown avec refus unilatéral, synchronisation et délais finaux dissymétriques"
    - id: AC3
      statement: "Un permis FALSE dans l'IHM/diagnostic interdit réellement la sortie correspondante."
      verified_by: "tests de chaîne permis -> commande -> interverrouillage final -> DQ"
    - id: AC4
      statement: "Le plancher MinStepDown ne relance jamais une descente lorsque le permis effectif est FALSE."
      verified_by: "test de régression DescendPermit=FALSE, MinStepDown=1 -> StepNumber=0 et sorties=0"
    - id: AC5
      statement: "Les commandes unitaires M1, M2 et le mouvement M2 explicitement piloté par la benne restent des exceptions identifiées et testées."
      verified_by: "tests de non-régression par source de commande et revue IHM"
    - id: AC6
      statement: "Les permis M3 Trémie et Maintenance ont une sémantique directionnelle, un producteur unique et un consommateur de commande identifié."
      verified_by: "matrice M3 code/AF/IHM et tests des deux sens, y compris accès P1"
    - id: AC6bis
      statement: "Les déplacements benne ouverture et fermeture restent bornés chacun par leur fin de course logicielle ; leurs permis et raisons de blocage sont distincts et visibles."
      verified_by: "matrice benne ouverture/fermeture : limite -> permis -> commande M2 -> diagnostic, et tests aux deux bornes"
    - id: AC7
      statement: "Le nom du fichier est identique au nom du POU ; le suffixe est égal au langage ST du bundle PLCopenXML."
      verified_by: "inspection des déclarations POU et bundle généré"
    - id: AC8
      statement: "Le cycle ne conserve qu'un permis humain commun et neutralise ses demandes en un site ; les limites propres de benne restent des causes directionnelles distinctes."
      verified_by: "lecture FB_Cycle et matrice benne : aucune limite Open/Close supprimée ou masquée"
    - id: AC9
      statement: "Aucune frontière fonctionnelle de demande, permis, commande, IHM ou inter-POU ne transporte Direction: INT ni le couple StartStop+Direction ; chaque sens est porté par un BOOL nommé selon l'axe."
      verified_by: "audit rg des interfaces actives + matrice Req/Permit/commande M1, M2, benne et M3"
    - id: AC10
      statement: "Une double demande de sens sur un même axe est détectée, publiée et rend l'ordre de mouvement nul ; aucun choix implicite de priorité n'est admis."
      verified_by: "tests CI M1/M2/M3 : deux Req directionnelles TRUE -> aucune sortie actionneur"
    - id: AC11
      statement: "Un plancher MinStepDown nul hors plongée ne peut jamais maintenir un palier pendant une inversion ; avec un plancher de plongée, l'injection attend l'adoption effective du sens descente."
      verified_by: "relecture chaîne PRG_04 -> FB_WinchDirectionInterlock -> FB_Winch et essai CODESYS : reprise descente après montée, hors plongée puis avec MinStepDown=4"

  scope:
    allowed:
      - CODE/D_JOYSTICK/FB_Joystick.st
      - CODE/F_MODES/FB_Modes.st
      - CODE/G_CYCLE/FB_Cycle.st
      - CODE/H_TREUILS_BENNE/FB_Winch.st
      - CODE/H_TREUILS_BENNE/FB_Bucket*.st
      - CODE/H_TREUILS_BENNE/FB_WinchCmdArbitrationM1.st
      - CODE/H_TREUILS_BENNE/FB_WinchCmdArbitrationM2.st
      - CODE/I_TRANSLATION/FB_Translation.st
      - CODE/I_TRANSLATION/FB_TranslationCmdArbitrationM3.st
      - CODE/J_SUPERVISION/FB_TroubleshootingView.st
      - CODE/J_SUPERVISION/FB_Hmi_BannerFormatter.st
      - CODE/M_MAIN/PRG_02_Acquisition.st
      - CODE/M_MAIN/PRG_03_Modes_Cycle.st
      - CODE/M_MAIN/PRG_04_Treuils_Benne.st
      - CODE/M_MAIN/PRG_05_Translation.st
      - CODE/M_MAIN/PRG_07_Supervision.st
      - CODE/J_SUPERVISION/_TYPES/
      - DOC/AF/
      - DOC/WFLOW/
      - TOOLS/TEST_AUTO_CI/
      - TOOLS/AGENT_WORKFLOW/scripts/
    forbidden:
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - ARCHIVES/

  conservation:
    must_survive:
      - "AU matériel et PowerCutOff restent indépendants et prioritaires."
      - "Aucun redémarrage automatique après défaut ou arrêt de sécurité."
      - "Modes unitaires M1/M2 et commande benne M2 demeurent possibles seulement par sources explicitement identifiées."
      - "Le trajet M3 autorisé vers P1 est préservé tant que la règle métier le confirme."
    dropped_on_purpose:
      - "Gates directionnels cachés ou doublons qui ne publient ni permis effectif ni raison de blocage."

  evidence_required:
    - matrix_producer_route_consumer
    - test_fix_guard
    - check_linkage
    - bundle
    - run_all_gates
    - human_design_validation

  alert_duty: >
    Toute divergence AF/code, toute exception unitaire non documentée ou tout veto final
    non reflété dans le permis doit être signalé avant toute implémentation.

status: IN_PROGRESS
execution:
  executed_by: Codex
  status: IN_PROGRESS
  summary: "Cartographie parallèle et plan d'intégration avant modification ST."
  evidence_submitted: []
validation:
  status: PENDING
  notes: "Politique validée : un permis effectif unique par axe/sens ; Both = deux ou aucun."
