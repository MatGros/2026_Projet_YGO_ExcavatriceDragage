# Contrat T301 — V2 (2026-10-28) : calculateur de position M3, réglage site simple (= lot L0 du chantier simu M3)
# V1 (2026-09-15, jamais exécutée) : procédure documentaire seule. V2 : coefficient calculé par le programme.
# Plan : DOC/WFLOW/AUDITS/DESIGN/SIMU_M3_REALISTE_20261028/PLAN_SIMU_M3_REALISTE.md
contract:
  task_id: T301
  criticality: C2
  strategy: patch
  objective: >
    Sur site, l'exploitant règle le calculateur de position M3 avec uniquement des valeurs
    mesurables : les 5 positions des capteurs (Trémie = 0) et le temps chronométré (trace ou
    chrono) entre P2 et PV à fréquence stable. Le programme en déduit seul le coefficient
    m/(Hz·s) = |PosP2 - PosPV| / (CalibFreq × CalibTime). Valeurs par défaut réalistes
    (0 / 1,5 / 3,5 / 5 / 10 m, 50 Hz, 2,0 s ⇒ 0,02 = valeur actuelle).
  acceptance:
    - id: AC1
      statement: "Le gain consommé par FB_Translation_PositionEstimator vaut |_TranslationPosP2_M - _TranslationPosPV_M| / (_TranslationCalibFreq_Hz × _TranslationCalibTime_S)."
      verified_by: "Test CI dédié (PRG_05 ou fonction de calcul) : 2 m, 50 Hz, 2 s → 0,02 ; 2 m, 50 Hz, 2,86 s → 0,014 (±1e-4)."
    - id: AC2
      statement: "Fréquence, temps ou distance ≤ 0 : le gain retombe sur _TranslationGainMetersPerHzSec (repli) et un témoin booléen de réglage invalide est vrai ; jamais de division par zéro."
      verified_by: "Test CI : 3 cas invalides (Freq=0, Time=0, PV=P2) → gain = repli, témoin TRUE ; cas valide → témoin FALSE."
    - id: AC3
      statement: "Valeurs par défaut GVL_PERSISTENT : Trémie 0, PV 1,5, P2 3,5, P1 5, Maintenance 10, CalibFreq 50, CalibTime 2,0 ; gain résultant = 0,02 (inchangé)."
      verified_by: "Lecture de GVL_PERSISTENT.st + test AC1 avec les défauts."
    - id: AC4
      statement: "Les 2 nouvelles persistantes sont ajoutées EN FIN de VAR_GLOBAL PERSISTENT RETAIN (après _RunningHoursM3_S) ; aucune variable existante supprimée, renommée, retypée ni déplacée."
      verified_by: "git diff de GVL_PERSISTENT.st : seuls 5 littéraux de défaut changés + 2 lignes ajoutées en fin."
    - id: AC5
      statement: "Logique de translation, recalage 5 capteurs, persistance de la position estimée et interface de FB_Translation_PositionEstimator inchangés."
      verified_by: "git diff : FB_Translation_PositionEstimator.st, FB_Translation*.st, PRG_06 intouchés ; CI FB_Translation_PositionEstimator 100 % PASS."
    - id: AC6
      statement: "Le gain calculé et le témoin sont lisibles en ligne (variables nommées de PRG_05), sans IHM obligatoire."
      verified_by: "Déclarations PRG_05 + mention dans la procédure."
    - id: AC7
      statement: "Procédure site mise à jour : quoi mesurer, sur quel signal (DI brut M3_PosP2_DI → M3_PosPV_DI, 1er front), trajet P1→Trémie à 50 Hz atteints avant P2, où saisir."
      verified_by: "Relecture DOC/WFLOW/CONTRACTS/PROCEDURE_CALIBRATION_ODOMETRIE_M3_T301.md."
    - id: AC8
      statement: "Garde-fou : gate (G518 étendu ou nouveau) qui échoue si le gain de l'estimateur n'est plus calculé depuis ces seules persistantes, ou si une seconde source de positions/gain apparaît hors GVL_PERSISTENT."
      verified_by: "--selftest du gate : mutations refusées, 0 faux positif."
    - id: AC10
      statement: "Structure : nom de fichier identique au nom de POU ; suffixe identique au langage du bundle. PRG_05_Translation reste un PROGRAM ST, aucun POU créé ni renommé."
      verified_by: "Bundle : POU PRG_05_Translation présent en ST ; aucun POU créé ni renommé."
    - id: AC9
      statement: "Bundle complet + diff bundle frais, G200 PASS 0 erreur, palier C sans nouvel échec."
      verified_by: "generate_codesys_bundle.py, generate_codesys_diff_bundle.py, G200_check_linkage.py --report, run_all_gates.py --palier C."
