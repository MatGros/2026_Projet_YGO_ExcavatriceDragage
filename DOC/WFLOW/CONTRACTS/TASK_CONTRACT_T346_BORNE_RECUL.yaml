    - "Aucune reinjection du code retire par le commit 2a307b5b tel quel : c'est exactement le defaut que la tache doit ne pas reproduire."
    - "Aucune desactivation, suppression ou affaiblissement d'un test ou d'une assertion existante."
    - "Aucune modification de CfgTimeoutDuration, de ses defauts, ni du latch de la cause 2."

  conservation:
    must_survive:
      - "Arret nominal de fermeture sur CablePosM1 + OffsetCloseM - CloseAnticipationM et d'ouverture sur CablePosM1 + OffsetOpenM + OpenAnticipationM"
      - "Branche AX10B HoldAscentP1AfterClose, qui force M2_ReqDescend a FALSE et ne commande que la montee"
      - "Watchdog de commande engagee CfgTimeoutDuration a 60 s, avec cumul suspendu hors engagement et latch de la cause 2"
      - "Classement continu de BucketState.IsOpen et IsClosed sur la mesure, sans latch par la confirmation"
      - "Permis de securite EffectivePermitBucket_Close et EffectivePermitBucket_Open comme seule condition de sortie d'ordre M2"
      - "Anti-traversee des demandes IHM a l'entree, sous NOT Lifecycle.Busy et NOT M1_Busy et NOT M2_Busy"
    dropped_on_purpose:
      - "Restons en attente d'arbitrage : la reference de recul ancree sur la position de depart M2StartPosM n'est pas retenue a priori, car elle depend du geste operateur. Voir arbitrages_ouverts Q1."

  evidence_required:
