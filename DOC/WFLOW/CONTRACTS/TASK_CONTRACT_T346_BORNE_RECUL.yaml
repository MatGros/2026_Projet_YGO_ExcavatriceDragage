contract:
  task_id: T346_BORNE_RECUL
  criticality: C1
  strategy: patch

  objective: >
    Sous une commande de fermeture (ou d'ouverture) engagee, un recul M2 (ReqDescend en
    fermeture, ReqAscent en ouverture) reste borne par une limite de recul deterministe et
    insensible au relachement/repompage du joystick, au lieu de ne s'arreter que sur la cible
    finale ou sur le defaut machine de timeout 60 s.

  acceptance:
    - id: AC1
      statement: "Sous fermeture engagee, un recul commande s'arrete a la limite de recul retenue : M2_RunRequest revient a FALSE, plus aucun sens n'est commande."
      verified_by: "TOOLS/TEST_AUTO_CI/RESULTS/H_TREUILS_BENNE/tests/test_fb_bucket.st — bloc TC-P10-029.1 (assertions d'arret, scans 5 et 6), ROUGE avant correctif et VERT apres"
    - id: AC2
      statement: "Un relachement puis repompage du joystick en pleine manoeuvre ne deplace pas la limite de recul : aucun arret parasite n'est declenche par ce geste."
      verified_by: "Test CI neuf : scans successifs avec MotionRequestActive FALSE puis TRUE a position constante, assertion M2_RunRequest reste TRUE et Lifecycle.Busy reste TRUE ; le test doit echouer si la reference de recul est recapturee a chaque front"
    - id: AC3
      statement: "Un bagotement de mesure de faible amplitude autour de la limite de recul ne coupe pas la commande."
      verified_by: "Test CI neuf : position oscillant de part et d'autre de la limite dans la bande de tolerance, assertion M2_RunRequest reste TRUE ; le test doit echouer si la comparaison redevient une egalite stricte sans marge"
    - id: AC4
      statement: "La sortie de borne suit le comportement arbitre par l'humain (reprise au joystick, ou fin de manoeuvre propre avec BucketState intact) et laisse la machine reprenable selon ce choix."
      verified_by: "Test CI neuf dedie au comportement arbitre ; il doit echouer quand on inverse ce choix dans le code"
    - id: AC5
      statement: "L'activation de la limite de recul ne modifie ni BucketState.IsOpen ni BucketState.IsClosed."
      verified_by: "Test CI neuf : capture de BucketState avant/apres l'activation de la limite, assertion d'egalite des deux champs, l'etat benne restant celui classe sur la mesure"
    - id: AC6
      statement: "La limite de recul n'inhibe jamais le sens allant vers la cible : fermeture et ouverture nominales atteignent OffsetCloseM et OffsetOpenM."
      verified_by: "Suite CI FB_Bucket complete : TC-P10-023, TC-P10-024, T196-001, T196-002, T262-001 et TC-P10-046.x restent verts apres correctif"
    - id: AC7
      statement: "La limite de recul est symetrique : elle est active en fermeture et en ouverture, avec la meme semantique dans les deux sens."
      verified_by: "Deux tests CI neufs symetriques, un par sens, chacun echouant si la branche de l'autre sens est retiree"
    - id: AC8
      statement: "Les variables locales de FB_Bucket.st declarees pour l'ancienne borne ne restent plus a moitie mortes : chacune est soit reellement lue, soit supprimee."
      verified_by: "Recherche des identifiants dans CODE/ : LeftStartSinceArm, M2StartPosM, WasOpenAtStart, WasClosedAtStart, BandLatchConcord, StateOffsetM ; plus aucune occurrence n'est ecrite sans etre lue"
    - id: AC9
      statement: "Un garde-fou automatique refuse toute variable locale ecrite et jamais lue dans le perimetre qu'il declare, et son auto-test rejette des mutations injectees."
      verified_by: "TOOLS/AGENT_WORKFLOW/scripts/G514_check_dead_local_variable.py --selftest PASS (forme reelle de FB_Bucket.st : 5 variables sur 6 detectees, M2StartPosM correctement non signalee car il s'agit d'une chaine morte) ; branchement dans PLANS de run_all_gates.py en attente des arbitrages Q4 et de la liberation du fichier par T339"
    - id: AC10
      statement: "La fiche FB_Bucket_v1.0.md ne presente plus la perte de la borne de recul comme un ecart ouvert, et TC-P10-029.1 n'est plus decrit comme rouge."
      verified_by: "Lecture de DOC/AF/AF_Partie-10_Fonction_Winch/FB_Bucket_v1.0.md : alerte 5 du paragraphe 8 close, mentions des etapes TC-P10-029 et etat BUSY realignees"
    - id: AC11
      statement: "Le bundle PLCopenXML est regenere, la liaison est verifiee et les gates applicables passent sans nouvel echec."
      verified_by: "generate_codesys_bundle.py, generate_codesys_diff_bundle.py, G200_check_linkage.py avec report, run_all_gates.py en palier C"
    - id: AC12
      statement: "Un relachement puis repompage du joystick en pleine manoeuvre ne recapture plus la reference de M1, donc un glissement reel de M1 pendant la manoeuvre declenche M1SlipDetected puis la cause 3 meme si l'operateur pompe le joystick."
      verified_by: "Test CI neuf N2 (derive de CablePosM1 superieure a M1SlipToleranceM avec pompage intercale) ; il doit echouer si la clause NOT Lifecycle.Busy est retiree du CLK de BusyEdge"
    - id: AC13
      statement: "M1RefPosM est conservee car elle est reellement lue, et les six autres variables locales mortes de FB_Bucket.st sont purgees."
      verified_by: "Recherche des sept identifiants dans CODE/ : M1RefPosM doit rester lue par la detection de glissement, les six autres ne doivent plus apparaitre"

