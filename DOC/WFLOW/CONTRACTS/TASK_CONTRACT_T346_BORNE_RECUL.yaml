    - run_all_gates
    - bundle
    - diff_bundle
    - ci_report_avant_apres

  models_allowed:
    - "deepseek-v4.1-flash:cloud"

  alert_duty: >
    Tout probleme constate en cours de route (incoherence de spec, bug preexistant, risque hors
    scope) est remonte IMMEDIATEMENT a l'orchestrateur, pas a la fin et jamais silencieusement.
    Signaler n'est pas elargir le scope. Cas deja remontes par T346 : (1) le brief affirme a tort
    qu'il n'y a pas de collision d'ecriture, alors que le verrou T339/DSH11 detient
    test_fb_bucket.st avec des modifications non commitees ; (2) le verrou T295/DSH08 est
    formellement pose sur FB_Bucket.st alors que son lot est commite et revu ;
    (3) deux variables mortes supplementaires existent dans FB_Bucket.st hors perimetre du
    commit 2a307b5b : BandLatchConcord et StateOffsetM, cette derniere decrite comme reference
    d'un filet de securite disparu.

  # ── Arbitrages ouverts — BLOQUANTS avant toute ecriture de code ─────────────
  arbitrages_ouverts:
    Q1_ancrage:
      question: >
        Sur quoi ancrer la limite de recul : la position de depart de manoeuvre, ou la frontiere
        reelle de l'etat oppose ?
      options: >
        (a) M2StartPosM plus ou moins une marge, comme l'ancien code ; (b) frontiere reelle de
        l'etat oppose, formule OffsetOpenM plus CoherenceLimitM en fermeture et OffsetCloseM
        moins CoherenceLimitM en ouverture, comme PRG_04_Treuils_Benne.st lignes 774 a 788.
      recommandation: >
        (b) : supprime par construction la dependance au geste operateur qui est la cause dominante
        des coupures parasites, n'invente aucun chiffre nouveau et suit la doctrine projet ecrite
        au fichier PRG_04 lignes 761 a 766.
      reserve: >
        En valeurs de production OffsetOpenM vaut 0.0 et CoherenceLimitM vaut 1.0 : une fermeture
        engagee dans la bande ouverte serait immediatement a la limite, ce qui change le
        comportement observable et impacte TC-P10-029, aujourd'hui vert avec CoherenceLimitM a 5.0.

    Q2_comportement_a_la_limite:
      question: Que fait le FB quand la limite de recul est atteinte ?
      options: >
        (A) coupe M2 et laisse CloseReq ou OpenReq arme, reprise des que l'operateur repousse vers
        la cible ; (B) coupe et pose Lifecycle.Done sans toucher BucketState, reprise par nouvel
        appui IHM ; (C) coupe et diagnostic nomme.
      recommandation: "(A), geste continu sans verrou, coherent avec une commande manuelle continue."
      contrainte_verifiee: >
        Tout slot instCauses alimente FB_FaultCore et aboutit a SevereError et a un Reset. Un simple
        signalement exige une VAR_OUTPUT dediee, sur le modele de M2_BucketJogLimit.

    Q3_collision_test:
      question: Comment traiter la collision d'ecriture sur test_fb_bucket.st avec T339/DSH11 ?
      options: >
        attendre la cloture de T339, ou autoriser T346 a n'editer que le bloc TC-P10-029.1 en
        cohabitation.

    Q4_perimetre_garde_fou:
      question: >
        Le garde-fou variable locale ecrite et jamais lue doit-il etre bloquant sur tout CODE/ ?
      constat: >
        Une mesure sur les 261 fichiers .st de CODE/ remonte environ 70 occurrences candidates
        dans une dizaine de fichiers, dont beaucoup sont des faux positifs car une VAR locale de
        PROGRAM est lisible de l'exterieur, par exemple PRG_02_Acquisition.st ligne 285 lit
        PRG_06_Outputs.M1RelayFwd. Un garde-fou bloquant sur tout CODE/ serait donc rouge sur des
        sites hors perimetre T346.
      options: >
        perimetre limite aux fichiers du lot, ou detection des references croisees, ou garde-fou
        non bloquant en avertissement.
      note: >
        Une exemption ou une allowlist n'est pas une decision d'agent : le choix revient a
        l'orchestrateur.

