  # ── 4. Contrat de conservation ────────────────────────────────────────────
  conservation:
    must_survive:
      - "L'ordre de priorite des messages existants (AU/puissance > SafeStop > direction > metier) est inchange."
      - "Aucun champ nouveau dans GVL_IHM ni dans un type associe (IHM figee pour livraison collegue)."
