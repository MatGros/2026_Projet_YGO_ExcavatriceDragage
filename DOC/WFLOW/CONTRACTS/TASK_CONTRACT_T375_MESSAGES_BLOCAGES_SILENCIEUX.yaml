contract:
  # ── Identification ────────────────────────────────────────────────────────
  task_id: T375_MESSAGES_BLOCAGES_SILENCIEUX
  criticality: C3
  strategy: patch

  # ── 1. Objectif metier ────────────────────────────────────────────────────
  objective: >
    Aucun refus de mouvement et aucune cause de securite latchee ne doit rester
    SILENCIEUX pour l'operateur : chaque voie qui bloque un mouvement doit avoir
    un message nomme, et la validite d'un temoin d'entree doit QUALIFIER une
    cause (elle ne doit jamais la FAIRE DISPARAITRE).

  # ── 2. Criteres testables ─────────────────────────────────────────────────
  acceptance:
    - id: AC1
      statement: "Un refus du mouvement « both » par le sequencement benne couple publie un message operateur nomme et explicite, et non plus un bouton inerte sans explication."
      verified_by: "test unitaire FB_Hmi_BannerFormatter (cas : WinchBothMotionBlockedByBucket=TRUE -> message present) + lecture IHM"
    - id: AC2
      statement: "Une cause latchee (ex. ErrorMecaB, ErrorID:09) est TOUJOURS publiee dans AlarmArray, meme lorsque le temoin de validite correspondant est FALSE (EncM1Valid/EncM2Valid/LocalIoValid/VarM3Valid) : la validite qualifie le libelle, elle ne supprime pas le message."
      verified_by: "CI FB_Hmi_BannerFormatter : 2 cas (valid=TRUE et valid=FALSE) ROUGE avant / VERT apres, meme cause nommee"
    - id: AC3
      statement: "Aucune regression des messages existants : la liste AlarmArray du cas nominal est identique a la baseline (memes libelles, meme ordre de priorite, meme comptage)."
      verified_by: "releve de baseline AVANT correctif + comparaison apres (CI + lecture du diff)"
    - id: AC4
      statement: "Un garde-fou mecanique nomme G524 refuse tout TERME BLOQUANT du predicat RunRequest (M1 et M2) qui ne serait declare dans aucune table de couverture (message nomme OU derogation documentee), et nomme le terme fautif."
      verified_by: "G524 --selftest : mutation = ajout d'un terme factice -> FAIL nomme ; arbre reel -> PASS"
    - id: AC5
      statement: "Le garde-fou G524 refuse aussi la forme interdite « message nomme masque par un temoin de validite » (motif AND <Valid> dans les conditions d'alarme)."
      verified_by: "G524 --selftest : mutation = ajout de AND EncM1Valid sur un message -> FAIL nomme"
    - id: AC6
      statement: "Aucun rouge nouveau : palier C = les 4 dettes preexistantes connues (G300, G340, G430, G483) et rien d'autre."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py --palier C"
    - id: AC7
      statement: "Liaison et bundle restent valides : bundle frais, diff bundle des objets touches, G200 --report 0 erreur."
      verified_by: "generate_codesys_bundle.py + generate_codesys_diff_bundle.py + G200_check_linkage.py --report"
    - id: AC8
      statement: "Aucune logique de securite n'est modifiee : git diff --numstat VIDE sur les fichiers de securite et la chaine AU."
      verified_by: "git diff --numstat CODE/H_TREUILS_BENNE/FB_Safety_Winch.st CODE/H_TREUILS_BENNE/FB_WinchOutputInterlock.st CODE/H_TREUILS_BENNE/FB_Winch.st CODE/B_AU_SECURITE/ = vide"

  # ── 3. Perimetre ──────────────────────────────────────────────────────────
