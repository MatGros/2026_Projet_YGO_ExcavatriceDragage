contract:
  task_id: TASK_MANAGER_CONCURRENCY_REPAIR
  criticality: C2
  strategy: patch
  objective: >
    Restaurer un catalogue TASKS.yaml exploitable et permettre aux humains et aux
    agents de modifier des tâches distinctes sans écrasement ni action sur une tâche
    verrouillée par un autre acteur.
  acceptance:
    - id: AC1
      statement: "TASKS.yaml restauré depuis le commit 739a9bc8 est un YAML valide, contient 114 identifiants de tâche uniques et reste inférieur à 200 ko."
      verified_by: "python -c de chargement yaml.safe_load, comptage des IDs et mesure de taille"
    - id: AC2
      statement: "Le serveur n'accepte que des connexions HTTP sur 127.0.0.1 et ne publie pas d'en-tête CORS permissif."
      verified_by: "test d'intégration HTTP local et inspection des en-têtes de réponse"
    - id: AC3
      statement: "Une prise de verrou par A interdit la prise, la sauvegarde et la suppression par B jusqu'à libération par A ou RAZ globale confirmée."
      verified_by: "tests automatisés API avec deux identités et codes HTTP de conflit/verrouillage"
    - id: AC4
      statement: "La sauvegarde d'une tâche avec une révision obsolète est refusée sans modifier TASKS.yaml."
      verified_by: "test API de conflit comparant le hash de TASKS.yaml avant et après la requête périmée"
    - id: AC5
      statement: "L'IHM reste lisible sans débordement horizontal du document aux largeurs 320, 768, 1024 et 1440 px avec des titres et descriptions longs."
      verified_by: "recette navigateur manuelle documentée avec captures aux quatre largeurs"
  scope:
