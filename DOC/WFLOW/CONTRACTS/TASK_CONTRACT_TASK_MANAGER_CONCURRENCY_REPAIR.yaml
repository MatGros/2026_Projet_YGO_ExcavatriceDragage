      - PRJ_CODESYS/
      - Device.export
  conservation:
    must_survive:
      - "Les 114 tâches et leurs champs métier issus du commit 739a9bc8."
      - "Les statuts métier existants restent distincts des verrous d'édition."
      - "Une modification locale d'une tâche ne réécrit pas les données métier d'une autre tâche."
    dropped_on_purpose: []
  evidence_required:
    - "validation YAML et unicité des IDs"
    - "tests API de verrouillage, conflit et RAZ globale"
    - "recette responsive aux quatre largeurs"
  models_allowed:
