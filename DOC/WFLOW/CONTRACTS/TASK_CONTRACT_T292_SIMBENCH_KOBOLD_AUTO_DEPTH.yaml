contract:
  task_id: T292
  criticality: C2
  strategy: patch
  objective: >
    Simuler la DI Kobold 0->1->0 sous alimentation, avec fond signe configurable et roulis mecanique, activable automatiquement en SEMI_AUTO et desactivable par l operateur.
  acceptance:
    - id: AC1
      statement: "Automatisme inactif : la DI suit exclusivement SimKoboldContactValue."
      verified_by: "Test ST comparatif des deux valeurs du stimulus manuel."
    - id: AC2
      statement: "Entree en simulation SEMI_AUTO ou entree SEMI_AUTO en simulation : SimKoboldAutoModeActive devient TRUE. Une desactivation manuelle reste effective jusqu a la prochaine entree. Sortie de mode ou simulation : FALSE."
      verified_by: "Test ST des fronts de mode, maintien sur dix scans et desactivation manuelle."
    - id: AC3
      statement: "Sous alimentation finale et au-dessus du fond signe configure, la DI passe a TRUE apres SimKoboldPowerUpTime propose a 50 ms. Sans alimentation ou au fond, la DI est FALSE."
      verified_by: "Chronogrammes ST alimentation, 50 ms, seuils -5/-15/-25 m et coupure."
    - id: AC4
      statement: "Au franchissement du fond, les codeurs poursuivent leur mouvement selon les relais et le roulis. SimKoboldCoast_M propose a 1 m avec dispersion commune bornee a 0.1 m ne modifie pas les arrets hors plongee Kobold."
      verified_by: "Test integration cycle AX5 a AX8 et mesure des distances entre DI basse, relais bas et arret des codeurs."
    - id: AC5
      statement: "La profondeur est signee et coherente avec la reference homing effective de FB_Encoder_Scale."
      verified_by: "Test conversion points/metres avant et apres homing ; aucune valeur absolue."
    - id: AC6
      statement: "M1 continue a evoluer sous commande descente effective ; les protections et le routage reel/simule gardent leur comportement."
      verified_by: "Test integration M1 et revue du diff des appels et selecteurs."
    - id: AC7
      statement: "Le nom de fichier est identique au nom de POU pour PRG_02_Acquisition."
      verified_by: "G310_check_code_structure.py."
    - id: AC8
      statement: "Le suffixe ST correspond au langage ST genere dans le bundle."
      verified_by: "G310_check_code_structure.py et inspection du POU genere."
    - id: AC9
      statement: "Le bundle est frais et G200 ne rapporte aucune erreur de liaison."
      verified_by: "generate_codesys_bundle.py puis G200_check_linkage.py --report, palier C et suite complete."
