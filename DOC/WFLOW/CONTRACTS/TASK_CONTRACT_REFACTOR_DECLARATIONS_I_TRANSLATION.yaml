      - CODE/J_SUPERVISION/
      - CODE/K_DEPANNAGE/
      - CODE/L_SIMULATION/
      - CODE/M_MAIN/

  conservation:
    must_survive:
      - "Toutes les signatures des POU, des DUT et des interfaces publiques."
      - "Toutes les valeurs par defaut et les declarations de variables."
      - "Toutes les lignes executables, les appels FB, les branchements et les regles safety."
      - "Les invariants AF11/AF03 : precedence mouvement, gate final frein, Cause/Ack et absence de redemarrage automatique."
    dropped_on_purpose:
      - "Les recits de developpement, REX, numeros de lots et dates dans les commentaires CODE uniquement."

  evidence_required:
    - "git diff --check"
    - "Comparaison signatures et corps executables avant/apres"
    - "Revue independante read-only C3"
    - "G200_check_linkage.py --report apres regeneration globale CODE_XML"

  models_allowed:
    - "omni/cx/gpt-5.6-terra"

  alert_duty: >
    Signaler immediatement toute contradiction AF/code, toute information historique
    absente de DOC, ou toute modification executable accidentelle. Ne pas elargir
    le scope ni creer de commit.

