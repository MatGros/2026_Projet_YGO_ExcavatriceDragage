contract:
  task_id: T123_I_TRANSLATION_COMMENTAIRES
  criticality: C3
  strategy: patch

  objective: >
    Standardiser sans modifier le comportement les cartouches, declarations et
    commentaires ST du domaine Translation M3, afin qu'ils expriment les exigences
    durables AF11/AF03 et ne contiennent plus de journal REX, date, lot ou recit
    d'essai dans CODE/.

  acceptance:
    - id: AC1
      statement: "Les 7 sources ST de CODE/I_TRANSLATION/ ont un cartouche de 15 lignes maximum, un lien AF11 exact et seulement des emojis de la whitelist CODESYS projet."
      verified_by: "Revue source fichier par fichier et grep des emojis/interdits dans les cartouches."
    - id: AC2
      statement: "Chaque declaration de FB respecte VAR_INPUT, VAR_OUTPUT, VAR_IN_OUT, VAR, avec fleche ASCII et tag de role conforme."
      verified_by: "Revue source et controle structurel des declarations."
    - id: AC3
      statement: "Aucun commentaire de CODE/I_TRANSLATION/ ne contient REX, lot, date, retour terrain, correctif, audit ou recit d'essai ; les invariants fonctionnels et safety sont conserves sous une formulation intemporelle liee a AF11/AF03."
      verified_by: "Grep cible puis revue AF11/AF03 par un reviewer read-only."
    - id: AC4
      statement: "Les signatures publiques, valeurs par defaut et lignes executables des 7 sources ST sont strictement inchangees."
      verified_by: "Comparaison avant/apres des declarations hors commentaires et du corps executable ; git diff --check."
    - id: AC5
      statement: "Les recits historiques utiles retires du code sont tracables dans DOC/VERSION_HISTORY.md, les fiches AF existantes ou une fiche DOC/WFLOW/REX/ creee seulement si une information historique n'y existe pas deja."
      verified_by: "Revue des references documentaires et des fichiers modifies."
    - id: AC6
      statement: "Le lot recoit une revue independante C3 avant validation ; aucun commit n'est cree."
      verified_by: "Rapport reviewer read-only, git status et absence de git commit."

  scope:
    allowed:
      - CODE/I_TRANSLATION/E_TranslationFinalInterlockReason.st
      - CODE/I_TRANSLATION/FB_Safety_Translation.st
      - CODE/I_TRANSLATION/FB_Translation.st
      - CODE/I_TRANSLATION/FB_TranslationOutputInterlock.st
      - CODE/I_TRANSLATION/FB_Translation_PositionDecoder.st
      - CODE/I_TRANSLATION/FB_Translation_PositionEstimator.st
      - CODE/I_TRANSLATION/ST_TranslationCmdDemand.st
      - DOC/STDS/CODE_QUALITY_STANDARDS.md
      - DOC/STDS/NAMING_CONVENTION.md
      - DOC/WFLOW/CONTRACTS/TASK_CONTRACT_REFACTOR_DECLARATIONS_I_TRANSLATION.yaml
      - DOC/WFLOW/PLAN_TASK.md
      - DOC/VERSION_HISTORY.md
      - DOC/WFLOW/REX/
    forbidden:
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - CODE_XML/
      - TOOLS/
      - CODE/A_COMMUN/
      - CODE/B_AU_SECURITE/
      - CODE/C_DIAG_RESEAUX/
      - CODE/D_JOYSTICK/
      - CODE/E_CODEURS/
      - CODE/F_MODES/
