# ═══════════════════════════════════════════════════════════════════════════
# LOT 1 — GARDE-FOUS AVANT CORRECTION
# ═══════════════════════════════════════════════════════════════════════════
# Decisions humaines du 2026-08 (arbitrage orchestrateur) :
#   D-A = OUI  -> les PRG_*_CFC deviennent des CFC natifs .xml
#   D-B = OUI  -> tous les programmes sont numerotes PRG_XX
#   D-C = OK   -> PRG_TROUBLESHOOTING_CFC devient PRG_11_Troubleshooting (ST)
#
# Pourquoi ce lot passe AVANT toute correction de code :
# les 5 incoherences constatees ont traverse 8 gates verts. Corriger d'abord
# le code sans corriger les gates, c'est reproduire le REX 2026-07-29
# (PRG_10_Outputs_LD relie a rien, tous controles verts).
# ═══════════════════════════════════════════════════════════════════════════

task_id: "LOT1-GATES-STRUCTURE-CODE"
request: >
  Doter le projet d'un gate de structure sur CODE/ qui detecte le desalignement
  nom de fichier / nom de POU et le desalignement suffixe / langage genere,
  rebrancher le gate CFC natif existant mais absent du runner, et retirer les
  exceptions qui blanchissent les fichiers non conformes.
criticality: C3
strategy: patch

scope_code:
  - "TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py (nouveau)"
  - "TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py"
  - "TOOLS/AGENT_WORKFLOW/scripts/check_code_style.py"
  - "TOOLS/AGENT_WORKFLOW/tests/test_check_code_structure.py (nouveau)"
scope_doc:
  - "TOOLS/AGENT_WORKFLOW/docs/WORKFLOW.md"
out_of_scope:
  - "CODE/** : aucun fichier automate n'est modifie dans ce lot"
  - "Renommage de POU (LOT 4)"
  - "Redaction des regles CFC dans DOC/ (LOT 2)"

contract:
  task_id: LOT1-GATES-STRUCTURE-CODE
  criticality: C3
  strategy: patch

  objective: >
    Rendre mecaniquement detectable, avant tout import CODESYS, qu'un programme
    porte un suffixe de langage qui ne correspond pas au langage reellement
    genere dans le bundle, ou que son nom de fichier differe du nom du POU
    qu'il declare.

  acceptance:
    - id: AC1
      statement: >
        check_code_structure.py signale CODE/MAIN/PRG_OUTPUTS_LD.st parce que le
        fichier declare PROGRAM PRG_10_Outputs_LD, nom different du nom de fichier.
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py ; la sortie cite PRG_OUTPUTS_LD.st et PRG_10_Outputs_LD"
    - id: AC2
      statement: >
        check_code_structure.py signale les 8 POU suffixes _CFC qui sont emis en
        balise <ST> dans CODE/CODE_Bundle.xml au lieu de <CFC>.
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py ; la sortie liste PRG_ACQUISITION_CFC, PRG_MODES_CFC, PRG_SAFETY_CFC, PRG_TREUILS_CFC, PRG_TRANSLATION_CFC, PRG_SUPERVISION_CFC, PRG_AUXILIARY_CFC, PRG_TROUBLESHOOTING_CFC"
    - id: AC3
      statement: >
        check_code_structure.py signale les 9 programmes de CODE/MAIN sans prefixe
        numerique PRG_XX, la numerotation etant la source de l'ordre MainTask.
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py ; le compte de programmes non numerotes vaut 9"
    - id: AC4
      statement: >
        check_code_structure.py accepte PRG_INPUTS_LD et PRG_10_Outputs_LD comme
        conformes sur l'axe langage, tous deux etant emis en balise <LD>.
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py ; aucune ligne d'erreur d'axe langage ne cite ces deux POU"
    - id: AC5
      statement: >
        run_all_gates.py execute le gate de cablage CFC natif, qui n'etait appele
        par aucun runner avant ce lot.
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py ; le RESUME contient une ligne citant check_cfc_wiring"
    - id: AC6
      statement: >
        L'allowlist GVL_Simulation est limitee a PRG_ACQUISITION_CFC.st,
        PRG_SUPERVISION_CFC.st et PRG_TROUBLESHOOTING_CFC.st ; chaque entree
        porte son usage executable, la decision 2026-08 et sa condition de
        retrait lors de la migration CFC/numerotation.
      verified_by: "C:/Python313/python.exe -m pytest TOOLS/AGENT_WORKFLOW/tests/test_check_code_style.py -q -k simulation_allowlist ; le test prouve que les trois chemins justifies passent et qu'un quatrieme chemin est refuse"
    - id: AC7
      statement: >
        Chaque regle du nouveau gate possede un test unitaire qui echoue si la
        regle est retiree du script.
      verified_by: "C:/Python313/python.exe -m pytest TOOLS/AGENT_WORKFLOW/tests/test_check_code_structure.py -q ; au moins 4 tests passent"
    - id: AC8
      statement: >
        Le nouveau gate sort en code retour non nul sur l'etat actuel du depot,
        puisque les 5 incoherences ne sont pas encore corrigees.
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py ; echo $? vaut 1"

  scope:
    allowed:
      - TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py
      - TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py
      - TOOLS/AGENT_WORKFLOW/scripts/check_code_style.py
      - TOOLS/AGENT_WORKFLOW/tests/test_check_code_structure.py
      - TOOLS/AGENT_WORKFLOW/tests/test_check_code_style.py
      - TOOLS/AGENT_WORKFLOW/docs/WORKFLOW.md
    forbidden:
      - CODE/
      - DOC/
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - TOOLS/AGENT_WORKFLOW/scripts/check_linkage.py

  conservation:
    must_survive:
      - "Les 8 gates deja presents dans run_all_gates.py continuent d'etre executes dans le meme ordre."
      - "run_all_gates.py continue d'executer tous les gates puis d'afficher un RESUME, au lieu de s'arreter au premier echec (REX 2026-07-29)."
    dropped_on_purpose:
      - "Les exemptions GVL_Simulation non justifiees ou sans condition de retrait ; les trois frontieres executees explicitement valides sont conservees jusqu'a leur migration."

  evidence_required:
    - check_linkage
    - run_all_gates
    - task_tests

  models_allowed:
    - "omni/cx/gpt-5.6-terra"
    - "omni/cc/claude-sonnet-5"

  alert_duty: >
    Si le nouveau gate detecte une incoherence de structure NON listee dans les
    8 constats de l'audit 2026-08, la signaler immediatement a l'orchestrateur
    avant d'elargir la regle ou d'ajouter une exemption. Une exemption ajoutee
    silencieusement reproduit exactement le defaut que ce lot corrige.
