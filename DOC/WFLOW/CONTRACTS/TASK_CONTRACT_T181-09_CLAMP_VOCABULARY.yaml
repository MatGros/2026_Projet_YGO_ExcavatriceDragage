      verified_by: "garde statique et lecture PRG_03/PRG_04."
    - id: AC3
      statement: "Les deux axes conservent les mêmes plafonds calculés : commun puis M2-propre, sans aucun changement de priorité des limites."
      verified_by: "tests ciblés FB_Winch et WINCH_INTEG."
    - id: AC4
      statement: "Le garde échoue si un ancien identifiant réapparait dans CODE/ ou si les deux drapeaux de montée contrôlée coexistent dans PRG_04."
      verified_by: "auto-test du garde avec mutations contrôlées."
    - id: AC5
      statement: "Nom de fichier est identique au nom de POU ; suffixe est identique au langage du bundle pour PRG_03_Modes_Cycle et PRG_04_Treuils_Benne."
      verified_by: "inspection des deux declarations PROGRAM."
