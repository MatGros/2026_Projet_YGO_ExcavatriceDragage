  criticality: C3
  strategy: patch
  objective: >
    Remplacer les noms Force* employés pour les bornes de palier par des noms MaxStep ou
    BucketJogLimit, et fusionner ControlAscentActive dans ExtractionControlActive sans modifier
    les décisions de clamp, les sorties de mouvement, ni les séquences métier.
