# CONTRAT DE TACHE — T168-C
# Combler le trou de reset des etats assistants de dragage dans la branche
# SEMI_AUTO de PRG_03 (remanence inter-modes -> interlock descente treuil fantome)
# ═══════════════════════════════════════════════════════════════════════════
# Origine : audit T168-B (2026-08-29) + 2 revues independantes contradictoires
#   (omniroute auto/best-reasoning, codex/gpt-5.6-terra-medium). Verdict convergent.
# ═══════════════════════════════════════════════════════════════════════════

contract:
  task_id: T168-C_RESET_ASSISTANTS_SEMI_AUTO
  parent_id: T168
  criticality: C3
  strategy: patch

  objective: >
    En mode SEMI_AUTO, PRG_03 doit reinitialiser TOUS les etats d'assistance de
    dragage (Dive*, Extraction*, DumpAtTremie*, Bypass*) a leur valeur neutre,
    afin qu'un flag arme en MAINT_N1/N2 ne subsiste pas au changement de mode.
    Regression cible : DumpAtTremieDescentLocked reste TRUE apres transition
    MAINT -> SEMI_AUTO et PRG_04 verrouille alors la descente M1/M2 pendant le
    cycle automatique, sans cause visible (introduit par commit 7e65e566 de
    centralisation du verrou dans Data.SequenceState).

  acceptance:
    - id: AC1
      statement: >
        Apres une transition MAINT_N1 (DumpAtTremie arme, M3 hors P1/Maintenance,
        donc DumpAtTremieDescentLocked=TRUE) vers SEMI_AUTO, la valeur
        PRG_03_Modes_Cycle.Data.SequenceState.DumpAtTremieDescentLocked vaut FALSE
        des le premier scan SEMI_AUTO, et PRG_04_Treuils_Benne ne force plus
        ProcessAndSafetyPermitM1_Descend / M2_Descend a FALSE via ce chemin.
      verified_by: >
        Test d'integration TEST_AUTO_CI (scenario transition MAINT->SEMI_AUTO) +
        relecture de la branche SEMI_AUTO de CODE/M_MAIN/PRG_03_Modes_Cycle.st.
    - id: AC2
      statement: >
        Les 17 feuilles suivantes sont assignees dans la branche SEMI_AUTO de
        PRG_03 avec exactement les memes valeurs neutres que la branche ELSE
        (DISABLE) : DiveReady, DiveBusy, DiveDone, DiveError, DiveErrorId,
        ExtractionReady, ExtractionBusy, ExtractionDone, ExtractionError,
        ExtractionErrorId, DumpAtTremieArmed, DumpAtTremieAssistActive,
        DumpAtTremieAtTremie, DumpAtTremieBucketOpenArmed,
        DumpAtTremieDescentLocked, BypassDiveActive, BypassKoboldBottomTouched.
      verified_by: >
        git diff de CODE/M_MAIN/PRG_03_Modes_Cycle.st + nouveau gate de completude
        (AC3) qui liste 0 feuille manquante.
    - id: AC3
      statement: >
        Un nouveau gate mecanique echoue si une feuille (sous-membres inclus) de
        ST_SequencePublicState est ecrite dans au moins une branche de mode de
        PRG_03 mais pas dans toutes ; il est vert sur le code corrige et il est
        cable dans run_all_gates.py au palier C.
      verified_by: >
        python TOOLS/AGENT_WORKFLOW/scripts/G346_check_mode_branch_completeness.py
        (nom indicatif) en PASS, et
        python TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py --palier C en ALL PASS
        avec le nouveau gate present dans le resume.
    - id: AC4
      statement: >
        Non-regression : G200 liaison PASS 0 erreur, palier C 100% PASS, et les
        verdicts TEST_AUTO_CI des FB de cycle (FB_Cycle, FB_DiveSearch,
        FB_ExtractionSequence) sont inchanges par rapport a la baseline pre-T168-C.
      verified_by: >
        python TOOLS/AGENT_WORKFLOW/scripts/G200_check_linkage.py --report ;
        python TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py --palier C ;
        suite TEST_AUTO_CI G_CYCLE (comparaison des rapports HTML avant/apres).
    - id: AC5
      statement: >
        Le choix DumpAtTremieDescentLocked := FALSE en SEMI_AUTO est ancre sur la
        spec. La prohibition de descente a la tremie EST un besoin en automatique
        (DESIGN_SEMI_AUTO_CYCLE X10/X11 : "descente interdite -> on peut uniquement
        ouvrir la benne"), mais elle est portee STRUCTURELLEMENT par le Grafcet
        FB_Cycle : les etapes X10_TRANSLATE_DUMP et X11_OPEN_DUMP n'emettent jamais
        de commande de descente treuil, et une deflexion joystick vers le bas y est
        convertie en BucketCmd.Open. Le champ Data.SequenceState.DumpAtTremieDescentLocked
        est le miroir de l'assistant MAINT_N1/N2 (DumpAtTremieAssistActive est deja
        gate AND Mode=MAINT). Le mettre a FALSE en SEMI_AUTO ne cree donc aucun trou
        de securite : le verrou effectif en auto ne transite pas par PRG_04:631.
      verified_by: >
        Relecture de CODE/G_CYCLE/FB_Cycle.st etapes X10/X11 (aucune ecriture
        WinchM*Cmd.Direction := -1 ; BucketCmd.Open sur deflexion bas) + citation de
        DOC/WFLOW/AUDITS/DESIGN/DESIGN_SEMI_AUTO_CYCLE_v0.1.md L153-154 dans la note
        d'application ; si la spec ou FB_Cycle contredit ce choix -> ALERTE avant ecriture.
    - id: AC6
      statement: >
        Controle structurel du bundle apres edition : le nom de fichier
        PRG_03_Modes_Cycle correspond au nom du POU declare, et le suffixe de
        langage correspond au langage genere dans le bundle PLCopenXML.
      verified_by: >
        python TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py --palier C
        (G300 structure du depot, G310 structure CODE : POU, suffixe, ordre) en PASS,
        et python TOOLS/AGENT_WORKFLOW/scripts/G200_check_linkage.py --report en PASS.

  scope:
    allowed:
      - CODE/M_MAIN/PRG_03_Modes_Cycle.st
      - TOOLS/AGENT_WORKFLOW/scripts/G346_check_mode_branch_completeness.py
      - TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py
      - TOOLS/TEST_AUTO_CI/
      - CODE_XML/CODE_Bundle.xml
    forbidden:
      - CODE/M_MAIN/PRG_04_Treuils_Benne.st
      - CODE/M_MAIN/PRG_07_Supervision.st
      - CODE/G_CYCLE/FB_Cycle.st
      - CODE/J_SUPERVISION/_TYPES/3_CYCLE_ET_MODES/ST_SequencePublicState.st
      - CODE/J_SUPERVISION/_TYPES/5_ASSISTANCE_DRAGAGE/ST_DredgingAssistState.st
      - PRJ_CODESYS/
      - DOC/STDS/NAMING_CONVENTION.md
    # NB : l'incoherence de type OperatorActionId (UINT vs WORD, 3 conversions
    # implicites) est un DEFAUT SEPARE -> micro-lot T168-D (touche FB_Cycle et
    # 2 DUT). Ne PAS le traiter ici.

  conservation:
    must_survive:
      - "Regle mono-producteur : PRG_03 reste le seul ecrivain de Data.SequenceState."
      - "Comportement des branches MAINT_N1/N2 et ELSE (DISABLE) inchange."
      - "Semantique de PRG_04:631 (verrou descente sur DumpAtTremieDescentLocked) inchangee ; seul le fait que la source soit desormais neutre en SEMI_AUTO change."
      - "Data.SequenceState.BottomTouchConfirmed (consomme PRG_04:146) reste ecrit dans les 3 branches."
    dropped_on_purpose:
      - "Rien."

  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle

  models_allowed:
    - "auto/best-coding"
    - "auto/best-reasoning"

  alert_duty: >
    Tout probleme constate en cours de route (spec qui contredit AC5, feuille
    supplementaire manquante detectee par le gate hors des 17 listees, bug
    prexistant hors scope) est remonte IMMEDIATEMENT a l'orchestrateur, jamais
    en fin de tache et jamais silencieusement. Signaler n'est pas elargir le scope.

