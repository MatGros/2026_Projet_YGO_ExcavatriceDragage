      verified_by: "run_tests.py --fb FB_SimBench (1 PASS, 0 FAIL)"
    - id: AC5
      statement: >
        Un garde-fou automatique interdit la récidive : G518 échoue si le ratio du banc diverge du
        gain persistant (> 1 %), si la constante du banc n'atteint plus le modèle (constante morte),
        si le gain n'est plus injecté dans l'estimateur, ou si les cas de test d'alignement
