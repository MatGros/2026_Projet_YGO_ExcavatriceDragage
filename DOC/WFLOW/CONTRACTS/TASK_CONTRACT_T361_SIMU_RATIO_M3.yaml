      verified_by: "G518_check_m3_odometry_scale.py --selftest (PASS) + ligne PLANS palier C de run_all_gates.py"
    - id: AC6
      statement: >
        VOLET B livré sous forme de tableau comparatif chiffré (dérive maximale, exposition,
        complexité, risque) pour les 3 options, avec recommandation argumentée — et ZÉRO ligne de
        code de recalage écrite avant arbitrage humain.
      verified_by: "DOC/WFLOW/AUDITS/DESIGN/ANALYSE_T361_RECALAGE_M3_OPTIONS_2026-09-21.md + git status --short -- CODE/I_TRANSLATION/FB_Translation_PositionEstimator.st (VIDE — l'estimateur n'est pas touché ; ⚠️ FB_Translation.st, autre fichier du même dossier, est modifié NON COMMITÉ par un autre lot, sans rapport avec ce volet)"
    - id: AC7
      statement: >
        La documentation d'interface du FB reste exacte après le changement de défaut.
      verified_by: "DOC/AF/AF_Partie-13_Fonction_Simulation/FB_Sim_Translation_v1.0.md §2 (défaut 37,5 s et justification)"
    - id: AC8
      statement: >
        VOLET B (décision utilisateur du 2026-09-21) : le recalage reste appliqué SANS CONDITION sur les
        5 repères absolus — aucun seuil, aucune zone morte, aucun blocage n'entre dans la chaîne de
        recalage. Un écart de 10,0 m est corrigé comme un écart de 2 cm.
      verified_by: "TC-T361-ANOM-002 (position recalée à 20,0 m malgré le témoin) + TC-T361-ANOM-004 (blip de 2 cm recalé) + gate G520 (le seuil est interdit DANS le bloc de recalage)"
    - id: AC9
      statement: >
        Un témoin d'anomalie est publié lorsque la correction effectivement appliquée dépasse
        CST_RecalibrationAnomalyM = 0,50 m (5 % de l'écart maximal entre deux repères), avec l'amplitude
        mesurée de la correction.
      verified_by: "TC-T361-ANOM-002 (RecalibrationAnomaly = TRUE, RecalibrationCorrectionM = 10,0 m) + TC-T361-ANOM-001 (correction nominale ~2 mm → témoin NON levé)"
    - id: AC10
      statement: >
        Le témoin est un PULSE (remis à zéro à chaque scan, comme Recalibrated) et l'amplitude de la
        dernière correction est MAINTENUE, pour rester lisible par une trace à 10 ms ou une IHM.
      verified_by: "TC-T361-ANOM-003 (témoin retombe au scan suivant, amplitude encore à 10,0 m)"
    - id: AC11
      statement: >
        La décision Q2 du lot T333 (« recaler SANS garde tant que T301 n'a pas calibré le gain ») n'est
        ni rouverte ni affaiblie : son cas TC-P11-EST-007 est inchangé et reste vert.
