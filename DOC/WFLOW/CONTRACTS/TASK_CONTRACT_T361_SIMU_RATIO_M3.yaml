contract:
  task_id: T361_SIMU_RATIO_M3
  criticality: C3
  strategy: patch            # alignement d'une constante d'échelle + garde-fou, pas de refonte

  objective: >
    VOLET A — Rendre la simulation M3 cohérente en interne : l'échelle odométrique du banc
    SimBench doit être ÉGALE au gain réellement consommé par l'estimateur de position
    (GVL_PERSISTENT._TranslationGainMetersPerHzSec = 0,02 m/(Hz·s)). Le banc intégrant
    dx = f × (30 / (40 × FullTravelTimeS)) × dt, l'égalité impose FullTravelTimeS = 37,5 s
    (au lieu de 8,0 s, ratio 0,09375, soit 4,7× l'échelle réelle). Un gate G518 interdit toute
    divergence future entre les deux échelles.
    VOLET B — Chiffrer et comparer les options de recalage M3 (5 capteurs actuels / Trémie seul
    proposé par l'utilisateur / 3e option à seuil de tolérance) et les présenter à l'utilisateur.
    AUCUN code du VOLET B n'est écrit avant validation explicite de l'option retenue.

  acceptance:
    - id: AC1
      statement: >
        FullTravelTimeS (défaut du FB ET constante CST_M3FullTravelTimeS réellement passée à
        instSimTranslation) vaut 37,5 s, de sorte que le ratio du banc
        30 m / (40 Hz × 37,5 s) = 0,02 m/(Hz·s) égale exactement GVL_PERSISTENT._TranslationGainMetersPerHzSec.
      verified_by: "CODE/L_SIMULATION/FB_Sim_Translation.st:20 (VAR_INPUT) et FB_SimBench.st:182 (VAR CONSTANT, consommée ligne 571) — gate G518 PASS"
    - id: AC2
      statement: >
        Le ratio odométrique publié par le banc (VelocityTrue_Mps / ActualFrequency_Hz) vaut
        0,02 m/(Hz·s) au palier 40 Hz, et la distance parcourue en 6 s égale l'intégrale
        ∫ f × 0,02 × dt à 5 % près (trainee de 1er ordre du modèle de vitesse).
      verified_by: "TOOLS/TEST_AUTO_CI/RESULTS/L_SIMULATION/tests/test_fb_sim_translation.st — cas TC-T361-ALIGN-001 et TC-T361-ALIGN-002 (PASS)"
    - id: AC3
      statement: >
        Les cas TC-T361-ALIGN-001/002 sont NON TAUTOLOGIQUES : remettre FullTravelTimeS à 8,0 s
        fait échouer les deux cas (12/14), la valeur 37,5 s les fait passer (14/14).
      verified_by: "deux exécutions successives de run_tests.py --fb FB_Sim_Translation (mutation puis restauration)"
    - id: AC4
      statement: >
        Aucune régression du banc : la CI FB_SimBench reste entièrement verte après alignement,
        avec le seul ajustement de scénario TC-T300-INT-030 (1100 → 1800 scans) documenté comme
