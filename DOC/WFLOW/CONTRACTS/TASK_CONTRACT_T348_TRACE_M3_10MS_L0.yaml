# Plan parent : DOC/WFLOW/CONTRACTS/PLAN_T334_PHASE3_AUTORITE_ARRET_AXE.md (lots L0 a L4, decisions D1 a D5)
# Procedure : DOC/WFLOW/CONTRACTS/PROCEDURE_TRACE_T334_M3_DEUX_CHEMINS.md (scenarios A / B / C)
# Requalification : DOC/WFLOW/CONTRACTS/PLAN_T345_AX14_TREMIE_L3_CANDIDAT.md
# NOTE DE VOCABULAIRE : le plan parent nomme ce lot L0 (preuve). Le brief T345 l'appelait « L1 ».
#   Il s'agit du MEME lot : le run de trace qui doit preceder le lot L1 de code.
