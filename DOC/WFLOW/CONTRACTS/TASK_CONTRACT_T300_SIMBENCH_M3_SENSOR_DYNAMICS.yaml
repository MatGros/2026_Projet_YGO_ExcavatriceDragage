  conservation:
    must_survive:
      - "PRG_02_Acquisition reste la frontière unique entre images réelle et simulée."
      - "HwIn reste la seule image consommée par la logique métier."
      - "Le modèle de simulation ne génère aucune commande de mouvement et ne contourne aucun interlock ni protection."
      - "Le reset et l absence de redémarrage automatique restent inchangés."
    dropped_on_purpose: []
  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle
    - diff_bundle
    - "Trace ou observation terrain anonymisée donnant les paramètres du modèle."
    - "Matrice temporelle capteurs M3 aux extrêmes, dans les deux sens."
  models_allowed:
    - "omni/cx/gpt-5.6-terra"
    - "omni/cc/claude-sonnet-5"
  alert_duty: >
    Distinguer géométrie, oscillation mécanique et intermittence électrique.
    Une hypothèse synthétique est permise si explicitement marquée non calibrée ;
    elle ne constitue pas une mesure terrain. Faire valider le plan avant ST.
    Ne jamais filtrer le comportement pour rendre les protections vertes.
