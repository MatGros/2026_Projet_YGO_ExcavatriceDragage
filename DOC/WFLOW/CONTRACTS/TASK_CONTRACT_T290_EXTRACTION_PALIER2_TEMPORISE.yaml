contract:
  task_id: T290
  criticality: C3
  strategy: patch
  objective: >
    Autoriser directement le palier 2 pendant la montee controlee AX11 du cycle
    automatique, sans nouvelle temporisation, en conservant prioritaires tous
    les interlocks, ralentissements et plafonds existants.
  acceptance:
    - id: AC1
      statement: "En AX11 du cycle SEMI_AUTO, M1 et M2 peuvent atteindre le palier 2 avec le joystick de montee maintenu."
      verified_by: "test cycle ciblé et essai utilisateur"
    - id: AC2
      statement: "Aucune temporisation nouvelle n est ajoutée pour autoriser le palier 2."
      verified_by: "revue du code et absence de TON dédiée T290"
    - id: AC3
      statement: "Les limitations existantes restent prioritaires et peuvent ramener le palier sous 2."
      verified_by: "tests combinés avec chaque source de clamp existante"
    - id: AC4
      statement: "Le changement reste strictement limité à AX11 SEMI_AUTO ; manuel, MAINT_N1 et MAINT_N2 sont inchangés."
      verified_by: "tests par mode et inspection des producteurs de commande"
    - id: AC5
      statement: "La valeur par défaut CtrlAscentMaxStep vaut 2 et reste bornée à 1..2 côté FB_CycleSemiAuto."
      verified_by: "inspection configuration persistante et test de saturation"
    - id: AC6
      statement: "Le bundle PLCopenXML est régénéré et la liaison producteur-consommateur reste sans erreur."
      verified_by: "generate_codesys_bundle.py puis G200_check_linkage.py --report"
    - id: AC7
      statement: "Pour chaque fichier ST autorisé, le nom de fichier est identique au nom de POU et le suffixe correspond au langage généré dans le bundle."
      verified_by: "gates structurels et revue du bundle"
  scope:
    allowed:
      - CODE/G_CYCLE/FB_CycleSemiAuto.st
      - CODE/M_MAIN/PRG_04_Treuils_Benne.st
      - CODE/J_SUPERVISION/_TYPES/3_CYCLE_ET_MODES/ST_CycleCfg.st
      - CODE_XML/CODE_Bundle.xml
      - DOC/WFLOW/TASKS.yaml
      - DOC/WFLOW/CONTRACTS/TASK_CONTRACT_T290_EXTRACTION_PALIER2_TEMPORISE.yaml
      - DOC/AF/AF_Partie-10_Fonction_Treuils_Benne_v2.3.md
    forbidden:
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - CODE/FB_Safety_Winch.st
      - CODE/B_AU_SECURITE/*
  conservation:
    must_survive:
      - "Le bridage à 1 pendant hors-homing (HomedAndReliable), inchangé et prioritaire."
      - "Le bridage à 1 sur SyncDeviationWarn, inchangé et prioritaire."
      - "Le bridage commun sous position Maintenance M3, inchangé et prioritaire."
      - "Le bridage à 1 benne non fermée / mou de câble en pilotage couplé, inchangé et prioritaire."
      - "La règle de l'agrégateur : plafond = MIN des sources, jamais un palier au-delà de la source la plus restrictive."
    dropped_on_purpose: []
  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle
  models_allowed:
    - "omni/cx/gpt-5.6-terra"
    - "omni/cc/claude-sonnet-5"
  alert_duty: >
    Toute interaction entre AX11 P2 et une source de clamp existante doit être
    signalée. Ne pas ajouter de temporisation ni modifier manuel/maintenance.
status: IN_PROGRESS
