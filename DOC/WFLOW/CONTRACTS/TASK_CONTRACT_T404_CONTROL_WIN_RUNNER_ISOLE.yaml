      statement: "Le lanceur demande explicitement un fichier .project ou .projectarchive et ne travaille jamais directement dessus."
      verified_by: "Selection Windows, empreinte SHA-256 avant/apres et revue du chemin transmis a CODESYS."
    - id: AC2
      statement: "Chaque import cree une copie horodatee et une copie de travail dans un dossier TwinBench dedie."
      verified_by: "Recette locale et journal manifest.json."
    - id: AC3
      statement: "Le mode diagnostic ouvre et compile la copie avec CODESYS 3.5.19.10 en mode --noUI sans telechargement."
      verified_by: "Journal headless avec nombre d erreurs et code retour."
    - id: AC4
      statement: "Le deploiement refuse toute cible dont le nom n est pas CODESYS Control Win V3 x64 et n utilise aucune adresse du PLC reel."
      verified_by: "Garde de cible dans le script CODESYS et controle automatique du code source."
    - id: AC5
      statement: "Le projet ouvert pour la visualisation est la meme copie que celle compilee et deployee."
      verified_by: "Commande Ouvrir la copie et concordance chemin/empreinte dans le manifeste."
    - id: AC6
      statement: "Le premier essai s arrete proprement sur les incompatibilites materiel ou E/S sans modifier automatiquement la logique PLC."
      verified_by: "Rapport de compilation et absence de modification sous CODE/ et PRJ_CODESYS/."
