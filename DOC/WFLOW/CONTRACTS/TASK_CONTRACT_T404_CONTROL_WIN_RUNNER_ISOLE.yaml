contract:
  task_id: T404
  criticality: C2
  strategy: patch
  objective: >
    Prouver qu un projet CODESYS choisi par l utilisateur peut etre copie dans
    un espace TwinBench isole, compile puis deploye sans interface graphique
    vers CODESYS Control Win, avant d ouvrir exactement cette copie pour la
    visualisation en ligne, sans modifier le projet source ni joindre le PLC reel.
  acceptance:
    - id: AC1
      statement: "Le lanceur demande explicitement un fichier .project ou .projectarchive et ne travaille jamais directement dessus."
      verified_by: "Selection Windows, empreinte SHA-256 avant/apres et revue du chemin transmis a CODESYS."
    - id: AC2
      statement: "Chaque import cree une copie horodatee et une copie de travail dans un dossier TwinBench dedie."
      verified_by: "Recette locale et journal manifest.json."
    - id: AC3
      statement: "Le mode diagnostic ouvre et compile la copie avec CODESYS 3.5.19.10 en mode --noUI sans telechargement."
      verified_by: "Journal headless avec nombre d erreurs et code retour."
    - id: AC4
      statement: "Le deploiement refuse toute cible dont le nom n est pas CODESYS Control Win V3 x64 et n utilise aucune adresse du PLC reel."
      verified_by: "Garde de cible dans le script CODESYS et controle automatique du code source."
    - id: AC5
      statement: "Le projet ouvert pour la visualisation est la meme copie que celle compilee et deployee."
      verified_by: "Commande Ouvrir la copie et concordance chemin/empreinte dans le manifeste."
    - id: AC6
      statement: "Le premier essai s arrete proprement sur les incompatibilites materiel ou E/S sans modifier automatiquement la logique PLC."
      verified_by: "Rapport de compilation et absence de modification sous CODE/ et PRJ_CODESYS/."
    - id: AC7
      statement: "L adaptateur HW_SIM agit uniquement sur l export natif derive de la copie Control Win et rend l Application compilable sans masquer les diagnostics."
      verified_by: "Rapport prepare 0 erreur, liste des substitutions HW_SIM et empreinte source inchangee."
  scope:
    allowed:
      - TOOLS/TWINBENCH/controlwin_runner/
      - DOC/WFLOW/CONTRACTS/TASK_CONTRACT_T404_CONTROL_WIN_RUNNER_ISOLE.yaml
      - DOC/WFLOW/REX/NOTE_APPLICATION_T404_CONTROL_WIN_RUNNER_20260927.md
      - DOC/WFLOW/TASKS.yaml
      - DOC/WFLOW/TASK_LOCKS.json
    forbidden:
      - CODE/
      - CODE_XML/
      - PRJ_CODESYS/
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - automate_reel
      - modification_silencieuse_des_IO
      - commit
      - push
  conservation:
    must_survive:
      - "Le projet selectionne reste byte-identique avant et apres le POC."
      - "Le projet automate reel et sa reference de device restent inchanges."
      - "Aucun deploiement n est autorise tant que la cible Control Win n est pas prouvee."
      - "Les erreurs de compilation sont restituees integralement ; l adaptateur HW_SIM est explicite et journalise."
    dropped_on_purpose:
      - "Compatibilite universelle avec tout projet CODESYS."
      - "Couplage OpenModelica et benchmark UDP."
  evidence_required:
    - "check_task_contract.py PASS."
    - "Autotest des gardes source/copie/cible PASS."
    - "Empreinte du projet source inchangee."
    - "Compilation headless de la copie documentee."
    - "Recette humaine d ouverture de la copie et connexion en visualisation."
  models_allowed:
    - "omni/cx/gpt-6-sol"
  alert_duty: >
    La copie ne garantit pas a elle seule la compatibilite Control Win : les
    symboles produits par le device et les mappings E/S peuvent manquer. Le POC
    doit s arreter et presenter ces ecarts avant toute proposition de shim HW_SIM.

