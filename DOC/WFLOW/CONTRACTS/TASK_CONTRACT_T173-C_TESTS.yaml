  # ── 2. Criteres testables ─────────────────────────────────────────────────
  acceptance:
    - id: AC1
      statement: "Nominal : armement réussi en 1 essai (séquence complète 1→6, PowerContactorEngaged, ErrorId=0, aucun message IHM)."
      verified_by: "test unitaire FB_Safety_EmergencyManagementLogic : sequence complète + assertions (ErrorId=0, ArmingSeqStep=0, PowerContactorEngaged=TRUE)"
    - id: AC2
      statement: "Échec contacteur : PowerContactorEngaged reste FALSE après le pulse → timeout 2s → message 'contacteur non engagé'."
      verified_by: "test unitaire avec Timeout ; assertion message IHM présent (AbortMsgActive ou Banner.OperatorActionText)"
    - id: AC3
      statement: "Coupure volontaire : BtnEmergencyCutOff pendant la séquence → arrêt immédiat, tracé 'coupe volontaire' sans alarme défaut."
      verified_by: "test unitaire + revue du mapping IHM"
    - id: AC4
      statement: "1er boot : confirmer la cause racine (timeout restauration A/B vs front ArmRequest avalé) par snapshot, puis vérifier que le message de cause apparaît ; 2e tentative après acquittement réussit."
      verified_by: "snapshot simulation boot (LastAbortCause=16#0004/0008 = timeout restauration, OU ArmingStep jamais sorti de 0 = front avalé) + test unitaire du scénario boot"
    - id: AC5
      statement: "Table de vérité : AUCUNE sortie silencieuse résiduelle — pour chaque signal d'échec injecté, un message IHM distinct est observé (le signal est le MESSAGE, pas ErrorId qui reste 0 pour les timeouts restauration A/B) ; la case 'sortie sans message' est vide."
      verified_by: "table de vérité complète (tous les signaux x messages) jointe au rapport, revue humaine"
    - id: AC6
      statement: "Non-régression : run_all_gates palier C PASS (bundle validé), G200_check_linkage 0 erreur."
      verified_by: "run_all_gates --palier C + G200 --report"

