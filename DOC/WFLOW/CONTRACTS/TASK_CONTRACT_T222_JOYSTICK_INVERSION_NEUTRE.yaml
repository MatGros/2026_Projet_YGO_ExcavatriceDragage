validation:
  status: PENDING
  validated_by: ""
  validated_at: ""
  notes: >
    Règle de conception demandée sur machine : inversion directe détectée entre
    deux scans sans neutre observé -> désarmement + sortie joystick nulle ;
    réarmement interdit avant passage X+Y au neutre puis nouvel appui conscient.

    Protocole de délégation (exigence opérateur 2026-09-02) : après exécution,
    DEUX revues séparées obligatoires avant validation -
    (1) convention de nommage (NAMING_CONVENTION.md, NC-xxx, préfixes Req/Tgt/Cmd/Act,
        polarité, zéro nombre magique) sur tout nouveau symbole ;
    (2) qualité code + effets de bord (diff réel vs must_survive, interaction
        NeutralHoldTimer / DeadmanArmGraceTimer / ArmingPermit, latch inversion NON
        effacé par Reset, qualification anti-bruit Hall, non-régression consommateurs
        PRG_04 / PRG_05).
    L'orchestrateur relit le git diff ; l'agent exécutant ne s'auto-valide jamais.

    Bloqué avant délégation sur 3 arbitrages : (A) comportement des FB mouvement
    (FB_Winch / FB_Translation) sur inversion de sens - rampent-ils au travers de
    zéro ? ; (C) le latch InversionLockActive survit-il au Reset et au cycle
    ArmingPermit (doctrine : Reset n'ouvre jamais un interlock) ? ; (D) libération
    du verrou sur AtNeutralXY (2 axes) ou par axe ?
