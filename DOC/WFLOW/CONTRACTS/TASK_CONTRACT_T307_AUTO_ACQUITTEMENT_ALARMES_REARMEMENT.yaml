contract:
  task_id: T307_AUTO_ACQUITTEMENT_ALARMES_REARMEMENT
  criticality: C2
  strategy: patch

  objective: >
    Après réarmement complet (24V rétabli, AU non actif), nettoyer automatiquement
    les alarmes transitoires de démarrage par une salve d'acquittements bornée,
    sans jamais acquitter une alarme réellement active.

  acceptance:
    - id: AC1
      statement: "Sur front de réarmement complet, AU non actif, 2 à 3 acquittements automatiques espacés d'environ 1 s sont émis sur une fenêtre d'environ 3 s."
      verified_by: "test unitaire CI + trace scan par scan"
    - id: AC2
      statement: "Toute alarme qui persiste après la fenêtre de 3 s reste affichée et non acquittée automatiquement."
      verified_by: "test unitaire CI dédié alarme persistante"
    - id: AC3
      statement: "Aucune alarme de sécurité bloquante (AU, discordance, PowerCutOff) n'est concernée par l'auto-acquittement."
      verified_by: "revue de code + test unitaire CI"
    - id: AC4
      statement: "Si un AU redevient actif pendant la fenêtre, la salve est immédiatement annulée."
      verified_by: "test unitaire CI"

  scope:
    allowed:
      - CODE/**/FB_*Alarm*.st
      - CODE/**/PRG_07_Supervision.st
    forbidden:
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - DOC/NAMING_CONVENTION.md

  conservation:
    must_survive:
      - "Acquittement manuel opérateur existant, inchangé."
      - "Détection et affichage des alarmes de sécurité bloquantes (AU, discordance, PowerCutOff)."
    dropped_on_purpose: []

  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle

  models_allowed:
    - "omni/cc/claude-sonnet-5"
    - "omni/cx/gpt-5.6-terra"

  alert_duty: >
    Tout probleme constate en cours de route (incoherence de spec, bug
    preexistant, risque hors scope) est remonte IMMEDIATEMENT a l'orchestrateur,
    pas a la fin et jamais silencieusement. Signaler n'est pas elargir le scope.

