  alert_duty: >
    Tout ecart entre le comportement attendu et le comportement observe sur le rattrapage
    est remonte IMMEDIATEMENT avec la trace. Signaler n'est pas elargir le scope : aucune
    correction spontanee hors perimetre, et aucun seuil de securite ni de synchro touche.
    Interdiction explicite de gater le rattrapage sur SyncActive/CoupledBoth (AC6) : si le
    mouvement physique reel des deux treuils n'est pas observable facilement au banc, STOP
    et remonter avant d'implementer un gate de repli.

