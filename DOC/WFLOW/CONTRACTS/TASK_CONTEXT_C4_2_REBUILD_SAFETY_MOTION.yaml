contract:
  task_id: C4-2-REBUILD-SAFETY-MOTION
  criticality: C4
  strategy: rebuild
  objective: >
    Reconstruire atomiquement les frontieres Reset, Codeurs/Homing et Safety
    pre/post-mouvement pour supprimer les cycles sans rendre un Reset inoperant
    ni introduire un retard de scan safety.
  acceptance:
    - id: AC1
      statement: "CmdReset a un producteur PLC prouve depuis les commandes IHM existantes, un nom de fichier est identique au nom de POU si un POU est cree, et Reset est traite sur front par chaque consommateur."
      verified_by: "grep -rn 'CmdReset.*:=' CODE/ ; producteur PLC unique et consommateurs verifies"
    - id: AC2
      statement: "La disponibilite et EncoderIncoherent pre-Modes produisent EncoderUnsafe avant FB_Modes, tandis que HomingSuspect est calcule apres Modes et invalide les mesures sans alimenter EncoderUnsafe."
      verified_by: "grep -rn -E 'EncoderUnsafe|HomingSuspect' CODE/ ; graphe producteur consommateur conforme au plan C4"
    - id: AC3
      statement: "Safety pre-mouvement ne lit aucun etat Treuils ou Translation courant, et les observations post-mouvement sont lecture seule sans production SafeStop, PowerCutOff, commande ou sortie."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_linkage.py --report ; aucune liaison safety post-mouvement interdite"
    - id: AC4
      statement: "Le nom de fichier est identique au nom de POU pour chaque POU cree ou renomme, et le suffixe est identique au langage genere dans le bundle."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py ; aucune erreur S1 ou S2 sur les POU C4.2"
    - id: AC5
      statement: "Les producteurs anciens et nouveaux ne coexistent jamais pour une meme donnee, et Outputs Ladder reste unique producteur physique."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_linkage.py --report ; producteur unique et sorties verifies"
  scope:
    allowed:
      - CODE/MAIN/
      - CODE/CODEURS/
      - CODE/COMMUN/
      - CODE/MODES/
      - CODE/TREUILS/
      - CODE/TRANSLATION/
      - CODE/SUPERVISION/
      - DOC/AUDITS/Architecture/
      - DOC/AF_Partie-02_Architecture_Programme_v3.0.md
      - DOC/AF_Partie-03_Contrats_Composants_v2.0.md
      - DOC/PLAN_TASK_v1.0.md
      - DOC/VERSION_HISTORY.md
    forbidden:
      - TOOLS/
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
  conservation:
    must_survive:
      - "Aucun retard sur Reset, SafeStop, PowerCutOff, commande ou sortie."
      - "Aucun redemarrage automatique apres defaut."
      - "Outputs LD unique producteur physique."
    dropped_on_purpose:
      - "Cycles safety/mouvement et acces internes inter-POU."
  evidence_required:
    - check_linkage
    - bundle
    - run_all_gates
  models_allowed:
    - "omni/cx/gpt-5.6-terra"
  alert_duty: >
    Stopper avant toute ecriture si un contrat safety, une polarite ou une
    semantique IHM ne peut etre prouvee; ne jamais faire un patch partiel.
