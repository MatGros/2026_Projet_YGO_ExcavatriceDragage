contract:
  task_id: LOT4C-RECONSTRUCTION-DESIGN
  criticality: C4
  strategy: rebuild
  objective: >
    Traduire les decisions RU-4 en une architecture de programmes sans cycle
    safety/commande et en une migration atomique, avant toute ecriture CODE.
  acceptance:
    - id: AC1
      statement: "Le dossier fournit les 13 programmes PRG_XX cibles, leur ordre MainTask et une justification producteur avant consommateur pour chaque rang."
      verified_by: "grep -c '^| [0-9][0-9] | .*PRG_' DOC/AUDITS/Architecture/PLAN_Reconstruction_C4_v1.0.md ; compte egal a 13"
    - id: AC2
      statement: "Le Reset IHM est une commande publiee avant Safety et les mouvements, avec un unique producteur et aucun retour de Supervision."
      verified_by: "grep -n 'Reset IHM' DOC/AUDITS/Architecture/PLAN_Reconstruction_C4_v1.0.md ; producteur, consommateurs et ordre sont cites"
    - id: AC3
      statement: "Diagnostics/Joystick et Codeurs possedent chacun un POU cible unique et aucun consommateur cible ne lit PRG_Xxx.instFb.Champ."
      verified_by: "grep -n -E 'inst.*Champ|proprietaire unique' DOC/AUDITS/Architecture/PLAN_Reconstruction_C4_v1.0.md ; interdiction et proprietaires sont cites"
    - id: AC4
      statement: "Safety pre-mouvement ne consomme aucun etat de mouvement courant ; les observations post-mouvement sont lecture seule et ne produisent ni SafeStop, ni PowerCutOff, ni commande."
      verified_by: "grep -n -E 'pre-mouvement|post-mouvement|SafeStop|PowerCutOff' DOC/AUDITS/Architecture/PLAN_Reconstruction_C4_v1.0.md ; les deux frontieres sont definies"
    - id: AC5
      statement: "Chaque migration de producteur est atomique : nouveaux consommateurs remappes puis ancien producteur supprime dans le meme lot, sans ancien/nouveau actifs simultanement."
      verified_by: "grep -n -E 'atomique|coexistence|ancien producteur' DOC/AUDITS/Architecture/PLAN_Reconstruction_C4_v1.0.md ; regle et etapes sont citees"
    - id: AC6
      statement: "Toute hypothese restante est identifiee et ne bloque aucune commande safety, Reset, PowerCutOff ni sortie physique."
      verified_by: "grep -n -E 'Hypothese|Non prouve' DOC/AUDITS/Architecture/PLAN_Reconstruction_C4_v1.0.md ; chaque hypothese est classee"
    - id: AC7
      statement: "EncoderUnsafe est produit une fois avant Modes selon NOT EncoderAvailable OR EncoderIncoherent et est exclusivement consomme par FB_Modes ; HomingSuspect et les commandes homing/preset restent dans un POU Homing dedie post-Modes et ne retardent pas l'interdiction SEMI_AUTO."
      verified_by: "grep -n 'EncoderUnsafe := NOT EncoderAvailable OR EncoderIncoherent' DOC/AUDITS/Architecture/PLAN_Reconstruction_C4_v1.0.md ; le producteur, FB_Modes exclusif et le POU Homing dedie sont cites"
    - id: AC8
      statement: "Le plan nomme les six contrats C4.1 CmdReset, Diagnostics State, Encoder State, Safety PreMovement State, Movement State et Output State, ainsi que leurs fichiers cibles et leur role de producteur unique."
      verified_by: "grep -n -E 'ST_CmdReset|ST_Diagnostics_State|ST_Encoder_State|ST_Safety_PreMovement_State|ST_Movement_State|ST_Output_State' DOC/AUDITS/Architecture/PLAN_Reconstruction_C4_v1.0.md ; les six contrats et fichiers sont cites"
    - id: AC9
      statement: "La table 13 POU declare explicitement la contrainte RU-4.6 : un POU Homing dedie post-Modes exige la liberation ou fusion documentee d'un rang, sans rang invente."
      verified_by: "grep -n -E '13 programmes|POU Homing|14e programme|non executable' DOC/AUDITS/Architecture/PLAN_Reconstruction_C4_v1.0.md ; la contrainte est explicite"
  scope:
    allowed:
      - DOC/AUDITS/Architecture/PLAN_Reconstruction_C4_v1.0.md
      - DOC/AUDITS/Architecture/PLAN_Migration_MainTask_CFC_v1.0.md
      - DOC/AF_Partie-02_Architecture_Programme_v3.0.md
      - DOC/NAMING_CONVENTION.md
      - DOC/PLAN_TASK_v1.0.md
      - DOC/VERSION_HISTORY.md
    forbidden:
      - CODE/
      - TOOLS/
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
  conservation:
    must_survive:
      - "Outputs Ladder reste l'unique producteur de sorties physiques."
      - "Troubleshooting reste ST lecture seule apres Outputs."
      - "Aucun retard d'un scan sur Reset, SafeStop, PowerCutOff, commande ou sortie."
    dropped_on_purpose:
      - "Cycles inter-programmes de commande et acces aux internes d'instances."
  evidence_required:
    - check_doc_links
    - check_linkage
    - run_all_gates
  models_allowed:
    - "omni/cx/gpt-5.6-terra"
    - "omni/cc/claude-sonnet-5"
  alert_duty: >
    Signaler toute impossibilite de construire 13 rangs sans hypothese safety.
    Ne jamais resoudre une contradiction par un retard de scan sur une commande,
    un reset, un interlock ou une sortie.
