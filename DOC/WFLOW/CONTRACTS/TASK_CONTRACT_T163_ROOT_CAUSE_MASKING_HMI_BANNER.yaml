contract:
  task_id: T163_ROOT_CAUSE_MASKING_HMI_BANNER
  criticality: C3
  strategy: patch
  objective: >
    Qualifier la validite des entrees materielles dans l'IHM et implementer le
    masquage des fausses alarmes en cascade (Root Cause Masking) dans FB_Hmi_BannerFormatter
    lors de la perte d'un module d'E/S (Local_Digital_IO, VH_0800END, VH_0808ETP),
    du bus CANopen/Joystick ou du bus EtherCAT/Codeurs/Variateur.
  acceptance:
    - id: AC1
      statement: "La perte d'un module DI physique (Local_Digital_IO, VH_0800END, VH_0808ETP) affiche l'alarme parente [IO] correspondante dans le carrousel d'alarmes."
      verified_by: "Test unitaire CI FB_Hmi_BannerFormatter_test.st"
    - id: AC2
      statement: "Toutes les alarmes filles portees par un module DI defaillant (thermiques moteurs/freins pour VH0800END, poire haute/mou cable pour Local_Digital_IO, inductifs M3 pour VH0808ETP) sont masquees dans le carrousel."
      verified_by: "Test unitaire CI FB_Hmi_BannerFormatter_test.st"
    - id: AC3
      statement: "La perte du bus CAN / Joystick JOY1 affiche l'alarme [CAN] Joystick JOY1 non detecte et masque les consignes ou alarmes de manche/homme-mort."
      verified_by: "Test unitaire CI FB_Hmi_BannerFormatter_test.st"
    - id: AC4
      statement: "La perte des codeurs COD1/COD2 ou du variateur AC600 affiche l'alarme [M1/M2/M3] correspondante et masque les fausses derives synchro ou mecaniques."
      verified_by: "Test unitaire CI FB_Hmi_BannerFormatter_test.st"
    - id: AC5
      statement: "La consigne operateur (OperatorActionText) preserve l'AU independant et la puissance en tete absolue, puis hierarchise les defauts modules E/S et bus avant les consignes de conduite."
      verified_by: "Test unitaire CI FB_Hmi_BannerFormatter_test.st"
    - id: AC6
      statement: "Une temporisation de garde au demarrage (TON_BootInhibit 4s) et un filtrage anti-bagotement (TOF 1.5s) sont integres et verifies par test pour stabiliser l'affichage."
      verified_by: "Test unitaire CI FB_Hmi_BannerFormatter_test.st (Tests 3 et 4)"
    - id: AC7
      statement: "Le nom de fichier est egal au nom du POU pour PRG_07_Supervision.st."
      verified_by: "G310_check_code_structure"
    - id: AC8
      statement: "Le suffixe de langage est egal au langage genere dans le bundle pour PRG_07_Supervision.st."
      verified_by: "G310_check_code_structure"
    - id: AC9
      statement: "La suite complete des gates de conformite (run_all_gates.py) et la verification de liaison (G200) sont 100% PASS."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py"
  scope:
    allowed:
      - CODE/J_SUPERVISION/FB_Hmi_BannerFormatter.st
      - CODE/M_MAIN/PRG_07_Supervision.st
      - TOOLS/TEST_AUTO_CI/RESULTS/J_SUPERVISION/reports/FB_Hmi_BannerFormatter_test.st
      - DOC/WFLOW/TASKS.yaml
      - DOC/WFLOW/CONTRACTS/PLAN_RootCauseMasking_HmiBanner_20260826.md
      - DOC/WFLOW/CONTRACTS/TASK_CONTRACT_T163_ROOT_CAUSE_MASKING_HMI_BANNER.yaml
    forbidden:
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - DOC/NAMING_CONVENTION.md
      - CODE/B_AU_SECURITE/*
  conservation:
    must_survive:
      - "Comportement nominal de formatage des 4 textes du bandeau IHM (GlobalContext, SequenceProgress, SpecialCondition, OperatorAction)"
      - "Rotation carrousel avec index n/N et duree parametrable AlarmHoldTime"
      - "Compatibilite totale avec GVL_IHM.Banner"
      - "Producteur unique : PRG_02_Acquisition qualifie seul les modules et bus en simulation, zero re-qualification simu dans FB_Hmi_BannerFormatter"
    dropped_on_purpose:
      - "Affichage indetermine des alarmes secondaires lorsque leur equipement support est hors service"
  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle
  models_allowed:
    - omni/cc/claude-sonnet-5
    - omni/cx/gpt-5.6-terra
    - omni/ga/gemini-2.5-pro
  alert_duty: >
    Tout probleme constate en cours de route (incoherence de spec, bug
    preexistant, risque hors scope) est remonte IMMEDIATEMENT a l'orchestrateur.

