contract:
  task_id: T345_AX14_TREMIE_CONTINUITE
  criticality: C3
  strategy: patch

  objective: >
    Un operateur qui maintient un geste sur le joystick depuis la mise en position P1 jusqu'a
    l'arrivee a la tremie traverse cette arrivee sans temps mort et sans a-coup, parce que la
    transition AX14 vers AX15A s'arme sur un fait d'arret confirme publie par l'axe, et non sur un
    relachement du joystick exige de l'operateur. Le comportement observable change : a l'arrivee a
    la tremie, l'etape suivante peut s'enchainer sous le geste maintenu, tout en conservant une
    preuve d'arret avant toute ouverture de benne.

  acceptance:
    - id: AC1
      statement: "Geste maintenu de la mise en position P1 jusqu'a l'arrivee tremie : aucun front montant de M3_CommandWord ni de M3_SetpointFrequencyHz n'apparait pendant la fenetre de confirmation d'arret."
      verified_by: "Trace 10 ms, scenarios A et B du protocole PROCEDURE_TRACE_T334_M3_DEUX_CHEMINS.md, colonnes mot de commande, consigne de frequence, frequence reelle, verrou d'arrivee de l'axe"
    - id: AC2
      statement: "Le mot de commande reste non nul pendant toute la deceleration d'arrivee : aucun passage a zero avant confirmation que la frequence reelle est inferieure ou egale a 0,5 Hz."
      verified_by: "Trace 10 ms, comparaison de M3_CommandWord et M3_ActualFrequencyHz ; le rapport du banc porte une frequence reelle constamment nulle, donc l'assertion doit aussi etre jouee en CI avec les entrees injectees"
    - id: AC3
      statement: "La transition AX14 vers AX15A s'arme uniquement sur un fait d'arret confirme publie par l'axe, jamais sur le seul jeton de position M3_AtTremieStable, qui est un latch persistant."
      verified_by: "Test CI du domaine G_CYCLE avec Translation_At_Tremie injecte a TRUE et sans fait d'arret : la transition ne doit pas se produire ; le test doit echouer si la garde revient sur le seul jeton"
    - id: AC4
      statement: "La transition n'exige aucun retour au neutre : le geste de translation maintenu suffit, et l'enchainement vers l'ouverture de benne se fait sous le meme geste sans temps mort."
      verified_by: "Test CI neuf, rouge avant correctif et vert apres, assertion sur l'etape courante sur des scans consecutifs"
    - id: AC5
      statement: "L'attente d'arret a l'arrivee tremie est bornee : un timeout provoque un repli sur AX_STAB avec defaut latche, jamais un maintien indefini."
      verified_by: "Test CI d'injection de timeout ; reference de la lecon A14 du plan parent, ou le modele AX3 porte lui-meme un timeout desarme"
    - id: AC6
      statement: "Au scan de bascule vers AX15A, les demandes benne et treuils sont a zero : aucune demande de mouvement ne survit au changement d'etape."
      verified_by: "Test CI capturant WinchM1Cmd, WinchM2Cmd, TranslationCmd et BucketCmd au scan de transition"
    - id: AC7
      statement: "Le message adresse a l'operateur en AX14 correspond au geste reellement exige par la porte : plus d'instruction de relachement si la porte ne l'exige plus."
      verified_by: "Relecture de OperatorAction de la branche d'arrivee AX14 contre l'expression de la porte, apres correctif"
    - id: AC8
      statement: "La mesure precedant ce lot existe : la trace 10 ms a ete produite et depouillee, et elle etablit si la confirmation d'arret de 500 ms est atteignable sous intermittence du capteur."
      verified_by: "Livrables de T348, contrat TASK_CONTRACT_T348_TRACE_M3_10MS_L0.yaml : CSV des scenarios A, B et C plus conclusion chiffree sur D3 et D4. Sans ces livrables, ce contrat ne peut pas passer en IN_PROGRESS"

