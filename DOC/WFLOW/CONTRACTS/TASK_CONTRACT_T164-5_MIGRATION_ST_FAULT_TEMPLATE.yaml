# ═══════════════════════════════════════════════════════════════════════════
# GABARIT DE CONTRAT — T164-5 : migration d'un domaine Status:ST_Status -> Fault:ST_Fault
# ═══════════════════════════════════════════════════════════════════════════
# À CLONER par domaine. 6 lots : A_COMMUN / E_CODEURS / F_MODES / G_CYCLE /
# H_TREUILS_BENNE / I_TRANSLATION. Chaque lot = son fichier
# TASK_CONTRACT_T164-5<lettre>_<DOMAINE>.yaml, son commit, sa revue orchestrateur.
# Bloque par : T164-3 (fait) + T164-4 (pattern prouve 2x : joystick + encodeur).
# NE PAS lancer avant que T164-4 soit VALIDATED.
# ═══════════════════════════════════════════════════════════════════════════

# ── REGLE DE MAPPING DES CAUSES (non negociable, la meme pour tous les lots) ──
# L'ancien ST_Status portait `Error` (toujours latche) + parfois `Warning`.
# Migration vers FB_FaultCore : chaque cause de la liste ARRAY[0..15] OF ST_FaultCause
# est classee par `Latching`, jamais devinee :
#   - tout ce qui alimentait `ErrorId` (defaut) -> `Latching := TRUE`  (acquittable, §9).
#   - tout ce qui alimentait `WarningId`         -> `Latching := FALSE` (live seulement).
#   - une cause dont l'origine ancienne est ambigue -> `Latching := TRUE` (fail-safe cote
#     acquittement) ET remontee a l'orchestrateur (devoir d'alerte), jamais tranchee seul.
# `Busy` / `Done` de l'ancien ST_Status -> `Lifecycle : ST_Lifecycle` SI le FB a une machine
# d'etat a cycle ; sinon supprimes (un FB synchrone ne les portait deja qu'a FALSE).
# `State` / `StateAtError` (E_State) -> le FB les gere lui-meme s'il en a besoin (FB_FaultCore
# n'en produit pas). Un FB a `State` domaine (E_Diag_State, E_CycleStep, ...) garde ce champ,
# separe de Fault.

contract:
  task_id: T164-5x_MIGRATION_<DOMAINE>
  criticality: C3
  strategy: patch

  objective: >
    Migrer les FB du domaine <DOMAINE> qui portent encore `Status : ST_Status` vers le socle
    cible `Fault : ST_Fault` rempli par une instance FB_FaultCore a partir d'une liste
    ST_FaultCause nommees (+ `Lifecycle : ST_Lifecycle` si machine d'etat a cycle), en
    remappant les consommateurs de Status.* vers Fault.*/Lifecycle.* SANS changer aucune
    valeur, seuil, polarite ni logique metier. Reference d'implementation : FB_Joystick
    (CODE/D_JOYSTICK/FB_Joystick.st) et FB_Encoder (T164-4).

  acceptance:
    - id: AC1
      statement: "Chaque FB du domaine <DOMAINE> listant Status:ST_Status expose desormais Fault:ST_Fault + instFault:FB_FaultCore + instCauses:ARRAY[0..15] OF ST_FaultCause ; chaque cause a un Latching explicite conforme a la regle de mapping en tete de ce contrat."
      verified_by: "grep 'Status : ST_Status' CODE/<DOMAINE>/*.st => 0 occurrence ; lecture de chaque instCauses : Latching cable sur chaque cause active, aucune valeur par defaut implicite"
    - id: AC2
      statement: "Busy/Done migres dans Lifecycle:ST_Lifecycle uniquement pour les FB a machine d'etat a cycle ; les FB synchrones ne portent plus ni Busy ni Done."
      verified_by: "revue par FB : Lifecycle present ssi le FB avait une vraie sequence Busy/Done pilotee"
    - id: AC3
      statement: "Tous les consommateurs de <FB>.Status.* (autres FB, PRG, GVL_IHM via ST_*HMI, GVL_Troubleshooting) sont remappes sur <FB>.Fault.* ou <FB>.Lifecycle.* ; valeurs strictement identiques a l'ancien comportement."
      verified_by: "grep '.Status.' des consommateurs du domaine => remappe ; G200 PASS ; tests CI du domaine au vert sans modif des attendus de valeur"
    - id: AC4
      statement: "G315 : les FB du domaine passent de 'legacy-status' a 'forme cible' ; le decompte legacy_status global diminue d'autant ; 0 nouveau hors-contrat."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/G315_check_fb_interface.py --report"
    - id: AC5
      statement: "L'AF metier du domaine (AF-09 / AF-10 / AF-11 / AF-05 / AF-04 selon le lot) est mise a jour en lockstep : pointeur de contrat + type des ports d'etat ; G340 PASS."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/G340_check_doc_links.py ; grep 'ST_Status\\|ST_FbStatus' dans l'AF concernee => seulement historique date"
    - id: AC6
      statement: "Aucune modification de logique metier : le diff se limite au remplacement de l'interface d'etat, au cablage de FB_FaultCore, aux causes nommees et au remappage consommateur."
      verified_by: "revue git diff par l'orchestrateur, hunk par hunk"

  scope:
    allowed:
      - CODE/<DOMAINE>/**
      - CODE/M_MAIN/PRG_*.st           # remappage consommateurs (garder nom fichier = nom POU, suffixe = langage bundle)
      - CODE/J_SUPERVISION/_TYPES/**    # ST_*HMI qui embarquent l'etat du FB
      - DOC/AF/<AF metier du domaine>
      - DOC/WFLOW/AUDITS/IHM_VARIABLES_MIGRATION.md
      - CODE_XML/**
    forbidden:
      - PRJ_CODESYS/**
      - DOC/WFLOW/TASKS.yaml
      - TOOLS/AGENT_WORKFLOW/scripts/G315_check_fb_interface.py   # deja a jour (T164-3)
      - "toute logique metier : seul le contrat d'interface d'etat change"

  conservation:
    must_survive:
      - "Comportement Cause/Ack a l'identique : ce qui etait latche reste latche (Latching:=TRUE), ce qui s'auto-effacait reste live (Latching:=FALSE)."
      - "Reset jamais conditionne (§9). Interlock toujours sur la cause brute (Fault.Error), jamais sur le latch."
      - "Toutes les valeurs, seuils, polarites, temporisations metier."
      - "Les FB a State domaine gardent leur enum d'etat, separe de Fault."
    dropped_on_purpose:
      - "Le type ST_Status en sortie de ces FB (remplace par ST_Fault + Lifecycle optionnel)."
      - "Les champs Warning/WarningId/WarningIdTxt separes (l'info warning = cause Latching=FALSE)."

  evidence_required:
    - check_linkage
    - g315_report
    - run_all_gates
    - bundle
    - git_diff_review

  models_allowed:
    - "omni/cc/claude-sonnet-5"

  alert_duty: >
    Toute cause dont il faut deviner si elle est latchee ou live : STOP, Latching:=TRUE
    provisoire + remontee immediate a l'orchestrateur. Tout consommateur de Status.* qui
    ferait autre chose qu'un affichage/interlock simple (ex. recalcul, arbitrage) : STOP.
    Ne jamais elargir a un changement de logique metier « tant qu'on y est ».

