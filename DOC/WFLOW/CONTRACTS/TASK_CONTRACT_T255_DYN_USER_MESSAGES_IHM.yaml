contract:
  task_id: T255
  criticality: C2
  strategy: patch

  objective: >
    Journaliser, corriger et enrichir les retours d'essais de mise en service (MES) :
    déblocage Exit/Abort en pause, assouplissement géométrie benne à l'initialisation AX1,
    et dynamisation des messages opérateur et conditions IHM.

  acceptance:
    - id: AC1
      statement: "Le bouton Exit / Abort (BtnAbort / AbortCycle) et le Reset réinitialisent immédiatement le séquenceur à AX0_REPOS, même lorsque le cycle est en pause (WaitingResume) ou hors mode SEMI_AUTO."
      verified_by: "Test en ligne CODESYS : appui sur Exit/Abort pendant WaitingResume ramène à AX0_REPOS"
    - id: AC2
      statement: "La condition de départ cycle (CycleWinchesAtTopOk / AX1_INIT) valide M1 au capteur haut et s'appuie sur l'état qualifié de la benne (FB_Bucket.IsClosed ou IsOpen) sans imposer un range rigide ±0.4m sur M2."
      verified_by: "Test départ cycle avec benne fermée/entre-ouverte et M1 au FDC haut"
    - id: AC3
      statement: "À l'étape AX1_INIT, le message IHM affiche dynamiquement la condition exacte manquante (Codeurs non référencés, Treuils hors FDC haut, Défaut actif, Chariot M3 en maintenance)."
      verified_by: "Vérification affichage SpecialConditionText et OperatorActionText"
    - id: AC4
      statement: "La liaison mécanique G200 est 100% PASS (0 erreur) et le bundle PLCopenXML est regénéré à chaque étape."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/G200_check_linkage.py --report"
    - id: AC5
      statement: "Critère structurel (scope CODE/M_MAIN) : pour chaque fichier modifié, le nom de fichier est identique au nom de POU ; aucun suffixe de langage _CFC/_LD n'est ajouté et le suffixe reste identique au langage généré dans le bundle."
      verified_by: "G310 structure + génération bundle PLCopenXML."

