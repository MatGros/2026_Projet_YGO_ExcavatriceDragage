      - "Reprise consciente apres bascule de mode : WaitingResume ecrit sur changement de mode et consomme par StartCycle ou homme-mort (FB_CycleSemiAuto.st:743-747 et :786-819)."
      - "Porte §2 du FB inchangee : Enable, PowerContactorEngaged, EncoderFaultPresent neutralisent le cycle et ramenent les demandes a zero (:714-772)."
      - "Repli defaut AX_STAB sur front de defaut live, prioritaire sur un forcage du meme scan (:823-828)."
      - "Gating de mouvement par etape : homme-mort et joystick restent obligatoires pour toute commande de mouvement (par exemple :1293, :1298, :1367-1372, :1397-1398)."
      - "Calcul et usages hors forcage de KoboldImmersionQualified (:423, :1154, :1157, :1161) et de Fault.Latched (:573, :774, :883, :899, :915)."
      - "Comptage des prelevements et protection du totalisateur (T299, gate G508)."
    dropped_on_purpose:
      - "Gardes de contexte du forcage : Mode SEMI_AUTO, Fault.Latched, JoystickDeflected, DiveStartStopped, KoboldImmersionQualified, BottomContextValid (FB_CycleSemiAuto.st:625-626, :653-658) — decision humaine explicite, risque de forcer une fermeture benne ou une remontee chargee sans reference terrain valide, signale et assume."
      - "Mecanisme a deux temps : preparation puis confirmation par Start joystick neutre (ForceStepPrepared, ForceStepWaiting, ForceStepApplyEdge, et la branche de confirmation :792-798)."
      - "Variable BottomContextValid, devenue ecrite et jamais lue apres retrait de sa seule garde."
      - "Ciblage par une configuration persistee : la cible quitte la zone Cfg persistee pour la zone de commande non persistee."

