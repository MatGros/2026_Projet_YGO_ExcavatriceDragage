# CONTRAT DE TACHE C4 — T387 — FB_Safety_Winch : confirmation d'arret MecaB
# independante de la source de commande
# ═══════════════════════════════════════════════════════════════════════════
# Contexte (cause racine confirmee) : en mode boutons MAINT_N2, la commande
# manuelle des treuils se fait par boutons mais MecaB base son critere sur
# JoystickYNeutral (toujours TRUE hors joystick) au lieu de MovementCommanded
# (etat de commande reel). Resultat : faux [M1/M2] ErrorID:09 MecaB pendant une
# commande legitime. Diagnostic 2026-09-22 (H1 confirme, H2 simu ecarte).
# Validation : python TOOLS/AGENT_WORKFLOW/scripts/check_task_contract.py <fichier>
# ═══════════════════════════════════════════════════════════════════════════
