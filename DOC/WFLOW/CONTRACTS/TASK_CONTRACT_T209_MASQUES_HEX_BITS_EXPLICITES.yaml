  # ⚠️ NE PAS utiliser le préambule erroné (bit10=MecaD, bit11=MecaE) — FAUX.
  # bit0=OperatorComm · bit1=Encoder · bit2=MotorThermal · bit3=SlackCable
  # bit4=PhaseRotation · bit5=TopLimitSwitch · bit6=CableLimitDescent
  # bit7=MecaA · bit8=MecaB · bit9=MecaC · bit10=BrakeThermal · bit11=MecaD
  # bit12=MecaE écart · bit13=MecaE escalade · bit14=OppositeDir · bit15=NoMovement

