  # 16#FF97 = {0,1,2,4,7,8,9,10,11,12,13,14,15} = tout sauf SlackCable(3), TopLimitSwitch(5), CableLimitDescent(6)
  # 16#FF9F = {0,1,2,3,4,7,8,9,10,11,12,13,14,15} = tout sauf TopLimitSwitch(5), CableLimitDescent(6)
  # 16#0040 = {6} = CableLimitDescent
  # 16#0020 = {5} = TopLimitSwitch
  # 16#0008 = {3} = SlackCable
  # 16#2F84 = {2,7,8,9,10,11,13} = MotorThermal, MecaA, MecaB, MecaC, BrakeThermal, MecaD, MecaE-escalade

