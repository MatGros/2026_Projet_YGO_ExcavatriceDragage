    - id: AC2
      statement: "Une expression 3D ou 4D Table[i,j,k,l] devient des crochets imbriqués avant STruCpp et ne génère plus un appel at à plus de deux indices."
      verified_by: "tests unitaires convertisseur sur tableaux 3D et 4D."
    - id: AC3
      statement: "WINCH_INTEG compile et renvoie son JSON de résultats ; aucun changement ne touche CODE/ production."
      verified_by: "run_tests.py --fb WINCH_INTEG."
