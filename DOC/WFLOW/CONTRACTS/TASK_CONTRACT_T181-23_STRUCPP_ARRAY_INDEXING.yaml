    Le convertisseur STruCpp conserve les accès 2D à virgule compatibles avec
    le runtime et convertit seulement les accès 3D ou plus en crochets imbriqués,
    afin que WINCH_INTEG compile de nouveau sans perdre le support de tables 4D.
