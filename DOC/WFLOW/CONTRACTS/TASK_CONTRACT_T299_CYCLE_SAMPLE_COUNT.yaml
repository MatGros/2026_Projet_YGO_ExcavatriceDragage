contract:
  task_id: T299
  criticality: C2
  strategy: patch
  objective: >
    Rendre le comptage des prélèvements exploitable côté client : un compteur JOURNALIER
    remis à zéro à la demande de l'opérateur (ou automatiquement selon un mode CONFIGURABLE
    par paramétrage IHM, sans modification de code), et un compteur TOTALISATEUR distinct,
    PERSISTENT, jamais remis à zéro et jamais modifiable, incrémenté au même événement
    (dépose trémie AX18, une fois par cycle).
  acceptance:
    - id: AC1
      statement: >
        Le compteur JOURNALIER (GVL_PERSISTENT._CycleSampleCount, publié GVL_IHM.CycleSemiAuto.State.SampleCount)
        s'incrémente de 1 exactement une fois par cycle à l'étape AX18_DONE_SYNC de FB_CycleSemiAuto,
        et une RAZ consciente sur front montant (GVL_IHM.CycleSemiAuto.Cmd.BtnResetSampleCount) le remet à zéro.
      verified_by: >
        Test CI TC-P04-034 (incrément vérifié avant/après le scan AX18, + absence de double comptage)
        et TC-P04-035 (RAZ sur front, bouton maintenu sans effet, nouvelle impulsion effective).
    - id: AC2
      statement: >
        Le mode de RAZ automatique du journalier est un paramètre IHM PERSISTANT
        (GVL_IHM.CycleSemiAuto.Cfg.SampleCountResetMode, DUT E_CycleSampleCountResetMode) :
        (a) NEVER = RAZ manuelle seule et DÉFAUT — aucun changement de comportement tant que non activé ;
        (b) ON_FIRST_START = RAZ au premier démarrage de cycle après mise sous tension ;
        (c) ON_SAFETY_REARM = RAZ au réarmement de la chaîne AU. Aucun mode n'exige de modifier le code.
      verified_by: >
        Tests CI TC-P04-036 (mode (a) : aucune RAZ auto), TC-P04-037 (mode (b)), TC-P04-038 (mode (c)),
        + valeur par défaut NEVER dans ST_CycleCfg et dans l'énumération.
      alert: >
        L'automate n'embarque AUCUNE horloge calendaire (aucune bibliothèque RTC/SysTime dans le
        projet) : le mode (b) « 1er démarrage du jour » est réalisé sur le proxy honnête
        « premier démarrage de cycle depuis la mise sous tension », valable pour une machine
        arrêtée entre deux postes. Une vraie date calendaire exigerait une source temps (RTC ou
        signal jour fourni par l'IHM) — décision à valider par l'humain, hors périmètre T299.
    - id: AC3
      statement: >
        Le TOTALISATEUR (GVL_PERSISTENT._CycleSampleCountTotal, UDINT, PERSISTENT) est incrémenté au
        MÊME événement que le journalier (AX18) et AUCUN chemin (IHM, code, bypass, test) ne peut
        l'écrire hors de cet incrément : pas de RAZ, pas de forçage, aucune commande IHM.
      verified_by: >
        Gate G508 (3 sites d'écriture autorisés dans tout CODE/, RAZ/injection détectée — auto-test
        du détecteur inclus), test CI TC-P04-039 (test négatif : RAZ IHM, modes (b)/(c), reset
        machine, abandon, sortie de mode -> totalisateur inchangé) et grep exhaustif de restitution.
    - id: AC4
      statement: >
        Les adresses IHM des deux compteurs sont publiées en lecture côté IHM
        (GVL_IHM.CycleSemiAuto.State.SampleCount et .SampleCountTotal).
      verified_by: "Restitution (adresses explicites) + inspection de PRG_07_Supervision.st."
    - id: AC5
      statement: >
        Les persistants/IHM touchés sont déclarés, et la nouvelle variable PERSISTENT (mémoire
        non-volatile ajoutée) est signalée explicitement.
      verified_by: "Restitution + G380 (cohérence Cfg/PERSISTENT) + G200 (liaison)."
    - id: AC6
      statement: "Le bundle PLCopenXML, la liaison G200 et les gates applicables sont PASS."
      verified_by: "generate_codesys_bundle.py, generate_codesys_diff_bundle.py, G200_check_linkage.py --report, run_all_gates.py --palier C."
    - id: AC7
      statement: "Le nom de fichier est identique au nom de POU pour tout POU modifié sous CODE/M_MAIN."
      verified_by: "Contrôle du nom de fichier/POU (G310/G120) : PRG_03_Modes_Cycle.st et PRG_07_Supervision.st."
    - id: AC8
      statement: "Le suffixe de fichier est identique au langage déclaré dans le bundle pour tout POU modifié sous CODE/M_MAIN."
      verified_by: "Contrôle du nom de fichier/POU et inspection du PLCopenXML généré."
  scope:
    allowed:
      - CODE/G_CYCLE/FB_CycleSemiAuto.st
      - CODE/GVL_PERSISTENT.st
      - CODE/M_MAIN/PRG_03_Modes_Cycle.st
      - CODE/M_MAIN/PRG_07_Supervision.st
      - CODE/J_SUPERVISION/_TYPES/3_CYCLE_ET_MODES/ST_CycleCfg.st
      - CODE/J_SUPERVISION/_TYPES/3_CYCLE_ET_MODES/ST_CycleCmd.st
      - CODE/J_SUPERVISION/_TYPES/3_CYCLE_ET_MODES/ST_CycleState.st
      - CODE/J_SUPERVISION/_TYPES/3_CYCLE_ET_MODES/E_CycleSampleCountResetMode.st
      - TOOLS/AGENT_WORKFLOW/scripts/G508_check_sample_totalizer_write_protection.py
      - TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py
      - TOOLS/TEST_AUTO_CI/
      - CODE_XML/
      - DOC/WFLOW/
    forbidden:
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - CODE/B_AU_SECURITE/**
      - Tout chemin d'écriture du totalisateur (RAZ, forçage, commande IHM)
      - Remise à zéro automatique non désactivable (le défaut reste la RAZ manuelle seule)
  conservation:
    must_survive:
      - "La logique de séquencement du cycle semi-auto (Grafcet AX0..AX18/AX_STAB) reste inchangée."
      - "Le compteur journalier conserve sa persistance et son adresse IHM existante."
      - "Le comportement par défaut (mode NEVER) est identique à l'existant : aucune RAZ automatique."
    dropped_on_purpose: []
  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle
    - "Tests CI TC-P04-034..039 (incrément AX18, RAZ manuelle, 3 modes d'auto-reset, test négatif totalisateur)."
    - "Gate G508 + preuve de non-cécité (injection d'une RAZ -> FAIL)."
  models_allowed:
    - "omni/cc/claude-sonnet-5"
    - "omni/cx/gpt-5.6-terra"
  alert_duty: >
    Signaler immédiatement : (1) l'absence d'horloge calendaire pour le mode (b) ; (2) tout
    chemin d'écriture du totalisateur découvert ; (3) toute entrée de registre CI laissée
    rouge par un défaut préexistant (PRG_03_Modes_Cycle / WINCH_INTEG : sources incomplètes).
status: COMPLETED
