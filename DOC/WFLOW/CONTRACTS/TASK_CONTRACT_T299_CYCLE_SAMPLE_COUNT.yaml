    F4 (croissance de ST_CycleCfg alors que _CycleCfgPersist est au milieu de GVL_PERSISTENT) :
    EVIDENCE — le miroir persistant existe depuis le 2026-07-24 (8f90d891) et ST_CycleCfg a
