  notes: >
    Revue indépendante (challenger) à organiser par l'orchestrateur avant clôture finale.
    Aucun commit posé : lot livré en working tree, diff bundle + bundle complet fournis.
    ARBITRAGES CC01 (2026-09-20) : (1) mode (c) = « réengagement contacteur puissance » plutôt
    que « AU strictement déclenché » — ACCEPTÉ tel quel, mode désactivé par défaut ; (2) même scan
