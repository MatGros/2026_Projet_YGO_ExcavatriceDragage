    Propager en UNE passe transverse le lot de renommages T181 (AF10 §5) sur toute la chaîne
    treuil + supervision + IHM, avec G200 vert immédiat. 1 oubli = liaison rouge.

  acceptance:
    - id: AC1
      statement: "Renommages appliqués partout : ForceMinSpeedStep -> ExtractionControlActive (+ fusion ControlAscentActive) ; CfgMaxStepDescente -> MaxStepDown ; MaxStepAscent -> MaxStepUp ; M2_ForceSlowSpeed -> M2_BucketJogLimit ; RelayFwd/RelayRev (sorties FB_Winch) -> RelayFwd_Up/RelayRev_Down ; FwdRevSpeedFeedbackOff -> ContactorsAllOff ; FB_Safety_Winch.PowerCutOff -> ReqPowerCutOff ; ST_WinchFinalInterlockRequest -> ST_WinchFinalInterlockReq (+ drop prefixe Requested des champs) ; ST_TranslationFinalInterlockRequest -> ST_TranslationFinalInterlockReq ; StuckClosed -> ContactorStuck."
      verified_by: "grep de chaque ancien identifiant dans CODE/ = 0"
    - id: AC2
      statement: "Périmètre réel couvert (B4) : M2_ForceSlowSpeed aussi dans PRG_04:405,710,717,969 + ST_BucketHMIState + sortie FB_Bucket ; ContactorStuck dans FB_Winch, FB_Safety_Winch, ST_ContactorCheck/ST_SafetyWinch, PRG_04/06/07, GVL_Troubleshooting, IHM ; RelayFwd_Up dans FB_Winch, PRG_04, PRG_06, FB_TroubleshootingView."
      verified_by: "grep exhaustif par identifiant sur CODE/**/*.st + CODE/**/_TYPES/**"
    - id: AC3
      statement: "Un seul flag de montée contrôlée : ExtractionControlActive ; ControlAscentActive (local PRG_04) supprimé."
      verified_by: "grep 'ControlAscentActive' = 0"
    - id: AC4
      statement: "G200 liaison PASS IMMÉDIATEMENT après le renommage (aucune liaison cassée). Bundle PLCopenXML régénéré."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/G200_check_linkage.py --report"
    - id: AC5
      statement: "Gate G4xx_check_no_force_in_clamp_vocab : aucun identifiant 'Force*Step' / 'Force*Speed' dans la chaîne de clamp treuil."
      verified_by: "exécution du gate PASS ; ajout à run_all_gates palier C"
    - id: AC6
      statement: "Fiches AF touchées par le renommage mises à jour sur preuve (diff aligné au code) : AF-10, AF-11 (symétrie M3)."
      verified_by: "diff AF vs code"
    - id: AC7
      statement: "Non-régression : gates palier C PASS ; TC treuils existants verts ; MAIN_EndToEnd vert."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py --palier C ; run_tests.py --fb MAIN_EndToEnd"
    - id: AC8
      statement: "Critère structurel (scope CODE/M_MAIN) : pour chaque fichier modifié, le nom de fichier est identique au nom de POU (source PRG_04_Treuils_Benne -> POU PRG_04_Treuils_Benne)."
      verified_by: "comparaison basename sans extension vs identifiant apres PROGRAM/FUNCTION_BLOCK"
    - id: AC9
      statement: "Critère structurel (scope CODE/M_MAIN) : aucun suffixe de langage (_CFC/_LD) apposé ; le suffixe reste identique au langage genere dans le bundle (ST pur)."
      verified_by: "grep basename *_CFC/_LD absent + inspection CODE_Bundle.xml"

