    - id: AC2
      statement: "FB_Winch est réinterfacé (structs en entrée), et AU MÊME COMMIT : les 2 sites d'appel de PRG_04 (instWinchM1/M2), FB_SimBench et TOOLS/TEST_AUTO_CI/RESULTS/H_TREUILS_BENNE/tests/test_fb_winch.st sont migrés. Aucun appelant orphelin."
