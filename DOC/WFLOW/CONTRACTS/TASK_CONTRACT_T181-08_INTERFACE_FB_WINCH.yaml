    - id: AC3
      statement: "Étape 08a : MinStepNumber est câblé partout à la valeur 1 (aucun plancher actif). Le comportement de FB_Winch est bit-identique à l'état pré-migration sur toute la matrice de vecteurs du harnais T181-00."
      verified_by: "python TOOLS/TEST_AUTO_CI/scripts/run_tests.py --fb FB_Winch (resultat identique a la baseline pre-migration) + run --fb WINCH_INTEG"
    - id: AC4
      statement: "L'interface de FB_Winch est en REDUCTION / additive contrôlée : l'entrée morte Mode (VAR_INPUT, jamais lue) est retirée et les 2 sites PRG_04 qui passaient Mode:= sont édités au même commit. Aucune entrée nouvelle hors les 3 structs et les seuils de cadence (T181-01)."
      verified_by: "git diff FB_Winch.st (bloc VAR_INPUT) + grep 'Mode ' dans les appels instWinchM1/M2 de PRG_04 = 0"
    - id: AC5
      statement: "ContactorsCheck.ContactorStuck reste publié en sortie de FB_Winch mais n'est plus produit par lui : il est ré-alimenté depuis FB_Safety_Winch via PRG_04 (décision T181-06 #3). La cause de défaut interne ContactorStuck de FB_Winch (instCauses) est retirée."
      verified_by: "grep 'ContactorStuck' dans le corps executable de FB_Winch.st = 0 assignation ; lecture PRG_04 (re-alimentation)"
    # ---- Étape 08b : bascule du calcul de clamp ----
    - id: AC6
      statement: "Étape 08b (après T181-10) : FB_Winch/FB_SpeedStep consomment les bornes Min/MaxStep{Up,Down} de DriveRequest calculées par l'agrégateur PRG_04. Le calcul de clamp interne historique de FB_Winch est supprimé."
      verified_by: "lecture FB_Winch.st + FB_SpeedStep.st : plus de SEL/MIN de clamp local ; les bornes viennent de DriveRequest"
    - id: AC7
      statement: "L'oracle de validation de 08b est une TABLE D'ATTENDUS ECRITE A LA MAIN pour les familles HARN-1x a HARN-6x (pas « nouveau == ancien calcul » : l'ancien est connu buggé D05/D08/D13). Un point de retour Git est taggé avant la bascule."
