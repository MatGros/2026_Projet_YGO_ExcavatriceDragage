      statement: "Non-régression : G200 PASS, gates palier C PASS, et les TC treuils existants (TC-P10-011/014-016/017/023-034/042.1) restent verts après 08a puis 08b."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py --palier C"
    - id: AC9
      statement: "Critère structurel (scope CODE/M_MAIN) : pour chaque fichier modifié, le nom de fichier est identique au nom de POU (PRG_04_Treuils_Benne.st -> PRG_04_Treuils_Benne)."
