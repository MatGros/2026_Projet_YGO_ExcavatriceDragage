contract:
  task_id: T181-15_SPEED_LEARNING
  criticality: C3
  strategy: patch

  objective: >
    Créer FB_WinchSpeedLearning, collecteur STRICTEMENT PASSIF (aucune commande moteur) qui
    apprend les vitesses réelles par palier dans une table RETAIN {M1/M2 x sens x charge/vide x
    palier 1-5}, sous bit IHM + mesure valide + conditions stables, avec enveloppes de plausibilité
    par palier (valeur hors borne -> cellule invalidée). TableComplete = TRUE uniquement si charge
    ET vide complets. Aucune surveillance survitesse activée dans ce lot (reste T181-16).

  acceptance:
    - id: AC1
      statement: "FB_WinchSpeedLearning n'écrit jamais de commande moteur : aucune sortie actionneur, aucun ordre contacteur/frein/variateur. Collecteur strictement passif."
      verified_by: "grep interface FB : VAR_OUTPUT sans champ actionneur (Relay*/Contactor*/Brake*/SpeedCmd)"
    - id: AC2
      statement: "Table RETAIN {M1/M2 x sens x charge/vide x palier 1-5} avec Valid, vitesse apprise (m/s) et compteur d'échantillons par cellule."
      verified_by: "DUT ST_fbWinchSpeedLearning_Table : ARRAY[1..2,1..2,1..2,1..5] OF ST_fbWinchSpeedLearning_Cell {Valid, SpeedMps, SampleCount}"
    - id: AC3
      statement: "Bit IHM OFF (LearnStart=FALSE) -> zéro écriture dans la table (aucune cellule modifiée)."
      verified_by: "TC : LearnStart=FALSE, mesure valide et stable -> Table inchangée"
    - id: AC4
      statement: "Collecte uniquement si bit IHM actif ET vitesse mesurée valide ET conditions stables (ET sens non nul ET palier 1..5 ET axe 1..2)."
      verified_by: "TC : chaque condition manquante -> pas de collecte"
    - id: AC5
      statement: "Enveloppes de plausibilité par palier : valeur hors borne min/max -> cellule invalidée (Valid=FALSE, compteur remis à zéro)."
      verified_by: "TC : injection vitesse hors enveloppe -> cellule invalidée"
    - id: AC6
      statement: "TableComplete = TRUE uniquement si charge ET vide sont complets (toutes les cellules valides)."
      verified_by: "TC : table partielle -> FALSE ; table complète charge+vide -> TRUE"
    - id: AC7
      statement: "Aucune surveillance survitesse activée dans ce lot : le FB ne produit ni OverspeedRefMps ni armement survitesse (reste T181-16)."
      verified_by: "grep FB : aucune sortie Overspeed*/SpeedGuard*"
    - id: AC8
