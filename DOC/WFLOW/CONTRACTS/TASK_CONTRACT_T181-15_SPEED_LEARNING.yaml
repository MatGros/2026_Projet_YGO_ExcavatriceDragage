      verified_by: "git diff GVL_PERSISTENT.st : ajout uniquement en fin de liste"
    - id: AC9
      statement: "Non-régression : aucun FB/PRG existant modifié ; GVL_PERSISTENT append-only."
      verified_by: "git diff : seuls les fichiers du scope sont touchés"

