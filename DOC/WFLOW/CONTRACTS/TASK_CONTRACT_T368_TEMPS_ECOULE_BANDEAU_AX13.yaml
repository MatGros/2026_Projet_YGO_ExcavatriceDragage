        Banner.GlobalContextText porte le suffixe MMminSSs zero-padde : avec CycleElapsed_Min=0
        et CycleElapsed_S=5 il vaut exactement '[SIMULATION] [SEMI-AUTO] [CYCLE AUTO] 00min05s',
        et avec CycleElapsed_Min=1 et CycleElapsed_S=5 il porte '01min05s' (deux chiffres
        toujours presents, aucune troncature a 1 chiffre).
      verified_by: >
        python TOOLS/TEST_AUTO_CI/scripts/run_tests.py --fb FB_Hmi_BannerFormatter, cas
        T368-001 : deux ASSERT_EQ sur FB_Banner.Banner.GlobalContextText (etat rouge mesure
        AVANT implementation, puis vert APRES).
    - id: AC2
