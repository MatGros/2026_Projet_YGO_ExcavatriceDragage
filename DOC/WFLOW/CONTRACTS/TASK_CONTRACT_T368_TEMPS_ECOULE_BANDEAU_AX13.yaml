  # ── 1. Objectif metier ────────────────────────────────────────────────────
  objective: >
    L'operateur voit la duree du cycle en cours (format MMminSSs, ex. 09min05s) accollee au
    bandeau mode [SIMULATION/REEL] [MODE] [COUPLAGE], et uniquement pendant un cycle
    reellement en cours ; le message de l'etape AX13 (egouttage du godet) porte en plus le
    temps RESTANT d'egouttage en secondes entieres. Les deux valeurs existent deja
    (CurrentCycleElapsed_Min/_S calcule par FB_CycleSemiAuto, DrainTimeRemaining publie a
    l'IHM) : aucune n'est recalculee, aucun nouveau chronometre n'est introduit.

  # ── 2. Criteres testables ─────────────────────────────────────────────────
