      - ARCHIVES/

  # ── 3. Contrat de conservation ───────────────────────────────────────────
  conservation:
    must_survive:
      - "Relachement du verrou d'arrivee par une demande explicite de sens inverse uniquement (FB_Translation.st:202-204)"
      - "Armement du verrou par la seule detection d'arrivee qualifiee et par le front de fin de course extreme (FB_Translation.st:179-183 et :190-200)"
      - "Liberation des verrous bistables de fin de course par la seule commande de sens inverse (PRG_05_Translation.st:162-166)"
      - "Semantique de la coupure dure de fin de course (FB_Translation.st:190-200) et de la cause 6 de la safety, non touchees dans ce lot"
      - "Resturation RETAIN des bypass M3 vers l'IHM par PRG_07, non touchee : la garde est posee a la consommation, pas au stockage"
    dropped_on_purpose:
      - "Aucun comportement abandonne : le lot restreint la consomabilite des bypass de fin de course hors MAINT_N2 (decision humaine D1 du plan T334 Phase 3, reponse oui)"

  # ── 4. Preuves attendues en restitution ──────────────────────────────────
  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle
    - diff_bundle
    - ci_before_after
    - git_diff

  # ── 5. Écarts de prémisse du brief, vérifiés avant écriture ──────────────
  deviations:
    - id: E1_verrou_T331
      fact: "Le brief annoncait le verrou T331/DSH09 sur FB_CycleSemiAuto.st TOUJOURS ACTIF : il est LIBERE depuis 2026-09-21T05:14:00+02:00 (TASK_LOCKS.json, entree T331, released_by DSH09)."
      action: "Alerte remontee. AUCUNE extension de perimetre vers le lot L2 : le brief l'interdit explicitement. FB_CycleSemiAuto.st reste non touche par ce lot."
    - id: E2_collision_T361
      fact: "Le brief annoncait PRG_05_Translation.st actif dans le perimetre T361. Verifie FAUX a la prise : aucune entree T361 dans TASK_LOCKS.json (grep sans resultat), statut T361 ⬜ et agent '—' ; le perimetre declare de T361 vise le simulateur et l'estimateur (FB_Sim_Translation.st, GVL_PERSISTENT._TranslationGainMetersPerHzSec)."
      action: "Aucune collision : PRG_05_Translation.st et FB_Translation.st etaient PROPRES vis-a-vis de HEAD 276fc11e (git status --short -- CODE/ ne listait que 4 fichiers hors perimetre)."
    - id: E3_mecanisme_plan
      fact: "Le plan fonde la correction sur PRG_05:427 (cible effacee par la perte de la demande). Ce chemin est celui du jog manuel (SelTarget=0) : en SEMI_AUTO SelTarget vaut 1 ou 3 (FB_TranslationCmdArbitrationM3.st:65, alimente par PRG_03 AX2/AX14), donc la cible est le jeton AtXxxStable et non la demande."
      action: "Le lot traite les DEUX chemins : memoire de sens du verrou dans FB_Translation (chemin cycle) et maintien de la cible dans PRG_05 (chemin jog). Le mecanisme reel du blocage AX2 est prouve fichier:ligne dans la restitution."
    - id: E4_references_de_lignes
      fact: "Les references du plan ont derive : TranslationStopTimer est en FB_CycleSemiAuto.st:361-365 (le plan citait :334-338, qui porte desormais le repli de configuration du plongement). Les references du brief (:361-365) sont exactes."
      action: "Toutes les references utilisees par ce lot ont ete relues physiquement sur l'arbre de travail (HEAD 276fc11e)."
    - id: E5_ajout_outillage_gate
      fact: "Le perimetre du brief ne nomme que CODE/ et les tests. La regle projet fix: + guard: (AGENTS.md) impose, pour tout bug corrige, un garde-fou automatique dans TOOLS/AGENT_WORKFLOW/scripts/."
      action: "Ajout declare de G519_check_t345_axis_owns_stop.py et de sa ligne PLANS dans run_all_gates.py. Necessite double : le harnais CI ne compile PAS PRG_05_Translation.st (run_tests.py n'utilise source_prg que pour le rapport), donc G519 est la seule preuve mecanique portant sur le vrai fichier PRG_05."
    - id: E6_collision_numerotation_gate
      fact: "Le numero G518 etait deja pris par le chantier concurrent T361 (G518_check_m3_odometry_scale.py deja present dans TOOLS/AGENT_WORKFLOW/scripts/ et cable dans run_all_gates.py), alors que T361 n'a AUCUN verrou dans TASK_LOCKS.json et que son entree TASKS.yaml porte statut ⬜ et agent '—'."
      action: "Le garde-fou de ce lot est numerote G519 (premier numero libre verifie). La collision de numerotation et l'absence de verrou du chantier T361 sont remontees a l'orchestrateur."
    - id: E7_test_ecriture_du_site_droite
      fact: "En rendant le harnais M_MAIN fidèle au PRG_05 reel, le test preexistant « Commande Translation Rev » armait la cible P1 (mot 00011) tout en attendant un frein desserre : il validait un comportement que le vrai PRG_05 ne produit pas (verrou d'arrivee arme a P1)."
      action: "Mot capteurs du cas preexistant corrige en 00001 (zone P1 -> Maintenance, aucune arrivee sur cible) : l'intention du test (commande arriere nominale) est conservee, la situation decrite devient atteignable. Aucune assertion affaiblie ni supprimee."

  alert_duty: >
