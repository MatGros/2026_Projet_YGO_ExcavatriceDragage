contract:
  task_id: T345_L1_AXE_ARRET
  criticality: C3
  strategy: patch

  objective: >
    Le chariot M3 possede desormais son arret : une arrivee sur capteur cible est
    verrouillee par l'axe lui-meme, avec le SENS du dernier mouvement memorise, de sorte
    qu'une demande re-armee par le sequenceur ni un rebond du capteur ne puissent plus
    annuler un arret deja confirme ni relancer le chariot ; l'axe publie ce fait d'arret
    confirme en VAR_OUTPUT pour que la porte de cycle puisse s'y conformer (lot L2), et les
    bypass de fin de course M3 ne sont plus consommables hors MAINT_N2.

  context: >
    Blocage reproduit sur machine reelle (AX2, translation M3, arrivee P1) et confirme sur
    le code. Deux defauts racines, tous deux dans le perimetre de ce lot :
    (1) FB_Translation capture le sens d'arrivee sur CommandedTremie/CommandedMaintenance
        (FB_Translation.st:181-182), or ces deux locaux sont remis a FALSE des que la
        demande retombe (:229-233). En cycle, la demande tombe environ un scan apres l'arrivee
        du jeton alors que le debounce d'arrivee dure 100 ms (:175-183) : le verrou s'arme
        donc avec ArrivalWasTremie=FALSE et ArrivalWasMaintenance=FALSE, et la condition de
        relachement (:202) le rend liberable par une demande du MEME sens -> aucune autorite
        d'arret, relance possible, depassement.
    (2) En jog manuel (SelTarget=0), la cible est effacee par la seule perte de la demande
        (PRG_05_Translation.st:427), ce qui interrompt le debounce de 100 ms et empeche
        l'armement du verrou.
    Effet mesure sur la porte de cycle : TranslationStopTimer (FB_CycleSemiAuto.st:361-365)
    exige 500 ms continus de At_Xxx AND NOT Busy ; chaque relance remet Busy a TRUE et la
    transition ne s'arme jamais.

  # ── 1. Critères testables ────────────────────────────────────────────────
  acceptance:
    - id: AC1
      statement: "Capteur d'arrivee P1 intermittent avec la demande du cycle re-armee : apres l'armement du verrou, ArrivalStopConfirmed reste TRUE et aucun front montant n'apparait sur RequestedDriveControlWord ni sur RequestedDriveFreqHz (freq reste 0.0)."
      verified_by: "test CI TC-P11-036 dans TOOLS/TEST_AUTO_CI/RESULTS/I_TRANSLATION/tests/test_fb_translation.st, execute par python TOOLS/TEST_AUTO_CI/scripts/run_tests.py --fb FB_Translation ; 45 scans avec PositionSensorTarget oscillant et ReqTremie/ReqMaintenance re-arrmes"
    - id: AC2
      statement: "Demande retiree pendant les 100 ms de debounce : le verrou d'arrivee est encore arme et le sens d'arrivee memorise est celui du dernier mouvement, donc une demande du meme sens ne le relache pas."
      verified_by: "test CI TC-P11-037 : mouvement CommandedMaintenance puis ReqMaintenance=FALSE avant la fin du debounce, puis re-demande ReqMaintenance=TRUE -> RequestedDriveControlWord reste 0"
    - id: AC3
      statement: "Une demande explicite de sens inverse relache le verrou : le mot de commande passe dans l'autre sens et la frequence cible redevient non nulle."
      verified_by: "test CI TC-P11-038 : apres armement du verrou en sens Tremie, application de ReqMaintenance=TRUE seul -> RequestedDriveControlWord vaut 2 et RequestedDriveFreqHz est superieure a 0.0"
    - id: AC4
      statement: "ArrivalStopConfirmed n'est pas vacuaire : elle est FALSE si la frequence reelle du variateur depasse 0.5 Hz, si le frein est commande ouvert, ou si l'axe est en defaut."
      verified_by: "test CI TC-P11-039 : injection DriveActualFreqHz=5.0 puis frein ouvert puis defaut variateur (DriveStatusWord bit 4) sur un axe dont le verrou est arme"
    - id: AC5
      statement: "En jog manuel, la perte de la demande n'efface plus la cible : M3_PositionSensorTarget reste TRUE tant que le jeton du dernier point atteint est vrai, et retombe quand le chariot quitte ce point."
      verified_by: "test M_MAIN PRG_05_Translation : demande retiree alors que le jeton P1 est arme -> le harnais publie une cible encore TRUE, puis un franchissement de capteur -> cible FALSE"
    - id: AC6
      statement: "Le bypass de fin de course M3 n'est plus consommable hors MAINT_N2 : en SEMI_AUTO ou MAINT_N1, un bypass LimitSwitch ou Global a TRUE n'ouvre ni FB_Translation.BypassLimitSwitch ni FB_Safety_Translation.BypassLimitSwitch, et en MAINT_N2 il les ouvre encore."
      verified_by: "test M_MAIN PRG_05_Translation avec le harnais : meme bypass a TRUE, mesure de la sortie BypassLimitSwitch consommee pour les deux modes"
    - id: AC7
      statement: "Le nom de fichier correspond au nom de POU : PRG_05_Translation.st ne contient que le PROGRAM PRG_05_Translation et aucun POU n'est renomme par ce lot."
      verified_by: "controle mecanique : python TOOLS/AGENT_WORKFLOW/scripts/G310_check_code_structure.py et lecture du diff (aucune ligne FUNCTION_BLOCK ni PROGRAM ajoutee)"
    - id: AC8
      statement: "Le suffixe de langage correspond au langage genere dans le bundle : aucun suffixe _CFC ni _LD n'est ajoute et le POU reste en ST dans CODE_XML/CODE_Bundle.xml."
      verified_by: "controle mecanique : python TOOLS/AGENT_WORKFLOW/scripts/G310_check_code_structure.py puis lecture de CODE_XML/CODE_Bundle.xml (implementation ST du POU PRG_05_Translation)"
    - id: AC9
      statement: "Le comportement manuel de reference est conserve : une arrivee sur le capteur cible avec la demande maintenue arme toujours le verrou et coupe la rampe, et la liberation par sens inverse reste le seul chemin de degagement."
      verified_by: "test CI existant TC-P11-018 (arrivee sur capteur cible, debounce 100 ms, arret exact) conserve vert, plus TC-P11-038 pour la liberation par sens inverse"

  # ── 2. Périmètre ─────────────────────────────────────────────────────────
  scope:
    allowed:
      - CODE/I_TRANSLATION/FB_Translation.st
      - CODE/M_MAIN/PRG_05_Translation.st
      - TOOLS/TEST_AUTO_CI/RESULTS/I_TRANSLATION/tests/test_fb_translation.st
      - TOOLS/TEST_AUTO_CI/RESULTS/M_MAIN/FB_TestHarness_PRG_05.st
      - TOOLS/TEST_AUTO_CI/RESULTS/M_MAIN/tests/test_prg_05_translation.st
      - DOC/WFLOW/CONTRACTS/TASK_CONTRACT_T345_L1_AXE_ARRET.yaml
