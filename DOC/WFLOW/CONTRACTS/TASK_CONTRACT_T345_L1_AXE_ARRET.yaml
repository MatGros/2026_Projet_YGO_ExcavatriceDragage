      - TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py
      - CODE_XML/
    forbidden:
      - CODE/G_CYCLE/FB_CycleSemiAuto.st
      - CODE/I_TRANSLATION/FB_Safety_Translation.st
      - CODE/I_TRANSLATION/FB_Translation_PositionDecoder.st
      - CODE/I_TRANSLATION/FB_TranslationCmdArbitrationM3.st
      - CODE/M_MAIN/PRG_06_Outputs.st
