# Brief  : DOC/WFLOW/CONTRACTS/BRIEF_T345_L1_AXE_POSSEDE_SON_ARRET.md
# Acteur : DSH23 · Prise de verrou 2026-09-21T05:22+02:00 · HEAD 276fc11e
