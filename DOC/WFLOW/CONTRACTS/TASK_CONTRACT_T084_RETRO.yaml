        La suite CI dediee au FB passe a 10 sur 10 sous STruCpp, et la mesure
        fenetre glissante 50 ms est eprouvee pour 1 a 2 m/s par anteriorite
        v0.5.25 lors des deplacements treuils.
      verified_by: >
        python TOOLS/TEST_AUTO_CI/run_tests.py --fb FB_Encoder_SpeedMeasure ;
        entree DOC/WFLOW/TASKS.yaml T084 (description : "10/10 PASS sous STruCpp
        et anteriorite v0.5.25").

  scope:
