    - id: AC3
      statement: "Le scénario purge RestartRequired par un retour neutre sans commande pendant le délai requis avant toute demande nominale."
      verified_by: "TC multi-scan : RestartRequired FALSE puis relais/StepNumber réellement actifs"
    - id: AC4
      statement: "Les PRECOND des vecteurs HARN-12/31/50/51/73/75/80 deviennent atteignables par stimulus réel ; aucun oracle ne repasse vert par tautologie."
      verified_by: "run_tests --fb WINCH_INTEG + inspection des assertions"
    - id: AC5
      statement: "SUITE_CALIBREE reste absente tant que les vecteurs nominalement attendus ne sont pas justifiés TC-par-TC et que les vrais rouges de cible ne sont pas séparés des défauts de stimulus."
      verified_by: "G481 + grep SUITE_CALIBREE"
    - id: AC6
      statement: "Le nom de fichier est identique au nom de POU FB_TestHarness_PRG_02."
      verified_by: "inspection source et bundle frais"
    - id: AC7
      statement: "Le suffixe est identique au langage généré dans le bundle ; FB_TestHarness_PRG_02.st reste du ST pur."
