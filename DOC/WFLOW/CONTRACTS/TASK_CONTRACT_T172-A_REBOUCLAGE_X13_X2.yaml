      - "100% des tests unitaires existants (TC-P03-001, TC-P04-001..013) dans test_fb_cycle.st."
      - "Le compteur SampleCount (front unique par cycle, F2)."
      - "Le principe 'pas de redémarrage auto après défaut' (X13->X2 n'est PAS une reprise après défaut, c'est un enchaînement de fin de cycle nominal)."
    dropped_on_purpose:
      - "L'attente StartCycle en X13 (remplacée par l'enchaînement automatique vers X2)."

  evidence_required:
