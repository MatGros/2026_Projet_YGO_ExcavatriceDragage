contract:
  task_id: T172-A_REBOUCLAGE_X13_X2
  parent_id: T172
  criticality: C3            # comportement machine (mouvement) — sécurité réelle
  strategy: patch

  objective: >
    À la fin du cycle (X13_DONE_SYNC), la machine est à la trémie, treuils en position
    haute et homing déjà réalisé. Le rebouclage doit enchaîner directement vers
    X2_WORK_POS_SELECT (sélection de la position de travail suivante) SANS attendre
    StartCycle et SANS repasser par X0/X1 (pas de re-homing). StartCycle reste réservé
    à l'initialisation complète du graphe depuis X0.

  acceptance:
    - id: AC1
      statement: "En X13, le FB enchaîne automatiquement vers X2_WORK_POS_SELECT (pas d'attente StartCycle, pas de retour X0)."
      verified_by: "Harnais STruCpp : TC-P04-100 étendu — après X13, CycleStep = X2_WORK_POS_SELECT au scan suivant, sans front StartCycle."
    - id: AC2
      statement: "Le homing n'est pas rejoué : la transition X13->X2 ne passe pas par X0/X1."
      verified_by: "Trace scan-par-scan : séquence X13 -> X2 sans X0/X1 intercalés."
    - id: AC3
      statement: "La spec AF_Partie-04 §2 (ligne 58) est mise à jour : rebouclage sur X2_WORK_POS_SELECT (homing conservé)."
      verified_by: "Lecture du diff spec + G340 liens doc."
    - id: AC4
      statement: "L'animation et la trace reflètent le nouveau rebouclage (X13 -> X2)."
      verified_by: "generate_trace_cycle.py + embed_trace_in_animation.py + guard PASS."
    - id: AC5
      statement: "L'orchestrateur lit, vérifie et valide le git diff réel (visa P5)."
      verified_by: "Visa formel de l'orchestrateur."

  scope:
