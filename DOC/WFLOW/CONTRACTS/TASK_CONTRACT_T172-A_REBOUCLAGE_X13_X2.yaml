    - run_all_gates
    - bundle
    - trace_json_validated

  models_allowed:
    - "omni/cc/claude-sonnet-5"
    - "omni/cx/gpt-5.6-terra"

  alert_duty: >
    ⚠️ SÉCURITÉ : X13->X2 déclenche un MOUVEMENT automatique (translation vers la position
    de travail) en fin de cycle, sans action opérateur. Ceci est un choix utilisateur
    explicite (2026-08-28). À confirmer par l'orchestrateur : le mouvement auto de fin de
    cycle est-il acceptable au regard d'ISO 13849 / des principes du projet ? Si non,
    prévoir un garde (ex. DeadmanArmed maintenu) avant l'enchaînement.

