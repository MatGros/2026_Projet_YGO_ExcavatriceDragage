contract:
  task_id: T262-PHASE-B
  criticality: C4
  strategy: patch
  technical_plan: DOC/WFLOW/AUDITS/DESIGN/CHALLENGE_T262_PHASE_B_SEUIL_BENNE_2026-09-21.md
  updated_at: '2026-09-21T01:45:00+02:00'
  objective: >
    Rendre le réglage IHM ExtractionStartOpening_Pct réellement maître du seuil de
    transition AX10 vers AX10B, en exprimant ce seuil en pourcentage d'ouverture benne
    mesurée (0 % fermée, 100 % ouverte), par une branche additive qui n'écrit dans
    aucune ligne historique : 0 % reproduit exactement le comportement d'aujourd'hui et
    une valeur positive avance réellement l'instant où la fermeture est considérée
    atteinte, sans inversion de sens M2 et sans retrait d'une barrière de sécurité.

  acceptance:
    - id: AC1
      statement: >
        Le réglage est un entier persistant borné 0..20, valeur initiale 0 ; le bornage
        PRG_07 et le commentaire de déclaration ST_CycleCfg sont alignés sur 20, et le
        FB de décision applique la MEME borne, vérifiée identique par le garde-fou G515.
      verified_by: >
        lecture de ST_CycleCfg.st:12 et PRG_07_Supervision.st:239 dans le diff, assertion
        de saturation dans le test CI du FB (entrées -1, 0, 10, 20, 21), et check croise
        de G515 sur les deux bornes.
    - id: AC2
      statement: >
        À 0 %, la branche additive est inactive par construction : la sortie Reached du FB
        vaut FALSE et l'expression historique de Benne_IsRoughlyClosed comme la condition
        d'arrivée de fermeture de FB_Bucket restent le texte d'origine, caractère pour
        caractère.
      verified_by: >
        test CI ST comparant la sortie du FB a l'expression historique recopiee, sur au
        moins 60 combinaisons Delta x geometry, toutes en Reached FALSE ; et gate G515
        verifiant que les deux lignes historiques sont presentes telles quelles.
    - id: AC3
      statement: >
        À seuil p strictement positif, Reached devient vrai exactement au point où
        l'écart mesuré atteint OffsetCloseM moins la distance équivalente, et reste faux
        au point précédent d'un epsilon de position.
      verified_by: >
        test CI ST aux trois points Delta = seuil - 0,01 m, seuil, seuil + 0,01 m pour p
        parmi 10, 19, 20, avec la distance equivalente calculee depuis la geometrie
        persistee 0,0 / 15,0 m.
    - id: AC4
      statement: >
        La distance équivalente est croissante en p sur 0..20 et ne remonte jamais le
        critère historique : à 0 % elle vaut 0,0 m et la branche reste inerte.
      verified_by: >
        test CI ST balayant p de 0 a 20 par pas de 1, verifiant la distance attendue
        p x 0,15 m et Reached faux a 0 % sur toute la plage de Delta.
    - id: AC5
      statement: >
        Une mesure non qualifiée interdit la branche seuil : géométrie invalide,
        MeasureValid faux ou IsIntermediate faux interdisent toute autorisation de
        transition, y compris lorsque l'ouverture affichée vaut 0,0 par repli de
        configuration.
      verified_by: >
        tests CI ST avec OffsetOpenM egal ou superieur a OffsetCloseM, MeasureValid faux
        et IsIntermediate faux, verifiant Reached faux et Active faux dans les trois cas.
    - id: AC6
      statement: >
        La sortie du lot ne fabrique aucun état benne : ni IsClosed, ni IsOpen, ni
        Lifecycle.Done, ni CloseReq, ni CloseReached ne recoivent une ecriture nouvelle
        hors des affectations existantes de FB_Bucket.
      verified_by: >
        revue du diff sur FB_Bucket.st et PRG_04_Treuils_Benne.st, plus gate G515 qui
        refuse toute ecriture de ces champs hors des affectations historiques.
    - id: AC7
      statement: >
        AX12 conserve sa règle actuelle : tant que Benne_IsClosed est faux, la consigne de
        palier reste CST_StepSlow et aucune vitesse de charge n'est atteinte par le seul
        franchissement du seuil.
      verified_by: >
        lecture de FB_CycleSemiAuto.st:1399-1402 dans le diff intact, et rejeu du test
        existant T262-002 sans modification.
    - id: AC8
      statement: >
        La chaîne AX10, AX10B, AX11, AX12 reste continue : à l'instant où la branche seuil
        fait basculer la fermeture atteinte, FB_Bucket prend la même branche historique de
        maintien en montée P1, donc aucune retombée du sens M2 ni du frein.
      verified_by: >
        test existant T262-002 rejoue vert, gate G500 vert, et lecture du diff verifiant
        que la branche HoldAscentP1AfterClose de FB_Bucket est atteinte par le meme
        CloseReached.
    - id: AC9
      statement: >
        Aucun blocage en AX10 : à l'ouverture réglée, la branche seuil reste vraie à
        chaque scan tant que la mesure reste dans sa plage, donc un geste absent au scan
        d'arrivée ne fige pas la sortie AX10.
      verified_by: >
        test CI ST avec trois scans consecutifs a Delta constant et Reached vrai a chaque
        scan, plus test comparatif montrant que la branche seuil ne depend d aucun front.
    - id: AC10
      statement: >
        Un garde-fou automatique G515 refuse toute régression du câblage : constante en
        dur au lieu du réglage, ligne historique modifiée, borne du FB divergente du
        bornage PRG_07, ou branche seuil non qualifiée par MeasureValid et
        IsIntermediate.
      verified_by: >
        execution de G515 avec --selftest (vert), puis jeu de mutations volontaires
        (retrait de la garde de mesure, borne divergente, ligne historique reecrite)
        verifiant le rejet de chaque mutation.
    - id: AC11
      statement: >
        Le test CI du FB de décision est écrit avant l'implémentation et échoue d'abord,
        puis passe au vert après implémentation, sur le même fichier de test inchangé.
      verified_by: >
        journal du runner CI TOOLS/TEST_AUTO_CI avec le resultat rouge initial puis vert
        final, et empreinte du fichier de test identique entre les deux executions.
    - id: AC12
      statement: >
        Le bundle PLCopenXML est régénéré et la liaison producteur-consommateur reste
        sans erreur après la modification.
      verified_by: >
        generate_codesys_bundle.py puis G200_check_linkage.py --report colle dans la
        restitution, plus CODE_XML/CODE_DiffBundle.xml avec la liste des objets.
    - id: AC13
      statement: >
        Pour chaque fichier ST autorisé, le nom de fichier est identique au nom de POU et
        le suffixe est égal au langage généré dans le bundle.
      verified_by: >
        gates structurels du palier C et revue du bundle PLCopenXML livré.
    - id: AC14
      statement: >
        La branche seuil ne contourne aucune barrière : AU, FDC, permis de mouvement,
        freinage, synchronisme et interlocks finaux restent inchangés et prioritaires, et
        aucun redémarrage automatique après défaut n'est introduit.
      verified_by: >
        revue de flux PRG_03, PRG_04, PRG_06 et FB_Bucket sur le diff, plus gates de
        securite du palier C verts.
    - id: AC15
      statement: >
        L'interface IHM est alignée : la plage acceptée 0..20 et sa conséquence pratique
        sont écrites dans la documentation d interface, et le contrat de gel IHM T262 est
        mis à jour au lieu de laisser une plage 0..50 fausse.
      verified_by: >
        lecture du diff de IHM_FREEZE_T262_EXTRACTION_START_OPENING_20260915.md, montrant
        la plage 0..20 et la mention de l effet inerte du plancher historique.

