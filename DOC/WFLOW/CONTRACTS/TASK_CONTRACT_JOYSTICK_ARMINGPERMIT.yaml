# ═══════════════════════════════════════════════════════════════════════════
# CONTRAT DE TACHE — Joystick : ArmingPermit + fiabilisation de l'intention gestuelle
# ═══════════════════════════════════════════════════════════════════════════
#
# Lot centré sur l'encapsulation OBJET JOYSTICK (intention gestuelle), prélude à
# l'intention de mouvement (T130/T135). Décisions utilisateur 2026-08-22.
#
# Validation  : python TOOLS/AGENT_WORKFLOW/scripts/check_task_contract.py <fichier>
# ═══════════════════════════════════════════════════════════════════════════

contract:
  task_id: LOT_JOYSTICK_ARMINGPERMIT
  criticality: C3            # Arming homme-mort = sécurité machine (ISO 13849)
  strategy: patch

  objective: >
    Fiabiliser l'intention gestuelle du joystick : l'armement homme-mort ne doit
    être possible QUE si une permission d'armement (ArmingPermit) est accordée par
    le système. ArmingPermit est une ENTRÉE du joystick (vue joystick, alimentée de
    n'importe où — le producteur sera analysé plus tard). Si FALSE → armement bloqué
    + warning "armement non permis" exposé en sortie (pas de blocage muet).

  acceptance:
    - id: AC1
      statement: "FB_Joystick expose une entrée ArmingPermit : BOOL ; quand elle est FALSE, l'armement homme-mort est bloqué (DeadmanArmed ne passe jamais à TRUE) même si l'opérateur maintient l'appui au neutre."
      verified_by: "test CI ad hoc (_TROUBLESHOOTING/) : ArmingPermit=FALSE + appui 110ms -> DeadmanArmed=FALSE ; ArmingPermit=TRUE + appui 110ms -> DeadmanArmed=TRUE"
    - id: AC2
      statement: "Quand l'armement est bloqué par ArmingPermit=FALSE, aucune commande de mouvement n'est émise (AxisCmd*.Enable=FALSE, SpeedRef=0), et un warning 'armement non permis' est exposé (sortie dédiée ou Status.WarningId dédié) — pas de blocage muet."
      verified_by: "test CI ad hoc : ArmingPermit=FALSE -> AxisCmdX/Y.Enable=FALSE, SpeedRef=0, warning armement non permis actif"
    - id: AC3
      statement: "Le désarmement sur défaut capteur interne (RawOutOfRange) reste effectif, indépendamment d'ArmingPermit : 2 mécanismes distincts (défaut interne vs permission externe)."
      verified_by: "test CI ad hoc : RawOutOfRange=TRUE -> Enable=FALSE même si ArmingPermit=TRUE ; ArmingPermit=FALSE bloque l'armement même sans défaut capteur"
    - id: AC4
      statement: "L'interface joystick est nettoyée : les états déjà portés par Status (Error/ErrorId/Busy/Done/State/StateAtError) ne sont PAS dupliqués en sorties à plat incohérentes ; la surface publique est cohérente."
      verified_by: "revue interface FB_Joystick (grep VAR_OUTPUT) + encapsulation_check.py (rapport CI)"
    - id: AC5
      statement: "Le bloc socle (FB_FbStatus) est encadré dans une région {region §8} et commenté ; les sorties à plat résiduelles (Ready) sont justifiées par commentaire. Cohérence structurelle respectée : le nom du fichier correspond au nom du POU (FB_Joystick.st contient le POU FB_Joystick, PRG_02_Acquisition.st le programme PRG_02_Acquisition), et le suffixe du fichier est identique au langage généré dans le bundle (.st → langage ST)."
      verified_by: "grep 'region §8 Statut socle' dans FB_Joystick.st"

  scope:
    allowed:
      - CODE/D_JOYSTICK/FB_Joystick.st
      - CODE/A_COMMUN/FB_FbStatus.st
      - CODE/A_COMMUN/ST_FbStatus.st
      - CODE/M_MAIN/PRG_02_Acquisition.st
      - TOOLS/TEST_AUTO_CI/RESULTS/_TROUBLESHOOTING/tests/test_fb_sim_joystick.st
      - TOOLS/TEST_AUTO_CI/RESULTS/_TROUBLESHOOTING/tests/run.py
    forbidden:
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - CODE/M_MAIN/PRG_04_Treuils_Benne.st   # intention de mouvement = lot T130/T135
      - CODE/M_MAIN/PRG_05_Translation.st
      - TOOLS/TEST_AUTO_CI/registry.yaml        # registry principal figé
      - DOC/AF/AF_Partie-08*                     # AF joystick = autre agent en cours

  evidence_required:
    - check_linkage
    - test_ci_ad_hoc            # run.py _TROUBLESHOOTING -> PASS
    - bundle

  models_allowed:
    - "omni/cc/claude-sonnet-5"

  alert_duty: >
    ArmingPermit est une ENTRÉE (vue joystick) alimentée de n'importe où — le
    producteur sera analysé plus tard (hors scope). Ne pas élargir vers T130/T135.
    Ne pas toucher à DOC/AF/AF_Partie-08 (autre agent en cours).

# ── Suivi ────────────────────────────────────────────────────────────────────
