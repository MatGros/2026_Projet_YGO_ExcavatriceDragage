      verified_by: "DOC/AF/AF_Partie-13_Fonction_Simulation/FB_Sim_Encoder_v1.1.md + python TOOLS/AGENT_WORKFLOW/scripts/G340_check_doc_links.py + grep du cartouche FB_Sim_Encoder.st et de registry.yaml"
    - id: AC7
      statement: "Le bug est garde : un gate statique echoue si un compteur de modele de simulation est ramene a un litteral (butee silencieuse) sans marqueur de saturation, et son --selftest rejette une mutation du code surveille."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/G510_check_sim_silent_floor.py --selftest + ligne PLANS dans run_all_gates.py (palier C)"
    - id: AC8
