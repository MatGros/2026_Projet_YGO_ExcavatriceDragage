contract:
  task_id: T338_SIM_ENCODER_FLOOR
  criticality: C2
  strategy: patch

  objective: >
    Supprimer la butee silencieuse a 0 du compteur brut du modele codeur simule (FB_Sim_Encoder) :
    le comptage devient un compteur SIGNE 32 bits continu, qui franchit 0 sans jamais s'y figer en
    descente, et dont la seule borne restante (plage de representation) est explicitement signalee
    par une sortie de saturation au lieu d'etre un zero muet. Effet machine attendu : le banc ne peut
    plus produire une position figee alors qu'une vitesse non nulle est publiee — la chaine M2 cesse
    de se verrouiller et de fabriquer une reference de homing aberrante (saut de 204,677 m).

  acceptance:
    - id: AC1
      statement: "Depuis un comptage brut a 0 avec RelayRev actif, un scan produit un comptage STRICTEMENT inferieur a 0 (jamais 0 maintenu) : la position ne peut plus rester figee a 0 en descente."
      verified_by: "test CI TC-P13-036 dans TOOLS/TEST_AUTO_CI/RESULTS/L_SIMULATION/tests/test_fb_sim_encoder.st + python TOOLS/TEST_AUTO_CI/scripts/run_tests.py --fb FB_Sim_Encoder"
    - id: AC2
      statement: "Le comptage est bidirectionnel et continu : N scans de descente au palier 1 depuis 1000 donnent exactement 1000 - N*40 points, y compris pour un resultat negatif (aucune borne intermediaire) ; une montee ulterieure ramene le comptage vers 0 puis au-dessus, sans saut."
      verified_by: "test CI TC-P13-032 (revise) et TC-P13-038, valeurs calculees : Increment = 1,0 m/s x 4096 pts/m x 0,010 s = 40 pts/scan"
    - id: AC3
      statement: "La seule borne restante est explicite : au franchissement de +/-CST_CountTravelLimitPts, RawPosOut est borne a la limite ET CountSaturated passe a TRUE dans le MEME scan ; aucun rebouclage UDINT silencieux n'est possible."
      verified_by: "test CI TC-P13-037 : comptage force a 2147483647 puis un scan de montee -> CountSaturated = TRUE et RawPosOut = 1073741824"
    - id: AC4
      statement: "En saturation de comptage, le modele ne publie plus de vitesse incoherente : RawSpdOut vaut 0 au scan de saturation (position bornee et vitesse nulle sont coherentes)."
      verified_by: "test CI TC-P13-037, assertion sur fb.RawSpdOut"
    - id: AC5
      statement: "Aucune regression sur les comportements conserves du modele : montee, latence et chargement du preset, roulis inertiel (CoastDistanceM), echelle de vitesse par palier, retour vitesse 1er ordre (SpeedReportTauS) et persistance VAR_IN_OUT du comptage."
