      - TOOLS/AGENT_WORKFLOW/scripts/G511_check_homing_climb_guard.py
      - TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py   # 1 ligne : branchement du gate
      - TOOLS/TEST_AUTO_CI/RESULTS/G_CYCLE/tests/test_fb_cyclemachinehoming.st
