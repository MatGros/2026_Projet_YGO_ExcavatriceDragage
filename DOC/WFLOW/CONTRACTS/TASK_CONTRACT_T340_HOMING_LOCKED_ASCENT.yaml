      - CODE/M_MAIN/PRG_04_Treuils_Benne.st               # palier 1 deja correct, aucune duplication
      - CODE/M_MAIN/PRG_05_Translation.st                 # interlock M3 deja correct
      - CODE/F_MODES/FB_Modes.st                          # arbitrage de mode hors perimetre
      - CODE/H_TREUILS_BENNE/FB_WinchCmdArbitrationM1.st  # arbitrage du palier hors perimetre
      - CODE/H_TREUILS_BENNE/FB_WinchCmdArbitrationM2.st
