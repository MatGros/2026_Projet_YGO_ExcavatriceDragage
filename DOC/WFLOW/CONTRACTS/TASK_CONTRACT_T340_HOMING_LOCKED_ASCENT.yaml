  # ── 4. Contrat de conservation ────────────────────────────────────────────
  conservation:
    must_survive:
      - "Comportement des etapes existantes HX0, HX1, HX2, HX2N, HX3, HX3N, HX4, HX5, HX6, HXF (aucun renumerotage : valeurs 0..9 inchangees, nouvel etat = 10)"
      - "EXCEPTION DECLAREE ET TESTEE sur HX3 : la garde de descente ne se consomme plus pendant une pause operateur (meme regle que la garde de montee, AC5). Seul comportement d'une etape existante modifie par le lot ; couvert par TC-P09-H210 et TC-P09-H211."
      - "Referencement AU VOL de HX3 (front descendant du capteur) : inchange, non regresse"
      - "Palier 1 hors referencement (PRG_04:1217-1230) : inchange, non duplique"
      - "Interlock hauteur M3 (PRG_05:134-138) : inchange"
      - "Expulsion SEMI_AUTO sans datum (FB_Modes:251) : inchangee"
      - "Chemin de secours hors grafcet : referencement unitaire BtnHome en MAINT_N1/N2 (PRG_02:601-604, 654-657)"
      - "Forcage de step de mise en service (CfgForceStep*, MAINT_N2, impulsion sur front)"
      - "Sonde de perte de datum en mouvement (MachineWasHomed / HomingLossLatched / SafeStop)"
      - "Reset jamais conditionne (front conscient, purge du cycle)"
      - "Contrat FB : Enable/Reset en entree, Ready/Fault/Lifecycle en sortie (CODESYS standard)"
    dropped_on_purpose:
      - "Position PROVISOIRE M1 (ex. 0) a la confirmation benne : ABANDONNEE sur preuve (challenge T340, point 1 BLOCK)"
      - "Palier 1 « a ecrire » : deja implemente, aucune ligne ajoutee"
      - "Interlock M3 « a ecrire » : deja implemente, aucune ligne ajoutee"
      - "Garde HX2 en dur 120 s : remplacee (AC5)"

  # ── 5. Preuves attendues en restitution ───────────────────────────────────
