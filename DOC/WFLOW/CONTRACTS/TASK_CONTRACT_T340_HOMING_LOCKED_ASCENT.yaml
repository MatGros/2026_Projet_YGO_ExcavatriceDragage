  # ── 6. Modeles autorises ──────────────────────────────────────────────────
  models_allowed:
    - "omni/cc/claude-sonnet-5"
    - "deepseek-v4.1-flash:cloud"

  # ── 7. Devoir d'alerte ────────────────────────────────────────────────────
  alert_duty: >
    Tout probleme constate en cours de route (incoherence de spec, bug preexistant, risque hors
    scope) est remonte IMMEDIATEMENT a l'orchestrateur, pas a la fin et jamais silencieusement.
    Signaler n'est pas elargir le scope. Limites structurelles deja identifiees et a re-declarer
    dans la restitution : (1) l'arbitrage de mode (FB_Modes) n'est pas dans le perimetre, donc le
    verrou est enforce cote cycle (etape maintenue, aucune sortie) et non par un veto de mode ;
    (2) hors SEMI_AUTO l'arbitrage treuil ignore ReqWinch, donc les ordres de montee emis par le
    cycle sont redondants avec la commande joystick de l'operateur en MAINT_N2 ; (3) le selecteur
    de treuil (couple / M1 seul / M2 seul) n'est pas une entree du cycle : impossible d'imposer
    la montee couplee depuis le cycle, a declarer comme risque residuel.

