# ═══════════════════════════════════════════════════════════════════════════
# CONTRAT DE TACHE — T340 : etape de grafcet VERROUILLEE de montee au vrai capteur haut
# Critique C1 — cycle de referencement machine (FB_CycleMachineHoming)
# ═══════════════════════════════════════════════════════════════════════════
#
# Validation : python TOOLS/AGENT_WORKFLOW/scripts/check_task_contract.py <ce fichier>
#
# Contexte : la conception initiale de T340 (position PROVISOIRE M1 := 0 a la confirmation
# benne) a ete CHALENGEE avant code (2 audits independants + challenge CC01 du 2026-09-20) et
# ABANDONNEE : ST_Encoder_Calib ne porte qu'un booleen Homed, et le couple « M1 provisoire +
# M2 cale sur M1 » produit Delta = OffsetCloseM, soit un datum faux AUTO-COHERENT donc
# indetectable. Ce contrat couvre la conception RETENUE apres arbitrage humain.
# ═══════════════════════════════════════════════════════════════════════════

contract:
  task_id: T340_HOMING_LOCKED_ASCENT
  criticality: C1
  strategy: patch

  # ── 1. Objectif metier ────────────────────────────────────────────────────
  objective: >
    Rendre le referencement machine M1/M2 impossible a « tricher » et impossible a perdre en
    cours de route : apres la confirmation visuelle « benne fermee » par l'operateur, le cycle
    entre dans une etape de GRAFCET DEDIEE et VERROUILLEE qui monte les deux treuils vers le
    capteur mecanique haut et n'en sort que par le vrai referencement (Homed pose sur le chemin
    standard, capteur haut reellement atteint puis machine arretee) ou par un acquittement
    conscient. Corrige au passage la garde de montee (timeout mural en dur, incompatible avec
    un trajet reel au palier 1) et ajoute un referencement A L'ARRET de secours, en complement
    du referencement au vol existant qui reste inchange.

  # ── 2. Criteres testables ─────────────────────────────────────────────────
  acceptance:
    - id: AC1
      statement: >
        Le cycle ne provoque JAMAIS une prise de reference avant le franchissement reel du
        capteur mecanique haut : aucune demande de homing (M1Demand.HomeReq / M2Demand.HomeReq)
        n'est emise tant que le capteur haut n'a pas ete reellement atteint. Homed reste FALSE
        pendant toute la montee. Renforcement issu de la revue independante : l'etape
        verrouillee ne s'OUVRE que si le capteur haut est INACTIF (machine vraisemblablement
        sous le capteur) — un capteur deja actif (colle, force, ou machine deja en position
        haute) n'apporte aucune preuve de franchissement et mene au chemin herite, qui exige
        le front descendant. La classe « impossible a tricher » du chemin herite est donc
        conservee.
      verified_by: >
        (1) trace exhaustive de TOUS les sites d'ecriture de HomeReq dans
        FB_CycleMachineHoming.st : 2 RAZ (tete de scan, NOT Enable) et 2 seuls sites a TRUE,
        chacun exigeant une preuve physique du capteur (HX3 : front descendant ; HX7 : capteur
        actif + arret mecanique + neutre, apres une entree refusee si le capteur etait deja
        actif) ; (2) test ST « HX7 : aucune HomeReq tant que le capteur haut est inactif » ;
        (3) test ST « Homed reste FALSE pendant la montee » ; (4) test ST « capteur deja actif
        a l'entree -> aucune capture sans franchissement » (TC-P09-H212).
    - id: AC2
      statement: >
        Aucune sortie de l'etape verrouillee n'est possible : ni changement d'etape, ni mise en
        pause, ni retour a l'etape initiale, tant que le vrai referencement n'est pas atteint.
        Sorties admises, toutes CONSCIENTES et tracees : (a) un front Reset (purge), (b) un
        defaut latché, (c) une violation detectee de la consigne (descente demandee, garde de
        montee ecoulee, erreur codeur, mouvement hors phase) -> abandon HXF, machine toujours
        NON referencee, (d) EXCEPTION DECLAREE : le forcage de step de mise en service
        (CfgCommissioningEnable + MAINT_N2 + impulsion sur front, mecanisme preexistant qui
        peut sortir de TOUTE etape, y compris les etapes HX0..HX6 d'avant ce lot). Le forcage
        n'est PAS un chemin d'entree dans HX7 (la cible est bornee 0..9). Il ne peut pas
        produire de reference : la sortie laisse la machine non referencee.
      verified_by: >
        Test ST « HX7 : une demande de descente pendant l'etape verrouillee fait echouer le
        cycle (HXF) et ne peut pas produire de reference » + test ST « HX7 : la perte du mode
        MAINT_N2 ne fait PAS sortir de l'etape (etape maintenue, aucun mouvement, aucun faux
        Homed) » + revue du CASE §8 (aucune transition de sortie non conditionnee) + revue du
        §4bis (forcage de step : sortie consciente de mise en service, hors chemin nominal).
    - id: AC3
      statement: >
        L'arret d'urgence fonctionne sans restriction pendant l'etape verrouillee : la chaine AU
        est materielle et le cycle ne la traverse pas (il ne consomme AUCUN signal de l'AU, et
        son Enable n'est pas coupe par l'AU). Apres rearmement, la machine reprend proprement
        l'etape verrouillee : pas de faux Homed, pas de blocage silencieux, pas de perte
        d'information, et la garde de montee ne s'est pas consommee pendant l'arret.
      verified_by: >
        (1) revue statique : le cycle ne consomme AUCUN signal de la chaine AU
        (grep : aucune entree Emergency/PowerContactor dans FB_CycleMachineHoming) et ses
        sorties de mouvement sont remises a zero en tete de scan (aucun maintien de mouvement
        traversant un arret de puissance) ; (2) test ST « HX7 : perte des permis operateur et
        arret confirme des treuils -> l'etape est CONSERVEE, aucune HomeReq, aucun defaut »
        (le banc ne peut pas simuler l'AU : le levier testable est la chute des permis et
        l'arret mecanique, l'AU n'ecrivant ni Enable ni Reset du cycle) ; (3) test ST « la
        garde de montee ne se consomme pas quand la montee n'est pas commandee » (preuve que
        l'arret ne consomme aucun budget) ; (4) test ST « HX7 : reprise de la montee apres
        l'arret -> reference atteinte » (reprise propre).
    - id: AC4
      statement: >
        Le palier 1 est actif automatiquement pendant toute la phase de referencement non
        reference, sans AUCUN code de plafond vitesse duplique (le garde-fou existant
        PRG_04:1217-1230 s'applique parce que Homed reste FALSE).
      verified_by: >
        (1) grep : aucune ecriture de plafond de palier ajoutee par ce lot (0 occurrence
        nouvelle dans PRG_04 / FB_Winch / arbitrages) ; (2) rappel du chemin existant
        PRG_04:1226-1230 -> ReqM1Winch.MaxStepUp/MaxStepDown -> FB_Winch.ActiveMaxStep ->
        FB_SpeedStep.MaxStepNumber ; (3) test ST « HX7 : les ordres de montee emis par le cycle
        sont au palier 1 (CST_StepSlow) pour M1 ET M2 ».
    - id: AC5
      statement: >
        A1 corrige : la garde de montee n'est plus un timeout mural en dur inadapte au terrain.
        Elle (a) ne se consomme QUE lorsque l'ordre de montee est REELLEMENT emis, et (b) porte
        une duree realiste, derivee de la course maximale et de la borne haute de vitesse du
        palier 1 (0,4 m/s, hypothese conservatrice de vitesse lente ; valeur de banc encore A
        MESURER sur site), avec marge, au lieu de 120 s en dur. Extension assumee et testee :
        la MEME regle est appliquee a la garde de descente HX3 (un temporisateur mural y
        sanctionnait deja une pause operateur) — c'est le seul comportement d'une etape
        existante modifie par ce lot, et il est couvert par test.
      verified_by: >
        (1) test ST « la garde de montee ne se consomme pas sans commande de montee » (TC-P09-H208) ;
        (2) test ST « la garde ne se consomme pas hors MAINT_N2, ou aucun ordre n'est emis »
        (TC-P09-H206, sejour prolonge 700 s) ; (3) test ST « la garde est consommee quand la
        montee est commandee » (TC-P09-H209) ; (4) tests ST de la garde de descente
        (TC-P09-H210 sans commande, TC-P09-H211 avec commande) ; (5) gate G511 PASS et
        --selftest PASS : 8 mutations rejetees (dont le retour a 120 s, la garde keyee sur
        l'intention au lieu de l'ordre emis, et la capture sans preuve de franchissement) ;
        (6) derivation documentee dans la constante (146,3 s x 2 = 292,5 s ; valeur retenue 300 s).
    - id: AC6
      statement: >
        Un referencement A L'ARRET est disponible en COMPLEMENT du referencement au vol (qui
        reste inchange) : a l'issue de la montee, machine arretee (etat de repos confirme :
        treuils non en mouvement, commande relachee) et capteur haut actif, le cycle demande la
        prise de reference nominale (cible = position capteur haut). Ce chemin est testable
        independamment du referencement au vol.
      verified_by: >
        (1) test ST « HX7 : la prise de reference n'est demandee qu'a l'arret confirme et
        capteur haut actif » ; (2) test ST « HX7 : referencement abouti -> MachineHomed TRUE,
        retour a l'etape initiale » ; (3) test ST « HX3 (au vol) : comportement inchange »
        (preuve de non-regression du chemin au vol).
    - id: AC7
      statement: >
        Le chemin de secours existant hors grafcet n'est pas regresse : en MAINT_N1/N2, le
        referencement unitaire manuel (bouton BtnHome, treuils arretes ou capteur haut atteint)
        reste disponible et sa semantique est inchangee.
      verified_by: >
        (1) git diff : aucune modification de PRG_02_Acquisition.st hors LA ligne de cablage
        declaree, aucune modification de FB_Encoder_Homing.st ni de ST_Encoder_Calib.st ;
        (2) revue des conditions HomingPermit inchangees (PRG_02:601-604, 654-657) ;
        (3) non-regression : suite CI du cycle (G_CYCLE) sans nouveau rouge.
    - id: AC8
      statement: >
        Criteres structurels de l'ecriture dans CODE/M_MAIN (une seule ligne de cablage dans
        PRG_02_Acquisition.st) : le nom de fichier est identique au nom de POU
        (PRG_02_Acquisition.st porte le PROGRAM PRG_02_Acquisition) et le suffixe de langage est identique au langage genere dans le bundle — aucun suffixe _LD ou _CFC n'est appose puisque le bundle
        PLCopenXML genere ce POU en ST pur.
      verified_by: >
        (1) lecture du fichier : `PROGRAM PRG_02_Acquisition` dans
        CODE/M_MAIN/PRG_02_Acquisition.st, aucun suffixe de langage au nom de fichier ;
        (2) bundle PLCopenXML : l'objet PRG_02_Acquisition y est genere en ST
        (CODE_XML/M_MAIN/PRG_02_Acquisition.xml) ; (3) G310 structure + G200 liaison.

  # ── 3. Perimetre ──────────────────────────────────────────────────────────
