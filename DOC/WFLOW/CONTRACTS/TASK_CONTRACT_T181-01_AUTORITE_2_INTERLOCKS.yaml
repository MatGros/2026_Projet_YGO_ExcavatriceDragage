# Contrat T181-01 — Barrière finale : autorité des 2 interlocks + interlock cadence + règle §3bis
# Source : PLAN_GEL_TREUIL_T181_v0.1.md §1 (D01), §4, §13#4 ; décision Q6 ; AF10_INTERFACE §3bis/§3ter ;
#          B4 S1 (StepDelay TON mort) ; B5 (§1.2 conflit barrière §5, §1.1 bornage, §M2 consolidation,
#          §5 corrections a/b/c/e).
# CE TICKET CONSOLIDE toutes les modifications de FB_WinchOutputInterlock (B5-§M2).

contract:
  task_id: T181-01_BARRIERE_INTERLOCK_CADENCE
  criticality: C4
  strategy: patch

  objective: >
    Rendre FB_WinchOutputInterlock vert en CI (7/7), CRÉER l'interlock de cadence 2 niveaux
    (FB_WinchRateInterlock : une instance dans FB_Winch seuils safety+marge, une dans PRG_06 seuils
    nus), et RESTRUCTURER §5 de la barrière pour qu'elle applique la règle §3bis (contacteur de sens
    jamais relâché avant les contacteurs de vitesse, fenêtre bornée). L'autorité : la logique
    programme n'est jamais limitée par l'interlock de sécurité en fonctionnement nominal
    (FinalInterlockGoverned reste FALSE).

  acceptance:
    - id: AC1
      statement: "CI FB_WinchOutputInterlock : TC-P10-012 (watchdog frein), TC-P10-013 (latches hors Enable), TC-P10-021 et TC-P10-022 (temps morts directionnels) PASS ; les TC déjà verts le restent (vecteur pass/fail par TC figé par T181-00, aucun TC vert ne repasse rouge)."
      verified_by: "python TOOLS/TEST_AUTO_CI/scripts/run_tests.py --fb FB_WinchOutputInterlock ; comparaison TC-par-TC a la baseline T181-00"
    - id: AC2
      statement: "L'interface (VAR_INPUT/VAR_OUTPUT/VAR_IN_OUT) de FB_WinchOutputInterlock est modifiée uniquement en ADDITIF contrôlé (nouvelles entrées de seuils de cadence et de fenetre T_max / DropConfirmDelay) ; aucune entrée retirée ; les 2 sites PRG_06 mis à jour au même commit."
      verified_by: "git diff bloc de declaration + G200_check_linkage.py --report (0 orphelin)"
    - id: AC3
      statement: "FB_WinchRateInterlock existe comme FB unique, instancié dans FB_Winch ET dans PRG_06. Les 2 jeux de seuils sont des CONSTANTES en dur distinctes (rien à corrompre) provenant de sources de config disjointes. Les valeurs de cadence de montée sont marquées PROVISOIRES / TODO essai site (base physique = thermique résistances rotoriques + choc de couple, valeur empirique)."
      verified_by: "grep 'FB_WinchRateInterlock' dans FB_Winch.st et PRG_06_Outputs.st + commentaire 'PROVISOIRE essai site' sur les constantes + gate G4xx_check_rateinterlock_independence (sources de seuils disjointes, zéro GVL/variable partagée)"
    - id: AC4
      statement: "Diag FinalInterlockGoverned (bus PRG_06) reste FALSE sur 100 % des vecteurs nominaux du harnais T181-00 (Grafcet, rampes joystick, plongée, extraction, benne). CLAUSE COMPAGNON : un DirectionDropBlocked TRANSITOIRE (<= quelques cycles, fenetre §3bis normale) N'EST PAS une gouvernance et ne met pas FinalInterlockGoverned a TRUE."
      verified_by: "harnais T181-00 : assertion FinalInterlockGoverned = FALSE + assertion DirectionDropBlocked transitoire sur relache joystick nominale"
    - id: AC5
      statement: "Injection : cadence > seuil safety en contournant l'instance FB_Winch (stub) -> l'instance PRG_06 coupe (RelayFwd/Rev = FALSE). Pas de double-freinage : quand l'instance FB_Winch gouverne (marge), l'instance PRG_06 reste passive (Busy interne PRG_06 = FALSE)."
      verified_by: "harnais T181-00 : vecteurs 'injection cadence' et 'marge FB_Winch active'"
    - id: AC6
      statement: "REGLE §3bis restructurée dans §5 de la barrière : quand RequestedStep tombe à 0 mais RequestedRelayFwd/Rev reste TRUE, la barrière NE force PLUS RelayFwd/Rev à FALSE immédiatement — elle les TIENT jusqu'à FwdRevSpeedFeedbackOff (feedback) OU T_max (timeout porté par le filet). Le chemin 'ELSIF NOT MotorRequest' de FB_WinchOutputInterlock.st:225-231 est retravaillé en conséquence."
      verified_by: "python TOOLS/TEST_AUTO_CI/scripts/run_tests.py --fb FB_WinchOutputInterlock : nouveau TC 'sens maintenu apres chute vitesse jusqu a ContactorsAllOff' ; nouveau TC 'T_max atteint sans confirmation -> chute sens forcee + latch'"
    - id: AC7
      statement: "Bornage §3ter : à T_max sans confirmation ContactorsAllOff -> chute du sens FORCÉE + latch StuckClosed (via FB_Safety_Winch) + escalade SafeStop. Le maintien indéfini du stator sous tension est INTERDIT. Feedback ContactorsAllOff collé 'released' -> la tempo DropConfirmDelay prévaut (pas d'ouverture du sens sur feedback simple voie seul)."
      verified_by: "TC : ContactorsAllOff force 'not released' + T_max -> RelayFwd = FALSE + StuckClosed latché + SafeStop ; TC : ContactorsAllOff 'released' premature -> sens tenu jusqu'à DropConfirmDelay"
    - id: AC8
      statement: "DropConfirmDelay et T_max sont des paramètres DÉDIÉS, distincts de DeadTimeSameDir/OppositeDir et DirectionInterlockDelay* (ne pas répéter D10). Ordre garanti : DropConfirmDelay < T_max."
      verified_by: "lecture des declarations + grep : aucune reutilisation croisee"
    - id: AC9
      statement: "Coupures dures exemptées (§3bis §M6) : les chemins NOT Enable, PowerCutOff, et la sous-liste 'dure' de Fault.Error coupent RelayFwd/Rev IMMÉDIATEMENT (pas d'ordonnancement). La garde G4xx_check_direction_after_speed exempte explicitement ces chemins."
      verified_by: "TC : Enable=FALSE en marche -> RelayFwd = FALSE au cycle suivant ; gate G4xx_check_direction_after_speed PASS (exemptions codées)"
    - id: AC10
      statement: "Temps mort directionnel : UNE seule implémentation dans le code, cohérente avec T175 AC2 (pas de duplication). TC-P10-021/022 exécutables."
      verified_by: "lecture code (un seul minuteur temps mort) + coherence avec l'etat livré de T175"
    - id: AC11
      statement: "Argument PLr documenté dans ce contrat (fonction de sécurité concernée, PLr visé, catégorie d'architecture). Non-bypassabilité : l'instance interne FB_Winch de FB_WinchRateInterlock n'est PAS neutralisée par GVL_IHM.MxTreuil*.Bypass.Global."
      verified_by: "section PLr dans execution: du contrat + TC non-bypass"
    - id: AC12
      statement: "Signature sécurité finale = essai site (la CI ne la délivre pas) : critère site chiffré au plan de tir — cadence paliers 1->5 chronométrée, la barrière ne mord pas ; fenêtre §3bis mesurée sous charge (dérive <= X cm)."
      verified_by: "PLAN_DE_TIR_T181 §4.1 complété"
    - id: AC13
      statement: "Non-régression : G200 liaison PASS, gates palier C PASS, harnais WINCH_INTEG ne régresse pas (aucun TC vert ne repasse rouge), MAIN_EndToEnd reste vert."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/G200_check_linkage.py --report ; python TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py --palier C ; run_tests.py --fb MAIN_EndToEnd"
    - id: AC14
      statement: "Critère structurel (scope CODE/M_MAIN) : pour chaque fichier modifié, le nom de fichier est identique au nom de POU (source PRG_06_Outputs -> POU PRG_06_Outputs)."
      verified_by: "comparaison basename sans extension vs identifiant apres PROGRAM/FUNCTION_BLOCK"
    - id: AC15
      statement: "Critère structurel (scope CODE/M_MAIN) : aucun suffixe de langage (_CFC/_LD) apposé ; le suffixe reste identique au langage genere dans le bundle (ST pur)."
      verified_by: "grep basename *_CFC/_LD absent + inspection CODE_Bundle.xml"

