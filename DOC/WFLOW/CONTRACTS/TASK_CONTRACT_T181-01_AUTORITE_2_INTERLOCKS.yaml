    - id: AC6
      statement: "Pas de double-freinage : quand l'instance FB_Winch gouverne déjà la cadence (marge active), l'instance PRG_06 reste passive (Busy interne PRG_06 = FALSE)."
      verified_by: "harnais T181-00 : vecteur 'marge FB_Winch active' → interlock PRG_06 non Busy"
    - id: AC7
      statement: "Temps mort directionnel : une SEULE implémentation dans le code (pas de duplication avec T175 AC2). TC-P10-021/022 décrivent 1 s par direction ; la valeur retenue est tranchée et documentée."
