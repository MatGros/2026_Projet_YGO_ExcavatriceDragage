      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/G200_check_linkage.py --report ; python TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py --palier C"
    - id: AC9
      statement: "Critère structurel (scope CODE/M_MAIN) : pour chaque fichier modifié, le nom de fichier est identique au nom de POU (PRG_06_Outputs.st -> PRG_06_Outputs ; FB_WinchRateInterlock.st -> FB_WinchRateInterlock)."
      verified_by: "comparaison basename(fichier) sans extension vs identifiant apres PROGRAM/FUNCTION_BLOCK dans chaque fichier du scope"
    - id: AC10
      statement: "Critère structurel (scope CODE/M_MAIN) : aucun suffixe de langage (_CFC/_LD) n'est apposé aux POU touchés ; le suffixe reste identique au langage genere dans le bundle, c'est-a-dire du ST pur (le generateur PLCopenXML n'emet pas de CFC/LD pour ces POU)."
