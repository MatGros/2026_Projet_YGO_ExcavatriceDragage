    - id: AC3
      statement: "FB_WinchRateInterlock existe comme FB unique, instancié dans FB_Winch (jeu de seuils = safety + marge) ET dans PRG_06 (jeu de seuils = safety nus). Les deux jeux de seuils sont des paramètres nommés distincts."
      verified_by: "grep 'FB_WinchRateInterlock' dans FB_Winch.st et PRG_06_Outputs.st + lecture des seuils"
    - id: AC4
      statement: "Diag FinalInterlockGoverned (ou équivalent nommé sur le bus PRG_06) reste FALSE sur 100 % des vecteurs nominaux du harnais T181-00 (Grafcet X0-X13, rampes joystick 0-100 %, plongée, extraction, benne couplée)."
