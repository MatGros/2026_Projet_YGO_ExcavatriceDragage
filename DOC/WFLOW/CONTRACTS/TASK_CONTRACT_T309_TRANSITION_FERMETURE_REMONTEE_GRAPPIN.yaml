  criticality: C3
  strategy: patch

  objective: >
    Étudier et simuler (SimBench uniquement) une transition anticipée AX10 (fermeture
    benne) vers AX11 (remontée deux treuils) sans attendre la fermeture complète,
    pour soulager M2 seul. Aucun code de production dans ce lot.

  acceptance:
