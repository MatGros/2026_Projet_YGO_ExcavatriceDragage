contract:
  task_id: T417
  criticality: C2
  strategy: patch
  objective: 'Fournir une etude et un modele fonctionnel realiste de la translation
    M3 dans SimBench, reproduisant la chaine complete : commande automate -> dynamique
    variateur AC600 -> glissement inertiel et frein mecanique -> cames et capteurs
    inductifs, sans forcer artificiellement les defauts et sans modifier la logique
    de production.

    '
  acceptance:
  - id: AC1
    statement: Le modele de dynamique M3 integre la rampe d acceleration (40%/s =
      20 Hz/s), deceleration normale (50%/s = 25 Hz/s) et SafeStop (100%/s = 50 Hz/s)
      conformement a la trace terrain reelle du 2026-09-04.
    verified_by: Verification statique et comparaison trace simulee vs Suivi_TranslationM3bug_20260904_27_wide.csv.
  - id: AC2
    statement: Le comportement du frein mecanique respecte les retards de bobine (200
      ms ouverture), le retour auxiliaire de contact (BrakeContactOpen) et la retombee
      a manque de courant a la coupure de commande avec glissement fini (deceleration
      d arret ~2 m/s2).
    verified_by: Chronogramme verifie dans FB_Sim_TranslationBrake et correlation
      avec FICHE_T400.
  - id: AC3
    statement: La detection de position est modelisee par cames inductives franchissables
      avec hysteresis (0.02 m), mot binaire conforme (11111 a Tremie -> 00000 a Maintenance)
      sans collage artificiel en butee.
    verified_by: Inspection de FB_Sim_PositionSensor et validation des transitions
      sur les 5 seuils.
  - id: AC4
    statement: 'Le retour du StatusWord AC600 au PLC est fidele a l etat de marche
      : Bit 0 (Ready/Operating) actif en mouvement et retombe a l arret sans declencher
      de faux defaut Meca B (TonMecaB 3s) en stationnaire.'
    verified_by: Inspection du cablage FB_SimBench et respect du gate G200.
  - id: AC5
    statement: 'Zero regression sur le code automate de production : PRG_01 a PRG_07,
      blocs de securite FB_Safety_* et sequenceurs de cycle restent strictement inchanges.'
    verified_by: G200_check_linkage.py --report PASS (0 erreur) et git diff limite
      a CODE/L_SIMULATION/.
  - id: AC6
    statement: GVL_PERSISTENT est strictement sanctuarise (zero ajout, zero suppression,
      zero modification d adresse ou d ordre de variable).
    verified_by: git diff CODE/GVL_PERSISTENT.st vide.
