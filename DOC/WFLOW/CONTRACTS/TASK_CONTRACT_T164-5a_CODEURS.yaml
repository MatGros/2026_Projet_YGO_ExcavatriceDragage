# ═══════════════════════════════════════════════════════════════════════════
# Contrat T164-5a — Migration sous-blocs E_CODEURS vers Fault:ST_Fault
# ═══════════════════════════════════════════════════════════════════════════
preconditions:
  - id: PRE1
    statement: "T164-4D est VALIDATED ; la façade FB_Encoder expose déjà Fault:ST_Fault."
    source: "Contrat T164-4D"
contract:
  task_id: T164-5a_CODEURS
  criticality: C3
  strategy: patch

  objective: >
    Migrer les 3 sous-FB du domaine E_CODEURS (FB_Encoder_Abs, FB_Encoder_Homing, FB_Encoder_Safety)
    qui portent encore Status:ST_Status vers le socle cible Fault:ST_Fault via FB_FaultCore et causes nommées
    (avec Lifecycle:ST_Lifecycle pour FB_Encoder_Homing), mettre à jour ST_EncoderMeasurement et remapper
    les consommateurs dans FB_Encoder, PRG_04 et PRG_07 sans changer aucune valeur ni logique métier.

  acceptance:
    - id: AC1
      statement: "FB_Encoder_Abs, FB_Encoder_Homing et FB_Encoder_Safety exposent Fault:ST_Fault avec instFault:FB_FaultCore et causes nommées ; FB_Encoder_Homing expose en plus Lifecycle:ST_Lifecycle."
      verified_by: "grep 'Status : ST_Status' CODE/E_CODEURS/*.st => 0 occurrence"
    - id: AC2
      statement: "Toutes les causes d'erreur historiques (Com, Preset Timeout, Target, Boot Incoherence, Bornes) ont Latching := TRUE ; les alertes sans arrêt ont Latching := FALSE."
      verified_by: "Revue ligne à ligne des tables de causes dans chaque sous-FB"
    - id: AC3
      statement: "ST_EncoderMeasurement est mis à jour (HomingFault:ST_Fault, HomingLifecycle:ST_Lifecycle, AbsFault:ST_Fault) et tous ses consommateurs dans PRG_04 et PRG_07 sont remappés fidèlement."
      verified_by: "G200_check_linkage.py --report PASS (0 erreur)"
    - id: AC4
      statement: "G315 : le compteur legacy-status diminue de 3 et les 3 sous-FB passent en forme cible."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/G315_check_fb_interface.py --report"
    - id: AC5
      statement: "AF_Partie-09 v2.3 est mise à jour avec les nouveaux contrats de sous-blocs ; G340 PASS."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/G340_check_doc_links.py"
    - id: AC6
      statement: "Aucun changement de comportement physique ni de logique métier : 22 gates PASS et tests unitaires verts."
      verified_by: "run_all_gates.py + run_tests.py --fb FB_Encoder"
    - id: AC7
      statement: "PRG_04_Treuils_Benne.st et PRG_07_Supervision.st : nom de fichier est identique au nom de POU et suffixe est identique au langage genere dans le bundle."
      verified_by: "G310_check_code_structure.py et G320_check_bundle_main_coverage.py"

  scope:
    allowed:
      - CODE/E_CODEURS/FB_Encoder_Abs.st
      - CODE/E_CODEURS/FB_Encoder_Homing.st
      - CODE/E_CODEURS/FB_Encoder_Safety.st
      - CODE/E_CODEURS/FB_Encoder.st
      - CODE/E_CODEURS/_TYPES/ST_EncoderMeasurement.st
      - CODE/M_MAIN/PRG_04_Treuils_Benne.st
      - CODE/M_MAIN/PRG_07_Supervision.st
      - DOC/AF/AF_Partie-09_Fonction_Encoder_v2.3.md
      - DOC/WFLOW/AUDITS/IHM_VARIABLES_MIGRATION.md
      - CODE_XML/**
    forbidden:
      - PRJ_CODESYS/**
      - DOC/WFLOW/TASKS.yaml
      - "toute modification de la logique de calcul de position ou de vitesse"

  conservation:
    must_survive:
      - "Sémantique exacte des mesures brutes, calibration et homing."
      - "Reset sur front conscient uniquement (§9)."
      - "Gels odométriques hors Enable (OK-FIGE)."
    dropped_on_purpose:
      - "Le type ST_Status dans les 3 sous-FB et dans ST_EncoderMeasurement."

  evidence_required:
    - check_linkage
    - g315_report
    - run_all_gates
    - bundle
    - git_diff_review

  models_allowed:
    - "deepseek-v4-flash:cloud"
    - "omni/cc/claude-sonnet-5"

status: PENDING
