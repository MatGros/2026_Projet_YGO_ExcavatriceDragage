# Contrat T181-05 — Extraction sous-FB de FB_Winch + D18 (Phase 0b)
# Source : PLAN_GEL_TREUIL_T181_v0.1.md §1 (D09, D10), §7 Phase 0b ; AF10_INTERFACE §3 + §3bis ;
#          B4 SEC-4 / §1 (D18 = front montant Enable, PAS FirstScanDone) ;
#          B5 §3 (requalifiée C4 : D18 est un changement de comportement sécurité ; §3bis et
#          FB_WinchOutputInterlock SORTIS du scope -> T181-01 ; non-régression par TC).

contract:
  task_id: T181-05_SOUS_FB_EXTRACTION
  criticality: C4            # requalifiée (B5) : D18 = changement de comportement sécurité au hot-restart
  strategy: rebuild         # 2 sous-FB créés

  objective: >
    Isoler de FB_Winch deux responsabilités en sous-FB testables : (1) FB_WinchDirectionInterlock
    (interlock de changement de sens) AVEC correction D18 (temps mort au front montant d'Enable, pas
    FirstScanDone) ; (2) FB_WinchStepShaper (cadencement de palier, montée cadencée +1 cran /
    StepRampDelay, descente immédiate à 0). Retirer les entrées mortes Mode et CycleTimeCalc.
    Interface EXTERNE de FB_Winch inchangée au retrait de Mode près (-> édite les 2 sites PRG_04).
    La règle §3bis « sens jamais avant vitesse » côté barrière n'est PAS dans ce ticket -> T181-01.

  acceptance:
    - id: AC1
      statement: "FB_WinchDirectionInterlock existe : IN Enable, EnableRising:BOOL, ReqDirection:INT, ChangeDelayUp:TIME, ChangeDelayDown:TIME ; OUT CommandedDirection:INT, DirectionChangePending:BOOL, DelayElapsed:TIME. Extrait de FB_Winch.st:198-227, comportement de changement de sens HORS front Enable strictement iso."
      verified_by: "python TOOLS/TEST_AUTO_CI/scripts/run_tests.py --fb FB_WinchDirectionInterlock (TC changement de sens temporisé, iso au comportement actuel)"
    - id: AC2
      statement: "D18 : sur EnableRising (front montant Enable), FB_WinchDirectionInterlock N'ADOPTE PAS ReqDirection immédiatement — il arme le temps mort. Cible = front d'Enable, PAS le flag FirstScanDone (B4). Pas de redémarrage instantané / inrush au retour d'Enable avec commande de sens maintenue."
      verified_by: "TC : Enable OFF->ON avec ReqDirection != 0 maintenu -> CommandedDirection reste 0 jusqu'à DelayElapsed ; grep 'FirstScanDone' absent de cette logique"
    - id: AC3
      statement: "FB_WinchStepShaper existe : IN Enable, TargetStep:INT, StepRampDelay:TIME ; OUT ShapedStep:INT, StepDelayElapsed:TIME. FB MINIMAL (1 TON + 1 compteur, zéro couplage config). Extrait de FB_Winch.st:250-271."
      verified_by: "python TOOLS/TEST_AUTO_CI/scripts/run_tests.py --fb FB_WinchStepShaper + revue : pas d'autre entrée que les 3 listées"
    - id: AC4
      statement: "FB_WinchStepShaper ASYMÉTRIQUE : montée = ShapedStep +1 cran quand StepDelayElapsed >= StepRampDelay ; descente = ShapedStep -> 0 au cycle suivant (aucune rampe descendante). La montée est STRICTEMENT ISO au comportement actuel (seule la SOURCE du délai change)."
      verified_by: "TC montée : 0->1->2->3 temporisé (1 cran / StepRampDelay) identique à la baseline ; TC descente : TargetStep=0 -> ShapedStep=0 au cycle N+1"
    - id: AC5
      statement: "D10 corrigé : StepRampDelay est un paramètre DÉDIÉ, découplé des DirectionInterlockDelay{Up,Down}. Le +T#100ms en dur de FB_Winch.st:248 est FONDU dans StepRampDelay (pas laissé en magic number commenté)."
      verified_by: "grep -n 'SEL(.*InterlockDelay' CODE/H_TREUILS_BENNE/FB_Winch.st renvoie 0 ligne pour le calcul du delai de rampe ; grep 'T#100ms' absent ; lecture du diff"
    - id: AC6
      statement: "Entrées mortes retirées : Mode (VAR_INPUT E_Mode jamais lu) et CycleTimeCalc (FB_CycleTime instancié jamais consommé). Le retrait de Mode édite les 2 sites d'appel PRG_04:671,702 au MÊME commit."
      verified_by: "git diff FB_Winch.st (VAR_INPUT) + grep 'Mode ' / 'CycleTimeCalc' dans FB_Winch.st = 0 ; grep 'Mode :=' dans les appels instWinchM1/M2 de PRG_04 = 0"
    - id: AC7
      statement: "Non-régression PAR TC (pas 'score >= baseline') : le vecteur pass/fail par TC du harnais WINCH_INTEG et de la CI FB_Winch, figé par T181-00, est comparé cellule à cellule — AUCUN TC vert ne repasse rouge. Les TC rouge-baseline restent rouges (pas de leak)."
      verified_by: "python TOOLS/TEST_AUTO_CI/scripts/run_tests.py --fb FB_Winch et --fb WINCH_INTEG ; diff TC-par-TC vs baseline commit T181-00"
    - id: AC8
      statement: "FB_Winch : comportement observable (rampe, interlock direction hors hot-restart) iso à la baseline. G200 PASS, gates palier C PASS, MAIN_EndToEnd vert."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py --palier C ; run_tests.py --fb MAIN_EndToEnd"
    - id: AC9
      statement: "Critère structurel (scope CODE/M_MAIN) : pour chaque fichier modifié, le nom de fichier est identique au nom de POU (source PRG_04_Treuils_Benne -> POU PRG_04_Treuils_Benne)."
      verified_by: "comparaison basename sans extension vs identifiant apres PROGRAM/FUNCTION_BLOCK"
    - id: AC10
      statement: "Critère structurel (scope CODE/M_MAIN) : aucun suffixe de langage (_CFC/_LD) apposé ; le suffixe reste identique au langage genere dans le bundle (ST pur)."
      verified_by: "grep basename *_CFC/_LD absent + inspection CODE_Bundle.xml"

  scope:
    allowed:
      - CODE/H_TREUILS_BENNE/FB_Winch.st
      - CODE/H_TREUILS_BENNE/FB_WinchDirectionInterlock.st     # nouveau
      - CODE/H_TREUILS_BENNE/FB_WinchStepShaper.st             # nouveau
      - CODE/M_MAIN/PRG_04_Treuils_Benne.st                    # retrait Mode:= sur les 2 appels
      - TOOLS/TEST_AUTO_CI/RESULTS/H_TREUILS_BENNE/tests/**     # TC des 2 sous-FB + FB_Winch
    forbidden:
      - CODE/H_TREUILS_BENNE/FB_WinchOutputInterlock.st        # §3bis barrière = T181-01
      - CODE/H_TREUILS_BENNE/_TYPES/**                         # pas de refonte DUT (T181-08)
      - CODE/H_TREUILS_BENNE/FB_SpeedStep.st                   # MinStepNumber = T181-07
      - CODE/H_TREUILS_BENNE/FB_Safety_Winch.st                # T181-02_03 / T181-01
      - DOC/WFLOW/TASKS.yaml
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - DOC/NAMING_CONVENTION.md

  conservation:
    must_survive:
      - "L'interface externe de FB_Winch (hors retrait Mode) — VAR_INPUT/OUTPUT/IN_OUT"
      - "Le comportement d'interlock de changement de sens en fonctionnement normal (hors front Enable)"
      - "La montée cadencée de palier — strictement iso (seule la source du délai change)"
      - "Garde Enable=FALSE -> sorties sûres ; pas de redémarrage auto après défaut"
    dropped_on_purpose:
      - "L'entrée VAR_INPUT Mode (morte)"
      - "L'instance CycleTimeCalc : FB_CycleTime (jamais consommée)"
      - "Le réemploi des DirectionInterlockDelay + T#100ms pour le délai de rampe palier (D10)"
      - "L'adoption immédiate de la direction au retour d'Enable (D18)"

  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle

  models_allowed:
    - "omni/cx/gpt-5.6-terra"
    - "omni/cc/claude-sonnet-5"

  alert_duty: >
    Si l'extraction change le timing observable de FB_Winch hors D18/D10 (rampe, interlock), si D18
    entre en conflit avec l'armement DirectionChangeDelay (gate FwdRevSpeedFeedbackOff, FB_Winch.st:206),
    ou si retirer Mode révèle un consommateur caché : REMONTER à l'orchestrateur.
    Séquencement : APRÈS T181-02_03 (TC-011 diagnostiqué), AVANT T181-01.

