# ═══════════════════════════════════════════════════════════════════════════
# CONTRAT DE TACHE RETROACTIF — T147
# FB_FbStatus : fault latche perdu sur un cycle Enable=FALSE->TRUE sans Reset
# ═══════════════════════════════════════════════════════════════════════════
# Contrat retroactif (REX 2026-08-29). Constat d'audit devenu sans objet : le FB
# concerne a ete supprime au profit du socle ST_Fault / FB_FaultCore (T164-3).
# ═══════════════════════════════════════════════════════════════════════════

contract:
  task_id: T147_RETRO
  parent_id: ''
  criticality: C4
  strategy: patch

  objective: >
    Garantir qu'un defaut latche ne peut pas disparaitre silencieusement d'un FB
    de statut lors d'un cycle Enable=FALSE puis TRUE sans front Reset explicite,
    conformement au principe Reset = front conscient.

  acceptance:
    - id: AC1
      statement: >
        Il n'existe plus de definition ni d'instanciation de FB_FbStatus dans
        CODE/ : la brique de statut a defaut latche est remplacee par le socle
        ST_Fault alimente par FB_FaultCore (issu de T164-3), et le constat
        d'origine n'a donc plus d'objet executable.
      verified_by: >
        grep -rn "FB_FbStatus" CODE/ : aucun POU de ce nom, seule subsiste une
        mention en commentaire dans CODE/A_COMMUN/_TYPES/ST_Status.st (ligne ~8),
        sans code executable associe.
    - id: AC2
      statement: >
        Le socle de remplacement FB_FaultCore conserve la memoire de defaut latche
        entre scans et n'acquitte que sur front Reset, jamais sur Enable=FALSE.
      verified_by: >
        Relecture de CODE/A_COMMUN/FB_FaultCore.st (memoire latchee retenue, gate
        Reset sur front) ; contrats de la famille T164-3 / T164-4 dans
        DOC/WFLOW/TASKS.yaml.

  scope:
    allowed:
      - DOC/WFLOW/TASKS.yaml
      - CODE/A_COMMUN/FB_FaultCore.st
      - CODE/A_COMMUN/_TYPES/ST_Status.st
    forbidden:
      - CODE_XML/
      - PRJ_CODESYS/

  evidence_required:
    - traceability_grep

  models_allowed:
    - "auto/best-reasoning"

  alert_duty: >
    Si une mention residuelle de FB_FbStatus redevenait executable, ou si
    FB_FaultCore acquittait un defaut latche sur Enable=FALSE, le SIGNALER
    immediatement a l'orchestrateur. Signaler n'est pas elargir le scope.

