contract:
  task_id: T173-A_BANC_WEB_INTERACTIF
  parent_id: T173
  criticality: C3
  strategy: new_feature

  objective: >
    Fournir un banc de test WEB interactif où l'utilisateur pilote manuellement les
    transitions du cycle (joystick, armement homme-mort, capteurs, StartCycle, Reset,
    mode) contre le BINAIRE FB_Cycle COMPILÉ (STruCpp/g++), et observe les sorties
    (CycleStep, WinchM1Cmd/M2Cmd, TranslationCmd, BucketCmd, Fault) à chaque scan.
    Le JS navigateur n'envoie que des entrées et affiche des sorties — AUCUNE logique
    métier en JS (le binaire décide).

  acceptance:
    - id: AC1
      statement: "L'utilisateur peut injecter les stimuli (joystick axe/sens, armement, capteurs top/Kobold/translation, StartCycle, Reset, mode) et déclencher un scan."
      verified_by: "UI web : contrôles présents + POST /scan renvoie les sorties du binaire."
    - id: AC2
      statement: "Les sorties affichées proviennent du binaire FB_Cycle compilé (pas d'un calcul JS)."
      verified_by: "Le serveur exécute le binaire g++ ; le JS ne fait que rendre le JSON reçu."
    - id: AC3
      statement: "Zéro logique métier en JS : le garde-fou anti-logique-métier passe sur le HTML du banc."
      verified_by: "guard_animation_no_business_logic.py --html <banc> PASS."
    - id: AC4
      statement: "Le banc compile FB_Cycle depuis WORKING_COPY (jamais CODE/)."
      verified_by: "Chaîne convert_codesys_to_iec.py + strucpp + g++ sur WORKING_COPY."
    - id: AC5
      statement: "L'orchestrateur lit, vérifie et valide le git diff réel (visa P5)."
      verified_by: "Visa formel de l'orchestrateur."

  scope:
    allowed:
      - TOOLS/TEST_AUTO_CI/**
    forbidden:
      - CODE/**
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export

  conservation:
    must_survive:
      - "Le principe 'zéro logique métier en JS' (le binaire décide, le JS affiche)."
      - "La chaîne de compilation WORKING_COPY (jamais CODE/)."
    dropped_on_purpose: []

  evidence_required:
    - guard_pass
    - engine_compiled
    - manual_test

  models_allowed:
    - "omni/cc/claude-sonnet-5"
    - "omni/cx/gpt-5.6-terra"

  alert_duty: >
    Le banc est un OUTIL DE TEST, pas un contrôleur machine. Il ne doit JAMAIS être
    présenté comme pilotant la machine réelle. Toute ambiguïté (ex. un stimulus qui
    semble commander un actionneur réel) est remontée immédiatement.

