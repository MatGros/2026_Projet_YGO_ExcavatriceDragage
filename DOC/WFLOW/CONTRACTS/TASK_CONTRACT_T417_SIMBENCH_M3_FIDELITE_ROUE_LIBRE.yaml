# Contrat T417 — SimBench M3 : fidélité 50 Hz + roue libre à la perte de commande
# Statut : BROUILLON pour validation humaine. Aucune ligne de CODE/ écrite.
# Périmètre de ce contrat = lots L1 + L2. Le refactor struct (L3) aura son propre contrat.
# Vérité des valeurs = code déployé en mise en service + registres MES (pas les AF).

contract:
  task_id: T417_SIMBENCH_M3_FIDELITE_ROUE_LIBRE
  criticality: C2
  strategy: patch

  objective: >
    Le SimBench ST reproduit le dépassement M3 observé en réel quand la commande est retirée
    avant l'arrêt physique (roue libre variateur, T334), à la bonne échelle de fréquence
    (50 Hz max, approche 20 Hz), sans qu'aucune ligne de simulation n'entre dans le code
    de production, pour tester les corrections sans réglage sur site. Modelica est mis
    en veille, jamais supprimé.

  context_facts:   # tous relevés dans le code ou les registres, aucun supposé
    - "Fréquence max = GVL_PERSISTENT._TranslationMaxFreq_Hz = 50.0 (source unique)"
    - "Approche par cible = 20 Hz : Trémie (déclenché PV), Maintenance (déclenché P1), P1 (déclenché P2) — ST_TranslationCfg.st"
    - "PRG_02 envoie SpeedCmd_Pct = f/50*100 ; FB_Sim_Translation refait Hz = Pct*0,4 borné à 40 => 20 Hz réel = 16 Hz simulé (écart à corriger)"
    - "Roue libre réelle : CommandWord=0 coupe la modulation (FB_Translation.st:297-303) ; étude T334 du 26/09 : dépassement 20 à 40 cm en cycle auto, arrêt net en manuel"
    - "Frein réel : reste desserré tant que |fAct| > 0,5 Hz (FB_Translation.st:271-272) ; DelayMotorDecel déclaré mais non câblé (audit 14/09)"
    - "Sim actuel : commande retirée => décélération contrôlée 20 Hz/s (FrequencyTgt=0), et VelocityTrue_Mps := 0 instantané à la fermeture frein"
    - "Pas de position en mètres dans les traces (DI capteurs + fréquences seulement). Suivi_90 (23/09) = réel ; Suivi_91 (26/09) = banc SIMU. T348 (mesure 10 ms) non faite."

  acceptance:
    - id: AC1
      statement: "Interrupteur roue libre FALSE (défaut) : toutes les sorties de FB_Sim_Translation sont identiques à la v0.7.33_SimBench_M3PLC_20261009 sur les scénarios de référence (aller-retour, arrêt sur capteur, SafeStop, faute frein)."
      verified_by: "Test CI rejouant les scénarios et comparant la trace à la référence figée avant modif"
    - id: AC2
      statement: "L1 : une consigne PRG_02 de 20 Hz (40 %) donne ActualFrequency_Hz = 20,0 Hz (±0,05) en régime établi ; 50 Hz (100 %) donne 50 Hz ; le gain reste 0,02 m/(Hz.s) (1 m/s à 50 Hz)."
      verified_by: "Test unitaire FB_Sim_Translation + gate G518 PASS (échelle sim/estimateur)"
    - id: AC3
      statement: "L2 interrupteur TRUE : quand ReqTremie et ReqMaintenance tombent tous deux à FALSE avec |fAct| > 0,5 Hz, la fréquence décroît selon la loi de roue libre (pas la rampe 20 Hz/s), le frein reste ouvert jusqu'à |fAct| <= 0,5 Hz, puis seulement se ferme."
      verified_by: "Test CI : trace 10 ms fAct/frein, comparaison au front de retrait de commande"
    - id: AC4
      statement: "L2 : à 20 Hz d'approche le dépassement après retrait de commande au contact capteur vaut 0,20 à 0,40 m (plage de l'étude T334). Cette plage est la CIBLE INITIALE de calibration, à confirmer par T348, pas une mesure."
      verified_by: "Test CI sur PositionTrue_M ; le paramètre de roue libre est exposé et documenté comme 'à calibrer'"
    - id: AC5
      statement: "L2 : le dépassement croît avec la vitesse d'approche (10 Hz < 20 Hz < 50 Hz), reproduisant l'aggravant mesuré par T334."
      verified_by: "Test CI : trois vitesses, distances strictement croissantes"
    - id: AC6
      statement: "Comportement correctif T334 : commande maintenue jusqu'à |fAct| <= 0,5 Hz (arrêt par la rampe) donne un dépassement strictement inférieur au cas retrait immédiat, à vitesse égale."
      verified_by: "Test CI comparatif retrait immédiat / retrait différé"
    - id: AC7
      statement: "Capteurs DI, position vraie et position estimée par Hz restent produits par la même chaîne qu'avant : le simulateur ne s'écrit que via la frontière PRG_02 ; aucun fichier de production (I_TRANSLATION, M_MAIN, J_SUPERVISION, GVL_PERSISTENT) n'est modifié."
      verified_by: "git diff --stat : zéro fichier hors scope.allowed ; G200 PASS"
    - id: AC8
      statement: "Garde-fou (fix + guard) : un gate vérifie qu'aucun nouveau consommateur de GVL_Simulation n'apparaît hors de la liste actuelle (PRG_02, PRG_05, PRG_07, FB_SimBench, FB_TroubleshootingView, types Checklist et FBs L_SIMULATION). La liste est figée telle que relevée ce jour, sans prétendre qu'elle se réduit à PRG_02."
      verified_by: "Nouveau script TOOLS/AGENT_WORKFLOW/scripts/ + intégration run_all_gates.py ; test négatif injectant un lecteur parasite"
    - id: AC9
      statement: "SimM3OpenModelicaActive reste FALSE par défaut, aucun fichier Modelica ni tâche T399-T415 n'est supprimé ni modifié."
      verified_by: "git diff : aucun chemin TOOLS/TWINBENCH/ ; TASKS.yaml T399-T415 seulement passées en pause par l'orchestrateur"
    - id: AC10
      statement: "Bundle PLCopenXML et diff bundle régénérés, 21 gates PASS."
      verified_by: "generate_codesys_bundle.py, generate_codesys_diff_bundle.py, G200 --report, run_all_gates.py"

  scope:
    allowed:
      - CODE/L_SIMULATION/FB_Sim_Translation.st
      - CODE/L_SIMULATION/FB_Sim_TranslationDrive.st
      - CODE/L_SIMULATION/FB_Sim_TranslationBrake.st
      - CODE/L_SIMULATION/FB_SimBench.st
      - CODE/L_SIMULATION/GVL_Simulation.st
      - TOOLS/TEST_AUTO_CI/   # tests des FB de simulation uniquement
      - TOOLS/AGENT_WORKFLOW/scripts/   # nouveau gate AC8 uniquement
    forbidden:
      - CODE/I_TRANSLATION/
      - CODE/M_MAIN/
      - CODE/J_SUPERVISION/
      - CODE/GVL_PERSISTENT.st
      - TOOLS/TWINBENCH/
      - DOC/AF/
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - ST_IHM_MANU (table figée, aucun champ ajouté)

  conservation:
    must_survive:
      - "Comportement v0.7.33 quand les nouveaux interrupteurs sont à FALSE"
      - "Chaîne Modelica / FMU / lien UDP (FB_Sim_Translation_ExtLink) intacte"
      - "Gate G518 et tests TC-T300"
    dropped_on_purpose:
      - "Rien. L3 (refactor struct SimM3/SimWinch, migration variables IHM) est reporté à un contrat séparé après validation de L1+L2."

  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle
    - diff_bundle

  open_points:   # à lever en essai, ne bloquent pas la rédaction
    - "Valeur de frottement en roue libre inconnue : initialisée pour viser 0,20-0,40 m à 20 Hz (v = 0,4 m/s ; soit environ 0,2 à 0,4 m/s2 si décélération constante, ou tau 0,5 à 1,0 s si frottement visqueux — calcul indicatif, forme du modèle à choisir au plan). À recaler par T348."
    - "Origine de la mesure '20 à 40 cm' de l'étude T334 non retrouvée dans les traces (pas de position en mètres)."
    - "Valeur effective du délai frein réel et temps de décélération interne AC600 : non nécessaires ici (frein piloté par |fAct| <= 0,5 Hz), à noter pour T348."

  alert_duty: >
    Tout écart constaté en cours de route est remonté immédiatement à l'orchestrateur,
    jamais en silence. Signaler n'est pas élargir le scope. Aucun commit sans validation humaine.

