  conservation:
    must_survive:
      - "Grafcet homing et câblage BtnValidation tels que déployés (v0.7.25)"
      - "Comportement réel de FB_Joystick (armement par maintien, grâce, désarmement au neutre et au retrait du permis)"
      - "Dynamique simulée des axes (montée, dépassement, retombée, bagotement)"
    dropped_on_purpose:
      - "L'appui homme-mort implicite produit par les boutons directionnels simulés (FB_SimBench.st:710)."
      - "Pas de mode 'homme-mort maintenu pour la session' dans ce lot : il masquerait le constat AC4."

  evidence_required:
