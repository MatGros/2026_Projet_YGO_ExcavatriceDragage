      - CODE/D_JOYSTICK/
      - CODE/M_MAIN/
      - CODE/F_MODES/
      - CODE/I_TRANSLATION/
      - CODE/H_TREUILS_BENNE/
      - CODE/GVL_PERSISTENT.st
      - ST_IHM_MANU (table figée)

  conservation:
    must_survive:
      - "Grafcet homing et câblage BtnValidation tels que déployés (v0.7.25)"
      - "Comportement réel de FB_Joystick (armement par maintien, grâce, désarmement au neutre et au retrait du permis)"
      - "Dynamique simulée des axes (montée, dépassement, retombée, bagotement)"
    dropped_on_purpose:
      - "L'appui homme-mort implicite produit par les boutons directionnels simulés (FB_SimBench.st:710)."
      - "Pas de mode 'homme-mort maintenu pour la session' dans ce lot : il masquerait le constat AC4."

  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle
    - diff_bundle

  open_points:
    - "Ergonomie banc : l'opérateur simulation doit actionner SimJoystickRawButton en plus du bouton directionnel. À réévaluer après AC4, pas avant."
    - "Tests CI existants et scénarios SimBench qui comptent sur l'homme-mort implicite : à recenser et adapter."

  alert_duty: >
    Tout écart constaté est remonté à l'orchestrateur, jamais en silence. Aucun commit sans validation humaine.

