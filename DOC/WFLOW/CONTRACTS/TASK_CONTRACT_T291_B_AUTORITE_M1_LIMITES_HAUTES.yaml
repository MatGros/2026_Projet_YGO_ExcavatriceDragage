contract:
  task_id: T291-B
  criticality: C4
  strategy: patch
  objective: >
    Corriger et valider d'abord la position M2 corrigee existante pour qu'elle
    soit continue pendant toute la course de benne ; seulement apres recette
    humaine, utiliser M1 comme autorite nominale Both AX12 et M2 corrige comme
    surveillance derivee, sans creer de nouvelle position ni nouveau FDC.
  acceptance:
    - id: AC1
      statement: "La position M2 corrigee existante ne saute pas lors des passages ouvert/intermediaire/ferme et reste bornee par la geometrie configuree."
      verified_by: "traces et tests scan-par-scan aux trois etats, sans changement de FDC"
    - id: AC2
      statement: "La source du pourcentage d ouverture et la fonction offset geometrique sont qualifiees avant tout usage de securite ou FDC."
      verified_by: "cartographie producteur -> calcul -> consommateurs et validation humaine B1"
    - id: AC3
      statement: "Apres validation B1, M1 seul et Both utilisent M1 pour l approche et l arret logiciel nominal H ; M2 corrige ne termine pas AX12 nominalement."
      verified_by: "tests aux positions H-0.51, H-0.50, H-epsilon et H"
    - id: AC4
      statement: "En Both, M1 et M2 recoivent le meme palier effectif pendant l approche haute ; aucun vecteur P1/P5 ne neutralise silencieusement les deux treuils."
      verified_by: "test scan-par-scan avec ecart M1/M2 realiste et inspection des demandes finales"
    - id: AC5
      statement: "Toute marge de surveillance M2 est derivee des positions Homing TOP et FDC logiciel existantes apres T330 ; aucun parametre IHM ou RETAIN n est ajoute."
      verified_by: "revue de declarations et contrat T330"
    - id: AC6
      statement: "Le TOP mecanique commun, limites tambour M2, mou de cable, synchronisme et AU restent actifs et independants."
      verified_by: "matrice de non-regression et tests capteur NC/mou de cable"
    - id: AC7
      statement: "Manuel, maintenance, homing, descente, limites cable propres et T327 restent inchanges hors matrice visee."
      verified_by: "matrice de non-regression par mode et direction"
    - id: AC8
      statement: "Bundle complet et diff bundle generes ; G200 et gates palier C passent."
      verified_by: "rapports outillage obligatoires"
    - id: AC9
      statement: "Pour chaque fichier ST autorise, le nom de fichier est identique au nom de POU et le suffixe correspond au langage genere dans le bundle."
      verified_by: "gates structurels et revue du bundle PLCopenXML"
  scope:
    allowed:
      - DOC/AF/AF_Partie-10_Fonction_Winch_v2.1.md
      - CODE/G_CYCLE/FB_CycleSemiAuto.st
      - CODE/H_TREUILS_BENNE/FB_Winch.st
      - CODE/H_TREUILS_BENNE/FB_Safety_Winch.st
      - CODE/H_TREUILS_BENNE/FB_WinchStateProjection.st
      - CODE/M_MAIN/PRG_03_Modes_Cycle.st
      - CODE/M_MAIN/PRG_04_Treuils_Benne.st
      - CODE/J_SUPERVISION/FB_TroubleshootingView.st
      - CODE/J_SUPERVISION/_TYPES/1_TREUILS_BENNE/ST_Chain_Winch_Safety.st
      - TOOLS/AGENT_WORKFLOW/scripts/G499_check_t291b_top_authority.py
      - CODE_XML/CODE_Bundle.xml
      - CODE_XML/CODE_DiffBundle.xml
      - DOC/WFLOW/TASKS.yaml
      - DOC/WFLOW/CONTRACTS/TASK_CONTRACT_T291_B_AUTORITE_M1_LIMITES_HAUTES.yaml
    forbidden:
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - CODE/B_AU_SECURITE/*
  conservation:
    must_survive:
      - "Une seule variable de position M2 corrigee : l'existante est corrigee, aucun doublon cree."
      - "Capteur TOP mecanique commun et chaine AU independante."
      - "Limites cable propres M1/M2 et deplacement descendant de degagement."
      - "Aucun redemarrage automatique apres defaut."
    dropped_on_purpose: []
  evidence_required:
    - test_scan_by_scan
    - guard_fix
    - check_linkage
    - run_all_gates_palier_c
    - bundle
    - diff_bundle
  alert_duty: >
    La continuite et le repere de la position M2 corrigee existante doivent etre
    prouves avant usage FDC. Toute ambiguite sur le pourcentage ouverture, la
    table geometrie, ActiveOffsetM ou le comportement TOP impose un arret avant code.
  blocking_decisions:
    - "Valider la source de pourcentage ouverture et la correction geometrique continue de la variable M2 corrigee existante."
    - "Valider T330 : invariant PositionHomingTop_M >= CableLimitAscent_M + 1.00 m et reaction configuration invalide."
  phases:
    - "B0 : corriger la variable M2 corrigee existante et son affichage, sans toucher aux commandes/FDC."
    - "B1 : tests de continuite et validation humaine de la geometrie ouverte/intermediaire/fermee."
    - "B2 : apres B1/T330, autorite M1 et profil commun en Both ; M2 corrige garde-fou derive."
    - "B3 : validation C3 et revue independante : AX12, homing, TOP, limites tambour, descente et T327."
status: OPEN
