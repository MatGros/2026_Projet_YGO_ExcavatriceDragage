    - id: AC4
      statement: "En Both, M1 et M2 recoivent le meme palier effectif pendant l approche haute ; aucun vecteur P1/P5 ne neutralise silencieusement les deux treuils."
      verified_by: "test scan-par-scan avec ecart M1/M2 realiste et inspection des demandes finales"
