contract:
  # ── Identification ────────────────────────────────────────────────────────
  task_id: LOT3_TRANSLATION_M3_DEADMAN
  criticality: C4
  strategy: patch
  human_validation_required: true

  # ── 1. Objectif métier ────────────────────────────────────────────────────
  objective: >
    Exiger le geste homme-mort joystick (DeadmanArmed) pour autoriser tout
    mouvement M3, en SEMI_AUTO et en MAINT_N1/N2 (boutons IHM ET joystick).
    Aujourd'hui M3_StartStop_Active dans PRG_05_Translation.st ignore
    totalement DeadmanArmed, contrairement à l'exigence de
    AF_Partie-11 §4.2 ("DeadmanArmed exigé même pour boutons IHM") et à
    l'écart déjà répertorié PLAN_TASK point "2.A".

  # ── 2. Critères testables ─────────────────────────────────────────────────
  acceptance:
    - id: AC1
      statement: >
        En MAINT_N1/MAINT_N2, M3_StartStop_Active exige DeadmanArmed=TRUE
        en plus des conditions actuelles (Direction<>0 AND (Bypass.Global
        OR NOT TglJoystickMaster)) — pour boutons IHM ET joystick, sans
        exception.
      verified_by: "revue du diff PRG_05_Translation.st + vérification manuelle CODESYS (relâcher le bouton homme-mort en cours de mouvement M3, confirmer arrêt rampe)"
    - id: AC2
      statement: >
        En SEMI_AUTO, le positionneur M3 (M3_StartStop_Active) exige
        également DeadmanArmed=TRUE, source identifiée précisément (instance
        FB_Joystick exposant DeadmanArmed, via PRG_02_Acquisition ou GVL_IHM
        — nom exact documenté dans le diff, pas supposé).
      verified_by: "revue du diff + vérification manuelle CODESYS"
    - id: AC3
      statement: >
        Aucune régression sur l'arbitrage Direction / InvertDirection /
        SelTarget existant pour les 3 cibles (Trémie, P2, P1).
      verified_by: "run_all_gates.py + vérification manuelle des 3 cibles et du sens inversé"
    - id: AC4
      statement: "Nom de fichier identique au nom de POU pour PRG_05_Translation.st (PRG_05_Translation)."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py"
    - id: AC5
      statement: "Suffixe de langage égal au langage généré dans le bundle pour PRG_05_Translation (.st = ST)."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py + inspection CODE/CODE_Bundle.xml"

  # ── 3. Périmètre ──────────────────────────────────────────────────────────
  scope:
    allowed:
      - CODE/MAIN/PRG_05_Translation.st
      - CODE/CODE_Bundle.xml
    forbidden:
      - CODE/JOYSTICK/FB_Joystick.st    # ne pas modifier la source DeadmanArmed, seulement la consommer
      - CODE/TREUILS/*                  # même écart probable sur M1/M2 — hors périmètre, signaler séparément (AC voir alert_duty)
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - .git/

  # ── 4. Contrat de conservation ────────────────────────────────────────────
  conservation:
    must_survive:
      - "Arbitrage SelTarget / Direction / InvertDirection / FreqPct actuel, inchangé hors ajout de la condition DeadmanArmed."
      - "Refus de la cible Maintenance (4) hors MAINT_N2, déjà en place."
    dropped_on_purpose:
      - "Aucun — ajout d'une condition supplémentaire, rien de retiré."

  # ── 5. Preuves attendues en restitution ───────────────────────────────────
  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle
    - human_validation_notes

  # ── 6. Modèles autorisés ──────────────────────────────────────────────────
  models_allowed:
    - "omni/cc/claude-sonnet-5"
    - "omni/cx/gpt-5.6-terra"

  # ── 7. Devoir d'alerte ────────────────────────────────────────────────────
  alert_duty: >
    Le même écart (DeadmanArmed non lu) existe très probablement côté M1/M2
    (Winch) — à vérifier par lecture de PRG_04_Treuils_Benne.st et signaler
    à l'orchestrateur SANS le corriger dans ce lot (hors périmètre M3).
    Ne jamais élargir le scope pour "corriger pendant qu'on y est".
