  conservation:
    must_survive:
      - "Le bypass SkipDrainRequest et le comportement de la TON DrainingTimer."
      - "La borne défaut interne (DrainingTime = T#5s) quand la consigne configurée est <= 0."
    dropped_on_purpose: []
  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle
  models_allowed:
    - "omni/cx/gpt-5.6-terra"
    - "omni/cc/claude-sonnet-5"
  alert_duty: >
    Toute ambiguïté sur le nommage des nouvelles variables IHM (consigne/écoulé
    en secondes) ou sur la borne max représentable en INT doit être signalée
    avant toute implémentation.
