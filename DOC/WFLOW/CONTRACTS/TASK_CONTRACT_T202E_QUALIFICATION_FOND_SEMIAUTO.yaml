      verified_by: "lecture AF-04 §4.2 mis à jour"
    - id: AC4
      statement: "Aucune régression du repli STABILIZING, de la reprise consciente et de l'interdiction Palier 5."
      verified_by: "tests CI FB_Cycle + G200 PASS"
    - id: AC5
      statement: "Le POU de CODE/M_MAIN (PRG_03_Modes_Cycle) conserve un nom de fichier identique au nom de POU et un suffixe de langage identique au langage généré dans le bundle."
      verified_by: "bundle PLCopenXML généré : nom de POU = nom de fichier, suffixe ST cohérent"

  scope:
