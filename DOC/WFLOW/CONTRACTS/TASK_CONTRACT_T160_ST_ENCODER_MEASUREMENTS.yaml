contract:
  task_id: T160_ST_ENCODER_MEASUREMENTS
  criticality: C2            # transverse : bus inter-PRG + 4 PRG consommateurs
  strategy: rebuild          # restructure le contrat de bus codeur (champs plats -> struct M1/M2)

  # ── 1. Objectif metier ────────────────────────────────────────────────────
  objective: >
    Mettre PRG_02_Acquisition en conformite avec AF_Partie-06 v2.4 §3ter : publier les
    mesures codeurs M1/M2 via la struct frontiere ST_EncoderMeasurements (sous-DUT M1/M2 de
    type ST_fbEncoder_Measurement) au lieu des champs plats actuels de ST_AcquisitionInterPrg,
    et remapper les 4 PRG consommateurs (PRG_03/04/05/07) sur cette struct, sans aucun
    changement de valeur ni de comportement logique.

  # ── 2. Criteres testables ─────────────────────────────────────────────────
  acceptance:
    - id: AC1
      statement: "PRG_02_Acquisition publie les mesures codeurs via ST_EncoderMeasurements (Data.Encoders.M1/M2) et non plus via les champs plats CablePosM1/M1_Speed_Mps/M1_EncoderFault de ST_AcquisitionInterPrg."
      verified_by: "lecture PRG_02_Acquisition + grep : 0 occurrence des champs plats codeur dans ST_AcquisitionInterPrg"
    - id: AC2
      statement: "Chaque champ de ST_fbEncoder_Measurement (RawPos, EncoderAvailable, CablePosM, CablePosMSafe, EncoderIncoherent, Speed_Mps, SignedSpeed_Mps, SpeedValid, HomingStatus, AbsStatus, HomingRefRaw) est alimente depuis instEncoderM1/instEncoderM2.Measurement."
      verified_by: "lecture PRG_02_Acquisition §4 + G200_check_linkage"
    - id: AC3
      statement: "Les 4 PRG consommateurs (PRG_03_Modes_Cycle, PRG_04_Treuils_Benne, PRG_05_Translation, PRG_07_Supervision) lisent les memes valeurs via Data.Encoders.M1/M2, sans changement de valeur ni de logique."
      verified_by: "grep consommateurs + G200_check_linkage --report (0 erreur)"
    - id: AC4
      statement: "Le champ M3_SensorsWord de ST_AcquisitionInterPrg est alimente depuis instPosDecoderM3 (mot capteurs M3 reel) au lieu de la valeur figee 0."
      verified_by: "lecture PRG_02_Acquisition §5 + G200_check_linkage"
    - id: AC5
      statement: "Le nom de fichier est egal au nom du POU pour PRG_02_Acquisition.st."
      verified_by: "G310_check_code_structure"
    - id: AC6
      statement: "Le suffixe de langage est egal au langage genere dans le bundle pour PRG_02_Acquisition.st."
      verified_by: "G310_check_code_structure"
    - id: AC7
      statement: "G200 PASS (0 erreur) et gates palier C PASS apres regeneration du bundle."
      verified_by: "G200 --report + run_all_gates --palier C"

  # ── 3. Perimetre ──────────────────────────────────────────────────────────
  scope:
    allowed:
      - CODE/M_MAIN/PRG_02_Acquisition.st              # publication via ST_EncoderMeasurements + M3_SensorsWord
      - CODE/J_SUPERVISION/_TYPES/4_JOYSTICK_ACQUISITION/ST_AcquisitionInterPrg.st  # retirer champs plats codeur, ajouter Encoders : ST_EncoderMeasurements
      - CODE/M_MAIN/PRG_03_Modes_Cycle.st              # remapper consommateurs codeur
      - CODE/M_MAIN/PRG_04_Treuils_Benne.st            # remapper consommateurs codeur
      - CODE/M_MAIN/PRG_05_Translation.st              # remapper consommateurs codeur
      - CODE/M_MAIN/PRG_07_Supervision.st              # remapper consommateurs codeur
    forbidden:
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - CODE/E_CODEURS/                                # FB_Encoder / ST_fbEncoder_Measurement* deja conformes, hors scope
      - CODE/H_TREUILS_BENNE/                          # FB_Bucket/FB_WinchSync/FB_SyncDeviation lisent des entrees, pas le bus

  # ── 4. Contrat de conservation (rebuild) ─────────────────────────────────
  conservation:
    must_survive:
      - "Les valeurs CablePosM1/M2, M1/M2_Speed_Mps, M1/M2_SignedSpeed_Mps, M1/M2_SpeedValid strictement identiques (non-regression mesure)"
      - "Les gates M1/M2_EncoderFault, M1/M2_EncoderIncoherent, M1/M2_HomedAndReliable strictement identiques (non-regression securite)"
      - "Le comportement logique des 4 PRG consommateurs inchange (0 diff logique)"
      - "Le bus ST_AcquisitionInterPrg conserve les champs non-codeur (joystick, positions M3, diag DI, simulation)"
    dropped_on_purpose:
      - "Les champs plats codeur de ST_AcquisitionInterPrg (CablePosM1, M1_Speed_Mps, M1_EncoderFault, etc.) remplaces par la struct Encoders : ST_EncoderMeasurements"

  # ── 5. Preuves attendues en restitution ───────────────────────────────────
  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle

  # ── 6. Devoir d'alerte ────────────────────────────────────────────────────
  alert_duty: >
    Toute perte de valeur (CablePosM/Speed), de gate (EncoderFault/Incoherent/HomedAndReliable)
    ou de comportement logique dans les 4 PRG consommateurs est remontee immediatement.
    Non-regression de la mesure et de la securite est imperatif. Le champ M3_SensorsWord
    (bug preexistant) est corrige dans ce lot car il appartient a la frontiere d'acquisition.

