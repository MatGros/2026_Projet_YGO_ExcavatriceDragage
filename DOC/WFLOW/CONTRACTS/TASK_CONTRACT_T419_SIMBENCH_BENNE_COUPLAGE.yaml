contract:
  task_id: T419
  criticality: C3
  strategy: patch
  objective: >
    En simulation, l'ouverture M2 seule poursuit son mouvement d'inertie sur la
    distance d'anticipation configuree afin que la benne atteigne sa geometrie
    ouverte apres la coupure de commande, sans modifier le cycle reel.
  acceptance:
    - id: AC1
      statement: En fin d'ouverture automatique M2 seule, la distance de roulis est limitée à l'écart restant jusqu'à la butée ouverte et plafonnée à l'anticipation configurée.
      verified_by: Test FB_SimBench en demande automatique dans la zone d'anticipation, avec mesure avant/après épuisement du roulis.
    - id: AC2
      statement: Pour Delta mesuré=1.31 m, OffsetOpen=0 m, OpenAnticipation=1.3 m et palier 1 à 1 m/s, le scan actif estimé est retranché et le roulis après coupure vaut 1.3 m.
      verified_by: Test FB_SimBench mesure la distance M2 réellement parcourue après coupure à ±0.03 m.
    - id: AC3
      statement: Jog manuel M2, M1, M2 en montée, M2 en descente couplée, presets et mode SimWinchCouplingModelActive=FALSE gardent leur distance de roulis historique.
      verified_by: Test ciblé du jog manuel et tests non-régression FB_SimBench.
    - id: AC4
      statement: Offset ouvert et anticipation configurée proviennent de la configuration persistante; l'activation du roulis long est vraie uniquement en AX15B, via le raccordement simulateur PRG_02_Acquisition.
      verified_by: Recherche de déclaration, raccordement et G200.
    - id: AC5
      statement: FB_CycleSemiAuto, FB_Bucket, FB_Joystick, FB_CycleMachineHoming et les parametres persistants restent inchanges.
      verified_by: Audit diff borne des chemins interdits contre HEAD f4db569d.
    - id: AC6
      statement: Le bundle complet et diff sont frais, G200 passe et les gates applicables au lot passent.
      verified_by: generate_codesys_bundle.py, generate_codesys_diff_bundle.py, G200_check_linkage.py --report et run_all_gates.py.
    - id: AC7
      statement: Le nom de fichier est identique au nom de POU.
      verified_by: Inspection du chemin source et de la declaration POU PRG_02_Acquisition.
    - id: AC8
      statement: Le suffixe est identique au langage genere dans le bundle.
      verified_by: Inspection de l'objet PRG_02_Acquisition dans CODE_XML/CODE_Bundle.xml.
