  criticality: C4            # anti-télescopage benne ; touche PRG_04
  strategy: patch

  objective: >
    Remplacer les 2 expressions SEL() de clamp dupliquées inline de PRG_04 (M1 : ~5 conditions,
    M2 : ~7) par UNE fonction d'agrégation unique : bornes communes identiques M1=M2, puis la
