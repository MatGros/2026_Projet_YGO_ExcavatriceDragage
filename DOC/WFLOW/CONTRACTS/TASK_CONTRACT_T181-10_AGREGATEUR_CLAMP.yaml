    M2 (~24 affectations) si elle devient redondante (décision D13). Zéro régression M1.

  acceptance:
    - id: AC1
      statement: "Une seule fonction (ou bloc nommé) de PRG_04 calcule commonMin/Max{Up,Down} identiques pour instWinchM1 et instWinchM2 ; plus AUCUN SEL() de clamp de palier inline dans les blocs d'appel instWinchM1/M2."
      verified_by: "grep 'SEL(' autour des appels instWinchM1/M2 dans PRG_04 = 0 pour le clamp ; lecture de la fonction d'agrégation"
    - id: AC2
      statement: "Bornes communes bit-à-bit identiques sur les 2 instances : le harnais T181-00 asserte commonMaxUp/commonMaxDown/commonMinUp/commonMinDown egaux entre M1 et M2 sur toute la matrice."
      verified_by: "python TOOLS/TEST_AUTO_CI/scripts/run_tests.py --fb WINCH_INTEG (vecteur d'egalite des bornes communes)"
    - id: AC3
      statement: "La branche M2 applique en plus MIN(., plafond benne) : M2_BucketJogLimit, ManualBucketLimitsActive, BucketNotClosedAscentStep1, SlackCableAscentStep1 restent M2-only et n'affectent JAMAIS M1."
      verified_by: "TC régression M1 : M2 en jog benne (M2_BucketJogLimit actif) + M1 demande palier 4 -> StepNumber M1 = 4 (PASS)"
    - id: AC4
      statement: "Précédence : MaxStep := MIN(sources plafond), MinStep := MAX(sources plancher) ; la garde LIMIT(1, MinStepNumber, MaxStepClamped) de FB_SpeedStep (T181-07) reçoit des bornes cohérentes (Min <= Max toujours possible ; si conflit, le plafond gagne)."
      verified_by: "TC : MinStepDown=3 (plongée) + source bordure basse voulant MaxStepDown=1 -> resultat 1"
    - id: AC5
      statement: "Décision D13 tranchée PAR LES TC : si les TC démontrent que MaxStepDown:=1 de l'agrégateur produit le même effet que la reconstruction de table M2 (PRG_04 ~l.405-429), cette reconstruction est SUPPRIMEE ; sinon elle est conservée avec une justification écrite en clair dans le code."
      verified_by: "TC comparatif table-swap vs MaxStepDown:=1 + git diff (suppression OU commentaire de justification)"
    - id: AC6
      statement: "L'arbitrage synchro reste en amont de l'agrégateur : SafeStopMx_Active, EffectivePermit et SyncDeviationWarn sont calculés dans PRG_04 avant l'appel de la fonction d'agrégation ; SyncDeviationWarn plafonne les DEUX demandes (commun). FB_Winch_Symmetry reste mesure passive, hors interface FB_Winch."
      verified_by: "lecture PRG_04 (ordre de calcul) + TC harnais : deviation injectee -> plafond 1 sur M1 ET M2"
    - id: AC7
      statement: "Renommage vocabulaire propagé (cohérent avec T181-09) : plus de M2_ForceSlowSpeed / CfgMaxStepDescente / MaxStepAscent dans le périmètre touché."
      verified_by: "grep 'M2_ForceSlowSpeed|CfgMaxStepDescente|MaxStepAscent' dans PRG_04 = 0"
    - id: AC8
      statement: "Non-régression : G200 PASS, gates palier C PASS ; TC treuils existants verts."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py --palier C"
    - id: AC9
      statement: "Critère structurel (scope CODE/M_MAIN) : pour chaque fichier modifié, le nom de fichier est identique au nom de POU (source PRG_04_Treuils_Benne -> POU PRG_04_Treuils_Benne)."
      verified_by: "comparaison basename sans extension vs identifiant apres PROGRAM"
    - id: AC10
      statement: "Critère structurel (scope CODE/M_MAIN) : aucun suffixe de langage n'est apposé ; le suffixe reste identique au langage genere dans le bundle (ST pur)."
      verified_by: "grep basename *_CFC/_LD absent + inspection CODE_Bundle.xml"

