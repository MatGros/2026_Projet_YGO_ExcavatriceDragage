contract:
  # ── Identification ────────────────────────────────────────────────────────
  task_id: LOT_T140_PURGE_GVL_GLOBAL_OUTPUTS
  criticality: C2            # C2 : Modification d'interface PRG_06_Outputs / GVL_Global / PRG_02_Acquisition
  strategy: patch            # patch

  # ── 1. Objectif metier ────────────────────────────────────────────────────
  objective: >
    Supprimer la double ecriture obsolete dans GVL_Global et aligner PRG_06_Outputs
    sur son role strict de barriere materielle unique, en branchant FB_SimBench directement
    sur PRG_06_Outputs avec conformite stricte des commentaires CQS §2 (tags et fleches ASCII).

  # ── 2. Criteres testables ─────────────────────────────────────────────────
  acceptance:
    - id: AC1
      statement: >
        GVL_Global ne contient plus aucune variable de contacteur moteur ni d'ordre d'actionneur,
        et ne conserve que BlinkClock.
      verified_by: >
        python -c "content = open('CODE/M_MAIN/GVL_Global.st').read(); assert 'M1RelayFwd' not in content and 'BlinkClock' in content"

    - id: AC2
      statement: >
        PRG_06_Outputs expose ses commandes d'actionneurs en VAR_OUTPUT avec les bannieres ASCII,
        les tags [ACT], [SAFE], [CMD] et les fleches ASCII <-- conformement a CODE_QUALITY_STANDARDS §2.
      verified_by: >
        python -c "content = open('CODE/M_MAIN/PRG_06_Outputs.st').read(); assert '[ACT]' in content and '<--' in content"

    - id: AC3
      statement: >
        FB_SimBench dans PRG_02_Acquisition lit directement les sorties publiques de PRG_06_Outputs
        sans aucun passage par GVL_Global.
      verified_by: >
        python -c "content = open('CODE/M_MAIN/PRG_02_Acquisition.st').read(); assert 'PRG_06_Outputs.M1RelayFwd' in content and 'GVL_Global.M1RelayFwd' not in content"

    - id: AC4
      statement: >
        Le bundle PLCopenXML est regenere et synchronise.
      verified_by: >
        python TOOLS/AGENT_WORKFLOW/scripts/generate_codesys_bundle.py .

    - id: AC5
      statement: >
        Le controle de liaison mecanique G200_check_linkage.py sort en PASS (0 erreur).
      verified_by: >
        python TOOLS/AGENT_WORKFLOW/scripts/G200_check_linkage.py --report

    - id: AC6
      statement: >
        L'ensemble de la suite des 15 gates du projet sort a 100% au vert.
      verified_by: >
        python TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py --palier C

    - id: AC7
      statement: >
        Pour tout fichier dans CODE/M_MAIN/, le nom de fichier correspond exactement au nom du POU
        et le suffixe correspond au langage généré dans le bundle.
      verified_by: >
        python TOOLS/AGENT_WORKFLOW/scripts/G310_check_code_structure.py

  # ── 3. Perimetre ──────────────────────────────────────────────────────────
  scope:
    allowed:
      - CODE/M_MAIN/GVL_Global.st
      - CODE/M_MAIN/PRG_06_Outputs.st
      - CODE/M_MAIN/PRG_02_Acquisition.st
      - CODE_XML/
      - DOC/WFLOW/CONTRACTS/TASK_CONTRACT_PURGE_GVL_GLOBAL_OUTPUTS.yaml
      - DOC/WFLOW/PLAN_TASK.md
    forbidden:
      - ARCHIVES/
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export

  # ── 4. Contrat de conservation ────────────────────────────────────
  conservation:
    must_survive:
      - "Les stimulations et retours de simulation banc FB_SimBench restent fonctionnellement identiques."
      - "Le pilotage physique direct des sorties materielles dans PRG_06_Outputs reste intact."

  # ── 5. Preuves attendues en restitution ───────────────────────────────────
  evidence_required:
    - bundle_freshness
    - linkage_report
    - all_gates_pass

  # ── 6. Modeles autorises ──────────────────────────────────────────────────
  models_allowed:
    - "inherit"

  # ── 7. Devoir d'alerte ────────────────────────────────────────────────────
  alert_duty: >
    Si un autre POU consommait en cachette GVL_Global.M1/M2/M3, remonter immediatement.

