    must_survive:
      - "Valeurs d'OperatorActionId inchangees (16#0100..16#0480, 0 = aucune action)."
      - "Aucune comparaison / CASE introduite : le champ reste un identifiant projete, jamais teste dans une condition."
      - "Chaine de projection T168-B/T168-C intacte (FB -> PRG_03.Data.SequenceState -> PRG_07 -> GVL_IHM / GVL_Troubleshooting)."
    dropped_on_purpose:
      - "Le type UINT sur ce champ (n'a jamais eu de justification : identifiant bit-code -> WORD)."

  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle

  models_allowed:
    - "auto/best-coding"
    - "auto/best-reasoning"

  alert_duty: >
    Si un usage d'OperatorActionId autre qu'une affectation est decouvert
    (comparaison, CASE, passage a une FC attendant UINT, arithmetique), ou si la
    bascule casse un test CI -> STOP et remonter a l'orchestrateur avant d'aller
    plus loin. Signaler n'est pas elargir le scope.

