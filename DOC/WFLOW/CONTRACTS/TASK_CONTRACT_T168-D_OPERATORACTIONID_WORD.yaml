        indicatif) en PASS, et integration dans run_all_gates.py palier C
        (present dans le resume). Test negatif : le gate echoue si on remet une
        des 4 declarations en UINT.
    - id: AC4
      statement: >
        Non-regression : G200 liaison PASS 0 erreur, palier C 100% PASS, et les
        verdicts TEST_AUTO_CI des FB de cycle (FB_Cycle, FB_DiveSearch,
        FB_ExtractionSequence) sont inchanges par rapport a la baseline pre-T168-D.
      verified_by: >
        python TOOLS/AGENT_WORKFLOW/scripts/G200_check_linkage.py --report ;
        python TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py --palier C ;
        python TOOLS/TEST_AUTO_CI/run_tests.py --fb FB_Cycle --fast (idem DiveSearch,
        ExtractionSequence).
    - id: AC5
      statement: >
        Controle structurel du bundle apres edition : le nom de fichier FB_Cycle /
        FB_TroubleshootingView correspond au nom du POU declare, et le suffixe de
        langage correspond au langage genere dans le bundle PLCopenXML.
      verified_by: >
        python TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py --palier C
        (G300 structure du depot, G310 structure CODE : POU, suffixe, ordre) en PASS,
        et python TOOLS/AGENT_WORKFLOW/scripts/G200_check_linkage.py --report en PASS.

