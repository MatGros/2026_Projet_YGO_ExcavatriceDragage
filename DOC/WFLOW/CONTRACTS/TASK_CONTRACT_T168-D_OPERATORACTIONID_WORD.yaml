    de diagnostic, comme il l'est deja cote assistants (FB_DiveSearch,
    FB_ExtractionSequence, ST_DredgingAssistState, ST_ChainDredgingAssist). But :
    supprimer les 3 conversions implicites UINT<->WORD du chemin vivant
    (PRG_03:304/308 sur les sources WORD des assistants, PRG_07:452 sur la cible
    WORD ST_DredgingAssistState) qui produisent des warnings de compilation
    CODESYS 3.5. Aucun changement de comportement : les valeurs (<= 16#0480) sont
    identiques en UINT et en WORD, et il n'existe aucune comparaison ni CASE sur
    ce champ (verifie : tous les usages sont des affectations).

  acceptance:
