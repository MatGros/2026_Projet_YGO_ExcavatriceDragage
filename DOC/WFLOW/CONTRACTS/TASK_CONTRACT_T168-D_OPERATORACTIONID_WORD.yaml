      statement: >
        Les 4 declarations suivantes passent de UINT a WORD :
        CODE/G_CYCLE/FB_Cycle.st (VAR_OUTPUT OperatorActionId),
        CODE/J_SUPERVISION/_TYPES/3_CYCLE_ET_MODES/ST_SequencePublicState.st (OperatorActionId),
