        CODE/J_SUPERVISION/_TYPES/3_CYCLE_ET_MODES/ST_ChainCycleSemiAuto.st (Idx211_OperatorActionId).
      verified_by: >
        grep -rnE "OperatorActionId\s*:\s*UINT|CycleOperatorActionId\s*:\s*UINT|Idx211_OperatorActionId\s*:\s*UINT"
        CODE/ retourne 0 resultat ; grep de la meme famille en WORD retourne 8 resultats
        (4 preexistants + 4 bascules).
    - id: AC2
      statement: >
        Aucune autre ligne modifiee : pas de changement de valeur affectee, pas de
        cast explicite ajoute (WORD_TO_UINT / UINT_TO_WORD), pas de modification de
        PRG_03_Modes_Cycle.st, PRG_04_Treuils_Benne.st ni PRG_07_Supervision.st
        (les affectations y deviennent WORD := WORD, plus aucune conversion).
      verified_by: >
        git diff : seules les 4 lignes de declaration changent (UINT -> WORD),
        + le bundle regenere. Zero occurrence de _TO_UINT / _TO_WORD ajoutee.
    - id: AC3
      statement: >
        Garde-fou : un gate mecanique verifie que tout champ de la famille
        OperatorActionId / CycleOperatorActionId / Idx*_OperatorActionId dans
        CODE/**/*.st est declare WORD (jamais UINT / INT), pour empecher la
