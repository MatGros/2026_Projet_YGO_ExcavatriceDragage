      - DOC/WFLOW/TASKS.yaml
  conservation:
    must_survive:
      - "Fault.Error reste une vue live des causes actives ; Fault.Latched respecte Latching et le Reset frontal."
      - "EncoderFault et HomedAndReliable gardent leur semantique existante."
      - "Aucune cause ne pilote une action machine par Fault.Latched ; les interlocks restent bases sur les faits bruts."
    dropped_on_purpose:
      - "Status:ST_Status de la seule facade FB_Encoder."
      - "Fusion OR des ErrorId des sous-FB dans la facade."
  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle
    - git_diff_review
  models_allowed:
    - "omni/cc/claude-sonnet-5"
  alert_duty: "Tout consumer facade Status non trace, toute lecture d'interne ou toute modification de sous-FB impose STOP."
