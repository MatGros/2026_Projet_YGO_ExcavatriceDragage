#
# T428 jalon J5 : guide de depannage lisible dans CODESYS, sans effet machine.
# Base : DOC/WFLOW/ETUDES/T428_J2_STRUCTURE/ (structure, table, liste J4).
#
# Validation  : python TOOLS/AGENT_WORKFLOW/scripts/check_task_contract.py <fichier>
# ═══════════════════════════════════════════════════════════════════════════

contract:
  task_id: TS_LOT5_GUIDE_DEPANNAGE
  criticality: C2
  strategy: patch

  objective: >
    Un mainteneur ou un agent ouvre FB_TroubleshootingGuide dans CODESYS et sait,
    pour un symptome, quelles variables du snapshot lire, dans quel ordre, quelle
    valeur est saine et ou aller ensuite. Aucun ordre machine ne change.

  acceptance:
    - id: AC1
      statement: >
        FB_TroubleshootingGuide existe dans CODE/J_SUPERVISION/, contrat light
        (Enable en entree, Ready en sortie, Ready := Enable), instancie et appele
        une fois par PRG_07_Supervision. Aucune autre logique.
      verified_by: "Revue du diff ; G200 --report sans nouvelle erreur ; bundle PLCopenXML."
    - id: AC2
      statement: >
        Le corps contient un sommaire, un mode d'emploi, une section GENERAL, une
        section par axe M1, M2, M3 dans l'ordre des 10 etapes de la fiche d'axe,
        une section par fonction (referencement, couplage, benne, cycle) et des
        cas par symptome avec branches.
      verified_by: "Garde-fou : presence des sections et ordre des etapes sur les 3 axes."
    - id: AC3
      statement: >
        Toute variable citee existe dans le code ST et dans la liste du snapshot
        troubleshooting_variables.txt (AC4 du contrat T428).
      verified_by: >
        Nouveau garde-fou G531 : 0 chemin inexistant ; une mutation (chemin faux
        injecte) est detectee.
    - id: AC4
      statement: >
        Chaque valeur saine et chaque branche citees sont verifiees a la source par
        une revue independante ; aucune affirmation non verifiee ne reste.
      verified_by: >
        Redaction par 3 agents DeepSeek, challenge par GLM (mainteneur) et gpt-oss
        (automaticien), juge natif Claude qui verifie chaque affirmation dans le code.
    - id: AC5
      statement: >
        Le texte respecte CODE_QUALITY_STANDARDS 2ter : il decrit le fonctionnement,
        sans historique, REX ni date ; uniquement des commentaires //, sans (* ni *).
      verified_by: "Garde-fou G531 et revue du diff."
    - id: AC6
      statement: >
        Le rejeu des 5 incidents avec le guide est publie. Seuils proposes, non
        valides : cause au moins 9 sur 15 et maillon au moins 12 sur 15 sur la plus
        faible des deux passes. Un seuil manque est publie sans modifier le seuil.
      verified_by: "Note dans DOC/WFLOW/ETUDES/T428_J2_STRUCTURE/."
    - id: AC7
      statement: >
        Import PLCopenXML et compilation CODESYS sans erreur ; aucun changement de
        comportement machine.
      verified_by: >
        Bundle complet, diff bundle, G200 --report, run_all_gates --palier C ;
        import et compilation par l'exploitant.

    - id: AC8
      statement: >
        Le nouveau POU respecte la structure CODE : nom de fichier identique au nom de POU
        (FB_TroubleshootingGuide.st), suffixe de langage ST identique au langage
        genere dans le bundle ; nouvelle instance prefixee inst (NAMING_CONVENTION).
        Un FB et non une FUNCTION : le convertisseur PLCopenXML ne genere pas de FUNCTION.
      verified_by: "Bundle PLCopenXML genere, G310, G200 --report, audit de nommage."

  scope:
    allowed:
      - CODE/J_SUPERVISION/FB_TroubleshootingGuide.st                 # nouveau
      - CODE/M_MAIN/PRG_07_Supervision.st                             # instance et appel seulement
      - TOOLS/AGENT_WORKFLOW/scripts/G531_check_troubleshooting_guide.py   # nouveau garde-fou
      - TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py                 # enregistrement de G531
      - DOC/AF/AF_Partie-14_Fonction_Troubleshooting_v1.4.md          # renvoi vers le guide
      - DOC/WFLOW/ETUDES/T428_J2_STRUCTURE/**
      - DOC/WFLOW/CONTRACTS/TASK_CONTRACT_TS_LOT5_GUIDE_DEPANNAGE.yaml
      - DOC/WFLOW/CONTRACTS/TASK_CONTRACT_TS_LOT5_GUIDE_DEPANNAGE.md
      - CODE_XML/CODE_Bundle.xml
      - CODE_XML/CODE_DiffBundle.xml
    forbidden:
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - CODE/J_SUPERVISION/GVL_Troubleshooting.st
      - CODE/J_SUPERVISION/FB_TroubleshootingView.st
      - CODE/J_SUPERVISION/_TYPES/**
      - CODE/M_MAIN/PRG_04_Treuils_Benne.st
      - CODE/M_MAIN/PRG_06_Outputs.st
      - TOOLS/PLC_CSV_SNAPSHOT/variable_lists/troubleshooting_variables.txt
      - TOOLS/AGENT_SUPERVISOR/**
      - ARCHIVES/**

  conservation:
    must_survive:
      - "Aucun ordre, permis, sequence ou seuil machine ne change"
      - "Noms et chemins GVL_Troubleshooting inchanges"
      - "Liste du snapshot J4 inchangee : le guide la cite, il ne la modifie pas"
    dropped_on_purpose:
      - "Pas de renommage de GVL ni de nettoyage de la vue (option liste seule)"

  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle
    - diff_bundle
    - diff_review
    - guide_guard_with_mutation

  models_allowed:
    - "claude-opus-5-5"
    - "deepseek-v4.1-flash:cloud"
    - "glm-5.3-flash:cloud"
    - "gpt-oss:120b-cloud"

  alert_duty: >
    Tout fait constate qui contredit la table J2, la fiche d'axe ou un commentaire
    de type est remonte immediatement a l'orchestrateur et a l'exploitant, sans
    elargir le perimetre.

