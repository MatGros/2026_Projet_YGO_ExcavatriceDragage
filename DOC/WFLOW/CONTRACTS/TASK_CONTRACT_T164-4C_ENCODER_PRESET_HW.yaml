# Contrat T164-4C — transaction preset et frontiere hardware codeur
preconditions:
  - id: PRE1
    statement: "T164-4A et T164-4B sont VALIDATED ; PresetConfirmMode est disponible et sa source publique est cablee."
    source: "Contrats T164-4A et T164-4B"
contract:
  task_id: T164-4C_ENCODER_PRESET_HW
  criticality: C3
  strategy: rebuild
  objective: >
    Implementer la transaction preset reelle validee E-D1 et separer la frontiere
    hardware codeur en HwIn/HwOut, sans modifier les constantes, la formule de mesure,
    les cibles homing M1/M2 ni les sous-FB hors scope.
  acceptance:
    - id: AC1
      statement: "PresetAck et PresetNak disparaissent de toutes les interfaces et references actives E_CODEURS ; PresetStatusBit les remplace dans ST_fbEncoder_HwIn et PRG_02 le laisse FALSE tant qu'aucun bit site n'est identifie."
      verified_by: "rg 'PresetAck|PresetNak' CODE/E_CODEURS => 0 ; rg PresetStatusBit CODE/M_MAIN/PRG_02_Acquisition.st"
    - id: AC2
      statement: "READBACK_ONLY confirme le preset apres la temporisation historique T#500MS, sans nouveau cycle ou tempo, par ABS(CandidateCablePosM - cible) <= CST_HomingVerifyToleranceM. CandidateCablePosM est calculee localement depuis RawPos relu et PendingHomingRefRaw sans publication prematuree. Calib.Homed et Calib.HomingRefRaw sont commits ensemble au seul succes ; une cible ratee de 50 mm conserve Calib.Homed, pose Calib.HomingSuspect et publie le fait/erreur preset non confirme deja decide. La sortie safety Homed conserve sa semantique existante."
      verified_by: "tests E_CODEURS : succes atomique, echec 50 mm, trois modes et Reset conscient"
    - id: AC3
      statement: "READBACK_AND_STATUSBIT et STATUSBIT_ONLY suivent exactement le selecteur E_PresetConfirmMode ; aucun signal materiel absent ne vaut TRUE par defaut."
      verified_by: "tests ou lecture des trois branches"
    - id: AC4
      statement: "HwIn contient uniquement les faits hardware d'entree et HwOut uniquement les ordres preset ; tous les call-sites actifs migrent sans copie partielle. ST_EncoderHw est conserve : ses seules references restantes sont sa definition et les fixtures historiques explicitement listees dans la preuve."
      verified_by: "G120 + G200 --report + inventaire rg ST_EncoderHw avec exemptions definition/fixtures"
    - id: AC5
      statement: "RawPos, AngleRaw et TurnCount de FB_Encoder_Abs sont OK-FIGE documentes dans le gate ; ses commandes bus sont neutralisees ; aucune lecture brute ni remise a zero ne survient dans ce gate."
      verified_by: "revue gate + AC5 parent amende et valide"
    - id: AC6
      statement: "FB_Sim_Encoder et FB_SimBench reproduisent le READBACK_ONLY et le call-site PresetStatusBit FALSE ; aucun seuil metier existant ne change."
      verified_by: "tests simulation + git diff"
    - id: AC7
      statement: "Les ports FwdRevSpeedFeedbackOff et BrakeFeedback de FB_Encoder_Homing sont soit cables depuis une source AF validee, soit retires uniquement selon la decision T164-4A ; aucun port mort non trace ne demeure."
      verified_by: "table d'impact T164-4A + revue interfaces/call-sites"
    - id: AC8
      statement: "PRG_02_Acquisition.st : fichier est identique au nom de POU ; suffixe est identique au langage bundle (Structured Text)."
      verified_by: "G310_check_code_structure.py et G320_check_bundle_main_coverage.py"
  scope:
    allowed:
      - CODE/E_CODEURS/FB_Encoder.st
      - CODE/E_CODEURS/FB_Encoder_Abs.st
      - CODE/E_CODEURS/FB_Encoder_Homing.st
      - CODE/E_CODEURS/ST_EncoderHw.st
      - CODE/E_CODEURS/ST_fbEncoder_HwIn.st
      - CODE/E_CODEURS/ST_fbEncoder_HwOut.st
      - CODE/M_MAIN/PRG_02_Acquisition.st
      - CODE/L_SIMULATION/FB_Sim_Encoder.st
      - CODE/L_SIMULATION/FB_SimBench.st
      - DOC/AF/AF_Partie-09_Fonction_Encoder_v2.3.md
      - DOC/WFLOW/AUDITS/IHM_VARIABLES_MIGRATION.md
      - TOOLS/TEST_AUTO_CI/TEST_AUTO_CI_UNITARY/E_CODEURS/test_unitaires.py
      - TOOLS/TEST_AUTO_CI/RESULTS/E_CODEURS/**
    forbidden:
      - CODE/E_CODEURS/FB_Encoder_Scale.st
      - CODE/E_CODEURS/FB_Encoder_Safety.st
      - CODE/E_CODEURS/FB_EncoderReliability.st
      - CODE/E_CODEURS/FB_Encoder_SpeedMeasure.st
      - CODE/M_MAIN/PRG_07_Supervision.st
      - PRJ_CODESYS/**
      - DOC/WFLOW/TASKS.yaml
  conservation:
    must_survive:
      - "Formule CablePosM signee et conversion DINT avant soustraction."
      - "Trois modes homing existants, bornage [-99;+99] m, HomingPermit et retard de scan documente ; seule la transaction E-D1 change selon la decision approuvee."
      - "Homed, HomingSuspect et HomingRefRaw persistants via Calib."
      - "Sous-FB en Status:ST_Status."
    dropped_on_purpose:
      - "PresetAck et PresetNak, remplaces par confirmation transactionnelle E-D1."
      - "Frontiere ST_EncoderHw active, remplacee par HwIn/HwOut apres preuve zero consommateur actif."
  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle
    - git_diff_review
  models_allowed:
    - "omni/cc/claude-sonnet-5"
  alert_duty: "Tout changement de valeur, seuil, polarite, tempo, formule, consumer non prevu ou acces a interne de sous-FB impose STOP."
