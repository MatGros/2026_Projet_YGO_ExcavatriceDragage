contract:
  task_id: T293
  criticality: C2
  strategy: patch
  objective: >
    Calculer continument la position simulee M2 depuis M1 uniquement en descente
    M1/M2 Both, avec facteur issu des mesures et bit de desactivation.
  acceptance:
    - id: AC1
      statement: "Le calcul positionnel requiert le bit actif, une intention Both descente et les deux relais descente effectifs sans relais montee."
      verified_by: "Test ST matrice Both, directions, relais et bit ON/OFF."
    - id: AC2
      statement: "M2_raw est calcule a toute profondeur depuis les origines de phase M1/M2 et le facteur 0.9333 (mesure ~0.6 m d ecart sur 9 m), sans offset affine ni borne de profondeur."
      verified_by: "Test ST de la formule aux profondeurs -5, -15 et -25 m avec ecart initial non nul."
    - id: AC3
      statement: "Bit OFF depuis le depart : la trajectoire M2 est identique au modele actuel. Desactivation en mouvement : reprise du facteur normal depuis la position acquise, sans saut de position."
      verified_by: "Comparaison ST baseline et test bascule a mi-descente."
    - id: AC4
      statement: "La montee, M1 seul, M2 seul et le roulis conservent leur dynamique hors ralentissement Both."
      verified_by: "Tests ST direction et commande unitaire, puis arret et reprise."
    - id: AC5
      statement: "La position publiee provient de la trajectoire M2 issue de M1 ; aucun plateau a 2.63 m ni offset affine d affichage n est ecrit dans le codeur. La vitesse publiee est coherente avec le facteur applique."
      verified_by: "Test position/vitesse et garde-fou source automatique."
    - id: AC6
      statement: "Aucune limitation cachee de l ecart ne neutralise les protections benne/synchronisme. M1 reste mobile sous relais descente effectif."
      verified_by: "Test integration des deux fonctions et comparaison M1 avec modele M2 desactive."
    - id: AC7
      statement: "Le nom de fichier est identique au nom de POU pour PRG_02_Acquisition."
      verified_by: "G310_check_code_structure.py."
    - id: AC8
      statement: "Le suffixe ST correspond au langage ST genere dans le bundle."
      verified_by: "G310_check_code_structure.py et inspection du POU genere."
    - id: AC9
      statement: "Le bundle est frais et G200 ne rapporte aucune erreur de liaison."
      verified_by: "generate_codesys_bundle.py puis G200_check_linkage.py --report, palier C et suite complete."
