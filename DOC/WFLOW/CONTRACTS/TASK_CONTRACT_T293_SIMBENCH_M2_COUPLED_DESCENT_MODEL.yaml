contract:
  task_id: T293
  criticality: C2
  strategy: patch
  objective: >
    Ajouter au banc de simulation un modèle de position M2 calé sur M1 en
    descente couplée, calibré sur trace réelle (régression linéaire, RMSE
    3cm), activable/désactivable par un bit actif par défaut, sans régresser
    le mode indépendant existant.
  acceptance:
    - id: AC1
      statement: "Avec SimM2CoupledDescentModelActive=FALSE, Winch.COD2_PosValue suit exactement instSimEncoderM2.RawPosOut comme avant (aucune régression)."
      verified_by: "test de non-régression flag désactivé"
    - id: AC2
      statement: "Avec le flag actif (défaut TRUE), M1 et M2 commandés en descente simultanée (M1_RelayRev AND M2_RelayRev), et M1_AbsDepth_M dans [1.6;8.0]m, Winch.COD2_PosValue suit le modèle (pente 0.8837, offset 1.1728m) à la dispersion près."
      verified_by: "test scan-par-scan : position M2 publiée = f(M1) dans la plage"
    - id: AC3
      statement: "Hors plage [1.6;8.0]m ou hors descente couplée (un seul treuil descend, ou remontée), Winch.COD2_PosValue revient à la position du modèle codeur M2 indépendant."
      verified_by: "test scan-par-scan : sortie de plage / arrêt descente couplée -> retour au modèle indépendant"
    - id: AC4
      statement: "Toutes les constantes du modèle (pente, offset, bornes, amplitude dispersion) sont déclarées en VAR CONSTANT nommées, aucun littéral numérique dans le corps du calcul."
      verified_by: "revue de code"
    - id: AC5
      statement: "La dispersion aléatoire reste bornée à l'amplitude configurée (CST_M2CoupledModelDispersion_M) et ne dérive pas dans le temps."
      verified_by: "test : dispersion tirée à chaque entrée en descente couplée, toujours dans [-amplitude;+amplitude]"
    - id: AC6
      statement: "Le bundle PLCopenXML est régénéré et la liaison producteur-consommateur reste sans erreur."
      verified_by: "generate_codesys_bundle.py puis G200_check_linkage.py --report"
  scope:
    allowed:
      - CODE/L_SIMULATION/GVL_Simulation.st
      - CODE/L_SIMULATION/FB_SimBench.st
      - CODE/M_MAIN/PRG_02_Acquisition.st
      - CODE_XML/CODE_Bundle.xml
      - DOC/WFLOW/TASKS.yaml
      - DOC/WFLOW/CONTRACTS/TASK_CONTRACT_T293_SIMBENCH_M2_COUPLED_DESCENT_MODEL.yaml
      - DOC/AF/AF_Partie-13_Fonction_Simulation_v2.5.md
    forbidden:
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - CODE/FB_Safety_Winch.st
      - CODE/B_AU_SECURITE/*
      - CODE/E_CODEURS/*
      - CODE/H_TREUILS_BENNE/*
  conservation:
    must_survive:
      - "Le comportement indépendant existant de FB_Sim_Encoder pour M2, inchangé quand le flag est désactivé ou hors conditions d'activation."
      - "instSimEncoderM2.RawPosOut continue d'évoluer en continu en tâche de fond même quand le modèle override l'affichage, pour éviter tout saut à la désactivation."
    dropped_on_purpose: []
  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle
  models_allowed:
    - "omni/cx/gpt-5.6-terra"
    - "omni/cc/claude-sonnet-5"
  alert_duty: >
    Hypothèse de convention de signe non vérifiée au banc : M1_AbsDepth_M
    suppose une correspondance avec M1TreuilRetenue.State.Position_M du
    terrain (distance descendue positive croissante). À confirmer par
    l'utilisateur après test ; signaler toute divergence observée.
status: PAUSED
