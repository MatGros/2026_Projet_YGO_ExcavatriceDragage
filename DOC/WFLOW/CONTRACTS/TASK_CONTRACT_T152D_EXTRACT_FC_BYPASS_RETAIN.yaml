    logique inline répétée — comportement strictement identique, conformité à l'esprit
    "orchestration = câblage" (CODE_QUALITY_STANDARDS.md §10). ⚠️ CORRIGÉ par le 3e challenge
    indépendant (2026-08-25) : §2b (lignes 174-223, 6 blocs) est un ALGORITHME DIFFÉRENT
    (restauration boot one-shot conditionnée par Initialized, pas une synchro bidirectionnelle
    continue) — explicitement HORS SCOPE de cette tâche, ne pas fusionner avec §2c.

