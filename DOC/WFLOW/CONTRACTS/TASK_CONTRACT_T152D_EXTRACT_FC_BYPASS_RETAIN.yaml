      verified_by: "Relecture manuelle de §2b ET §2c post-édition : §2b identique au diff pres, §2c = 10 appels FC, comptage des sites"
    - id: AC3
      statement: "Comportement bit-à-bit strictement identique avant/après pour chacun des 10 sites §2c (même sortie pour les mêmes entrées bypass Hmi/Retain) ; §2b non modifié donc non-régression garantie par construction."
      verified_by: "Relecture manuelle exhaustive des 10 sites §2c (avant/après côte à côte) + G200_check_linkage.py --report = PASS"
    - id: AC4
      statement: "Gates Palier C 100% PASS, bundle régénéré frais."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/generate_codesys_bundle.py . && python TOOLS/AGENT_WORKFLOW/scripts/run_all_gates.py --palier C"
    - id: AC5
      statement: "Validation manuelle exhaustive CODESYS (Watch/forçage bypass sur au moins 2 domaines) avant tout chargement en production — non négociable (Étape 3bis codesys-workflow, human_validation_required)."
