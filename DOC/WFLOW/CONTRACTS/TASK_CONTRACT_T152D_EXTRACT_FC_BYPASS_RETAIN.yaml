  criticality: C2            # comportement-préservé mais touche la persistance des bypass
  strategy: patch

  # ── 1. Objectif ───────────────────────────────────────────────────────────
  objective: >
    Extraire le motif dupliqué 10 fois de synchronisation bidirectionnelle bypass IHM↔RETAIN
