        python TOOLS/TEST_AUTO_CI/scripts/run_tests.py --fb PRG_07_Supervision
        Le meme scenario est d'abord porte par le dossier exploratoire
        TOOLS/TEST_AUTO_CI/RESULTS/_TROUBLESHOOTING/DSH05_T255D_FDC_BAS
        (registre ephemere hors depot, lance par tests/run.py)
    - id: AC3
      statement: >
        Le test AC2 est rouge sur le code actuel, avec un message d'assertion montrant le
        symptome exact (carrousel vide et SpecialCondition vide alors que la cause limite
