  task_id: T255-D_SILENT_LOW_LIMIT_FAULT
  criticality: C2
  strategy: patch

  # ── 1. Objectif metier ────────────────────────────────────────────────────
  objective: >
    A l'arrivee d'un treuil (M1 ou M2) sur la butte logicielle BASSE, rendre la cause
    et l'action autorisee visibles a l'operateur au MEME scan que l'allumage du voyant
    AnyFault : le bandeau doit nommer le treuil concerne et la limite basse cable
    atteinte, et indiquer que la remontee est l'action autorisee. Le defaut lui-meme
    (quand il se leve, et sa logique) n'est pas modifie ; seule sa VISIBILITE l'est.

