        et :537-547 (AnyFaultActive) -> FB_Hmi_BannerFormatter.st (carrousel, section 5).
        Le consommateur final est nomme : l'operateur devant le bandeau IHM.
      verified_by: >
        Section 5 (arbre vertical) et section 7 (conclusion) de la fiche
        DOC/WFLOW/TROUBLESHOOTING/FICHES/TROUBLESHOOTING_FdcBasSilencieux_20260920.md,
        plus grep des references croisees de CableLimitDescent et ErrorId dans CODE/
    - id: AC2
      statement: >
        Scenario butte basse cable atteinte, teste SEPAREMENT pour M1 et pour M2 :
        WinchSafety.ErrorId porte le bit 6 (16#0040), WinchSafety.Error vaut TRUE et
        l'encodeur du treuil est valide ; au scan suivant du formateur le bandeau publie
        un libelle d'alarme NON VIDE citant le treuil et la limite basse cable, ET un
        texte d'action operateur NON VIDE nommant la remontee comme action autorisee.
      verified_by: >
        Tests CI boite noire par le harnais d'integration FB_TestHarness_PRG_07 :
        cas M1 et M2 separes injectant WinchData.WinchM1Safety (Error, ErrorId 16#0040,
