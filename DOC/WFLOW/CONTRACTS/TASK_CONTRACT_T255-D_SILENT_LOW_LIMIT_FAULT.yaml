        l'assertion entre les deux. Le cas de reproduction doit aussi prouver que le texte
        d'action ne nomme pas la cause avant correctif.
      verified_by: >
        Sorties brutes du dossier exploratoire DSH05_T255D_FDC_BAS avant correctif, deja
