open_decisions:
  - id: D1
    question: >
      Canal de publication du message d'alarme : ajouter la cause limite basse cable au
      carrousel d'alarmes (section 5 de FB_Hmi_BannerFormatter, aligne sur AF-07 section 6
      qui definit un interlock comme bloquant) ou la publier uniquement dans les champs 3
      et 4 (SpecialConditionText et OperatorActionText), ce qui respecte la decision
      code du 2026-09-01 excluant les limites du carrousel ?
    recommended: carrousel pour l'alarme plus champs 3 et 4 pour l'action, avec condition de validite encodeur
    impact: >
      Le carrousel modifie le sens de la decision 2026-09-01 et exige une mise a jour de
      AF_Partie-07 section 6 ; les champs 3 et 4 seuls laissent HasAlarm a FALSE alors que
      le voyant AnyFault est allume.
  - id: D2
    question: >
      Mise a jour de AF_Partie-07 : modification en place de la version v2.3 ou creation
      d'une version _v2.4 ?
    recommended: decision humaine, la convention de version n'est pas tranchee par le code
  - id: D3
    question: >
      Le voyant AnyFault doit-il rester allume sur une cause non bloquante non labellisee
      (par exemple le defaut fonctionnel joystick ou un defaut d'arbitrage de mode), ou
      la liste AnyFaultActive doit-elle etre restreinte aux causes reellement bloquantes ?
    recommended: >
      ne pas toucher AnyFaultActive dans ce lot (inventaire AC6 seulement, rattachement
      T220 et T243), car restreindre la liste eteindrait un voyant sur un defaut reel
  - id: D4
    question: >
      L'entree de registre FB_Hmi_BannerFormatter est inutilisable : elle cumule 13 sources
      absentes (tout le dossier CODE/J_SUPERVISION/_TYPES/5_ASSISTANCE_DRAGAGE/, retire)
      et une source manquante non declaree (E_CycleDepthStopMode.st, requise par
      ST_CycleCfg.st qu'elle liste). Les 19 cas de test du bandeau ne s'executent donc pas.
      Reparer cette entree fait-il partie du lot T255-D, ou est-ce une tache d'outillage
      separee ?
    recommended: >
      reparer l'entree dans ce lot : sans elle AC4 n'a aucune ancre sur le carrousel et le
      correctif du formateur reste sans test unitaire exécutable
    impact: >
      touche TOOLS/TEST_AUTO_CI/scripts/config/registry.yaml, hors du perimetre autorise
      actuel du contrat ; toute modification du registre affecte l'ensemble des agents.
      Mesure du 2026-09-20 avec registre repare localement : 15 cas verts sur 19, avec
      4 rouges PRE-EXISTANTS (TC-P07-020, TC-P07-006, TC-P07-008, TC-P07-031). Les reparer
      ou les accepter est une decision humaine tracee, jamais une retouche d'agent : ils
      documentent la decision du 2026-09-01 sur le carrousel

