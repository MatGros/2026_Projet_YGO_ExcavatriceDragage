contract:
  task_id: T262
  criticality: C4
  strategy: patch
  objective: >
    Permettre la transition anticipée de AX10 vers AX11 par seuil configurable
    d ouverture benne, puis assurer un transfert continu et maîtrisé de M2 seul
    vers M1+M2 Both et de AX11 vers AX12, sans supprimer les barrières de sécurité.
  acceptance:
    - id: AC1
      statement: "La configuration est bornée à 0..50 % et sa valeur par défaut est 0 %."
      verified_by: "test unitaire de saturation et inspection de la valeur initiale"
    - id: AC2
      statement: "Avec Cfg=0 %, AX10_CLOSE_BUCKET ne change pas de condition et attend l'information actuelle benne fermée."
      verified_by: "test cycle auto avec benne à 1..10 % puis benne fermée"
    - id: AC3
      statement: "Avec Cfg>0 %, le passage au step suivant est vrai lorsque ActualBucketOpeningPct < Cfg OU lorsque l'information benne fermée historique est vraie (OU logique, pas un remplacement du fallback)."
      verified_by: "tests aux valeurs seuil-1, seuil, seuil+1, 50 %, et cas fermé avec %>=seuil (dérive capteur)"
    - id: AC4
      statement: "Le seuil ne neutralise ni AU, ni FDC, ni freinage, ni défaut de mouvement et ne commande pas un redémarrage automatique."
      verified_by: "revue de flux PRG/FB et tests de coupure des permis"
    - id: AC5
      statement: "Le scénario de fermeture ne maintient pas inutilement l'effort sur M2 seul après validation du seuil, sans supprimer la synchronisation et les limites finales."
      verified_by: "simulation/rejeu cycle AX10 avec trace M1/M2, demandes et étapes"
    - id: AC6
      statement: "Le bundle PLCopenXML est régénéré et la liaison producteur-consommateur reste sans erreur."
      verified_by: "generate_codesys_bundle.py puis G200_check_linkage.py --report"
    - id: AC7
      statement: "Pour chaque fichier ST autorisé, le nom de fichier est identique au nom de POU et le suffixe est égal au langage généré dans le bundle."
      verified_by: "gates structurels et revue du bundle"
    - id: AC8
      statement: "Le transfert AX10 vers AX11 ne provoque pas d arrêt franc inutile et ne commande jamais M1 seul de façon transitoire."
      verified_by: "chronogramme scan-par-scan demandes, sens, paliers, contacteurs et freins M1/M2"
    - id: AC9
      statement: "AX11 vers AX12 conserve la demande et le sens ; le changement de palier suit le cadenceur existant sans retombée frein/contacteurs."
      verified_by: "test cycle avec joystick maintenu et trace sorties finales"
    - id: AC10
      statement: "Tant que la fermeture franche n est pas confirmée, AX12 reste au palier lent même si le seuil pour entrer en AX11 est franchi."
      verified_by: "tests seuil franchi avec Benne_IsClosed faux puis vrai"
  scope:
    allowed:
      - CODE/G_CYCLE/FB_CycleSemiAuto.st
      - CODE/M_MAIN/PRG_03_Modes_Cycle.st
      - CODE/M_MAIN/PRG_04_Treuils_Benne.st
      - CODE/H_TREUILS_BENNE/BENNE/FB_Bucket.st
      - CODE/H_TREUILS_BENNE/FB_WinchCmdArbitrationM1.st
      - CODE/H_TREUILS_BENNE/FB_WinchCmdArbitrationM2.st
      - CODE/J_SUPERVISION/GVL_IHM.st
      - CODE/J_SUPERVISION/_TYPES/3_CYCLE_ET_MODES/ST_CycleCfg.st
      - CODE/J_SUPERVISION/_TYPES/7_COMMUN_CONFIG/ST_CommunCfg.st
      - DOC/AF/AF_Partie-10_Fonction_Winch_v2.1.md
      - CODE_XML/CODE_Bundle.xml
      - DOC/WFLOW/TASKS.yaml
      - DOC/WFLOW/CONTRACTS/TASK_CONTRACT_T262_AX10_CLOSE_BUCKET_THRESHOLD.yaml
      - TOOLS/AGENT_WORKFLOW/scripts/G500_check_t262_bucket_ascent_handoff.py
    forbidden:
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - CODE/FB_Safety_Winch.st
      - CODE/B_AU_SECURITE/*
  conservation:
    must_survive:
      - "La condition historique benne fermée lorsque le seuil vaut 0 %."
      - "Les contrôles FDC, AU, freinage, synchronisation et défaut mouvement."
      - "La convention ActualBucketOpeningPct : 0 % fermé, 100 % ouvert."
      - "La pleine vitesse AX12 exige toujours Benne_IsClosed."
    dropped_on_purpose: []
  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle
  models_allowed:
    - "omni/cx/gpt-5.6-terra"
    - "omni/cc/claude-sonnet-5"
  alert_duty: >
    Toute incohérence entre le pourcentage réel, l'information benne fermée,
    l'étape AX10 et la synchronisation M1/M2 doit être signalée avant toute
    implémentation.
  blocking_decisions:
    - "A 0 %, confirmer si le comportement historique conserve Benne_IsRoughlyClosed en plus de Benne_IsClosed."
    - "Confirmer la borne métier maximale 50 % et la comparaison stricte ActualBucketOpeningPct < seuil."
    - "Définir le chronogramme de transfert de priorité M2 benne vers Both P1 sans supprimer directement AX10_WAIT_ASCENT_START."
  phases:
    - "A : ajouter/publier le paramètre et le critère calculé, sans changer la séquence."
    - "B : transfert explicite M2 seul vers Both au palier 1, scan-par-scan."
    - "C : continuité AX11 vers AX12 ; paliers supérieurs seulement après Benne_IsClosed."
status: PENDING
