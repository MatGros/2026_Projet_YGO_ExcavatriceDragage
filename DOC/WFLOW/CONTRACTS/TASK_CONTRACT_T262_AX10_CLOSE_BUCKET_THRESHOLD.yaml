contract:
  task_id: T262
  criticality: C4
  strategy: patch
  technical_plan: DOC/WFLOW/CONTRACTS/PLAN_T262_TRANSFERT_AX10_AX11_20260915.md
  updated_at: '2026-09-15T15:10:00+02:00'
  objective: >
    Permettre la transition anticipée de AX10 vers AX11 par seuil configurable
    d ouverture benne, puis assurer un transfert continu et maîtrisé de M2 seul
    vers M1+M2 Both, extraction AX11 cible P2 puis AX12, sans supprimer les barrieres
    de securite. Preparation au P1 sans arret franc ; repli historique si la
    fermeture arrive avant la disponibilite du transfert. Plan soumis a validation.
  acceptance:
    - id: AC1
      statement: "La configuration INT persistante proposee est bornee a 0..50 % et sa valeur par defaut est 0 % ; borne maximale a valider humainement."
      verified_by: "test unitaire de saturation et inspection de la valeur initiale"
    - id: AC2
      statement: "Avec Cfg=0 %, conserver le critere historique Done AND (IsClosed OR IsRoughlyClosed) ; le transfert prepare ne prolonge jamais la fermeture M2 en attente de M1."
      verified_by: "test cycle auto avec benne à 1..10 % puis benne fermée"
    - id: AC3
      statement: "Avec Cfg>0 %, preparer le transfert lorsque BucketOpening_Pct valide <= Cfg OU lorsque la fin de fermeture historique est atteinte. L egalite est incluse pour atteindre le pourcentage demande ; aucun faux IsClosed ou Done fermeture au seuil partiel."
      verified_by: "tests aux valeurs seuil-1, seuil, seuil+1, 50 %, et cas fermé avec %>=seuil (dérive capteur)"
    - id: AC4
      statement: "Le seuil ne neutralise ni AU, ni FDC, ni freinage, ni défaut de mouvement et ne commande pas un redémarrage automatique."
      verified_by: "revue de flux PRG/FB et tests de coupure des permis"
    - id: AC5
      statement: "Le scénario de fermeture ne maintient pas inutilement l'effort sur M2 seul après validation du seuil, sans supprimer la synchronisation et les limites finales."
      verified_by: "simulation/rejeu cycle AX10 avec trace M1/M2, demandes et étapes"
    - id: AC6
      statement: "Le bundle PLCopenXML est régénéré et la liaison producteur-consommateur reste sans erreur."
      verified_by: "generate_codesys_bundle.py puis G200_check_linkage.py --report"
    - id: AC7
      statement: "Pour chaque fichier ST autorisé, le nom de fichier est identique au nom de POU et le suffixe est égal au langage généré dans le bundle."
      verified_by: "gates structurels et revue du bundle"
    - id: AC8
      statement: "Le transfert AX10 vers AX11 ne provoque pas d arrêt franc inutile et ne commande jamais M1 seul de façon transitoire."
      verified_by: "chronogramme scan-par-scan demandes, sens, paliers, contacteurs et freins M1/M2"
    - id: AC9
      statement: "AX11 vers AX12 conserve la demande et le sens ; le changement de palier suit le cadenceur existant sans retombée frein/contacteurs."
      verified_by: "test cycle avec joystick maintenu et trace sorties finales"
    - id: AC10
      statement: "Tant que la fermeture franche n est pas confirmée, AX12 reste au palier lent même si le seuil pour entrer en AX11 est franchi."
      verified_by: "tests seuil franchi avec Benne_IsClosed faux puis vrai"
    - id: AC11
      statement: "Apres raccordement des deux axes au P1, AX11 demande P2 avec le cadenceur existant et CtrlAscentMaxStep ; l exception benne partielle ne releve aucun plafond mou de cable, limite, codeur, maintenance ou securite."
      verified_by: "tests ST integration AX11 benne partielle, puis chaque plafond prioritaire ; trace des paliers reels"
    - id: AC12
      statement: "La liberation de propriete benne et la reprise Both sont effectives dans le meme scan PRG04 ; aucun retrait de sens M2 nominal n atteint les sorties finales pendant le transfert."
      verified_by: "chronogramme PRG03/PRG04/PRG06 avec M2 initial P1..P5, M1 dernier sens montee et descente"
    - id: AC13
      statement: "La preparation logique M1 reste sans marche ni contacteurs ; disponibilite du FB mouvement et de l interlock final verifiee avant transfert, pas seulement Ready."
      verified_by: "test M1 dernier sens descente, fermeture courte/longue, frein ouvert/ferme, purge ou inhibition finale"
    - id: AC14
      statement: "Perte du geste, du contexte ou d un permis annule la transaction ; une preparation insuffisante a la fermeture utilise l arret historique avec motif observable, sans effort M2 prolonge ni redemarrage automatique apres defaut."
      verified_by: "injections avant, pendant et apres transfert ; reprise avec mesure et permis reevalues"
    - id: AC15
      statement: "La validite du seuil exige geometrie et references fiables ; un affichage 0 % issu d une configuration invalide n autorise pas de transfert."
      verified_by: "tests references douteuses, geometrie invalide, mesure invalide et bornes de configuration"
