# ═══════════════════════════════════════════════════════════════════════════
# CONTRAT DE REVUE INDEPENDANTE — T123 Standardisation CODE/ (A-M)
# Projet Excavatrice Dragage — CODESYS 3.5 / IEC 61131-3
# ═══════════════════════════════════════════════════════════════════════════
#
# ROLE : Revue READ-ONLY (aucune edition) par un Expert Senior en Automatisme
# Industriel (CODESYS, Safety ISO 13849, IHM, POO/FB, normes, test, R&D).
# L'agent VALIDE les approches avant de proposer, CHALLENGE les idees, signale
# les risques et l'effort estime. Il consulte les standards/conventions/AF du
# projet et demande confirmation explicite avant toute action.
#
# Validation : python TOOLS/AGENT_WORKFLOW/scripts/check_task_contract.py <fichier>
# ═══════════════════════════════════════════════════════════════════════════

contract:
  task_id: T123_REVIEW_STANDARDISATION
  criticality: C3            # C3 (safety standard) — revue de code safety/motion
  strategy: patch            # revue read-only, aucune modification

  # ── 1. Objectif ────────────────────────────────────────────────────────────
  objective: >
    Verifier que la standardisation documentaire T123 (cartouches, tags, regions,
    purge REX) appliquee sur tout CODE/ (A-M, 103 fichiers) n'a AUCUN impact sur
    le code executable, la securite machine, la coherence avec l'analyse
    fonctionnelle (AF) et le respect des standards/conventions du projet.

  # ── 2. Criteres testables (le rapport doit etre EVALUABLE et TESTABLE) ─────
  acceptance:
    - id: AC1
      statement: "Le code executable (hors commentaires) de chaque fichier modifie est strictement identique a HEAD."
      verified_by: "Comparaison lignes executables HEAD vs working (script Get-CodeLines) sur les 103 fichiers modifies — 0 difference logique."
    - id: AC2
      statement: "Aucun REX, date, numero de lot, recit d'essai/audit/correctif ne subsiste dans les commentaires de CODE/."
      verified_by: "grep ripgrep sur CODE/ : pattern REX|20[0-9]{2}-[0-9]{2}-[0-9]{2}|🆕|retour terrain|correctif|LOT[0-9]|audit|revocation — 0 resultat."
    - id: AC3
      statement: "Les invariants de securite machine (Enable>SafeStop>StartStop, Reset sur front, pas de redemarrage auto, producteur unique, gate final frein, PowerCutOff) sont preserves."
      verified_by: "Revue ciblee des FB safety/mouvement (FB_Safety_Winch, FB_Safety_Translation, FB_Winch, FB_Translation, FB_Bucket, FB_WinchOutputInterlock, FB_TranslationOutputInterlock, FB_Safety_EmergencyManagement*) contre AF01/AF03/AF10/AF11."
    - id: AC4
      statement: "Chaque cartouche <=15 lignes, contient un lien AF valide sous DOC/AF/ et n'utilise que des emojis de la whitelist CODESYS projet."
      verified_by: "Comptage lignes cartouche + verification lien AF + emojis whitelist sur les 103 fichiers."
    - id: AC5
      statement: "Les declarations respectent l'ordre VAR_INPUT->VAR_OUTPUT->VAR_IN_OUT->VAR et portent fleche ASCII + tag de role conforme (NAMING_CONVENTION §Tags)."
      verified_by: "Revue structurelle des declarations + presence tags [CMD/CFG/HW/SAFE/TST/STAT/ACT/DIAG/INST/LOC/BUS]."
    - id: AC6
      statement: "Les regions CODESYS suivent la convention documentee (CODE_QUALITY_STANDARDS section 2bis) : format numerote aligne sur les sections du corps, sans style descriptif residuel."
      verified_by: "grep des balises region sur CODE/ : aucune balise sans numerotation (style descriptif)."
    - id: AC7
      statement: "La documentation est coherente : CODE_QUALITY_STANDARDS, NAMING_CONVENTION, PLAN_TASK, VERSION_HISTORY, contrat T123-I refletent l'etat reel du code."
      verified_by: "Revue croisee docs vs code (liens AF, comptes fichiers, statuts lots)."
    - id: AC8
      statement: "Aucune regression de liaison : les instances FB declarees sont appelees, aucun POU orphelin introduit."
      verified_by: "G200_check_linkage.py --report (apres regeneration bundle) — PASS."
    - id: AC9
      statement: "Le rapport de revue est evaluable : verdict par critere (PASS/FAIL/BLOCK), fichier:ligne pour chaque constat, preuve associee."
      verified_by: "Format du rapport : tableau verdict par AC + liste constats fichier:ligne + preuve."

  # ── 3. Perimetre ────────────────────────────────────────────────────────────
  scope:
    allowed:                 # fichiers que la revue PEUT lire/verifier
      - CODE/**/*.st
      - DOC/STDS/CODE_QUALITY_STANDARDS.md
      - DOC/STDS/NAMING_CONVENTION.md
      - DOC/AF/**/*.md
      - DOC/WFLOW/PLAN_TASK.md
      - DOC/VERSION_HISTORY.md
      - DOC/WFLOW/CONTRACTS/TASK_CONTRACT_REFACTOR_DECLARATIONS_I_TRANSLATION.yaml
    forbidden:               # explicitement hors scope — ne pas y toucher
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - CODE_XML/            # regeneration finale, hors revue
      - TOOLS/               # outillage, hors revue
      - tmp/

  # ── 4. Conservation (revue read-only : rien a conserver/modifier) ─────────
  conservation:
    must_survive:
      - "AUCUNE modification de fichier — la revue est READ-ONLY."
      - "Le code executable, les interfaces FB, les valeurs par defaut et les invariants safety."
    dropped_on_purpose: []

  # ── 5. Preuves attendues en restitution ─────────────────────────────────────
  evidence_required:
    - "Comparaison lignes executables HEAD vs working (103 fichiers) : 0 difference logique"
    - "grep REX/date/lot sur CODE/ : 0 resultat"
    - "G200_check_linkage.py --report : PASS (apres regeneration bundle)"
    - "git diff --check : PASS"
    - "Revue ciblee invariants safety (AC3) : PASS/FAIL par FB"
    - "Verification cartouches <=15L + lien AF + emojis whitelist (AC4)"
    - "Verification declarations ordre + tags (AC5)"
    - "Verification regions convention §2bis (AC6)"
    - "Revue coherence documentation (AC7)"

  # ── 6. Modeles autorises ──────────────────────────────────────────────────
  models_allowed:
    - "omni/cc/claude-sonnet-5"
    - "omni/cx/gpt-5.6-terra"

  # ── 7. Devoir d'alerte ─────────────────────────────────────────────────────
  alert_duty: >
    Tout probleme constate (incoherence AF/code, regression de securite, impact
    executable, non-respect standard, lien mort) est remonte IMMEDIATEMENT avec
    fichier:ligne et preuve. La revue est READ-ONLY : signaler, ne pas corriger.
    Ne jamais elargir le scope ni creer de commit.

# ═══════════════════════════════════════════════════════════════════════════
# 🚦 SUIVI DE L'ETAT D'AVANCEMENT
# ═══════════════════════════════════════════════════════════════════════════
status: PENDING               # PENDING | IN_PROGRESS | COMPLETED | VALIDATED

# ── 1. Rapport d'exécution de l'agent revieweur (rempli en fin de revue) ──
execution:
  executed_by: ""
  completed_at: ""
  status: PENDING            # PENDING | COMPLETED | BLOCKED | ALERT_RAISED
  summary: >
    Rapport de revue : verdict par critere (AC1..AC9), constats fichier:ligne,
    preuves, risques identifies, effort estime pour toute correction necessaire.
  evidence_submitted: []

# ── 2. Visa de validation de l'orchestrateur / validateur ──────────────────
validation:
  status: PENDING            # PENDING | APPROVED | REJECTED
  validated_by: ""
  validated_at: ""
  notes: >
    Visa de l'orchestrateur apres lecture du rapport de revue et recettage humain.
