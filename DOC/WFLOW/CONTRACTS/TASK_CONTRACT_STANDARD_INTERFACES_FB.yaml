    NON APPROUVE malgre 8/8 AC : l'arbitrage humain du 2026-08-19 tranche que
    ST_FbStatus est une CIBLE (option A) — les 21 FB standard doivent migrer,
    T137 garde donc son sens. Cet arbitrage fait apparaitre deux defauts que les
    criteres d'acceptation ne pouvaient pas attraper, et que le devoir d'alerte
    (d) aurait du faire remonter :

    CORRECTION 1 — CODE_QUALITY_STANDARDS.md ligne 268.
    La mention "(ou membres equivalents integres au DUT d'etat metier)" institue
    une seconde forme de conformite permanente. Elle choisit implicitement
    l'option B et vide T137 de son objet. A remplacer par une tolerance
    TRANSITOIRE datee : Status : ST_FbStatus est la forme cible ; les FB
    anterieurs exposent encore ces membres a plat, tolerance levee a la cloture
    de T137.

    CORRECTION 2 — TOOLS/AGENT_WORKFLOW/scripts/G315_check_fb_interface.py.
    Defaut fonctionnel : le script detecte les membres A PLAT (regex
    ^\s*<Membre>\s*:) et ignore totalement ST_FbStatus (0 occurrence dans le
    fichier). Consequence mecanique : des qu'un FB migre vers
    Status : ST_FbStatus, ses membres a plat disparaissent, le score tombe a 0/5,
    le FB est classe "light" et le script sort en SUCCES sans rien signaler. Le
    garde-fou est donc incompatible avec la cible qu'il garde et se degrade en
    silence des le premier FB migre. A corriger AVANT le demarrage de T137 :
    reconnaitre Status : ST_FbStatus comme satisfaisant les cinq membres d'etat.

    Le reste du lot (AC1-AC5, AC7, AC8, test unitaire 2/2) est valide en l'etat
    et n'est pas a refaire.

