# ═══════════════════════════════════════════════════════════════════════════
# CONTRAT DE TACHE — Interfaces socle FB (light / standard) + dedup doc
# ═══════════════════════════════════════════════════════════════════════════
#
# Contexte : session d'etude 2026-08-19. Un releve mecanique sur les 53 FB du
# projet montre une distribution BIMODALE des interfaces (21 FB portent le bloc
# d'etat complet, 27 n'en portent aucun, 5 sont en entre-deux). Le standard
# existe donc DEJA de fait — il n'est simplement ecrit nulle part.
# Cette tache l'ECRIT. Elle ne le REINVENTE pas.
#
# Analyse source : DOC/WFLOW/AUDITS/REVUE_CRITIQUE_DESIGN_INTENTION_ARCHITECTURE_v0.1.md
# Prerequis de   : T130 (FB d'intention) — les FB neufs doivent naitre conformes.
#
# Validation : python TOOLS/AGENT_WORKFLOW/scripts/check_task_contract.py DOC/WFLOW/CONTRACTS/TASK_CONTRACT_STANDARD_INTERFACES_FB.yaml
# ═══════════════════════════════════════════════════════════════════════════

contract:
  # ── Identification ────────────────────────────────────────────────────────
  task_id: T136_STANDARD_INTERFACES_FB
  criticality: C2
  strategy: patch

  # ── 1. Objectif ───────────────────────────────────────────────────────────
  objective: >
    Ecrire dans les standards projet les deux contrats d'interface FB deja
    pratiques dans le code (light et standard) et fournir le script qui verifie
    mecaniquement qu'un FB releve de l'un des deux. Aucun comportement machine
    ne change : aucune ligne de CODE/ n'est modifiee par cette tache. L'effet
    attendu est que tout FB ecrit ensuite naisse conforme au lieu d'etre
    rattrape apres coup.

  # ── 2. Criteres testables ─────────────────────────────────────────────────
  # Chaque critere se verifie par UNE commande dont le resultat est oui/non.
  acceptance:
    - id: AC1
      statement: >
        DOC/STDS/CODE_QUALITY_STANDARDS.md decrit un contrat nomme "light"
        dont l'interface se limite a Enable en VAR_INPUT et Ready en VAR_OUTPUT,
        tous deux de type BOOL et hors structure.
      verified_by: >
        grep -n "light" DOC/STDS/CODE_QUALITY_STANDARDS.md retourne la section,
        et son corps contient a la fois "Enable" et "Ready" en BOOL.

    - id: AC2
      statement: >
        Le meme document decrit un contrat nomme "standard" portant en entree
        Enable, Reset et PowerContactorEngaged, et en sortie Ready en BOOL nu
        plus un membre Status de type ST_FbStatus.
      verified_by: >
        grep -n "ST_FbStatus" DOC/STDS/CODE_QUALITY_STANDARDS.md retourne au
        moins une occurrence dans la section standard, et Reset comme
        PowerContactorEngaged y figurent en VAR_INPUT.

    - id: AC3
      statement: >
        Le type ST_FbStatus est documente avec exactement six membres :
        Busy, Done, Error, ErrorId, State, StateAtError — sans ajout ni retrait.
      verified_by: >
        Le bloc STRUCT de ST_FbStatus dans le document compte six lignes de
        declaration, et chacun des six noms y apparait une fois.

    - id: AC4
      statement: >
        DOC/AF/AF_Partie-03_Contrats_Composants_v2.1.md ne recopie plus les
        regles de generation Ladder : les intitules "Rung complet obligatoire"
        et le terme "inVariable" en ont disparu, remplaces par un renvoi vers
        CODE_QUALITY_STANDARDS.md section 11.
      verified_by: >
        grep -c "Rung complet obligatoire\|inVariable" sur AF_Partie-03 retourne 0,
        et grep "CODE_QUALITY_STANDARDS" sur ce meme fichier retourne le renvoi.

    - id: AC5
      statement: >
        CODE_QUALITY_STANDARDS.md ne contient plus deux sections portant le meme
        numero 2bis : la seconde (lisibilite des conditions booleennes) est
        renumerotee et le sommaire eventuel suit.
      verified_by: >
        grep -c "^## 2bis" DOC/STDS/CODE_QUALITY_STANDARDS.md retourne 1.

    - id: AC6
      statement: >
        Un script TOOLS/AGENT_WORKFLOW/scripts/G3xx_check_fb_interface.py classe
        chacun des 53 FB de CODE/ en light, standard ou hors-contrat, affiche les
        trois totaux, et sort en echec uniquement si un FB hors-contrat ne figure
        pas dans sa liste d'exceptions documentee.
      verified_by: >
        python TOOLS/AGENT_WORKFLOW/scripts/G3xx_check_fb_interface.py --report
        affiche des totaux dont la somme vaut le nombre de FB trouves, et sort
        en code 0 sur l'etat actuel du depot.

    - id: AC7
      statement: >
        Les cinq FB aujourd'hui en entre-deux sont listes nommement dans la liste
        d'exceptions du script, chacun avec la raison de sa derogation :
        FB_Output, FB_SimBench, FB_Safety_EmergencyManagementLogic,
        FB_Safety_EmergencyManagementOutput, FB_Joystick.
      verified_by: >
        Les cinq noms apparaissent dans le fichier du script avec un commentaire
        de justification adjacent a chacun.

    - id: AC8
      statement: >
        Les liens inter-documents du depot restent resolvables apres edition.
      verified_by: >
        python TOOLS/AGENT_WORKFLOW/scripts/G340_check_doc_links.py sort sans erreur.

  # ── 3. Perimetre ──────────────────────────────────────────────────────────
  scope:
    allowed:
      - DOC/STDS/CODE_QUALITY_STANDARDS.md
      - DOC/AF/AF_Partie-03_Contrats_Composants_v2.1.md
      - TOOLS/AGENT_WORKFLOW/scripts/G3xx_check_fb_interface.py
      - TOOLS/AGENT_WORKFLOW/tests/test_fb_interface_guard.py
      - DOC/WFLOW/PLAN_TASK.md
    forbidden:
      - CODE/                     # aucune ligne de code automate dans ce lot
      - CODE_XML/                 # bundle non regenere : rien a regenerer
      - DOC/STDS/NAMING_CONVENTION.md   # les NOMS ne sont pas le sujet ici
      - ARCHIVES/
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export

  # ── 4. Contrat de conservation ────────────────────────────────────────────
  conservation:
    must_survive:
      - "Les regles Ladder restent accessibles depuis AF_Partie-03 par un renvoi explicite, jamais supprimees sans remplacement."
      - "Enable et Ready restent des BOOL nus dans les deux contrats : ils n'entrent dans aucune structure."
      - "Les sections existantes de CODE_QUALITY_STANDARDS.md autres que le doublon 2bis gardent leur numerotation."
    dropped_on_purpose:
      - "La recopie des regles Ladder dans AF_Partie-03 : remplacee par un pointeur, cause de derive documentee au REX 2026-07-29."

  # ── 5. Preuves attendues en restitution ───────────────────────────────────
  # Ni check_linkage ni bundle : aucun fichier CODE/ n'est touche par ce lot.
  evidence_required:
    - doc_links                 # sortie de G340_check_doc_links.py
    - fb_interface_report       # sortie de G3xx_check_fb_interface.py --report
    - grep_proofs               # une ligne de preuve grep par critere AC1 a AC5

  # ── 6. Modeles autorises ──────────────────────────────────────────────────
  models_allowed:
    - "omni/cc/claude-sonnet-5"
    - "omni/cx/gpt-5.6-terra"

  # ── 7. Devoir d'alerte ────────────────────────────────────────────────────
  alert_duty: >
    Le perimetre ci-dessus est un cadre, pas une oeuvre fermee. L'agent DOIT
    interrompre et remonter a l'orchestrateur, immediatement et non en fin de
    travail, dans les cas suivants :
    (a) le releve reel des FB contredit les chiffres de reference 21 / 27 / 5 —
        donner les chiffres trouves et la methode, ne pas ajuster le contrat
        en silence pour le faire coller ;
    (b) un sixieme FB en entre-deux apparait, ou l'un des cinq listes se revele
        en fait conforme ;
    (c) une regle deja ecrite ailleurs dans DOC/ contredit un des deux contrats ;
    (d) l'agent voit une meilleure formulation, un meilleur decoupage entre
        CODE_QUALITY_STANDARDS.md et AF_Partie-03, ou un critere d'acceptation
        mieux verifiable que ceux ci-dessus : il le PROPOSE, argumente, et
        attend l'arbitrage. Etre force de proposition fait partie du travail
        attendu ; appliquer un contrat que l'on juge mauvais sans le dire n'en
        fait pas partie.
    Signaler n'est pas elargir le perimetre : aucun fichier hors scope.allowed
    n'est modifie, meme si l'agent a raison sur le fond.

