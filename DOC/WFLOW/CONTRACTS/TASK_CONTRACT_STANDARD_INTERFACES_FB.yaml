  notes: >
    CONTROLE INDEPENDANT — les 8 AC ont ete reverifies sur le git diff reel, pas
    sur le rapport de l'agent (AGENTS.md). Tous PASS. Perimetre respecte : aucun
    fichier CODE/ touche. Le releve 21 / 27 / 5 de l'agent est IDENTIQUE au
