  alert_duty: >
    Signaler immediatement toute ambiguite de classification des causes, tout conflit
    avec la chaine safety ou toute dependance a un bypass de simulation.

context:
  description: >
    Les equipements peuvent publier des defauts transitoires lors de la coupure AU,
    du demarrage CPU et du rearmement puissance (bus EtherCAT/CAN, codeurs, variateurs,
    retours contacteurs). Le besoin est de limiter les acquittements repetitifs sans
    masquer une cause reelle ni provoquer une reprise automatique de mouvement.

scope:
  in_scope:
    - Analyse de FB_Safety_EmergencyManagement, FB_Hmi_BannerFormatter, FB_Encoder_Abs, FB_Diag_Ethercat et FB_Diag_CanOpen.
    - Hierarchisation IHM sans suppression de la cause brute ni inhibition safety.
    - Deux sequences distinctes : AutoReset_Startup et AutoReset_PostPowerRearm.
    - Liste blanche des diagnostics transitoires acquittables.
    - Parametres bornes : activation par phase, 1..3 tentatives, intervalles et stabilisation.
    - Tests separes simulation et voie materielle reelle.
  out_of_scope:
    - Modification de la chaine materielle de securite ou des regles de coupure immediate.
    - Auto-reset de FB_Safety_EmergencyManagement, AU, PowerCutOff, discordance contacteur, frein, securite codeur, defaut mecanique ou mouvement.
    - Redemarrage automatique de mouvement, cycle ou sequence.
    - Bypass EtherCAT permanent ou dependance a un bypass de simulation.

safety_constraints:
  - L auto-reset est un acquittement diagnostique cible, jamais FaultMachineReset_IHM global.
  - La cause brute reste tracee ; seul l ordre de priorite IHM peut etre filtre.
  - Autorisation : AU fermee, PowerCutOff inactif, contacteur attendu, machine immobile, equipement stable et cause transitoire.
  - Annulation immediate si AU, PowerCutOff, discordance, perte puissance, mouvement ou defaut persistant apparait.
  - Compteur et verrouillage apres salve epuisee ; action operateur obligatoire pour un defaut persistant.

parameters:
  AutoResetAtStartupEnable: false
  AutoResetAfterPowerRearmEnable: false
  AutoResetMaxAttempts: 1
  AutoResetInterAttemptTime: 'T#1s'
  AutoResetStabilizationTime: 'T#1s'

objectifs_testables:
  - id: OBJ-01
    description: Classifier les alarmes secondaires generees par AU, demarrage CPU et rearmement puissance.
    critere_succes: Matrice cause racine / alarme / classe acquittable documentee.
    verified_by: Revue code + trace PLC
  - id: OBJ-02
    description: Separer filtrage IHM, suppression de cause et inhibition safety.
    critere_succes: Cause brute conservee et alarme primaire AU prioritaire.
    verified_by: Revue FB_Hmi_BannerFormatter + trace
  - id: OBJ-03
    description: Definir deux automates bornes AutoReset_Startup et AutoReset_PostPowerRearm.
    critere_succes: Chronogrammes distincts, sans reprise de mouvement ni cycle.
    verified_by: Revue architecture + test ST hors CI
  - id: OBJ-04
    description: Tester le demarrage CPU avec une seule sequence maximale autorisee.
    critere_succes: Aucun mouvement ; seuls les diagnostics en liste blanche sont acquittes ; un defaut persistant reste bloquant.
    verified_by: Trace PLC + test unitaire ST hors CI
  - id: OBJ-05
    description: Tester le front de rearmement puissance et la salve temporisee.
    critere_succes: 1 a 3 impulsions maximum, espacees de l intervalle configure, annulees sur cause safety ou mouvement.
    verified_by: Trace PLC simulation et voie reelle
  - id: OBJ-06
    description: Garantir la non-regression entre simulation et materiel reel.
    critere_succes: Aucun bypass permanent ajoute ; voies HwSim et HwReal verifiees separement.
    verified_by: G200 + bundle + essais CODESYS

acceptance_tests:
  - "AC-01: Boot CPU avec defaut transitoire autorise : auto-acquittement borne, aucun mouvement, trace phase/compteur/code."
  - "AC-02: Boot CPU avec AU, PowerCutOff ou discordance active : aucun auto-reset safety, defaut visible et bloquant."
  - "AC-03: Rearmement puissance nominal : stabilisation puis 1..3 impulsions selon parametre."
  - "AC-04: Defaut persistant : salve epuisee, verrouillage et reset operateur obligatoire."
  - "AC-05: AU ou mouvement pendant la fenetre : annulation immediate, aucune reprise automatique."
  - "AC-06: Simulation et reel : diagnostic source separe, aucun bypass permanent requis."

livrables:
