        muette et ne masque aucun doute residuel.
      verified_by: >
        Lecture du livrable : section presente, non vide, chaque entree enoncant
        la question ouverte et la preuve manquante.

    - id: AC14
      statement: >
        Aucun fichier de CODE/ n'est modifie et aucun artefact mecanique n'est
