contract:
  task_id: T354_ASYMETRIE_GARDE_M1_M2
  criticality: C3
  strategy: patch

  objective: >
    Repondre par preuve (et non par deduction) a une seule question de securite
    machine : le scenario « benne occupee (BucketBusy=TRUE) et M2 commande seul
    alors que M1 est gele » est-il ATTEIGNABLE en exploitation reelle, et par
    quel chemin de commande exact ? Le livrable doit rendre la reponse
    verifiable ligne a ligne par un relecteur qui n'a pas lu le code : table de
    verite prouvee, statut de chaque garde traversee en fichier:ligne, verdict
    d'atteignabilite tranche pour les 3 chemins de commande M2, verdict sur le
    mode MAINTENANCE N2 (inhibition d'un treuil, cas d'usage reel de
    l'exploitant), verdict sur le verrou d'atomicite de demarrage couple, et
    doctrine M1 vs M2 SOURCEE ou declaree NON SOURCEE. Aucune ligne de CODE/
    n'est ecrite : les options de correction eventuelles sont documentaires.

  acceptance:
    - id: AC1
      statement: >
        Le livrable contient une table de verite au format demande
        {Mode, BucketBusy, M1 etat, M2 commande possible ?, garde traversee
        fichier:ligne, verdict atteignable OUI/NON}, avec AU MOINS une ligne par
        mode atteignable dans le code (MANU_N1, AUTO_N1, MAINT_N1, MAINT_N2,
        SEMI_AUTO) et une ligne par chemin de commande M2 (joystick-select,
        boutons IHM directs, chemin benne), chacune citant au moins un
        fichier:ligne reel. Les combinaisons non tranchables sont declarees NON
        TRACEES, jamais remplies par deduction.
      verified_by: >
        Lecture du livrable ; recomptage des lignes du tableau ; Select-String de
        chaque fichier:ligne cite sur un echantillon d'au moins 20 references,
        chaque motif devant se trouver a la ligne citee.

    - id: AC2
      statement: >
        Le livrable porte en tete un bloc d'ancrage de revision donnant le commit
        HEAD (git rev-parse HEAD) et le blob SHA (git hash-object) de CHAQUE
        fichier de CODE/ cite, avec horodatage ISO 8601 de la lecture ; aucun
        numero de ligne n'est presente comme valable pour un autre blob.
      verified_by: >
        Recalcul independant par l'orchestrateur : git hash-object sur chaque
        fichier cite doit rendre le blob annonce, et git rev-parse HEAD le commit
        annonce. Tout ecart est un echec.

    - id: AC3
      statement: >
        L'asymetrie est etablie avec precision, en refutant si besoin la
        formulation du brief : la garde « AND NOT Context.BucketBusy » existe au
        gate de FB_WinchCmdArbitrationM1 UNIQUEMENT dans la branche manuelle
        (ELSE du test de mode), et le gate de FB_WinchCmdArbitrationM2 n'en porte
        aucune ; le livrable prouve en outre que M1 n'a AUCUNE garde BucketBusy
        dans sa branche SEMI_AUTO, donc que l'enonce « M1 protege partout / M2
        jamais protege » est faux.
      verified_by: >
        Lecture croisee des deux FB : les lignes citees par le livrable doivent
        contenir l'expression exacte de la garde (gate M1), son absence (gate
        M2) et la ligne du test de mode qui borne la portee de la garde M1.
        Chaque ligne verifiee par Select-String.

    - id: AC4
      statement: >
        Les TROIS chemins de commande M2 identifies sont traces physiquement
        jusqu'a la barriere finale : (a) joystick-select, (b) boutons IHM directs
        BtnAscentM2/BtnDescentM2, (c) chemin benne. Pour chacun, le livrable donne
        la condition d'entree dans le chemin, la ligne de selection de source, le
        gate final et la chaine aval jusqu'a la publication physique vers les
        contacteurs (FB_Winch M2, WinchM2FinalInterlockRequest, barriere finale
        PRG_06). Un chemin non trace rend la conclusion invalide.
      verified_by: >
        Select-String des trois conditions d'entree et de la chaine aval sur les
        fichiers cites ; presence obligatoire des 4 etapes aval
        (assembly ReqM2Winch, appel instWinchM2, publication
        WinchM2FinalInterlockRequest, barriere PRG_06) avec fichier:ligne.

    - id: AC5
      statement: >
        Le mode MAINTENANCE NIVEAU 2 avec inhibition d'un ou plusieurs treuils est
        trace comme mecanisme REEL du code (et non comme hypothese) : variable
        d'etat, ecrivain, ecritoire IHM, condition de mode, exclusion mutuelle,
        et effet de l'inhibition sur les FB du treuil concerne. Le livrable
        tranche explicitement si BucketBusy peut etre TRUE pendant que cette
        inhibition est active, avec la preuve. Si aucun mecanisme d'inhibition
        n'existait dans le code, le livrable devrait le declarer comme constat
        majeur — il doit donc dire lequel des deux cas il a trouve.
      verified_by: >
        Select-String de la variable d'inhibition, de ses ecrivains, de son
        ecritoire IHM et de la ligne qui conserve/enleve l'activation du FB benne
        pendant l'inhibition ; chaque reference citee presente dans le livrable.

    - id: AC6
      statement: >
        Le verrou d'atomicite de demarrage couple est tranche par preuve : le
        livrable dit s'il COUVRE ou NON le scenario « M2 seul commande, benne
        occupee, M1 gele », en citant le gate exact de chaque volet du verrou et
        en prouvant que ces volets sont inactifs dans la configuration du
        scenario. Une reponse « couvre » ou « ne couvre pas » sans cette preuve
        de portee est un echec du critere.
      verified_by: >
        Select-String des gates du verrou (gel des requetes M1/M2 et barriere de
        coherence finale) et de la variable d'intention couplee dont ils
        dependent ; le livrable doit citer la ligne qui rend le verrou inerte
        dans la configuration du scenario.

    - id: AC7
      statement: >
        La garde compensatoire WinchBothMotionBlockedByBucket est reverifiee sur
        le code actuel : le livrable donne sa definition reelle, sa source
        d'armement, et tranche son SENS reel dans le cas du brief (couvre ou ne
        couvre pas le cas BucketBusy=TRUE). Une conclusion qui reprend la
        formulation du brief sans revérifier la logique de la definition est un
        echec.
      verified_by: >
        Select-String de la definition de la variable et de sa source ; le
        livrable doit expliciter la valeur de la variable pour BucketBusy=TRUE et
        pour BucketBusy=FALSE.

    - id: AC8
      statement: >
        La doctrine M1 vs M2 est etablie avec sa source documentaire (spec AF,
        contrat de tache, ou commentaire de code cite fichier:ligne), OU declaree
        explicitement NON SOURCEE si aucune source ne la porte. Aucune
        justification n'est inventee ; toute source citee existe reellement et
        est verifiable.
      verified_by: >
        Lecture du livrable (section doctrine) ; verification par l'orchestrateur
        que chaque source citee existe (chemin de fichier + extrait retrouve par
        Select-String).

    - id: AC9
      statement: >
        Si le scenario est declare atteignable, la chaine de valeurs booleennes
        qui y mene est donnee maillon par maillon avec fichier:ligne, de
        l'armement de BucketBusy jusqu'a la requete de marche M2, en incluant le
        point ou BucketM2RunRequest retombe a FALSE alors que Busy reste TRUE, et
        les gardes qui ne bloquent pas (avec la raison).
      verified_by: >
        Relecture independante des lignes de la chaine par l'orchestrateur
        (au moins 8 references) ; toute garde oubliee qui bloquerait en realite
        invalide le verdict.

    - id: AC10
      statement: >
        Si le scenario est atteignable, le livrable propose 2 a 3 options de
        correction comparees et chiffrees en impact (quels modes/chemins
        supplementaires seraient bloques par chaque option, et quel usage reel
        serait perdu), SANS implementer : aucune ligne de code, aucun diff, aucun
        patch pret a coller, aucune modification de CODE/.
      verified_by: >
        Lecture du livrable (presence des options et du chiffrage par mode) et
        git status --short -- CODE/ vide a la livraison.

    - id: AC11
      statement: >
        Le livrable porte un comptage explicite de ses references fichier:ligne :
        nombre total de references, nombre conformes apres contre-verification,
        nombre hors-borne, et la methode utilisee ; le comptage ne peut pas etre
        nul ni approximatif.
      verified_by: >
        Recomptage independant par l'orchestrateur sur un echantillon d'au moins
        25 references tirees du livrable ; le nombre de references du livrable
        doit etre coherent avec le nombre d'occurrences de motifs fichier:ligne.

    - id: AC12
      statement: >
        Tout ecart entre les references du brief et le code reel est refute par
