      verified_by: >
        Select-String sur les lignes du brief et sur les lignes reelles ; le
        livrable doit citer les deux (annonce vs reel) et l'ecart doit apparaitre
        dans la synthese des constats.

    - id: AC13
      statement: >
        Le livrable contient une section dediee aux limites de la preuve : chaque
        combinaison ou chemin juge non tranchable y est declare NON TRACE avec la
        question ouverte et ce qui manque pour la trancher (ex. cycle de homing
