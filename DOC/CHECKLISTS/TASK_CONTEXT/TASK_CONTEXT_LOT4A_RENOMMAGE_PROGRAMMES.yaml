# ═══════════════════════════════════════════════════════════════════════════
# LOT 4A — RENOMMAGE ET NUMEROTATION DES PROGRAMMES (D-B, D-C)
# ═══════════════════════════════════════════════════════════════════════════
# Decisions humaines du 2026-08 :
#   D-B = OUI  -> tous les programmes portent un prefixe PRG_XX
#   D-C = OK   -> PRG_TROUBLESHOOTING_CFC devient PRG_11_Troubleshooting
#
# Volume mesure : environ 929 references dans CODE/ et 148 dans DOC/ + TOOLS/.
# Le renommage est donc scripte et relu par diff, jamais fait a la main.
#
# PREALABLES BLOQUANTS :
#   - LOT 1 livre  : le gate de structure existe et sert de preuve de fin
#   - LOT 2 livre  : la table de correspondance des 13 noms cibles est en doc
#   - l'agent en cours sur CODE/ a termine et son travail est integre
#
# Ce lot ne traite QUE le renommage. La conversion CFC natif est le LOT 4B.
# Un POU renomme PRG_03_Modes_CFC reste temporairement en ST : c'est un etat
# intermediaire assume et trace, resolu par le LOT 4B.
# ═══════════════════════════════════════════════════════════════════════════

task_id: "LOT4A-RENOMMAGE-PROGRAMMES"
request: >
  Aligner les 13 programmes de CODE/MAIN sur la table de nommage cible : nom de
  fichier egal au nom du POU, prefixe numerique PRG_XX reflet de l'ordre
  MainTask, et suppression du suffixe de langage sur le programme de
  troubleshooting qui n'est ni une page CFC ni une barriere Ladder.
criticality: C4
strategy: patch

scope_code:
  - "CODE/MAIN/*.st (13 programmes)"
  - "CODE/**/*.st (references croisees PRG_*)"
scope_doc:
  - "DOC/PLAN_TASK_v1.0.md"
  - "DOC/VERSION_HISTORY.md"
out_of_scope:
  - "Conversion des pages CFC en .xml natif : LOT 4B"
  - "Modification de la logique metier d'un quelconque POU"
  - "Renommage de FB, DUT, GVL ou variable"
  - "PRJ_CODESYS/PROJ_Full_ImportExport/Device.export"

contract:
  task_id: LOT4A-RENOMMAGE-PROGRAMMES
  criticality: C4
  strategy: patch

  objective: >
    Retablir la lecture de l'ordre d'execution MainTask directement dans le nom
    des programmes, et supprimer le piege de maintenance ou un grep sur un nom de
    fichier ne trouve pas le POU qu'il contient.

  acceptance:
    - id: AC1
      statement: >
        Chaque fichier de CODE/MAIN declare un POU dont le nom est identique au
        nom du fichier, extension exclue.
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py ; zero ecart nom fichier / nom POU"
    - id: AC2
      statement: >
        Les 13 programmes de CODE/MAIN portent un prefixe PRG_XX a deux chiffres
        conforme a la table cible de NAMING_CONVENTION.
      verified_by: "ls CODE/MAIN/PRG_*.st ; les 13 noms correspondent a la table cible du LOT 2"
    - id: AC3
      statement: >
        Le programme de troubleshooting s'appelle PRG_11_Troubleshooting, sans
        suffixe de langage, et reste le producteur unique de GVL_Troubleshooting.
      verified_by: "grep -c 'GVL_Troubleshooting\\.' CODE/MAIN/PRG_11_Troubleshooting.st ; le compte vaut 152, identique a l'etat avant renommage"
    - id: AC4
      statement: >
        Aucune reference croisee PRG_ ne pointe vers un nom de programme qui
        n'existe plus dans CODE/.
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_linkage.py --report ; bloc Auto-verification liaison en PASS"
    - id: AC5
      statement: >
        CODE_Bundle.xml expose exactement 13 POU de type programme, portant les
        noms cibles, et aucun POU sous un ancien nom.
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/generate_codesys_bundle.py . puis grep 'pou name=\"PRG_' CODE/CODE_Bundle.xml ; 13 occurrences, toutes au nom cible"
    - id: AC6
      statement: >
        Les deux barrieres Ladder restent emises en balise LD dans le bundle
        apres renommage.
      verified_by: "grep -A5 'pou name=\"PRG_02_Inputs_LD\"' CODE/CODE_Bundle.xml ; la balise LD est presente, idem pour le programme Outputs"
    - id: AC7
      statement: >
        Le nombre total d'occurrences de noms de programmes dans CODE/ est
        conserve apres renommage, aucune reference n'ayant ete perdue en route.
      verified_by: "comptage avant / apres des occurrences PRG_ dans CODE/ ; ecart nul, ecart justifie ligne a ligne sinon"
    - id: AC8
      statement: >
        Le renommage n'introduit aucune modification de logique : le diff ne
        contient que des changements de nom de programme et de nom de fichier.
      verified_by: "git diff --stat puis relecture du diff ; aucune ligne modifiee hors identifiant de programme"
    - id: AC9
      statement: >
        Le suffixe de chaque programme correspond au langage emis dans le bundle
        a l'etape de migration : chaque _LD source .st est emis en <LD> ; chaque
        _CFC encore source .st est explicitement trace comme etat transitoire
        interdit apres LOT4B, sans pretendre etre deja un CFC natif.
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py ; les seules erreurs S2 restantes citent exclusivement les _CFC attendus au LOT4B, aucune erreur S2 ne cite un _LD"

  scope:
    allowed:
      - CODE/MAIN/
      - CODE/AU/
      - CODE/CODEURS/
      - CODE/COMMUN/
      - CODE/DIAG/
      - CODE/MODES/
      - CODE/SIMULATION/
      - CODE/TRANSLATION/
      - CODE/TREUILS/
      - CODE/SUPERVISION/
      - CODE/CODE_Bundle.xml
      - DOC/PLAN_TASK_v1.0.md
      - DOC/VERSION_HISTORY.md
    forbidden:
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - DOC/NAMING_CONVENTION.md
      - DOC/AF_Partie-02_Architecture_Programme_v3.0.md
      - TOOLS/AGENT_WORKFLOW/scripts/

  conservation:
    must_survive:
      - "PRG_11_Troubleshooting reste en lecture seule : aucune ecriture vers une commande, une configuration ou un interlock."
      - "Le producteur unique de chaque donnee reste le meme POU qu'avant renommage."
      - "Les deux barrieres finales restent les uniques productrices des sorties physiques."
      - "Les 152 ecritures vers GVL_Troubleshooting sont toutes conservees."
      - "L'ordre d'execution effectif dans la MainTask CODESYS reste celui d'avant renommage."
    dropped_on_purpose:
      - "Les anciens noms de POU non numerotes, remplaces sans periode de coexistence."
      - "Le suffixe _CFC sur le programme de troubleshooting, qui n'a jamais designe une page CFC."

  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle

  models_allowed:
    - "omni/cx/gpt-5.6-terra"
    - "omni/cc/claude-sonnet-5"

  alert_duty: >
    Interdiction absolue de faire coexister un ancien et un nouveau nom de
    programme actifs en meme temps, meme temporairement : AF_Partie-02 section 5
    l'interdit et deux producteurs actifs sur la meme donnee est une faute de
    securite machine. Si une reference resiste au renommage scripte, arreter et
    remonter le cas plutot que de laisser un alias en place. Signaler egalement
    tout impact suspecte sur les tags graphiques IHM, avertis par
    NAMING_CONVENTION ligne 321.
