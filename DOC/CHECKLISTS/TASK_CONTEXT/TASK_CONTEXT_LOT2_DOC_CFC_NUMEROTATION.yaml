# ═══════════════════════════════════════════════════════════════════════════
# LOT 2 — DOCUMENTATION : REGLES CFC NATIF + NUMEROTATION
# ═══════════════════════════════════════════════════════════════════════════
# Decisions humaines du 2026-08 :
#   D-A = OUI  -> CFC natif .xml obligatoire pour les pages CFC
#   D-B = OUI  -> numerotation PRG_XX obligatoire sur tous les programmes
#   D-C = OK   -> PRG_11_Troubleshooting (ST, sans suffixe de langage)
#
# Consigne explicite de l'orchestrateur : « il faut corriger en premier la
# documentation et apres faire une revision du code ». Ce lot ne touche donc
# aucun fichier de CODE/.
#
# Constat declencheur : la doc ne dit NULLE PART comment ecrire un CFC natif.
# CODE_QUALITY_STANDARDS §10 donne les regles de cablage mais renvoie comme
# « reference conforme a copier » vers PRG_ACQUISITION_CFC.st, qui est du ST
# sans aucun connecteur, et cite PRG_GLOBAL_CFC.xml / PRG_AU_Acquisition_CFC.xml,
# absents du depot. Les samples CODESYS reels existent pourtant deja dans
# TOOLS/ST_PLCOPENXML_GENERATOR/samples_reference_codesys/ mais aucun document
# de DOC/ ne les mentionne : un agent qui lit DOC/ ne les trouve jamais.
# ═══════════════════════════════════════════════════════════════════════════

task_id: "LOT2-DOC-CFC-NUMEROTATION"
request: >
  Ecrire dans la documentation la procedure de production d'une page CFC native
  au format PLCopenXML, corriger les references mortes de CODE_QUALITY_STANDARDS
  section 10, lever la contradiction de AF_Partie-02 section 4 sur la
  numerotation, et rendre les samples CODESYS de reference atteignables depuis DOC/.
criticality: C3
strategy: patch

scope_code: []
scope_doc:
  - "DOC/AF_Partie-03_Contrats_Composants_v2.0.md"
  - "DOC/AF_Partie-02_Architecture_Programme_v3.0.md"
  - "DOC/CODE_QUALITY_STANDARDS.md"
  - "DOC/NAMING_CONVENTION.md"
  - "DOC/README.md"
  - "DOC/VERSION_HISTORY.md"
out_of_scope:
  - "CODE/** : aucun fichier automate n'est modifie dans ce lot"
  - "Creation des .xml CFC eux-memes (LOT 4)"
  - "Modification des scripts de gate (LOT 1)"

contract:
  task_id: LOT2-DOC-CFC-NUMEROTATION
  criticality: C3
  strategy: patch

  objective: >
    Permettre a un agent qui ne connait pas le projet de produire une page CFC
    native important correctement dans CODESYS, en lisant uniquement DOC/, sans
    avoir a deviner le format ni a retrouver les samples par exploration du depot.

  acceptance:
    - id: AC1
      statement: >
        AF_Partie-03 section 5 contient la procedure d'ecriture d'un CFC natif :
        squelette PLCopenXML, role de inVariable, block, connector, connection,
        role de executionOrderId, et commande de fusion dans le bundle.
      verified_by: "grep -n 'executionOrderId' DOC/AF_Partie-03_Contrats_Composants_v2.0.md ; au moins une occurrence dans une section decrivant la production d'un CFC"
    - id: AC2
      statement: >
        La documentation designe TOOLS/ST_PLCOPENXML_GENERATOR/samples_reference_codesys/PRG_CFC_3FB.xml
        comme exemple de page CFC a trois blocs issu d'un export CODESYS reel.
      verified_by: "grep -rn 'samples_reference_codesys' DOC/ ; au moins une occurrence citant PRG_CFC_3FB.xml"
    - id: AC3
      statement: >
        CODE_QUALITY_STANDARDS section 10 ne renvoie plus vers un fichier .st ni
        vers un .xml absent du depot comme reference de cablage CFC.
      verified_by: "grep -n 'PRG_ACQUISITION_CFC.st\\|PRG_GLOBAL_CFC.xml\\|PRG_AU_Acquisition_CFC.xml' DOC/CODE_QUALITY_STANDARDS.md ; zero occurrence presentee comme reference a copier"
    - id: AC4
      statement: >
        AF_Partie-02 section 4 enonce la numerotation PRG_XX et sa liste d'ordre
        MainTask emploie les memes noms numerotes, sans divergence entre la regle
        et la liste qui l'illustre.
      verified_by: "lecture de DOC/AF_Partie-02_Architecture_Programme_v3.0.md section 4 ; chaque programme du bloc MainTask porte un prefixe PRG_XX"
    - id: AC5
      statement: >
        AF_Partie-02 section 2 attribue au troubleshooting un type et un rang
        d'execution arretes, en remplacement de la mention TBD.
      verified_by: "grep -n 'Troubleshooting' DOC/AF_Partie-02_Architecture_Programme_v3.0.md ; la ligne cite PRG_11_Troubleshooting et ne contient plus TBD"
    - id: AC6
      statement: >
        NAMING_CONVENTION porte une table associant chaque suffixe de programme a
        son langage et a son extension de fichier source, CFC vers .xml, LD vers
        .st converti en Ladder, absence de suffixe vers .st.
      verified_by: "grep -n '_CFC' DOC/NAMING_CONVENTION.md ; une table associe explicitement _CFC a l'extension .xml"
    - id: AC7
      statement: >
        La table de nommage des programmes liste les 13 programmes avec leur nom
        cible numerote, utilisable comme table de correspondance par le LOT 4.
      verified_by: "grep -c 'PRG_' DOC/NAMING_CONVENTION.md ; la table cible contient 13 lignes de programmes"
    - id: AC8
      statement: >
        Aucun lien documentaire mort ni version perimee n'est introduit par les
        modifications de ce lot.
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_doc_links.py ; sortie PASS"

  scope:
    allowed:
      - DOC/AF_Partie-03_Contrats_Composants_v2.0.md
      - DOC/AF_Partie-02_Architecture_Programme_v3.0.md
      - DOC/CODE_QUALITY_STANDARDS.md
      - DOC/NAMING_CONVENTION.md
      - DOC/README.md
      - DOC/VERSION_HISTORY.md
    forbidden:
      - CODE/
      - TOOLS/AGENT_WORKFLOW/scripts/
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export

  conservation:
    must_survive:
      - "Les 4 regles de cablage CFC de CODE_QUALITY_STANDARDS section 10 (connecteur dedie, position non nulle, disposition en colonnes, aucune logique metier) restent enoncees et opposables."
      - "La regle d'ordonnancement inter-programmes reste enoncee dans AF_Partie-02 section 4."
      - "Les 7 points de validation TC-P02 et TC-P03 restent presents et numerotes a l'identique."
    dropped_on_purpose:
      - "La mention TBD du troubleshooting dans AF_Partie-02 section 2, arbitree en PRG_11_Troubleshooting."
      - "Le renvoi de CODE_QUALITY_STANDARDS section 10 vers des fichiers inexistants ou non CFC."

  evidence_required:
    - check_doc_links
    - run_all_gates

  models_allowed:
    - "omni/cc/claude-sonnet-5"
    - "omni/cx/gpt-5.6-terra"

  alert_duty: >
    Si la redaction de la procedure CFC revele que le format attendu par CODESYS
    differe de ce que produisent les samples de reference, arreter et remonter le
    point a l'orchestrateur. Ecrire une procedure non verifiee sur un export reel
    ferait entrer une deuxieme source d'erreur dans la documentation.
