contract:
  task_id: AF02_AF03_ARCHITECTURE_EXTRACTION
  criticality: C3
  strategy: rebuild
  objective: >
    Preserver les exigences d'architecture et de contrat FB utiles a la future
    orchestration CFC, sans reprendre les propositions d'audit non validees ni
    modifier le comportement automate actuel.
  acceptance:
    - id: AC1
      statement: "Les extractions separent les invariants a conserver des decisions CFC/DUT a valider."
      verified_by: "Relecture des sections Statut, A conserver et Alertes des deux fiches."
    - id: AC2
      statement: "Les contradictions entre les propositions CFC, les specifications actives et le code observe sont explicites."
      verified_by: "Relecture des alertes et des references CODE/AUDITS citees dans les deux fiches."
    - id: AC3
      statement: "Les extractions ne modifient ni AF02, ni AF03, ni les sources ST."
      verified_by: "git diff --name-only limite aux fiches et au contrat de tache."
  scope:
    allowed:
      - DOC/CHECKLISTS/EXTRACTIONS/AF_Partie-02_Extraction_Architecture_v1.0.md
      - DOC/CHECKLISTS/EXTRACTIONS/AF_Partie-03_Extraction_Contrat_FB_v1.0.md
      - DOC/CHECKLISTS/TASK_CONTEXT/TASK_CONTEXT_AF02_AF03_EXTRACTION.yaml
    forbidden:
      - DOC/AF_Partie-02_Architecture_Programme_v3.0.md
      - DOC/AF_Partie-03_Contrats_Composants_v2.0.md
      - CODE/
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
  conservation:
    must_survive:
      - "Un seul producteur par donnee et une frontiere explicite entre producteur et consommateur."
      - "CFC de cablage visuel sans logique metier cachee ; FB par composition et responsabilite unique."
      - "Precedence Enable > SafeStop > StartStop, Reset sur front et absence de redemarrage automatique apres defaut."
      - "La tache, l'ordre d'execution et le rattachement des programmes restent explicitement verifiables."
      - "Les structures IHM Cmd/State/Cfg/Bypass restent un contrat distinct des bus internes."
    dropped_on_purpose:
      - "Le statut definitif des propositions CFC/BUS/DUT des audits, qui n'a pas ete valide par une decision d'architecture."
      - "Les noms, contenus et nombres de bus proposes avant specification du contrat de chaque frontiere."
  evidence_required:
    - task_contract
    - check_doc_links
    - git_diff_check
  models_allowed:
    - "openai/gpt-5.6-terra"
  alert_duty: >
    Toute confusion entre etat actuel, cible envisagee et exigence validee est
    signalee avant de devenir une norme documentaire ou une modification code.
