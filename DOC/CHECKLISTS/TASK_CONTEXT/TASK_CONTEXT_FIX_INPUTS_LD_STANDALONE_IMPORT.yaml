contract:
  task_id: FIX_INPUTS_LD_STANDALONE_IMPORT
  criticality: C3
  strategy: patch
  objective: "Produire un PLCopenXML individuel PRG_INPUTS_LD importable dans CODESYS et prouver que le POU Ladder est sélectionnable, sans modifier sa logique ST."
  acceptance:
    - id: AC1
      statement: "Un fichier CODE/MAIN/PRG_INPUTS_LD.xml contient exactement le POU PRG_INPUTS_LD avec un corps LD natif et les en-têtes PLCopenXML requis."
      verified_by: "XML parse + inspection pou/LD"
    - id: AC2
      statement: "Le POU individuel provient du même générateur LD que CODE_Bundle.xml, sans différence de logique ou de réseaux Ladder."
      verified_by: "comparaison canonique du fragment pou individuel avec le fragment bundle"
    - id: AC3
      statement: "Le bundle global ne contient pas deux POU PRG_INPUTS_LD."
      verified_by: "test de couverture bundle"
    - id: AC4
      statement: "Un test automatisé échoue si le XML individuel PRG_INPUTS_LD est absent, sans LD ou différent du fragment bundle."
      verified_by: "pytest ajouté"
    - id: AC5
      statement: "Le nom de fichier est identique au nom de POU et le suffixe de langage est identique au langage généré dans le bundle : PRG_INPUTS_LD.xml contient le POU PRG_INPUTS_LD en LD."
      verified_by: "check_bundle_main_coverage.py --report + XML parse"
  scope:
    allowed:
      - TOOLS/AGENT_WORKFLOW/scripts/
      - TOOLS/AGENT_WORKFLOW/tests/
      - CODE/MAIN/PRG_INPUTS_LD.xml
      - CODE/CODE_Bundle.xml
      - DOC/CHECKLISTS/TASK_CONTEXT/TASK_CONTEXT_FIX_INPUTS_LD_STANDALONE_IMPORT.yaml
    forbidden:
      - CODE/MAIN/PRG_INPUTS_LD.st
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
  conservation:
    must_survive:
      - "La logique Ladder et les 21 entrées qualifiées existantes sont strictement inchangées."
  evidence_required:
    - tests-added
    - bundle
    - commands-run
  models_allowed:
    - "omni/cx/gpt-5.6-terra"
  alert_duty: "Ne jamais créer un second POU homonyme dans le bundle; signaler toute incompatibilité PLCopen."