out_of_scope:
  - "Relais temporisés ou interverrouillage matériel à ajouter dans l'armoire"
  - "Réglage terrain des temporisations"
  - "T91/T93/T87 : stratégie mécanique détaillée frein/puissance en charge, DelayMotorDecel et loi de rampe/calibration"
  - "T94/T95 et activation du garde-fou vitesse T47"
acceptance_criteria:
  - "PRG_00 publie une seule fois M1/M2/M3BrakeCommandOpenConfirmed, issus des DI filtrés à polarité positive."
  - "Le watchdog final frein est interne et fixe à T#500ms ; il démarre exclusivement par BrakeReleaseRequest et ne connaît pas la pré-magnétisation."
  - "Les réglages normaux respectent DelayMagnetise <= T#400ms et BrakeFeedbackTimeout < T#500ms."
  - "FB_WinchOutputInterlock_LD est le marqueur explicite de la chaîne finale visualisable Ladder."
  - "La barrière finale est l'unique productrice des sorties relais vitesse M1/M2 dans PRG_10_Outputs_LD."
  - "Toutes les 15 instances FB_Output sont retirées ; aucune instance FB_Output ne reste appelée."
  - "RequestedStep 0→5 progresse par pas adjacents, au moins T#1s250 entre augmentations ; le métier impose au moins T#1s500."
  - "Après arrêt M1/M2 et FwdRevSpeedFeedbackOff, l'interlock impose T#900ms ; FB_Winch impose T#1s500ms entre hausses de paliers en nominal."
  - "M1/M2 : aucun contacteur vitesse C1..C4 avant frein ouvert confirmé ; pré-magnétisation métier non gérée par l'interlock."
  - "M3 : FB_TranslationOutputInterlock_LD est l'unique producteur final AC600/frein ; DriveControlWord de mouvement et fréquence sont nuls tant que M3BrakeCommandOpenConfirmed est FALSE. Après timeout : Reset + mot 0 neutre + nouvelle demande 1/2 obligatoires."
  - "Le convertisseur PLCopenXML convertit uniquement PROGRAM PRG_*_LD en Ladder ; FB_*_LD reste ST."
  - "Sur timeout frein, perte Enable, EmergencyStopOk/AU ou défaut final : mouvement coupé et frein serré. SafeStop reste une rampe rapide produite par FB_Winch/FB_Translation avec Enable maintenu ; l'interlock laisse passer cette décélération jusqu'à demande métier nulle. Le timeout mémorise le défaut à travers Enable/AU ; après cause disparue + Reset sur front, la demande doit passer à zéro puis être redemandée avant reprise."
  - "États, raisons et temporisations sont visibles IHM et lecture seule dans PRG_11."
tests_required:
  - "Treuil : demande 0→5, progression métier 0→1→2→3→4→5 à T#1s500ms puis barrière finale à T#1s250ms."
  - "Treuil : redémarrage/inversion, retour retombé et délai 900ms obligatoire."
  - "Frein M1/M2/M3 : timeout 500ms après BrakeReleaseRequest, arrêt et défaut mémorisé."
  - "M3 : aucune fréquence ni mot de marche tant que frein non confirmé ouvert, Enable=FALSE ou EmergencyStopOk=FALSE ; SafeStop reste la décélération rapide amont. Post-timeout, demande 1 maintenue reste inhibée jusqu'au neutre puis nouvelle demande."
  - "Perte Enable ou EmergencyStopOk : coupure immédiate de toutes sorties moteur."
  - "SafeStop : l'interlock ne coupe pas le frein ni les commandes tant que la demande métier issue de la rampe rapide n'est pas tombée à zéro."
  - "FB_Winch : test end-to-end de la temporisation métier T#1s500ms, RequestedStep versus StepNumber, sans saut."
tests_automated_required: true
tests_implementation_paths:
