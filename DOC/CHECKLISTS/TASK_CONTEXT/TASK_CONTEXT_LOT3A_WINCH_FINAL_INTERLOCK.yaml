task_id: "LOT3A-FINAL-BRAKE-POWER-INTERLOCK"
request: "Ajouter des barrières finales frein/puissance cohérentes M1/M2/M3 : paliers et redémarrage treuils, absence de couple M3 frein serré, watchdog autonome 500 ms après ordre de desserrage."
