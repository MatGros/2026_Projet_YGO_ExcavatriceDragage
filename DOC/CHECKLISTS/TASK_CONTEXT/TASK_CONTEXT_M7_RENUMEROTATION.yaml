contract:
  task_id: M7_RENUMEROTATION
  criticality: C3
  strategy: patch
  human_validation_required: true

  objective: >
    Finaliser les sept POU ordonnés 01 à 07 et supprimer les derniers noms et
    producteurs historiques seulement après preuve d'absence de cycle inter-programme.

  acceptance:
    - id: AC1
      statement: "Les seuls programmes applicatifs CODE/MAIN sont PRG_01_Inputs_LD, PRG_02_Acquisition_CFC, PRG_03_Modes_Cycle_CFC, PRG_04_Treuils_Benne_CFC, PRG_05_Translation_CFC, PRG_06_Outputs_LD et PRG_07_Supervision_CFC."
      verified_by: "grep '^PROGRAM ' CODE/MAIN/*.st + inspection des POU XML dans CODE/CODE_Bundle.xml"
    - id: AC2
      statement: "check_linkage.py --report ne signale aucun cycle inter-programme avant tout renommage, puis après remappage de chaque consommateur; toute occurrence de cycle verrouille M7."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_linkage.py --report exécuté avant et après migration"
    - id: AC3
      statement: "Aucun ancien et nouveau producteur ne coexistent pour Auth, CmdReset, PowerCutOff, interlocks finaux, commandes cycle, diagnostics ou sorties physiques."
      verified_by: "check_linkage.py --report + audit producteurs par symbole dans le diff"
    - id: AC4
      statement: "Toutes les références POU, noms PROGRAM/pou, documentation d'architecture et ordre MainTask sont remappés sur les sept noms cibles sans changer la sémantique des liaisons."
      verified_by: "grep des noms historiques + inspection humaine CODESYS de l'ordre MainTask et des fils importés"
    - id: AC5
      statement: "Le nom de chaque fichier cible est identique au nom de POU correspondant: PRG_01_Inputs_LD.st, PRG_02_Acquisition_CFC.xml, PRG_03_Modes_Cycle_CFC.xml, PRG_04_Treuils_Benne_CFC.xml, PRG_05_Translation_CFC.xml, PRG_06_Outputs_LD.st et PRG_07_Supervision_CFC.xml."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py"
    - id: AC6
      statement: "Le suffixe correspond au langage généré dans le bundle: .st pour Ladder POU 01/06 et .xml pour CFC POU 02/03/04/05/07."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py + inspection CODE/CODE_Bundle.xml"
    - id: AC7
      statement: "L'import CODESYS humain confirme les sept POU, l'ordre MainTask, les fils visibles et l'absence de valeur scan précédent sur Reset, SafeStop, PowerCutOff, commande ou sortie."
      verified_by: "validation humaine CODESYS consignée avec captures/notes par POU"

  scope:
    allowed:
      - CODE/MAIN/PRG_INPUTS_LD.st
      - CODE/MAIN/PRG_01_Inputs_LD.st
      - CODE/MAIN/PRG_02_Acquisition_CFC.xml
      - CODE/MAIN/PRG_03_Modes_Cycle_CFC.xml
      - CODE/MAIN/PRG_04_Treuils_Benne_CFC.xml
      - CODE/MAIN/PRG_05_Translation_CFC.xml
      - CODE/MAIN/PRG_06_Outputs_LD.st
      - CODE/MAIN/PRG_07_Supervision_CFC.xml
      - DOC/AF_Partie-02_Architecture_Programme_v3.0.md
      - DOC/AUDITS/Architecture/REGISTRE_ARBITRAGES_MIGRATION.md
      - CODE/CODE_Bundle.xml
    forbidden:
      - CODE/MAIN/PRG_ACQUISITION_CFC.st
      - CODE/MAIN/PRG_01_Diagnostics.st
      - CODE/MAIN/PRG_02_Encoders.st
      - CODE/MAIN/PRG_AUXILIARY_CFC.st
      - CODE/MAIN/PRG_MODES_CFC.st
      - CODE/MAIN/PRG_05_Cycle.st
      - CODE/MAIN/PRG_SAFETY_CFC.st
      - CODE/MAIN/PRG_TREUILS_CFC.st
      - CODE/MAIN/PRG_TRANSLATION_CFC.st
      - CODE/MAIN/PRG_OUTPUTS_LD.st
      - CODE/MAIN/PRG_SUPERVISION_CFC.st
      - CODE/MAIN/PRG_TROUBLESHOOTING_CFC.st
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - .git/

  conservation:
    must_survive:
      - "Ordre topologique 01 Inputs, 02 Acquisition, 03 Modes/Cycle, 04 Treuils/Benne, 05 Translation, 06 Outputs, 07 Supervision."
      - "Outputs unique producteur des commandes physiques d'actionneur; les presets codeur A-12 restent l'exception documentée."
      - "Reset sur front, pas de redémarrage automatique, AU matériel indépendant et PowerCutOff agrégé par OU."
      - "Aucun retard de scan ajouté à Reset, SafeStop, PowerCutOff, commande ou sortie."
      - "Les 5 CFC XML sont importés sans ST CFC concurrent; les POU 01/06 restent Ladder."
    dropped_on_purpose:
      - "Noms, fichiers et POU historiques après que chaque consommateur a été remappé et que zéro cycle est prouvé."
      - "Écart historique PRG_OUTPUTS_LD.st/PROGRAM PRG_10_Outputs_LD, remplacé par le nom unique PRG_06_Outputs_LD."

  decision_references:
    - "A-01: homing demeure rang 04 avec Treuils, pas rang 02."
    - "A-02: EncoderUnsafe reste rang 02 avant Modes."
    - "A-03: CmdReset reste rang 02, jamais Supervision rang 07."
    - "A-04: Outputs rang 06 agrège PowerCutOff par OU."
    - "A-05: safety est localisée dans le domaine qui subit l'interdiction."
    - "A-06: état AU acquisition, action barrière Outputs, chaîne matérielle indépendante."
    - "A-07: dette BrakeCmd est conservée et non résolue par renommage."
    - "A-08: Supervision fusionnée est lecture seule."
    - "A-09: source encodeur qualifiée retenue."
    - "A-10: raccordement HwIn reste prouvé par validation CODESYS."
    - "A-11: aucune safety transverse sans contrat public ne subsiste."
    - "A-12: presets encodeur restent exception documentée aux sorties Outputs."

  evidence_required:
    - check_code_structure
    - check_linkage
    - check_cfc_wiring
    - bundle
    - run_all_gates
    - human_validation_notes

  models_allowed:
    - "omni/cx/gpt-5.6-terra"
    - "omni/cc/claude-sonnet-5"

  alert_duty: >
    M7 est verrouillé au premier cycle, producteur dupliqué, lien CODESYS non
    prouvé ou différence d'ordre MainTask; ne jamais renommer pour masquer un flux.
