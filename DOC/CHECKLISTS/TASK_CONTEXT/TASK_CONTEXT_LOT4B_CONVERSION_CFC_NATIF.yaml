# ═══════════════════════════════════════════════════════════════════════════
# LOT 4B — CONVERSION DES PAGES CFC EN XML NATIF (D-A)
# ═══════════════════════════════════════════════════════════════════════════
# Decision humaine du 2026-08 :
#   D-A = OUI -> les programmes suffixes _CFC deviennent des CFC natifs .xml
#
# Etat de depart mesure : les 8 POU suffixes _CFC sont emis en balise <ST> dans
# CODE_Bundle.xml. Le generateur ne possede aucun chemin ST vers CFC
# (xml_builder.py ligne 209 ne traite que PROGRAM PRG_*_LD). Le suffixe _CFC
# n'a donc jamais rien produit d'autre que du ST.
#
# CONSEQUENCE STRUCTURANTE : une page CFC se dessine dans CODESYS, elle ne se
# genere pas depuis du ST. Ce lot est donc un lot A DOMINANTE HUMAINE, decoupe
# page par page, avec un import CODESYS reel entre chaque page. Un agent ne
# valide jamais seul une page CFC.
#
# PREALABLES BLOQUANTS :
#   - LOT 2 livre  : la procedure d'ecriture CFC natif est en documentation
#   - LOT 4A livre : les programmes portent deja leur nom cible
#   - check_cfc_wiring.py branche dans run_all_gates.py (LOT 1)
#
# ORDRE IMPOSE, du moins couplé au plus couplé :
#   1. PRG_XX_Auxiliary_CFC       (6 references)
#   2. PRG_XX_Translation_CFC     (31)
#   3. PRG_XX_Supervision_CFC     (52)
#   4. PRG_XX_Acquisition_CFC     (66)
#   5. PRG_XX_Safety_CFC          (91)
#   6. PRG_XX_Modes_CFC           (105)
#   7. PRG_XX_Treuils_CFC         (172)
# Une page livree, importee et confirmee par l'humain avant la suivante.
# ═══════════════════════════════════════════════════════════════════════════

task_id: "LOT4B-CONVERSION-CFC-NATIF"
request: >
  Convertir les pages CFC du projet en fichiers PLCopenXML natifs importables
  dans CODESYS, une page a la fois, en respectant les regles de cablage de
  CODE_QUALITY_STANDARDS section 10 et la procedure ecrite au LOT 2.
criticality: C4
strategy: rebuild

scope_code:
  - "CODE/MAIN/PRG_*_CFC.xml (nouveaux, une page par etape)"
  - "CODE/MAIN/PRG_*_CFC.st (retires au fur et a mesure)"
  - "TOOLS/ST_PLCOPENXML_GENERATOR/generator/file_discovery.py"
scope_doc:
  - "DOC/PLAN_TASK_v1.0.md"
  - "DOC/VERSION_HISTORY.md"
out_of_scope:
  - "Toute modification de la logique metier a l'occasion de la conversion"
  - "Les programmes ST et LD, qui ne sont pas concernes par la conversion"
  - "Renommage ou renumerotation : traite au LOT 4A"

contract:
  task_id: LOT4B-CONVERSION-CFC-NATIF
  criticality: C4
  strategy: rebuild

  objective: >
    Rendre les pages d'orchestration reellement lisibles en Continuous Function
    Chart dans CODESYS, afin qu'un technicien de maintenance suive le flux
    acquisition vers decision vers mouvement vers sortie sur un schema graphique
    au lieu d'un texte structure etiquete CFC.

  acceptance:
    - id: AC1
      statement: >
        La page convertie est emise en balise CFC dans CODE_Bundle.xml, la ou
        elle etait emise en balise ST avant conversion.
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/generate_codesys_bundle.py . puis inspection du POU converti dans CODE/CODE_Bundle.xml ; la balise CFC est presente"
    - id: AC2
      statement: >
        Chaque connecteur de la page possede une position non nulle et distincte
        de celle des autres connecteurs de la meme page.
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_cfc_wiring.py --report ; zero connecteur en position 0,0 et zero doublon de position"
    - id: AC3
      statement: >
        Chaque connecteur de la page est reference par au moins une connexion, ce
        qui exclut les connecteurs orphelins jamais consommes.
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_cfc_wiring.py --report ; controle W3 sans anomalie"
    - id: AC4
      statement: >
        La page importee dans CODESYS affiche des liens visibles entre les blocs,
        constat fait par l'humain sur le projet reel.
      verified_by: "import PLCopenXML dans CODESYS 3.5 par l'operateur, puis confirmation ecrite que les fils sont visibles"
    - id: AC5
      statement: >
        La page ne contient aucune structure conditionnelle ni calcul inline, la
        logique restant portee par les blocs fonctionnels instancies.
      verified_by: "inspection du .xml de la page ; aucune balise portant une expression IF ou un calcul, conformement a TC-P02-002"
    - id: AC6
      statement: >
        Les instances presentes dans la page convertie sont exactement celles
        declarees dans la version ST d'origine, ni ajoutees ni supprimees.
      verified_by: "comparaison de la liste des instances entre l'ancien .st et le nouveau .xml ; listes identiques"
    - id: AC7
      statement: >
        Les liaisons entre instances de la page convertie reproduisent les
        affectations de la version ST d'origine, champ par champ.
      verified_by: "table de correspondance affectation ST vers connexion CFC, produite en restitution, une ligne par liaison"
    - id: AC8
      statement: >
        Aucune reference croisee vers la page convertie n'est cassee apres
        conversion.
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_linkage.py --report ; bloc Auto-verification liaison en PASS"
    - id: AC9
      statement: >
        Le generateur de bundle integre le .xml natif de la page sans le
        reconstruire depuis du ST.
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/generate_codesys_bundle.py . ; la page apparait dans le bundle et aucun .st homonyme ne subsiste dans CODE/MAIN"
    - id: AC10
      statement: >
        Le nom du fichier source CFC est identique au nom du POU qu'il declare,
        avec l'extension .xml, et son suffixe _CFC correspond au langage CFC,
        emis en balise <CFC> dans le bundle final.
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py ; aucune erreur S1 ou S2 ne cite la page CFC convertie"

  scope:
    allowed:
      - CODE/MAIN/
      - CODE/CODE_Bundle.xml
      - TOOLS/ST_PLCOPENXML_GENERATOR/generator/file_discovery.py
      - DOC/PLAN_TASK_v1.0.md
      - DOC/VERSION_HISTORY.md
    forbidden:
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - CODE/AU/
      - CODE/TREUILS/
      - CODE/TRANSLATION/
      - CODE/CODEURS/
      - DOC/CODE_QUALITY_STANDARDS.md
      - TOOLS/AGENT_WORKFLOW/scripts/

  conservation:
    must_survive:
      - "Chaque instance declaree dans la version ST de la page est instanciee dans la page CFC, avec le meme nom d'instance."
      - "Chaque affectation entre instances de la version ST devient une connexion equivalente dans la page CFC."
      - "Le producteur unique de chaque donnee publiee par la page reste inchange."
      - "Les sorties publiques VAR_OUTPUT de la page restent exposees sous le meme nom et le meme type, les consommateurs n'etant pas modifies."
      - "L'ordre d'execution des blocs reste conforme au flux de donnees d'origine, materialise par executionOrderId."
    dropped_on_purpose:
      - "Le fichier .st de la page, remplace par le .xml natif sans coexistence des deux sources."
      - "La mise en forme textuelle et les commentaires de bloc propres au ST, remplaces par les commentaires graphiques CFC."

  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle

  models_allowed:
    - "omni/cc/claude-sonnet-5"
    - "omni/cx/gpt-5.6-terra"

  alert_duty: >
    Une page CFC est un livrable de securite machine : elle porte le cablage reel
    entre acquisition, safety et sorties. Si une affectation de la version ST
    n'a pas de traduction evidente en connexion CFC, arreter et remonter le cas.
    Aucune liaison ne doit etre deduite ni inventee. Ne jamais convertir plus
    d'une page avant confirmation d'import CODESYS reussie par l'operateur.
