contract:
  task_id: C4-1-CONTRATS-PUBLICS
  criticality: C4
  strategy: rebuild
  objective: >
    Construire les frontieres publiques CmdReset, diagnostic, etat codeur,
    safety pre-mouvement, etat mouvement et etat sortie necessaires pour couper
    les cycles inter-programmes sans retard de scan safety.
  acceptance:
    - id: AC1
      statement: "CmdReset possede un producteur unique avant Safety, mouvements et Outputs, et chaque consommateur traite Reset sur front."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_linkage.py --report ; aucune reference Reset vers Supervision"
    - id: AC2
      statement: "EncoderUnsafe = NOT EncoderAvailable OR EncoderIncoherent est produit avant Modes et consomme exclusivement par FB_Modes pour autoriser SEMI_AUTO."
      verified_by: "grep -rn 'EncoderUnsafe' CODE/ ; le producteur et FB_Modes sont les seules references de ce predicat"
    - id: AC3
      statement: "Safety pre-mouvement produit SafeStop et PowerCutOff depuis des faits qualifies sans lire direction, relais, benne, frein ou etat de mouvement courant."
      verified_by: "grep -rn -E 'PRG_TREUILS|PRG_TRANSLATION' CODE/MAIN/PRG_SAFETY_CFC.st ; aucune lecture post-mouvement dans la branche safety pre"
    - id: AC4
      statement: "Les contrats publics remplacent les acces PRG_Xxx.instFb.Champ entre programmes pour Diagnostics et Codeurs, sans ancien et nouveau producteur actifs simultanement."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_linkage.py --report ; zero acces croise aux internes concernees"
    - id: AC5
      statement: "Les sorties physiques restent uniquement produites par Outputs Ladder et Troubleshooting reste lecture seule."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_linkage.py --report ; sorties et troubleshooting sans ecriture interdite"
    - id: AC6
      statement: "Le nom de fichier est identique au nom de POU pour chaque POU cree ou renomme, et le suffixe est identique au langage genere dans le bundle."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py ; aucune erreur S1 ou S2 sur les POU C4.1"
  scope:
    allowed:
      - CODE/MAIN/
      - CODE/COMMUN/
      - CODE/CODEURS/
      - CODE/DIAG/
      - CODE/MODES/
      - CODE/TREUILS/
      - CODE/TRANSLATION/
      - CODE/SUPERVISION/
      - DOC/AUDITS/Architecture/
      - DOC/AF_Partie-02_Architecture_Programme_v3.0.md
      - DOC/AF_Partie-03_Contrats_Composants_v2.0.md
      - DOC/PLAN_TASK_v1.0.md
      - DOC/VERSION_HISTORY.md
    forbidden:
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - TOOLS/
  conservation:
    must_survive:
      - "Reset sur front et aucun redemarrage automatique."
      - "Aucun retard scan Reset, SafeStop, PowerCutOff, commande ou sortie."
      - "Outputs LD seul producteur Q/PDO."
    dropped_on_purpose:
      - "Cycles inter-programmes et acces aux internes d'instances."
  evidence_required:
    - check_linkage
    - bundle
    - run_all_gates
  models_allowed:
    - "omni/cx/gpt-5.6-terra"
    - "omni/cc/claude-sonnet-5"
  alert_duty: >
    Arreter et signaler toute interface ou semantique safety non prouvee. Ne pas
    inventer de champ DUT ni de retard de scan pour faire passer un cablage.
