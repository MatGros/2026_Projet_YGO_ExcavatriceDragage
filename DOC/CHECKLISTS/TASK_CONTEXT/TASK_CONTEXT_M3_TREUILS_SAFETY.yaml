contract:
  task_id: M3_TREUILS_SAFETY
  criticality: C4
  strategy: rebuild
  human_validation_required: true

  objective: >
    Réunir Treuils, Benne, homing et safety M1/M2 au rang 04 pour supprimer le
    cycle Safety↔Treuils tout en conservant les interdictions et coupures des deux treuils.

  acceptance:
    - id: AC1
      statement: "PRG_04_Treuils_Benne_CFC câble localement FB_Safety_Winch M1/M2, moniteurs vitesse, estimateurs charge, synchronisation, benne, extraction, plongeon, FB_Winch M1/M2, homing et leurs adaptateurs."
      verified_by: "check_cfc_wiring.py --report + inspection indépendante du câblage XML"
    - id: AC2
      statement: "Les mécanismes Méca A à E M1/M2, bits 14/15, ForbidAscent, ForbidDescent, SafeStop, limites câble, synchronisation, offset benne et arrêt immédiat de fin benne conservent leur polarité, seuil, temporisation et ErrorId."
      verified_by: "tests PLC ciblés par mécanisme + revue humaine CODESYS des scénarios safety et des valeurs ErrorId"
    - id: AC3
      statement: "Aucun cycle inter-programme Safety↔Treuils ni ancien producteur Safety M1/M2 ne subsiste; les demandes vers Outputs sont exactement deux ST_WinchFinalInterlockRequest et deux demandes PowerCutOff publiées."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_linkage.py --report + audit producteurs"
    - id: AC4
      statement: "Le homing et les six commandes preset codeur sont portés par Treuils, sans transfert aux sorties actionneur Outputs; HomingSuspect invalide toujours position et vitesse sans participer à EncoderUnsafe pré-Modes."
      verified_by: "grep des six symboles COD1/COD2 et contrats homing + essais CODESYS de référencement M1/M2"
    - id: AC5
      statement: "Reset reste sur front local et aucun défaut treuil ne provoque de redémarrage automatique."
      verified_by: "essai humain CODESYS: défaut safety, disparition cause, absence de reprise, puis appui Reset conscient"
    - id: AC6
      statement: "Le nom de fichier est identique au nom de POU: PRG_04_Treuils_Benne_CFC.xml / PRG_04_Treuils_Benne_CFC."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py"
    - id: AC7
      statement: "Le suffixe correspond au langage CFC généré dans le bundle: .xml pour PRG_04_Treuils_Benne_CFC."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py + inspection CODE/CODE_Bundle.xml"

  scope:
    allowed:
      - CODE/MAIN/PRG_TREUILS_CFC.st
      - CODE/MAIN/PRG_SAFETY_CFC.st
      - CODE/MAIN/PRG_04_Treuils_Benne_CFC.xml
      - CODE/TREUILS/ST_WinchSafetyState.st
      - CODE/TREUILS/ST_TreuilsBenneState.st
      - CODE/TREUILS/FB_TreuilsBenneArbiter.st
      - CODE/TREUILS/FB_TreuilsSafetyCoupling.st
      - CODE/TREUILS/FB_WinchRequestPublisher.st
      - CODE/COMMUN/ST_EncoderMeasurements.st
      - DOC/AUDITS/Architecture/REGISTRE_ARBITRAGES_MIGRATION.md
      - CODE/CODE_Bundle.xml
    forbidden:
      - CODE/MAIN/PRG_TRANSLATION_CFC.st
      - CODE/MAIN/PRG_OUTPUTS_LD.st
      - CODE/MAIN/PRG_SUPERVISION_CFC.st
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - .git/

  conservation:
    must_survive:
      - "Les deux ST_WinchFinalInterlockRequest complets et leurs 14 champs chacun."
      - "Les règles SafeStop et interdictions directionnelles ne subissent aucun retard de scan supplémentaire."
      - "Les relais surveillés par safety ne sont pas remplacés silencieusement par une intention de commande."
      - "Les six presets codeur demeurent l'exception explicitement documentée aux commandes physiques centralisées dans Outputs."
      - "Aucune reprise de mouvement après défaut sans cause disparue et front Reset conscient."
    dropped_on_purpose:
      - "PRG_TREUILS_CFC et la partie M1/M2 de PRG_SAFETY_CFC après migration complète des consommateurs."
      - "Lectures inter-POU des instances internes Safety/Treuils remplacées par câblage local ou contrats publics."

  decision_references:
    - "A-01: homing est une fonction Treuils et arrive avec ses presets."
    - "A-03: CmdReset acquisition, détection de front locale."
    - "A-05: les interdictions sont portées par le domaine Treuils qui les subit."
    - "A-11: suppression de la safety transverse sans contrat public au profit de safety locale."
    - "A-12: six sorties preset codeur conservées comme exception documentée."

  evidence_required:
    - check_code_structure
    - check_linkage
    - check_cfc_wiring
    - bundle
    - run_all_gates
    - task_tests
    - human_validation_notes

  models_allowed:
    - "omni/cx/gpt-5.6-terra"
    - "omni/cc/claude-sonnet-5"

  alert_duty: >
    Le cycle local FB_Winch↔FB_Safety_Winch est un blocage si aucun contrat ou
    adaptateur préserve la sémantique des relais; ne pas le briser par un ordre
    CFC arbitraire ni remplacer un retour par une consigne.
