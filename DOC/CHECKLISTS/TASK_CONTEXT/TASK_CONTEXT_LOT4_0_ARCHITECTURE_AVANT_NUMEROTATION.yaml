# ═══════════════════════════════════════════════════════════════════════════
# LOT 4-0 — ARBITRAGE ARCHITECTURE AVANT NUMEROTATION / CFC XML
# ═══════════════════════════════════════════════════════════════════════════
# User validation 2026-08 : orchestration autonome lots 2, 3, 4, 4B et 5.
# Cette autonomie n'autorise pas a inventer une dependance safety. Ce lot produit
# un plan d'architecture prouve et une decision de migration, AVANT toute ecriture
# CODE/, afin de supprimer les cycles qui rendent PRG_XX impossible a definir.
# ═══════════════════════════════════════════════════════════════════════════

task_id: "LOT4-0-ARCHITECTURE-AVANT-NUMEROTATION"
request: >
  Etablir et documenter les cycles inter-programmes, les duplications de
  producteurs et les options de migration vers une architecture executable sans
  boucle safety implicite, puis initier une revue utilisateur C4 avant toute
  attribution de proprietaire ou table MainTask cible.
criticality: C4
strategy: rebuild

scope_code: []
scope_doc:
  - "DOC/AUDITS/Architecture/PLAN_Migration_MainTask_CFC_v1.0.md (nouveau)"
  - "DOC/AF_Partie-02_Architecture_Programme_v3.0.md"
  - "DOC/NAMING_CONVENTION.md"
  - "DOC/PLAN_TASK_v1.0.md"
  - "DOC/VERSION_HISTORY.md"
out_of_scope:
  - "CODE/** : lecture seule dans ce lot"
  - "TOOLS/**"
  - "PRJ_CODESYS/PROJ_Full_ImportExport/Device.export"
  - "Conversion XML CFC (LOT 4B)"
  - "Renommage effectif de POU (LOT 4A)"

contract:
  task_id: LOT4-0-ARCHITECTURE-AVANT-NUMEROTATION
  criticality: C4
  strategy: rebuild

  objective: >
    Produire un dossier de revue utilisateur C4 permettant de choisir sans
    hypothese de securite les proprietaires uniques et l'architecture MainTask
    necessaires avant tout renommage ou cablage CFC natif.

  acceptance:
    - id: AC1
      statement: >
        Le plan recense chaque cycle inter-programmes actuel avec ses deux
        directions, ses fichiers et lignes de lecture, les donnees impliquees et
        le caractere safety, commande, mesure ou diagnostic de chaque flux.
      verified_by: "grep -n -E 'Acquisition.*Diagnostics|Acquisition.*Encoders|Supervision.*Diagnostics|Supervision.*Encoders|Treuils.*Safety|Translation.*Safety' DOC/AUDITS/Architecture/PLAN_Migration_MainTask_CFC_v1.0.md ; les six cycles sont presents avec references"
    - id: AC2
      statement: >
        Chaque instance actuellement dupliquee instJoystick, instEncoderAbsM1/M2,
        instEncoderScaleM1/M2 et instHomingM1/M2 est recensee avec ses producteurs
        actuels, les options de proprietaire unique et la decision RU C4 necessaire
        avant tout basculement vers un contrat public.
      verified_by: "grep -n -E 'instJoystick|instEncoderAbsM1|instEncoderAbsM2|instEncoderScaleM1|instEncoderScaleM2|instHomingM1|instHomingM2' DOC/AUDITS/Architecture/PLAN_Migration_MainTask_CFC_v1.0.md ; chaque instance est recensee avec une decision RU C4"
    - id: AC3
      statement: >
        Aucun flux de commande, Reset, SafeStop, PowerCutOff ou sortie physique
        n'est qualifie de retard d'un scan sans justification safety explicite ;
        chaque retard admis est limite a une mesure ou un diagnostic lecture seule.
      verified_by: "grep -n 'retard d.un scan' DOC/AUDITS/Architecture/PLAN_Migration_MainTask_CFC_v1.0.md ; chaque occurrence identifie le flux et sa justification"
    - id: AC4
      statement: >
        Le plan ne fournit aucune table PRG_XX comme decision tant que les cycles
        C4 sont ouverts ; il fournit a la place les options d'ordre, les invariants
        et les decisions RU C4 a acter avant de produire les 13 rangs.
      verified_by: "grep -n -E 'Table MainTask.*non decidee|RU C4|13 rangs' DOC/AUDITS/Architecture/PLAN_Migration_MainTask_CFC_v1.0.md ; les conditions de decision sont presentes"
    - id: AC5
      statement: >
        Le plan separe les migrations sans changement comportemental des
        migrations qui changent le contrat public, et interdit toute coexistence
        ancien/nouveau producteur pour une meme donnee.
      verified_by: "grep -n -E 'coexistence|producteur unique|contrat public' DOC/AUDITS/Architecture/PLAN_Migration_MainTask_CFC_v1.0.md ; les trois garde-fous sont enonces"
    - id: AC6
      statement: >
        AF_Partie-02 et NAMING_CONVENTION conservent explicitement le gel des
        quatre POU et renvoient vers le dossier RU C4, sans presenter une table
        MainTask cible comme decidee.
      verified_by: "grep -n 'PLAN_Migration_MainTask_CFC' DOC/AF_Partie-02_Architecture_Programme_v3.0.md DOC/NAMING_CONVENTION.md ; au moins un renvoi dans chaque fichier"
    - id: AC7
      statement: >
        Le plan declare explicitement les hypotheses non prouvees et les
        decisions qui necessitent une revue utilisateur avant l'application dans
        CODE/ ; aucune n'est masquee comme fait.
      verified_by: "grep -n -E 'Hypothese|Revue utilisateur|Non prouve' DOC/AUDITS/Architecture/PLAN_Migration_MainTask_CFC_v1.0.md ; une section dediee est presente"
    - id: AC8
      statement: >
        Les modifications documentaires de ce lot ne creent aucun lien mort ni
        aucune reference a un XML CFC cible presente comme deja existant.
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_doc_links.py ; sortie PASS"

  scope:
    allowed:
      - DOC/AUDITS/Architecture/PLAN_Migration_MainTask_CFC_v1.0.md
      - DOC/AF_Partie-02_Architecture_Programme_v3.0.md
      - DOC/NAMING_CONVENTION.md
      - DOC/PLAN_TASK_v1.0.md
      - DOC/VERSION_HISTORY.md
    forbidden:
      - CODE/
      - TOOLS/
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export

  conservation:
    must_survive:
      - "PRG_11_Troubleshooting reste un programme ST de lecture seule execute apres les sorties physiques."
      - "Les sorties physiques restent produites uniquement par le programme Outputs Ladder."
      - "Les frontieres CFC ne contiennent pas de logique metier inline."
      - "Chaque reset reste sur front et aucun acquittement ne redemarre automatiquement un mouvement."
    dropped_on_purpose:
      - "Les cycles inter-programmes non documentes et les acces de consommateurs aux internes d'instances d'un autre POU."
      - "La duplication active des instances joystick et codeurs apres migration." 

  evidence_required:
    - check_doc_links
    - check_linkage
    - run_all_gates

  models_allowed:
    - "omni/cx/gpt-5.6-terra"
    - "omni/cc/claude-sonnet-5"

  alert_duty: >
    Si le plan ne peut pas attribuer un producteur unique ou un ordre a un flux
    sans supposer une semantique safety, l'ecrire en hypothese et le remonter en
    revue utilisateur. Ne jamais compenser une inconnue en ajoutant un retard
    d'un scan a SafeStop, Reset, PowerCutOff ou une sortie physique.
