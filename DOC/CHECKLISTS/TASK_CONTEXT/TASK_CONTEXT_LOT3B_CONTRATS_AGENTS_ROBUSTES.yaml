# ═══════════════════════════════════════════════════════════════════════════
# LOT 3B — ROBUSTESSE DU GATE DE CONTRAT (REX REVUE LOT 3)
# ═══════════════════════════════════════════════════════════════════════════
# Origine : revue indépendante LOT 3 (2026-08) a classé MAJOR :
# - sans PyYAML, le repli détecte CODE/MAIN même s'il est seulement forbidden ;
# - T8 accepte une cooccurrence de mots sans obligation d'alignement ;
# - les contrats de campagne amendés par l'orchestrateur n'étaient pas listés
#   dans le scope LOT3, alors que leur validation est un objectif du LOT3.
#
# Ce lot ferme ces trois défauts sans toucher à CODE/.
# ═══════════════════════════════════════════════════════════════════════════

task_id: "LOT3B-CONTRATS-AGENTS-ROBUSTES"
request: >
  Rendre le controle T8 de check_task_contract.py identique avec ou sans PyYAML,
  exiger une relation structurelle explicite plutot qu'une simple cooccurrence de
  mots, et regulariser le perimetre des six contrats de campagne 2026-08.
criticality: C3
strategy: patch

scope_code:
  - "TOOLS/AGENT_WORKFLOW/scripts/check_task_contract.py"
  - "TOOLS/AGENT_WORKFLOW/tests/test_check_task_contract.py"
  - "TOOLS/AGENT_WORKFLOW/templates/task_contract.yaml"
  - "TOOLS/AGENT_WORKFLOW/prompts/subagent_preamble.md"
  - "TOOLS/AGENT_WORKFLOW/docs/WORKFLOW.md"
  - "TOOLS/AGENT_WORKFLOW/docs/CODE_WRITING_POLICY.md"
scope_doc:
  - "DOC/CHECKLISTS/TASK_CONTEXT/TASK_CONTEXT_LOT1_GATES_STRUCTURE_CODE.yaml"
  - "DOC/CHECKLISTS/TASK_CONTEXT/TASK_CONTEXT_LOT2_DOC_CFC_NUMEROTATION.yaml"
  - "DOC/CHECKLISTS/TASK_CONTEXT/TASK_CONTEXT_LOT3_CONTRATS_AGENTS.yaml"
  - "DOC/CHECKLISTS/TASK_CONTEXT/TASK_CONTEXT_LOT4A_RENOMMAGE_PROGRAMMES.yaml"
  - "DOC/CHECKLISTS/TASK_CONTEXT/TASK_CONTEXT_LOT4B_CONVERSION_CFC_NATIF.yaml"
  - "DOC/CHECKLISTS/TASK_CONTEXT/TASK_CONTEXT_LOT5_VERIFICATION_FINALE.yaml"
out_of_scope:
  - "CODE/** : aucun fichier automate n'est modifie"
  - "PRJ_CODESYS/PROJ_Full_ImportExport/Device.export"
  - "Regles CFC ou numerotation des programmes"

contract:
  task_id: LOT3B-CONTRATS-AGENTS-ROBUSTES
  criticality: C3
  strategy: patch

  objective: >
    Refuser de maniere identique avec ou sans PyYAML une tache CODE/MAIN qui ne
    formule pas les alignements fichier/POU et suffixe/langage bundle, sans
    rejeter une tache documentaire ou accepter une phrase seulement decorative.

  acceptance:
    - id: AC1
      statement: >
        Avec PyYAML desactive, un contrat dont CODE/MAIN apparait seulement dans
        scope.forbidden et dont scope.allowed est documentaire ne declenche pas T8.
      verified_by: "C:/Python313/python.exe -m pytest TOOLS/AGENT_WORKFLOW/tests/test_check_task_contract.py -q -k raw_forbidden ; le test passe"
    - id: AC2
      statement: >
        Avec PyYAML desactive, un contrat dont scope.allowed contient CODE/MAIN
        mais sans criteres fichier = nom de POU ni suffixe = langage genere dans
        le bundle est refuse par T8.
      verified_by: "C:/Python313/python.exe -m pytest TOOLS/AGENT_WORKFLOW/tests/test_check_task_contract.py -q -k raw_code_main ; le test passe"
    - id: AC3
      statement: >
        T8 refuse les criteres decoratifs contenant seulement les mots fichier,
        nom, POU, suffixe, langage et bundle sans relation explicite d'egalite ou
        de correspondance entre les elements concernes ; il refuse notamment
        « Le fichier est identique dans la revue ; le POU est documente. » et
        « Le suffixe est identique dans la revue ; le langage et le bundle sont
        documentes. ».
      verified_by: "C:/Python313/python.exe -m pytest TOOLS/AGENT_WORKFLOW/tests/test_check_task_contract.py -q -k relation_decorative_scattered ; le test passe"
    - id: AC4
      statement: >
        T8 accepte un contrat CODE/MAIN portant explicitement fichier = nom de
        POU et suffixe = langage genere dans le bundle, dans une ou deux phrases.
      verified_by: "C:/Python313/python.exe -m pytest TOOLS/AGENT_WORKFLOW/tests/test_check_task_contract.py -q -k relations_structurelles_explicites ; le test passe"
    - id: AC5
      statement: >
        Le contrat LOT3 autorise explicitement les six contrats de campagne qu'il
        verifie, et les six contrats passent check_task_contract.py.
      verified_by: "for f in TASK_CONTEXT_LOT1_GATES_STRUCTURE_CODE.yaml TASK_CONTEXT_LOT2_DOC_CFC_NUMEROTATION.yaml TASK_CONTEXT_LOT3_CONTRATS_AGENTS.yaml TASK_CONTEXT_LOT4A_RENOMMAGE_PROGRAMMES.yaml TASK_CONTEXT_LOT4B_CONVERSION_CFC_NATIF.yaml TASK_CONTEXT_LOT5_VERIFICATION_FINALE.yaml; do python TOOLS/AGENT_WORKFLOW/scripts/check_task_contract.py DOC/CHECKLISTS/TASK_CONTEXT/$f || exit 1; done"
    - id: AC6
      statement: >
        Le template et le preambule imposent une relation explicite, avec les
        formulations fichier = nom de POU et suffixe = langage bundle, sans
        laisser entendre qu'une presence de mots suffit.
      verified_by: "grep -n -E 'fichier.*POU|suffixe.*langage.*bundle' TOOLS/AGENT_WORKFLOW/templates/task_contract.yaml TOOLS/AGENT_WORKFLOW/prompts/subagent_preamble.md ; au moins une formulation d'egalite dans chaque fichier"
    - id: AC7
      statement: >
        Sans PyYAML, les six contrats de campagne utilisant des champs YAML plies
        statement: > et verified_by: restent acceptes exactement comme avec PyYAML.
      verified_by: "C:/Python313/python.exe -m pytest TOOLS/AGENT_WORKFLOW/tests/test_check_task_contract.py -q -k campaign_raw_fallback ; le test passe"
    - id: AC8
      statement: >
        Sans PyYAML, un contrat contenant scope: mais aucun scope.allowed non
        vide est refuse par T5, comme avec PyYAML.
      verified_by: "C:/Python313/python.exe -m pytest TOOLS/AGENT_WORKFLOW/tests/test_check_task_contract.py -q -k raw_scope_allowed_empty ; le test passe"

  scope:
    allowed:
      - TOOLS/AGENT_WORKFLOW/scripts/check_task_contract.py
      - TOOLS/AGENT_WORKFLOW/tests/test_check_task_contract.py
      - TOOLS/AGENT_WORKFLOW/templates/task_contract.yaml
      - TOOLS/AGENT_WORKFLOW/prompts/subagent_preamble.md
      - TOOLS/AGENT_WORKFLOW/docs/WORKFLOW.md
      - TOOLS/AGENT_WORKFLOW/docs/CODE_WRITING_POLICY.md
      - DOC/CHECKLISTS/TASK_CONTEXT/TASK_CONTEXT_LOT1_GATES_STRUCTURE_CODE.yaml
      - DOC/CHECKLISTS/TASK_CONTEXT/TASK_CONTEXT_LOT2_DOC_CFC_NUMEROTATION.yaml
      - DOC/CHECKLISTS/TASK_CONTEXT/TASK_CONTEXT_LOT3_CONTRATS_AGENTS.yaml
      - DOC/CHECKLISTS/TASK_CONTEXT/TASK_CONTEXT_LOT4A_RENOMMAGE_PROGRAMMES.yaml
      - DOC/CHECKLISTS/TASK_CONTEXT/TASK_CONTEXT_LOT4B_CONVERSION_CFC_NATIF.yaml
      - DOC/CHECKLISTS/TASK_CONTEXT/TASK_CONTEXT_LOT5_VERIFICATION_FINALE.yaml
    forbidden:
      - CODE/
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - DOC/AF_Partie-02_Architecture_Programme_v3.0.md

  conservation:
    must_survive:
      - "Les controles T1 a T8 existants restent actifs ; T8 devient plus strict sans masquer un contrat CODE/MAIN incomplet."
      - "Une tache documentaire reste acceptable sans criteres structurels quand scope.allowed ne touche pas CODE/MAIN."
      - "Les contrats historiques hors campagne ne sont ni modifies ni migres."
    dropped_on_purpose:
      - "Le repli textuel qui confond scope.forbidden avec scope.allowed."
      - "La validation T8 par simple presence des six mots structurels."

  evidence_required:
    - task_tests
    - run_all_gates

  models_allowed:
    - "omni/cx/gpt-5.6-terra"
    - "omni/cc/claude-sonnet-5"

  alert_duty: >
    Si la syntaxe YAML reelle des contrats rend impossible un repli textuel fiable,
    remonter le risque plutot que de valider un parseur approximatif. Le gate ne
    doit jamais rendre vert un contrat ambigu par confort de compatibilite.
