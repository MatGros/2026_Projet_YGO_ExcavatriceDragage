contract:
  # ── Identification ────────────────────────────────────────────────────────
  task_id: LOT0_DIAG_IHM_HEARTBEAT
  criticality: C3
  strategy: patch
  human_validation_required: true

  # ── 1. Objectif métier ────────────────────────────────────────────────────
  objective: >
    Rendre HeartbeatIhmOk réellement calculé par le programme (perte de
    communication IHM→PLC détectée par timeout) au lieu d'être un signal
    fantôme jamais produit, pour que FB_Safety_Translation (lot M4) et
    FB_Safety_Winch reçoivent une vraie mesure et non une valeur figée.

  # ── 2. Critères testables ─────────────────────────────────────────────────
  acceptance:
    - id: AC1
      statement: >
        instDiagIhmHeartbeat (FB_Diag_IhmHeartbeat) est instancié UNE SEULE
        FOIS dans PRG_07_Supervision.st, câblé sur la source réelle du front
        IHM (à identifier dans GVL_IHM — si aucune source réelle n'existe,
        c'est un STOP, voir alert_duty, pas une valeur inventée).
      verified_by: "check_linkage.py --report (instance unique, appelée) + lecture du diff"
    - id: AC2
      statement: >
        GVL_IHM.Commun.HeartbeatIhmOk est publié depuis
        instDiagIhmHeartbeat.HeartbeatIhmOk — plus jamais un champ non câblé.
      verified_by: 'grep "Commun.HeartbeatIhmOk :=" CODE/MAIN/PRG_07_Supervision.st (doit matcher)'
    - id: AC3
      statement: "Nom de fichier identique au nom de POU pour PRG_07_Supervision.st (PRG_07_Supervision)."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py"
    - id: AC4
      statement: "Suffixe de langage égal au langage généré dans le bundle pour PRG_07_Supervision (.st = ST)."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py + inspection CODE/CODE_Bundle.xml"

  # ── 3. Périmètre ──────────────────────────────────────────────────────────
  scope:
    allowed:
      - CODE/MAIN/PRG_07_Supervision.st
      - CODE/SUPERVISION/GVL_IHM.st       # lecture ; modif structure UNIQUEMENT si le champ source front IHM manque, et alors signalé avant d'écrire
      - CODE/CODE_Bundle.xml
    forbidden:
      - CODE/TRANSLATION/*
      - CODE/TREUILS/*
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - .git/

  # ── 4. Contrat de conservation ────────────────────────────────────────────
  # strategy = patch : non obligatoire, renseigné par prudence (FB déjà écrit, non touché).
  conservation:
    must_survive:
      - "Logique interne de FB_Diag_IhmHeartbeat.st inchangée (déjà écrite et correcte, ce lot ne fait que l'appeler)."
    dropped_on_purpose:
      - "Aucun — lot additif uniquement."

  # ── 5. Preuves attendues en restitution ───────────────────────────────────
  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle
    - human_validation_notes

  # ── 6. Modèles autorisés ──────────────────────────────────────────────────
  models_allowed:
    - "omni/cc/claude-sonnet-5"
    - "omni/cx/gpt-5.6-terra"

  # ── 7. Devoir d'alerte ────────────────────────────────────────────────────
  alert_duty: >
    Si aucune source réelle de front IHM (bouton/pulse écrit par le SCADA)
    n'existe côté GVL_IHM, STOP et remonter à l'orchestrateur — ne jamais
    câbler TRUE constant pour faire disparaître l'alerte, ce serait un
    consentement de complaisance sur un signal de sécurité (perte de
    communication opérateur, bit0 de FB_Safety_Translation et FB_Safety_Winch).
    Ce lot est un prérequis du lot M4_TRANSLATION_SAFETY : sans lui,
    HeartbeatIhmOk resterait une source non fiable dans la safety M3.
