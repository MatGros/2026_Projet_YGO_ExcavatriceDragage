contract:
  task_id: M6_SUPERVISION
  criticality: C2
  strategy: patch
  human_validation_required: true

  objective: >
    Fusionner Supervision et Troubleshooting au rang 07 en une projection strictement
    lecture seule des contrats publics, sans changer les informations visibles opérateur ou maintenance.

  acceptance:
    - id: AC1
      statement: "PRG_07_Supervision_CFC remplace les producteurs historiques Supervision et Troubleshooting et projette les données depuis contrats publics, sans lire PRG_xxx.instYyy ni variable VAR locale d'un autre POU."
      verified_by: "grep des accès inter-POU internes + check_linkage.py --report + revue indépendante"
    - id: AC2
      statement: "PRG_07_Supervision_CFC n'écrit aucune commande, configuration, bypass, interlock, Q ni PDO; ses seules écritures autorisées sont les projections IHM et Troubleshooting explicitement listées."
      verified_by: "grep des affectations dans PRG_07_Supervision_CFC.xml et FB_SupervisionProjection.st + inspection indépendante"
    - id: AC3
      statement: "Les 316 publications IHM, les 152 publications Troubleshooting et les cinq vues Troubleshooting conservées restent renseignées par les mêmes données ou contrats sémantiquement équivalents."
      verified_by: "comparaison inventaire AUDIT_M0 §A12/A13 + essai humain CODESYS des cinq vues"
    - id: AC4
      statement: "Aucune écriture impulsionnelle des boutons Cycle, de sélection position Translation, de configuration persistante ou de bypass ne demeure dans la supervision; tout propriétaire de remplacement doit être explicitement prouvé avant suppression."
      verified_by: "grep des symboles GVL_IHM.Cycle.Cmd, StubTranslationPositionSelect_IHM, GVL_PERSISTENT et GVL_BypassRetain + check_linkage.py --report"
    - id: AC5
      statement: "Le nom de fichier est identique au nom de POU: PRG_07_Supervision_CFC.xml / PRG_07_Supervision_CFC."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py"
    - id: AC6
      statement: "Le suffixe correspond au langage CFC généré dans le bundle: .xml pour PRG_07_Supervision_CFC."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py + inspection CODE/CODE_Bundle.xml"

  scope:
    allowed:
      - CODE/MAIN/PRG_SUPERVISION_CFC.st
      - CODE/MAIN/PRG_TROUBLESHOOTING_CFC.st
      - CODE/MAIN/PRG_07_Supervision_CFC.xml
      - CODE/MAIN/GVL_Troubleshooting.st
      - CODE/SUPERVISION/FB_SupervisionProjection.st
      - CODE/COMMUN/ST_OutputBarrierState.st
      - DOC/AUDITS/Architecture/REGISTRE_ARBITRAGES_MIGRATION.md
      - CODE/CODE_Bundle.xml
    forbidden:
      - CODE/MAIN/PRG_02_Acquisition_CFC.xml
      - CODE/MAIN/PRG_03_Modes_Cycle_CFC.xml
      - CODE/MAIN/PRG_04_Treuils_Benne_CFC.xml
      - CODE/MAIN/PRG_05_Translation_CFC.xml
      - CODE/MAIN/PRG_06_Outputs_LD.st
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - .git/

  conservation:
    must_survive:
      - "Les diagnostics et états exposés aux opérateurs et aux cinq vues troubleshooting."
      - "La supervision s'exécute après les producteurs et reste une observatrice sans effet machine."
      - "Aucun accès aux copies GVL d'instances Outputs ni aux instances internes procédé ne survit."
      - "Reset ne devient jamais un producteur rang 07; CmdReset vient toujours d'Acquisition."
    dropped_on_purpose:
      - "PRG_SUPERVISION_CFC et PRG_TROUBLESHOOTING_CFC après projection complète dans PRG_07_Supervision_CFC."
      - "Écritures interdites de commande, configuration, bypass ou interlock dans le POU de supervision."

  decision_references:
    - "A-03: CmdReset ne peut plus être agrégé tardivement en Supervision."
    - "A-08: fusion autorisée car les deux pages sont des observateurs lecture seule."
    - "A-11: lire les contrats publics, jamais les internals de la safety transverse supprimée."

  evidence_required:
    - check_code_structure
    - check_linkage
    - check_cfc_wiring
    - bundle
    - run_all_gates
    - human_validation_notes

  models_allowed:
    - "omni/cx/gpt-5.6-terra"
    - "omni/cc/claude-sonnet-5"

  alert_duty: >
    Si une écriture Supervision n'a pas de propriétaire cible hors rang 07,
    arrêter le lot: la déplacer sans règle métier explicite est interdite.
