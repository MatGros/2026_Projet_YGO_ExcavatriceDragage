contract:
  task_id: M1_ACQUISITION_UNIFIEE
  criticality: C4
  strategy: rebuild
  human_validation_required: true

  objective: >
    Fournir au rang 02 une acquisition unique et qualifiée des entrées, diagnostics,
    mesures et commandes opérateur, afin que Modes reçoive EncoderUnsafe et CmdReset
    frais sans conserver de producteur historique concurrent.

  acceptance:
    - id: AC1
      statement: "PRG_02_Acquisition_CFC publie une seule chaîne active pour diagnostics CANopen/EtherCAT, heartbeat, joystick, HwIn, positions M3 filtrées, retour hydraulique, EncoderUnsafe et CmdReset."
      verified_by: "grep des déclarations et appels dans les fichiers scope.allowed + check_linkage.py --report"
    - id: AC2
      statement: "Les entrées frein, thermique, contacteur et fin de course reprises par l'acquisition proviennent de PRG_INPUTS_LD qualifié, avec filtre 20 ms et inversion M*_BrakeIsOpen_DI vers M*BrakeFeedback conservées."
      verified_by: "diff ciblé de PRG_INPUTS_LD.st et PRG_02_Acquisition_CFC.xml + essai CODESYS humain signal-par-signal"
    - id: AC3
      statement: "EncoderUnsafe disponible avant PRG_03_Modes_Cycle_CFC ne contient que indisponibilité device et incohérence mesure/plage; HomingSuspect en est exclu."
      verified_by: "revue des contrats ST_EncoderMeasurements et du câblage XML + watch CODESYS humain avant activation SEMI_AUTO"
    - id: AC4
      statement: "CmdReset agrège les quatre boutons au rang Acquisition et chaque consommateur détecte son front localement; aucun reset ne réarme automatiquement après disparition d'un défaut."
      verified_by: "test PLC/CODESYS des quatre boutons: défaut présent, relâchement, puis nouvel appui + grep FB_ResetAggregation"
    - id: AC5
      statement: "Aucune instance historique dupliquée de joystick, diagnostic ou encodeur ne reste active, et aucun consommateur ne lit le jeu encodeur brut supprimé."
      verified_by: "check_linkage.py --report + grep des instances instJoystick/instEncoderAbs/instEncoderScale dans CODE/MAIN"
    - id: AC6
      statement: "Le raccordement Acquisition vers PRG_INPUTS_LD.HwIn est visible, alimenté et confirmé dans le projet CODESYS; sinon le lot est BLOCK conformément à A-10."
      verified_by: "inspection humaine CODESYS du fil HwIn et essai Watch des 22 sorties qualifiées"
    - id: AC7
      statement: "Le nom de fichier est identique au nom de POU: PRG_02_Acquisition_CFC.xml / PRG_02_Acquisition_CFC."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py"
    - id: AC8
      statement: "Le suffixe correspond au langage CFC généré dans le bundle: .xml pour PRG_02_Acquisition_CFC."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py + inspection CODE/CODE_Bundle.xml"

  scope:
    allowed:
      - CODE/MAIN/PRG_ACQUISITION_CFC.st
      - CODE/MAIN/PRG_01_Diagnostics.st
      - CODE/MAIN/PRG_02_Encoders.st
      - CODE/MAIN/PRG_AUXILIARY_CFC.st
      - CODE/MAIN/PRG_INPUTS_LD.st
      - CODE/MAIN/PRG_02_Acquisition_CFC.xml
      - CODE/MAIN/GVL_Global.st
      - CODE/COMMUN/ST_AcquisitionQualified.st
      - CODE/COMMUN/ST_DeviceDiagnostics.st
      - CODE/COMMUN/ST_EncoderMeasurements.st
      - CODE/COMMUN/ST_ResetCommand.st
      - CODE/SIMULATION/FB_AcquisitionRouter.st
      - CODE/COMMUN/FB_ResetAggregation.st
      - DOC/AUDITS/Architecture/REGISTRE_ARBITRAGES_MIGRATION.md
      - CODE/CODE_Bundle.xml
    forbidden:
      - CODE/MAIN/PRG_05_Cycle.st
      - CODE/MAIN/PRG_TREUILS_CFC.st
      - CODE/MAIN/PRG_TRANSLATION_CFC.st
      - CODE/MAIN/PRG_OUTPUTS_LD.st
      - CODE/MAIN/PRG_SUPERVISION_CFC.st
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - .git/

  conservation:
    must_survive:
      - "Sélection atomique réel/simulé et impulsion WinchInputSourceChanged."
      - "Disponibilité, vitesse, position et alarmes encodeurs M1/M2; aucun délai de scan ajouté."
      - "AU acquis comme fait d'entrée, tandis que son action demeure dans Outputs et la chaîne matérielle reste indépendante."
      - "Les six commandes de preset encodeur ne sont ni perdues ni transférées à Outputs dans ce lot; elles attendent M3 avec le homing."
      - "Aucun accès au signal brut ne remplace un signal qualifié safety."
    dropped_on_purpose:
      - "PRG_ACQUISITION_CFC, PRG_01_Diagnostics, PRG_02_Encoders et PRG_AUXILIARY_CFC après remappage complet de leurs consommateurs."
      - "Instances encodeurs et joystick brutes/dupliquées non retenues par A-09."

  decision_references:
    - "A-01: homing hors acquisition, migré avec Treuils en M3."
    - "A-02: EncoderUnsafe rang 02, sans HomingSuspect."
    - "A-03: CmdReset agrégé au rang 02, fronts locaux."
    - "A-06: état AU en acquisition, action en Outputs."
    - "A-09: conserver le jeu qualifié et filtré, supprimer le brut sans consommateur."
    - "A-10: HwIn de PRG_INPUTS_LD doit être prouvé humainement."
    - "A-12: presets encodeur migrent avec le homing en M3."

  evidence_required:
    - check_code_structure
    - check_linkage
    - check_cfc_wiring
    - bundle
    - run_all_gates
    - human_validation_notes

  models_allowed:
    - "omni/cx/gpt-5.6-terra"
    - "omni/cc/claude-sonnet-5"

  alert_duty: >
    Stopper et remonter immédiatement toute différence de polarité, filtrage,
    valeur de repli ou raccordement HwIn non prouvé; aucune hypothèse CODESYS
    ni suppression de producteur n'est autorisée.
