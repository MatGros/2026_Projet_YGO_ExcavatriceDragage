contract:
  task_id: AF01_DOCUMENTATION_V2
  criticality: C4
  strategy: rebuild
  objective: >
    Fournir une analyse fonctionnelle de tete concise qui preserve le modele
    d'arret et de rearmement de la machine, sans dupliquer les specifications
    de cycle, de mouvement ou d'interface des parties proprietaires.
  acceptance:
    - id: AC1
      statement: "L'AF01 v2.0 definit les equipements, les fonctions metier et les fonctions transverses sans reprendre le mapping E/S detaille."
      verified_by: "Relecture de DOC/AF_Partie-01_Analyse_Fonctionnelle_v2.0.md sections 2 et 3."
    - id: AC2
      statement: "L'AF01 v2.0 est la source exhaustive du fonctionnement de la chaine de coupure puissance et du rearmement."
      verified_by: "Relecture de la section 5 contre CODE/AU/FB_Safety_EmergencyManagementLogic.st et CODE/MAIN/PRG_10_Outputs_LD.st."
    - id: AC3
      statement: "La v1.6 est archivee et tous les liens actifs vers l'AF01 pointent vers la v2.0."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_doc_links.py"
    - id: AC4
      statement: "Les protections propres aux treuils et a la translation restent proprietaires des Parties 09 et 11 ; l'AF01 renvoie vers elles sans recopier leurs seuils."
      verified_by: "Relecture croisee AF01 v2.0 sections 4 et 7 avec AF_Partie-09 et AF_Partie-11."
  scope:
    allowed:
      - DOC/AF_Partie-01_Analyse_Fonctionnelle_v2.0.md
      - DOC/AF_Partie-01_Analyse_Fonctionnelle_v1.6.md
      - ARCHIVES/Doc/AF_Partie-01_Analyse_Fonctionnelle_v1.6.md
      - DOC/AF_Partie-03_Contrats_Composants_v2.0.md
      - DOC/AF_Partie-08_Fonction_Joystick_v2.0.md
      - DOC/AF_Partie-10_Fonction_Encoder_Homing_v1.11.md
      - DOC/CHECKLISTS/EXTRACTIONS/AF_Partie-01_Extraction_Specifications_v1.0.md
      - README.md
      - CODE/AU/FB_Safety_EmergencyManagement.st
      - CODE/AU/FB_Safety_EmergencyManagementLogic.st
      - CODE/AU/FB_Safety_EmergencyManagementOutput.st
      - CODE/AU/ST_EmergencyManagementCmd.st
      - CODE/MAIN/PRG_03_Safety.st
      - CODE/SUPERVISION/_TYPES/ST_ModesCmd.st
    forbidden:
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - DOC/NAMING_CONVENTION.md
  conservation:
    must_survive:
      - "L'automate reste alimente ; la coupure porte sur la puissance moteurs et actionneurs."
      - "Les boutons AU physiques et les deux canaux PLC commandent la meme chaine de coupure fail-safe."
      - "Le contacteur confirme engage est le portail maitre EmergencyStopOk ; la boucle AU saine est une precondition d'armement."
      - "Le rearmement est explicite, sur front, avec auto-test A/B, impulsion 1 s et confirmation 2 s."
      - "Les protections mouvement demandent PowerCutOff ; leurs conditions et seuils restent dans les parties de domaine."
      - "La simulation, les diagnostics devices et le contrat PLC-IHM restent des fonctions transverses exigees."
    dropped_on_purpose:
      - "Le journal detaille des versions precedentes dans le bandeau AF01, porte par VERSION_HISTORY.md."
      - "Le cycle semi-auto pas-a-pas dans l'AF01, porte par AF_Partie-04_Cycle_Sequenceur."
      - "Le mapping exhaustif des devices et E/S, porte par l'export CODESYS et les specifications de domaine."
  evidence_required:
    - check_doc_links
    - task_contract
    - git_diff_check
  models_allowed:
    - "openai/gpt-5.6-terra"
  alert_duty: >
    Toute divergence entre le comportement code observe, la specification
    historique et le cablage a confirmer est signalee explicitement sans
    modifier le code ni presenter une hypothese comme un fait.
