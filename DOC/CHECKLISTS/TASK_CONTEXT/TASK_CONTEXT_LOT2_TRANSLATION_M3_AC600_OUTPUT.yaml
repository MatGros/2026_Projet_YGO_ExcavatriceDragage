contract:
  # ── Identification ────────────────────────────────────────────────────────
  task_id: LOT2_TRANSLATION_M3_AC600_OUTPUT
  criticality: C4
  strategy: patch
  human_validation_required: true

  # ── 1. Objectif métier ────────────────────────────────────────────────────
  objective: >
    Écrire réellement la commande moteur AC600 (mot de commande +
    consigne fréquence) calculée par la barrière finale
    FB_TranslationOutputInterlock_LD vers la sortie physique EtherCAT.
    Aujourd'hui ce calcul existe (instTranslationOutputInterlockM3.DriveControlWord
    / .DriveFreqRefHz) mais n'est écrit nulle part : M3 ne peut physiquement
    pas bouger, même une fois SafetyStructureNotValidated levé.

  # ── 2. Critères testables ─────────────────────────────────────────────────
  acceptance:
    - id: AC1
      statement: >
        instTranslationOutputInterlockM3.DriveControlWord et .DriveFreqRefHz
        sont écrits vers les variables PDO de sortie réelles du device
        AC600_ECAT_Drive (nom exact à identifier par lecture SEULE de
        Device.export, jamais modifié) dans PRG_06_Outputs_LD.st, après
        M3InterlockEnable — même barrière que BrakeCmd déjà câblé.
      verified_by: "check_linkage.py --report + inspection du diff + grep du nom exact de variable PDO dans Device.export"
    - id: AC2
      statement: >
        Si M3InterlockEnable = FALSE OU SafetyStructureNotValidated = TRUE,
        la valeur écrite sur le PDO est 0 / commande None — jamais une
        valeur résiduelle du scan précédent.
      verified_by: "vérification manuelle CODESYS (Watch/forçage) : forcer SafetyStructureNotValidated=TRUE et confirmer 0 sur le PDO"
    - id: AC3
      statement: "Nom de fichier identique au nom de POU pour PRG_06_Outputs_LD.st (PRG_06_Outputs_LD)."
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py"
    - id: AC4
      statement: >
        Suffixe de langage égal au langage généré dans le bundle pour
        PRG_06_Outputs_LD (`_LD.st` → `<LD>` Ladder, règle codesys-workflow
        §Note _LD.st) ; rung complet contact → block → coil → rightPowerRail
        sur le nouveau réseau.
      verified_by: "python TOOLS/AGENT_WORKFLOW/scripts/check_code_structure.py + python -m pytest TOOLS/AGENT_WORKFLOW/tests/test_ld_import_guard.py -v"

  # ── 3. Périmètre ──────────────────────────────────────────────────────────
  scope:
    allowed:
      - CODE/MAIN/PRG_06_Outputs_LD.st
      - CODE/CODE_Bundle.xml
    forbidden:
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export   # lecture seule autorisée, écriture interdite
      - CODE/TRANSLATION/*
      - CODE/TREUILS/*
      - .git/

  # ── 4. Contrat de conservation ────────────────────────────────────────────
  # strategy = patch : ajout d'un réseau de sortie, rien d'existant retiré.
  conservation:
    must_survive:
      - "M3_BrakeRelease_RQ et tout le §1/§2 M1/M2 actuels de PRG_06_Outputs_LD.st inchangés."
      - "SafetyStructureNotValidated reste le garde-fou unique qui neutralise toute sortie tant qu'il vaut TRUE."
    dropped_on_purpose:
      - "Aucun — lot additif uniquement."

  # ── 5. Preuves attendues en restitution ───────────────────────────────────
  evidence_required:
    - check_linkage
    - run_all_gates
    - bundle
    - human_validation_notes

  # ── 6. Modèles autorisés ──────────────────────────────────────────────────
  models_allowed:
    - "omni/cc/claude-sonnet-5"
    - "omni/cx/gpt-5.6-terra"

  # ── 7. Devoir d'alerte ────────────────────────────────────────────────────
  alert_duty: >
    PRÉCONDITION CRITIQUE, à écrire dans human_validation_notes AVANT clôture
    quel que soit l'ordre choisi par l'utilisateur : ce lot rend le moteur M3
    commandable dès que SafetyStructureNotValidated repasse à FALSE. Si
    M4_TRANSLATION_SAFETY (FB_Safety_Translation câblé, 8 mécanismes) n'est
    PAS fait avant ou en même temps, le moteur pourra bouger SANS protection
    Méca A/B, sans détection perte comm, sans détection surchauffe frein,
    avec pour seules protections celles déjà internes à FB_Translation et
    FB_TranslationOutputInterlock_LD (butées extrêmes, confirmation frein,
    anti-redémarrage). Signaler ce risque explicitement, ne jamais le
    minimiser dans la restitution.
