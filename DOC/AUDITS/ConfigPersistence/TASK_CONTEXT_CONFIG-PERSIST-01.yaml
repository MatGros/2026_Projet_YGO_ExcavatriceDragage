task_id: "CONFIG-PERSIST-01"
request: >
  Fiabiliser la persistance des paramètres de config exposés a l'IHM (GVL_IHM, RETAIN simple) qui
  doivent survivre a un rechargement de programme via GVL_PERSISTENT (PERSISTENT RETAIN). Bug
  initial signale par l'utilisateur : GVL_IHM.M2TreuilBenne.Cfg.CfgMaxStepDescente repart au
  defaut struct (3) au chargement d'un nouveau programme au lieu de conserver la valeur reglee.
  Cause racine : sentinelles boot-restore `IF champ = 0.0 THEN` cassees des que le defaut struct
  reel du champ teste n'est pas 0.0 (CfgTopSensorPos_M:=8.5, CfgSyncTolerance_M:=0.25) -> le bloc
  de restauration ne s'executait plus, 10+ champs Cfg (paliers, rampes SafeStop, limites cable,
  tolerance synchro) ne se resynchronisaient jamais depuis le vrai PERSISTENT. Revue par agent
  expert automatisme/securite machine avant implementation (verdict : plan valide sur le principe,
  amende sur l'emplacement du flag + ajout alarme operateur obligatoire).
criticality: "C3"
