out_of_scope:
  - "Refonte architecture (IHM lit/ecrit PERSISTENT en direct, suppression du miroir GVL_IHM) : non applicable, l'IHM (supervision externe) n'a jamais d'acces direct aux variables PLC internes -- ecarte par l'utilisateur"
  - "Winch Cfg partage M1/M2 (CfgMaxStepDescente/Ascent/SlowdownDistance_M/SlowSpeed_Pct) : deplaces vers Commun.Cfg (Lot 3d-1), plus un probleme de reconciliation -- resolu structurellement, pas par ce lot de test"
  - "Joystick _JoystickNeutralX/Y : verifie deja correctement ecrit par reference (VAR_IN_OUT FB_Joystick), aucun bug -- voir PLAN_TASK T68 corrige"
  - "Logique safety elle-meme (FB_Safety_Winch/FB_Safety_Translation) : aucune modification, seule la restauration de la CONFIG qui alimente ces FB est testee"
acceptance_criteria:
  - "Flag Initialized (ST_WinchCfg) / CfgInitialized (ST_SyncHMI) : defaut FALSE, pose TRUE uniquement apres restauration complete PERSISTENT->IHM du groupe, meme scan que les assignations (pas de scan separe)."
  - "Bloc §3 (propagation IHM->PERSISTENT) garde par le flag Initialized/CfgInitialized correspondant pour chaque champ concerne -- ne peut plus ecraser le PERSISTENT avec une valeur GVL_IHM fraichement resettee avant restauration."
  - "ConfigRestoredFromPersistent (Commun) : pose TRUE des qu'une restauration a lieu sur n'importe quel groupe, ne disparait JAMAIS automatiquement -- seul un front sur BtnAckConfigRestored l'efface (doctrine reset=front)."
  - "BypassRestoreDone : VAR RETAIN (plus simple VAR) -- ne se reinitialise plus a chaque download/reset si GVL_IHM RETAIN est reste intact."
  - "CfgMaxStepDescente/CfgMaxStepAscent (commun M1/M2) : mirroir bidirectionnel garde par Initialized des DEUX treuils simultanement (evenement de boot partage)."
  - "Bundle PLCopenXML regenere et frais (check_bundle_freshness.py = PASS)."
tests_required:
  - "Gates Python structure/style (pre-existant : erreurs DOC reference/NAVBOARDS non liees a ce lot, deja presentes avant modification)"
  - "Compilation CODESYS manuelle (utilisateur)"
  - "Simulation PLC manuelle (Watch/forcage) : forcer Cfg.Initialized:=FALSE + champs Cfg a leur defaut struct + valeur PERSISTENT differente -> verifier restauration correcte + ConfigRestoredFromPersistent=TRUE + acquittement front"
