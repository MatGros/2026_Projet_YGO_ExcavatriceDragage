task_id: "IHM-NAMING-01"
request: >
  Renommage complet en un seul lot : (1) convention IHM Btn/Sel/Set/Tgl/Cfg sur toutes
  les structures ST_*HMI (Winch, Bucket, Translation, Modes, Joystick, Sync, Cycle,
  Commun) ; (2) convention simulation Sensor/Bus/Sim/Tst/Link sur GVL_Simulation ;
  (3) nouveau struct Bypass dedie par metier (ST_*HMI.Bypass) pour les bypass
  maintenance MAINT_N2, separe de GVL_Simulation qui reste en l'etat structurel
  (juste renomme).
