out_of_scope:
  - "BypassContactorCheck (O3 : renomme si trouve sur le chemin, sinon reporte, priorite basse)"
  - "Renommage logique metier interne aux FB (variables VAR locales hors structs HMI/simulation) — chantier separe deja identifie en session"
  - "Comportement fonctionnel des blocs Safety — renommage pur, aucune logique/seuil/condition modifiee"
  - "Visualisation IHM graphique elle-meme (tags a remapper manuellement par l'utilisateur apres import bundle)"
acceptance_criteria:
  - "Toutes les structures ST_*HMI utilisent les prefixes Btn/Sel/Set/Tgl/Cfg selon NAMING_CONVENTION.md (section Variables IHM), sans underscore apres le prefixe."
  - "GVL_Simulation utilise les prefixes Sensor/Bus/Sim/Tst/Link avec Repere juste apres le prefixe pour les GVL plates (SensorM1ThermalIsReal, pas SensorThermalM1IsReal)."
  - "Repere fonctionnel numerote (ex: Contactor1..4) reste colle a sa fonction, jamais separe (SensorM1Contactor4IsReal)."
  - "Nouveau struct ST_Bypass<Metier> (ex: ST_BypassWinch) cree et imbrique dans chaque ST_*HMI concerne (Winch x2 instances, Translation, Bucket) — jamais de champ bypass isole a la racine."
  - "Bypass communs (thermique frein, mou cable, position haute, rotation phase) dans ST_CommunHMI.Bypass, pas duplique par axe."
  - "GVL_Simulation reste structurellement inchangee (pas de sous-structs, liste plate conservee) — seuls les NOMS changent."
  - "Flux VAR_INPUT respecte partout : aucun FB metier ne lit GVL_Simulation ou GVL_IHM directement depuis son corps — injection depuis PRG_03_Safety/PRG_06/PRG_07 uniquement (pattern deja conforme EncoderFaultBypass a generaliser)."
  - "Granularite fine conservee : pas de bypass bloc entier (doctrine Conditional Bypass, retiree, ne pas reintroduire)."
  - "Bundle PLCopenXML regenere et frais (check_bundle_freshness.py = PASS)."
  - "Mapping complet OldName -> NewName documente dans VERSION_HISTORY.md pour permettre le remappage manuel des tags IHM graphiques."
tests_required:
  - "Compilation CODESYS manuelle (utilisateur, apres import bundle)"
  - "Suites PLC_TESTS existantes (SUITE_SAFETY, SUITE_TRANSLATION, SUITE_BENNE, SUITE_ENCODER, SUITE_MODES) doivent continuer a passer apres renommage sans aucune modification de leur propre code (preuve que le renommage est bien 1:1, pas de perte de cablage VAR_INPUT)."
# Gate C3/C4 (check_task_test_contract.py) : aucun lot safety sans artefact de test PLC,
# meme un renommage pur touchant des VAR_INPUT de blocs Safety (EncoderFaultBypass, Inhibit,
# BypassContactorFeedback...). Artefact = suite de non-regression qui verifie que chaque
# bypass renomme est toujours effectivement cable et fonctionnel (pas juste renomme a vide).
tests_automated_required: true
tests_implementation_paths:
  - "CODE/SIMULATION/PLC_TESTS/SUITE_SAFETY/FB_SafetyValidation.st (suite existante, executee telle quelle apres renommage — verifie EncoderFaultBypass/Inhibit/Bypass* toujours cables)"
  - "CODE/SIMULATION/PLC_TESTS/SUITE_BENNE/FB_BucketValidation.st (idem, Bucket)"
  - "CODE/SIMULATION/PLC_TESTS/SUITE_TRANSLATION/FB_TranslationValidation.st (idem, Translation)"
tests_status: "planned"
test_execution_evidence: []
review_required: true
dual_review_required: true
pony_tail: forbidden
human_validation_required: true
