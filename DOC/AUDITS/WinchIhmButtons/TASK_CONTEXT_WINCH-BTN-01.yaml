task_id: "WINCH-BTN-01"
request: >
  Reouverture documentee de la doctrine T40 (suppression IHM_MANU 2026-07-19) : reintroduire
  des boutons IHM de mouvement direct maintenus (BtnUp/BtnDown) sur les treuils M1/M2, en plus
  du joystick existant. Nouveau selecteur TglJoystickMaster (source de commande, joystick vs
  boutons) SANS dupliquer JoystickWinchSelectArbitrated (qui reste l'unique autorite de
  selection treuil M1/M2/Couple, applique identiquement aux deux sources). Accessible des
  MAINT_N1 (conforme AF_Partie-05 : pilotage unitaire deja prevu des N1). Permanent (pas un
  outil de mise en service temporaire).
criticality: "C4"
scope_code:
  - "CODE/SUPERVISION/ST_WinchHMI.st"
  - "CODE/SUPERVISION/ST_ModesHMI.st"
  - "CODE/MAIN/PRG_06_WinchControl.st"
  - "CODE/SIMULATION/PLC_TESTS/SUITE_MODES/FB_ModesValidation.st"
scope_doc:
  - "DOC/AF_Partie-05_Modes_Maintenance_v1.6.md"
  - "DOC/AF_Partie-09_Fonction_Winch_v1.11.md"
  - "DOC/PLAN_TASK_v1.0.md"
  - "DOC/NAVBOARD_MiseEnService_JoystickTranslation.md"
  - "DOC/VERSION_HISTORY.md"
out_of_scope:
  - "FB_Winch.st / FB_Safety_Winch.st : aucune modification, interface deja compatible (StartStop/Direction/SpeedRefPct)"
  - "Homing (BtnHome) : reste MAINT_N2, deja conforme, aucun changement"
  - "Benne ouvrir/fermer (FB_Bucket) : deja implemente, aucun changement"
  - "Branche SEMI_AUTO de PRG_06_WinchControl : non touchee, isolee par IF/ELSE existant"
  - "Paliers vitesse (FB_SpeedStep) : deja geres en aval, aucune nouvelle logique"
acceptance_criteria:
  - "TglJoystickMaster (nouveau, ST_ModesHMI ou struct dedie) bascule uniquement la SOURCE du signal StartStop/Direction/SpeedRefPct."
  - "JoystickWinchSelectArbitrated reste l'unique autorite de selection treuil (M1/M2/Couple), appliquee IDENTIQUEMENT que la source soit joystick ou boutons -- aucune duplication de logique de selection."
  - "BtnUp/BtnDown (ST_WinchHMI, instances M1TreuilRetenue et M2TreuilBucket) : mouvement MAINTENU (tant qu'actif), jamais impulsionnel."
  - "DeadmanArmed (homme-mort joystick reel) obligatoire et teste EXPLICITEMENT sur la branche boutons, exactement comme sur la branche joystick actuelle -- pas d'implicite (lecon precedent Translation AF_Partie-11 v1.9 section 6bis)."
  - "Accessible des MAINT_N1, sans authentification -- conforme AF_Partie-05 section MAINT_N1 (pilotage unitaire deja prevu)."
  - "Branche SEMI_AUTO (PRG_06_WinchControl) non modifiee -- isolation IF/ELSE deja existante preservee."
  - "Aucun nouveau bypass safety -- FB_Safety_Winch reste l'unique source de SafeStop/ForbidAscent/ForbidDescent/PowerCutOff, filtrage aval identique quelle que soit la source amont."
  - "Interlock changement de sens (DirectionInterlockDelay, deja dans FB_Winch) s'applique de la meme facon quelle que soit la source."
tests_required:
  - "Revue Safety read-only (double A/B, TEST_DESIGN + code)"
  - "Gates Python structure/style"
  - "Compilation CODESYS manuelle (utilisateur)"
  - "Simulation PLC (nouveau cas : bouton sans homme-mort = aucun mouvement)"
# Gate C4 : test PLC automatique obligatoire, sujet safety (mouvement machine).
tests_automated_required: true
tests_implementation_paths:
  - "CODE/SIMULATION/PLC_TESTS/SUITE_MODES/FB_ModesValidation.st (etendre avec nouveaux cas TC-M7bis : bouton sans homme-mort, bouton + homme-mort, source boutons vs joystick, MAINT_N1 sans authentification)"
tests_status: "planned"
test_execution_evidence: []
review_required: true
dual_review_required: true
pony_tail: forbidden
human_validation_required: true
