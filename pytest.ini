[pytest]
testpaths =
    TOOLS
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -s -rP
markers =
    linter: Validation de la syntaxe et du typage strict STruCpp sur tout CODE/
    safety: Invariants critiques de sécurité machine (AGENTS.md)
    gates: Contrôles de structure, nommage et liaison
    golden: Tests de conformité avec les exports de référence CODESYS
    ci_fb: Suites de test CI automatisées par Function Block (STruCpp)
    unit: Tests unitaires ciblés par Function Block / POU individuel (rapide)
    domain: Tests de validation groupée par domaine métier (A_COMMUN, H_TREUILS...)
    all_domains: Test global de l'ensemble des 28 blocs fonctionnels du projet
    registry: Validation d'intégrité du registre CI (registry.yaml, config.yaml)
