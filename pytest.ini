[pytest]
testpaths =
    TOOLS
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q
markers =
    safety: Invariants critiques de sécurité machine (AGENTS.md)
    gates: Contrôles de structure, nommage et liaison
    golden: Tests de conformité avec les exports de référence CODESYS
    ci_fb: Suites de test CI automatisées par Function Block (STruCpp)
