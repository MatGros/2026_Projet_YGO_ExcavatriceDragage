contract:
  task_id: T118_IHM_BANNER_TEXTS
  criticality: C2            # IHM textes — pas de conséquence physique directe
  strategy: patch

  # ── 1. Objectif metier ────────────────────────────────────────────────────
  objective: >
    Refondre les textes du bandeau IHM (FB_Hmi_BannerFormatter) pour afficher la
    cause + l'action d'un blocage de mouvement, avec des textes concis et dynamiques,
    au lieu des textes verbeux et génériques actuels.
    Critères structurels : nom de fichier = nom de POU
    suffixe de langage = langage bundle (ST, pas de suffixe _CFC/_LD)

  # ── 2. Criteres testables ─────────────────────────────────────────────────
  acceptance:
    - id: AC1
      statement: "Les textes du bandeau sont concis et directs (ex. « ACQ défaut » au lieu de « Acquitter le défaut » ; message homme-mort raccourci)."
      verified_by: "Lecture du code FB_Hmi_BannerFormatter.st : chaque STRING de texte ≤ 40 caractères."
    - id: AC2
      statement: "Le bandeau affiche la cause spécifique d'un blocage de mouvement (ex. descente bloquée par Dive + benne fermée → « Ouvrir la benne »)."
      verified_by: "Lecture du code : logique de génération de texte par cause (DescendPermit/AscentPermit/BucketIsOpen/DiveActive/TopLimitReached)."
    - id: AC3
      statement: "SpecialConditionText affiche un indicateur unique « bypass actif » si au moins un bypass OU une simulation est active (pas la liste de tous les bypass)."
      verified_by: "Lecture du code : agrégation OR des bypass/simu en un seul booléen → un seul texte."
    - id: AC4
      statement: "GlobalContextText ne contient PAS le numéro d'étape (il reste dans SequenceProgressText)."
      verified_by: "Lecture du code : GlobalContextText = [RÉEL/SIMU] [MODE] [COUPLAGE] uniquement."
    - id: AC5
      statement: "Le blocage courant est affiché en fixe ; la rotation (bascule 1-2 s) est optionnelle pour montrer tous les cas de l'interdiction courante."
      verified_by: "Lecture du code : texte fixe du blocage prioritaire + mécanisme de rotation optionnel."
    - id: AC6
      statement: "Les signaux de cause (DescendPermit, AscentPermit, BucketIsOpen, DiveActive, TopLimitReached, SafeStop) sont exposés en entrée de FB_Hmi_BannerFormatter et câblés dans PRG_07_Supervision."
      verified_by: "G200_check_linkage.py : chaque nouveau signal câblé ; run_all_gates PASS."
    - id: AC7
      statement: "La hiérarchie des causes est respectée : sécurité d'abord (AU, SafeStop), puis blocages métier (Dive, benne, limite)."
      verified_by: "Lecture du code : ordre des IF/ELSIF dans la génération de texte."
    - id: AC8
      statement: "nom de fichier est identique au nom de POU et suffixe de langage est identique au langage bundle pour les POU de CODE/MAIN modifiés"
      verified_by: "G200_check_linkage.py --report"

  # ── 3. Perimetre ──────────────────────────────────────────────────────────
  scope:
    allowed:
      - CODE/SUPERVISION/FB_Hmi_BannerFormatter.st
      - CODE/MAIN/PRG_07_Supervision.st
      - CODE/SUPERVISION/_TYPES/ST_HmiBanner.st
    forbidden:
      - PRJ_CODESYS/PROJ_Full_ImportExport/Device.export
      - DOC/STDS/NAMING_CONVENTION.md
      - DOC/STDS/CODE_QUALITY_STANDARDS.md
      - Tout autre FB/PRG hors scope (ne pas élargir)

  # ── 4. Contrat de conservation ────────────────────────────────────────────
  conservation:
    must_survive:
      - "Les 4 champs du bandeau (GlobalContextText, SequenceProgressText, SpecialConditionText, OperatorActionText) restent présents dans ST_HmiBanner."
      - "Le comportement de sécurité (AU, SafeStop) reste prioritaire dans OperatorActionText."
      - "Aucun changement de logique machine (mouvement, interlocks) — refonte textes uniquement."
    dropped_on_purpose:
      - "Textes verbeux remplacés par des textes concis (décision humaine, session 2026-08-16)."

  # ── 5. Preuves attendues en restitution ───────────────────────────────────
  evidence_required:
    - check_linkage          # bloc "Auto-verification liaison"
    - run_all_gates          # resultat des gates
    - bundle                 # CODE/CODE_Bundle.xml regenere

  # ── 6. Modeles autorises ──────────────────────────────────────────────────
  models_allowed:
    - "codex/gpt-5.6-luna"
    - "codex/gpt-5.6-sol"

  # ── 7. Devoir d'alerte ────────────────────────────────────────────────────
  alert_duty: >
    Tout probleme constate en cours de route (incoherence de spec, bug preexistant,
    risque hors scope) est remonte IMMEDIATEMENT a l'orchestrateur, pas a la fin et
    jamais silencieusement. Signaler n'est pas elargir le scope.

