  conservation:
    must_survive:
      - "Meca A (FB_Safety_Winch bit7, derive codeur) : declenche quand le treuil bouge ALORS QUE le frein est serre. Condition actuelle : MeasuredSpeedMps > seuil AND FwdRevSpeedFeedbackOff AND BrakeFeedback (TRUE=serre). Apres : AND NOT BrakeFeedback (TRUE=ouvert donc NOT = serre). MEME declenchement."
      - "Meca B (bit8, arret non confirme) : TON si contacteurs retombes ET frein serre pendant PostRampTimeout. Condition actuelle : NOT (FwdRevSpeedFeedbackOff AND BrakeFeedback). Apres : NOT (FwdRevSpeedFeedbackOff AND NOT BrakeFeedback). MEME declenchement."
      - "Meca D/E : meme logique que Meca B."
      - "DriftGuard Arm : s'arme quand contacteurs retombes ET frein serre. Apres : AND NOT BrakeFeedback au lieu de AND BrakeFeedback."
      - "FB_Brake StuckClosed/StuckOpen : en marche saine BrakeCmd (TRUE=relache) et ContactorFeedback (TRUE=ouvert apres fix) sont EGAUX. Le test repasse en <> (difference = defaut). StuckClosed = relache commandee (BrakeCmd=TRUE) mais frein reste serre (ContactorFeedback=FALSE). StuckOpen = serrage commande (BrakeCmd=FALSE) mais frein reste ouvert (ContactorFeedback=TRUE)."
      - "FB_Encoder_Homing ArretConfirme : TRUE quand contacteurs retombes ET frein serre. Apres : AND NOT BrakeFeedback."
      - "IHM troubleshooting M1BrakeApplied : TRUE = frein serre (le nom le dit). Apres : := NOT M1BrakeFeedback pour garder ce sens."
    dropped_on_purpose:
      - "Decision PLAN_TASK section 1bis TRUE = frein serre dans l'aval — REVOQUEE."
      - "CST_BrakeFeedbackInvertLogic := TRUE — supprimee ou mise a FALSE."
      - "Procedure terrain REGISTRE MES 'Si 1 -> cablage inverse -> passer InvertLogic := FALSE' — supprimee (plus d'InvertLogic)."

  evidence_required:
    - check_linkage
    - check_bundle_st_syntax
    - bundle
    - diff_review

  models_allowed:
    - "nvidia/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"

  alert_duty: >
    Toute condition safety qui ne se retrouve pas a l'identique apres inversion
    doit etre remontee IMMEDIATEMENT via contact_supervisor (reason: need_decision).
    Ne jamais inverser aveuglement — verifier que chaque NOT preserve le
    comportement. Si un doute existe sur le sens d'une condition, PAUSE et demande.